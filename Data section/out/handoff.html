<script>
const D = {"handoff":{"html":"<h1 id=\"h-1\">Handoff: Data section<\/h1>\n<h2 id=\"h-2\">เริ่มงานที่นี่ ถ้าเป็นแชทใหม่<\/h2>\n<p>ก็อปข้อความในกรอบนี้ส่งให้แชทใหม่ได้เลย<\/p>\n<blockquote><p>งาน SMOTE25 survey ส่วน Data section repo อยู่ที่ <code>D:\\SMOTE25<\/code> บนเครื่องของฉัน<br>โฟลเดอร์ของงานนี้คือ <code>Data section<\/code> ที่ระดับบนสุดของ repo (ชื่อมีเว้นวรรค ต้องใส่เครื่องหมายคำพูดเวลาพิมพ์คำสั่ง)<\/p>\n<ol><li><code>git fetch origin main<\/code> ดูก่อนว่าฝ่ายอื่นมีของใหม่ไหม ถ้ามีให้ <code>git pull --rebase origin main<\/code><\/li><li>อ่าน <code>Data section/handoff.md<\/code> ให้จบก่อนลงมือ โดยเฉพาะข้อ 4 บันทึกการดำเนินงาน<\/li><\/ol>\n<p>(รายการล่าสุดอยู่ล่างสุด) ข้อ 6 เรื่องที่ยังไม่ตัดสิน ข้อ 7 งานขั้นถัดไป และข้อ 9 กติกาที่ห้ามละเมิด<\/p>\n<ol><li>ทำงานตามข้อ 7 แล้วเขียนบันทึกลงข้อ 4 ทุกครั้งที่มีความคืบหน้า<\/li><\/ol>\n<p>push ทำจากฝั่ง cloud ไม่ได้ ต้องบอกให้ฉันรันเอง ส่วน fetch กับ pull ทำได้<\/p><\/blockquote>\n<p><b>ถ้าแชทใหม่อยู่ใน Project SMOTE25 เดียวกัน<\/b> จะได้ ID ของโฟลเดอร์ Google Drive<br>ที่เก็บ paper ทั้ง 76 เรื่องมาอัตโนมัติจาก project instructions<br><b>ถ้าอยู่นอก Project<\/b> ต้องบอก ID ให้เอง รายการอยู่ใน <code>_archive/drive-inventory.md<\/code><\/p>\n<p><b>สิ่งที่แชทใหม่จะไม่รู้ถ้าไม่บอก<\/b> สไตล์การทำงานที่ตกลงกันไว้ ตอบกระชับเป็นภาษาไทย<br>ใช้ศัพท์เทคนิคอังกฤษได้ เขียนโค้ดขอไฟล์สมบูรณ์ไม่เอาเป็นท่อน และห้ามสรุป insight แทน<br>ให้จัดข้อมูลและวิเคราะห์โดยทุกค่าต้องตรวจย้อนกลับไปหาแหล่งที่มาได้<\/p>\n<hr>\n<p>เอกสารส่งต่อสถานะของ <b>Data section<\/b> ใน survey <code>25 Years of SMOTE: What Has Been Done and How Did It Benefit Society?<\/code><\/p>\n<p>เจ้าของ repo: Supawit (P)<br>เป้าหมายวารสาร: JAIR<br>อัปเดตล่าสุด: 8 พฤศจิกายน 2026 (บันทึกล่าสุดอยู่ท้ายไฟล์; สถานะปัจจุบันสรุปไว้ในข้อ 0 ด้านล่าง)<br>ที่อยู่ของโฟลเดอร์นี้: <code>Data section/<\/code> ที่ระดับบนสุดของ repo<\/p>\n<p>อ่านไฟล์นี้ไฟล์เดียวแล้วต่องานได้ รายละเอียดแต่ละเรื่องอยู่ในไฟล์ที่อ้างถึงท้ายหัวข้อ<\/p>\n<blockquote><p><b>กติกาก่อนเริ่มงานทุกครั้ง<\/b> <code>git fetch<\/code> แล้วดูว่าฝ่ายอื่นมีของใหม่ไหมก่อนลงมือ<br>ถ้ามี ให้ <code>git pull --rebase origin main<\/code> ก่อน แล้วค่อยทำงานต่อ<br>repo นี้มีหลายคนทำพร้อมกัน (P ดู methodology และ section อื่น) การ push ทับกันเคยเกิดมาแล้วหนึ่งครั้ง<br>fetch และ pull ทำจากฝั่ง cloud ได้ มีแต่ push ที่ต้องรันเองบนเครื่อง<\/p><\/blockquote>\n<blockquote><p><b>กติกาของไฟล์นี้<\/b> ทุกครั้งที่มีการดำเนินงานหรือมีอะไรเปลี่ยน ให้เขียนลง <b>ข้อ 4 บันทึกการดำเนินงาน<\/b> ทันที<br>รวมถึงรายละเอียดเล็ก ๆ ที่คิดว่าไม่สำคัญ เช่น ทำไมถึงเลือกวิธีนี้ ตัวเลขไหนแก้แล้ว อะไรที่ลองแล้วไม่ได้ผล<br>เพราะสิ่งที่หายง่ายที่สุดคือเหตุผลเบื้องหลัง ไม่ใช่ตัวเลขผลลัพธ์<br>ถ้างานรอบนั้นมีรายละเอียดเยอะ ให้แยกเป็นไฟล์ของตัวเองแล้วลิงก์มาจากข้อ 4<\/p><\/blockquote>\n<hr>\n<h2 id=\"h-3\">0. สถานะปัจจุบัน (9 พ.ย. 2026) อ่านข้อนี้ก่อน<\/h2>\n<p>ข้อ 3 และข้อ 5–8 ด้านล่างเป็นบันทึกสถานะเก่า (ต.ค.) เก็บไว้เป็นประวัติ ตัวเลขปัจจุบันอยู่ที่นี่และใน <code>CONCLUSIONS.md<\/code><\/p>\n<div class=\"tbox\"><table><thead><tr><th>เรื่อง<\/th><th>ตัวเลขปัจจุบัน<\/th><th>ไฟล์<\/th><\/tr><\/thead><tbody><tr><td>corpus<\/td><td>76 paper (มีการประเมินบนข้อมูล 73) · entry 1,756 (มีชื่อ 1,755; รวม 93 ชุดประกอบภาพ/ทดลองข้างเคียงของ 10 paper ที่เพิ่ม 8 พ.ย. และ 9 entry ชุดที่ใส่ noise ของ 7 paper ที่เพิ่ม 9 พ.ย.) → 866 ชื่อ → 775 dataset → 491 family<\/td><td><code>out/reconcile_counts.json<\/code>, <code>out/dataset_families.csv<\/code><\/td><\/tr><tr><td>ชนิด entry<\/td><td>original 537 · repository-defined 470 · modified 341 · synthetic 213 · not stated 195 (Toy ของ OREM-M: original → synthetic, override <code>EXTERNAL<\/code>; กฎ NS รอบสาม: 4 entry SPIDER2 → original, <code>RULE_NS<\/code> จาก <code>out/rule_ns_original.csv<\/code>; ทั้งสองใน build/full_extraction.py)<\/td><td><code>out/dataset_records.csv<\/code><\/td><\/tr><tr><td>ตรวจได้ (ความยาก)<\/td><td>991 entry 65 paper 261 ไฟล์ (รอบสาม 986/65/256; รอบสอง 973/65/247; รอบแรก 8 พ.ย. 864/65/172; 28 ต.ค. 643/61/131) · V-author_release 43 entry · Kaggle 9 entry (11 ไฟล์) · CLUTO 2 entry · Loyalty-SMOTE N+1 8 entry<\/td><td><code>difficulty/verify_ext_summary.json<\/code><\/td><\/tr><tr><td>task ที่วัดได้<\/td><td>binary/binarise 238 (703 entry 46 paper) · OvR 347 · ไม่ได้วัด: covertype (ใหญ่เกินเวลา), la12 (เกินหน่วยความจำ)<\/td><td><code>difficulty/profile_final_summary.json<\/code>, <code>difficulty/measure_log.csv<\/code><\/td><\/tr><tr><td>ความยากระดับชื่อ<\/td><td>มีโปรไฟล์ 317 (รวม varies 5) · หลายคลาส 66 · วัดไม่ได้ 483 (synthetic 196, ไม่พบไฟล์ 159, ขนาดไม่ตรง 82, task สร้างซ้ำไม่ได้ 35, อื่น 11)<\/td><td><code>out/name_level_types.json<\/code>, <code>out/name_level_extras.json<\/code><\/td><\/tr><tr><td>200 ชื่อที่ไม่มีไฟล์ (รอบแรก)<\/td><td>ตรวจได้แล้ว 97 ชื่อ (119 entry) · ได้ไฟล์แต่ขนาด/task ไม่ตรง 48 · modified ไม่พิมพ์ขนาด 8 · ยังไม่ได้ไฟล์ 47 (HDDT เว็บปิด, private, ภาพ/ข้อความ/time series, Kaggle competition, ชุดย่อยที่ผู้เขียนสร้างเอง)<\/td><td><code>out/names_download_result.csv<\/code>, <code>out/names_to_download.csv<\/code> (45 ชื่อที่อ้างแหล่งสาธารณะแต่ไม่มีไฟล์), <code>difficulty/official_manifest.csv<\/code><\/td><\/tr><tr><td>synthetic เผยแพร่ไหม<\/td><td>29 paper 213 entry: เผยแพร่ 7 paper/63 (รวม Toy ของ OREM-M) · อ้างงานอื่น 3/13 · ขอได้ 1/60 (MC-MBRC) · บอกแค่ตัวสร้าง 1/3 · มีแค่โค้ด 5/10 · ไม่พบ 13/64 (OREM-M อยู่ 2 กลุ่ม)<\/td><td><code>out/synthetic_availability.json<\/code><\/td><\/tr><tr><td>ผลชนะ SMOTE<\/td><td>plain 29 paper 1,511 แถว ชนะ 1,107 เสมอ 102 แพ้ 286 (ไม่เปลี่ยน) · H1 ไม่ได้รับการสนับสนุน (GEE 0.69 p 0.10) · noise +0.1 → odds ชนะ ×1.15 (p 0.005)<\/td><td><code>out/winloss_allmetric_summary.json<\/code>, <code>out/hypotheses.json<\/code>, <code>out/difficulty_outcomes.json<\/code><\/td><\/tr><tr><td>manuscript<\/td><td><code>manuscript/data-section-draft.tex<\/code> (แก้ที่นี่) → <code>data-section-final.tex<\/code> + <code>.bib<\/code> (make_final.py) → <b><code>manuscript/data-section-jair.pdf<\/code><\/b> (template JAIR จริง, build_jair_pdf.py) · พรีวิวแบบมีมาร์กอัป <code>data-section-draft-preview.pdf<\/code><\/td><td><\/td><\/tr><tr><td>HTML หลัก<\/td><td><code>out/dataset-atlas.html<\/code> (เนื้อหา) และ <code>out/handoff.html<\/code> (ไฟล์นี้ + CONCLUSIONS.md เป็นหน้าแยก; build/make_handoff_html.py) · ข้อความใน HTML ไม่มีชื่อผู้ตัดสิน/ผู้สั่ง ตั้งแต่ 9 พ.ย.<\/td><td><code>build/make_atlas.py<\/code> + <code>build/atlas_template.html<\/code><\/td><\/tr><tr><td>git<\/td><td>commit ในเครื่องแล้ว ยังไม่ push (push ต้องรันเองบนเครื่อง)<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>คำสั่ง rebuild ทั้งหมด<\/b> (จาก <code>Data section/<\/code>; ต้องมี mirror ใน <code>difficulty/src/<\/code> จาก <code>difficulty/fetch_mirrors.sh<\/code> + <code>difficulty/fetch_mirrors_ext.sh<\/code>, statsmodels, TeX Live + biber + biblatex + libertine/newtx/inconsolata)<\/p>\n<pre><code>bash difficulty/rebuild_difficulty.sh        # verify_ext -&gt; measure -&gt; ... -&gt; name_level_* -&gt; difficulty_outcomes\npython3 build/synthetic_availability.py      # ต้องมี paper/ (PDF ไม่อยู่ใน git)\npython3 build/names_download_result.py       # ผลของ 200 ชื่อรอบแรก (8 พ.ย. รอบสอง)\npython3 build/make_final.py &amp;&amp; python3 build/build_jair_pdf.py &amp;&amp; python3 build/preview/build_preview.py\npython3 build/make_atlas.py &amp;&amp; python3 build/make_handoff_html.py &amp;&amp; python3 build/atlas_analysis_checks.py &amp;&amp; python3 build/consistency_check.py &amp;&amp; python3 build/phase2_checks.py<\/code><\/pre>\n<p><b>จัดโฟลเดอร์ (9 พ.ย.)<\/b>: ไฟล์สำรองรุ่นเก่า (<code>*.before_*<\/code>, <code>out/audit_backup/<\/code>, <code>ai-draft/full_backup_*<\/code>, <code>_verify_png/<\/code>) ลบแล้ว ดูย้อนหลังจาก git history · เอกสารทำงานรุ่นก่อนอยู่ใน <code>_archive/<\/code> (ตัวเลขเก่า ไม่ใช่สถานะปัจจุบัน) · ชื่อไฟล์ before_ ที่ปรากฏในบันทึกด้านล่างคือไฟล์ที่ลบไปแล้ว<\/p>\n<p><b>สถานะเรื่องที่เคยค้าง (อัปเดต 9 พ.ย.)<\/b>: V-author_release รับแล้ว · ขนาด +1 ของ Loyalty-SMOTE รับแล้ว · Kaggle ดาวน์โหลดแล้ว 11 ชุดด้วยบัญชี (9 พ.ย. เพิ่ม Sales Win Loss, Credit Card Fraud; ที่เหลือ: icr เข้าถึงไม่ได้ — ข้อมูล competition ที่กติกาให้ใช้เฉพาะในการแข่งขัน ไม่ได้กดยอมรับ, approval ระบุชุดไม่ได้) · ไฟล์ชั่วคราวใน Downloads (.tmp, smote25_uci_*.bin, uci_extended.tar.gz, archive*.zip) มีสำเนาใน difficulty/src/ แล้ว ลบได้ · ชื่อผู้เขียนใน PDF ปล่อยว่าง · <b>ที่เหลือจริง<\/b>: merge เข้า main.tex/sections/references.bib ตอนรวมกับ P · git pull แล้ว push<\/p>\n<hr>\n<h2 id=\"h-4\">1. section นี้ต้องตอบอะไร<\/h2>\n<p><b>คำถามหลัก<\/b> การที่วงการ SMOTE เลือกและจัดการข้อมูลแบบที่ทำกันอยู่ ส่งผลต่อความน่าเชื่อถือของผลลัพธ์ที่รายงานอย่างไร<br>และควรปรับการประเมินผลอย่างไรในงานถัดไป<\/p>\n<p><b>ไม่ใช่<\/b> การสรุปว่า paper ไหนใช้ dataset กี่ชุด ตัวเลขนั้นอย่างเดียวไม่มีประโยชน์<\/p>\n<p><b>แกนการนำเสนอ<\/b> แบ่งตาม paper ก่อน แล้วจำแนกข้อมูลที่แต่ละ paper ใช้เป็น 3 แบบ<\/p>\n<div class=\"tbox\"><table><thead><tr><th>แบบ<\/th><th>ความหมาย<\/th><\/tr><\/thead><tbody><tr><td>Original<\/td><td>benchmark มาตรฐาน (UCI / KEEL) ใช้ตามที่แจกมา ไม่ดัดแปลง<\/td><\/tr><tr><td>Modified<\/td><td>ดัดแปลงเอง เช่น binarize จาก multiclass, รวมคลาส, สุ่มตัด minority เพื่อดัน IR, ใส่ noise<\/td><\/tr><tr><td>Synthetic<\/td><td>ผู้เขียนสร้างขึ้นเอง<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>ป้ายที่ใช้จริงตอนนี้ (18 ต.ค.)<\/b> 4 แบบ + not stated: original, repository-defined (KEEL หรือ imbalanced-learn เป็นผู้แบ่งคลาส), modified, synthetic<br>repository-defined คือทางเลือกที่ 3 ของ decisions-pending เรื่องที่ 2 (ปิดแล้ว 29 ต.ค.: คงแยกไว้) ยุบกลับเป็น 3 แบบได้ที่ <code>keel_rule<\/code><\/p>\n<p>แล้วดูว่าแต่ละ paper \"ชนะ\" บนข้อมูลแบบไหน<\/p>\n<p><b>สมมติฐาน<\/b><\/p>\n<ul><li><b>H1<\/b> อัตราการชนะบนข้อมูล Modified และ Synthetic สูงกว่าบนข้อมูล Original (ข้อสังเกต)<\/li><li><b>H2<\/b> paper ที่ใส่ชุดมาตรฐานมาแค่ชุดเดียวเพื่อความน่าเชื่อถือ มักรายงานผลที่อยากได้จากข้อมูลอีกแบบ (ตั้งเป็นสมมติฐาน)<\/li><li><b>H3<\/b> dataset ที่ปรากฏในตารางคุณลักษณะ แต่ไม่ปรากฏในตารางผล (ข้อสังเกต ตั้งเป็นสมมติฐานเพิ่ม)<\/li><\/ul>\n<p>การทดสอบใช้ mixed-effects logistic regression ให้ paper เป็น random effect เพราะ dataset ภายใน paper เดียวกันไม่เป็นอิสระต่อกัน<br>Fisher exact ใช้เป็นตัวอ้างอิงหยาบเท่านั้น<\/p>\n<hr>\n<h2 id=\"h-5\">2. หลักการทำงาน<\/h2>\n<p>หลักการที่ใช้ตลอดงาน <b>ทั้งหมดนี้บังคับ<\/b><\/p>\n<ol><li>ต้องมี insight เอง ไม่ใช่บทสรุปที่เครื่องสร้าง<\/li><li>ทุกค่าที่มาจาก AI ต้องเปิด paper ต้นฉบับตรวจเอง<\/li><li>ต้องเริ่มจาก \"สิ่งที่เราสงสัย\" แล้วหาหลักฐานมาตอบ ไม่ใช่เริ่มจากตารางสรุป<\/li><\/ol>\n<p><b>ผลต่อวิธีทำงานในโฟลเดอร์นี้<\/b> ทุกแถวในฐานข้อมูลที่ AI เติมให้จะถูกตั้งสถานะ <code>ai_draft (unverified)<\/code> และ <b>ไม่มี <code>page_ref<\/code><\/b><br>สคริปต์วิเคราะห์จะข้ามแถวเหล่านี้ทิ้งโดยอัตโนมัติ แถวจะนับก็ต่อเมื่อ เปิด paper ตรวจแล้วเปลี่ยนสถานะเป็น<br><code>verified against paper<\/code> หรือ <code>corrected<\/code> พร้อมใส่เลขหน้าและตาราง<\/p>\n<hr>\n<h2 id=\"h-6\">3. สถานะวันนี้<\/h2>\n<div class=\"tbox\"><table><thead><tr><th>รายการ<\/th><th>ตัวเลข<\/th><\/tr><\/thead><tbody><tr><td>Paper ที่ต่างกันจริงใน Drive<\/td><td>76<\/td><\/tr><tr><td>Paper ที่มีระเบียนแล้ว<\/td><td>76<\/td><\/tr><tr><td>Paper ที่รายชื่อ dataset กระทบยอดครบ<\/td><td>75 (ที่เหลือคือ Tomek Links ซึ่งไม่มีชื่อให้ลง)<\/td><\/tr><tr><td>แถว <code>extraction<\/code> (1 แถว = 1 dataset ใน 1 paper)<\/td><td>1,473<\/td><\/tr><tr><td>ในนั้นเป็นแถวก้อนรวม<\/td><td>11 แถว แทน 324 dataset<\/td><\/tr><tr><td>ชื่อ dataset ที่ยังค้าง<\/td><td>0<\/td><\/tr><tr><td>paper ที่มีค่าคุณลักษณะเชิงตัวเลข (N, features, IR) ในชีต<\/td><td>9 จาก 76 (154 แถว)<\/td><\/tr><tr><td><b>อ่าน PDF ครบแล้ว (18 ต.ค.)<\/b><\/td><td>72 จาก 72 paper เชิงประจักษ์<\/td><\/tr><tr><td>dataset entry จากรอบอ่านครบ (<code>out/full_datasets.csv<\/code>)<\/td><td>1,653 แถว มีตารางและหน้าทุกแถว<\/td><\/tr><tr><td>ผลเทียบวิธีที่เสนอกับ SMOTE รายชุด (<code>out/full_outcome_rows.csv<\/code>)<\/td><td>835 แถว 44 paper (plain SMOTE 542 แถว 31 paper)<\/td><\/tr><tr><td>ข้อที่ผู้อ่านไม่มั่นใจ (<code>out/full_uncertain.csv<\/code>)<\/td><td>452 ข้อ ยังไม่ได้ไล่<\/td><\/tr><tr><td><b>แถวที่ตรวจกับ paper ต้นฉบับแล้ว<\/b><\/td><td><b>0<\/b><\/td><\/tr><tr><td>แถวที่มี <code>page_ref<\/code><\/td><td>0<\/td><\/tr><tr><td>แถวที่ใช้ทดสอบ H1/H2 ได้<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>ยังไม่มีตัวเลขใดในโฟลเดอร์นี้ที่เขียนลง manuscript ได้<\/b> ทุกอย่างเป็น ai_draft ที่รอการตรวจ<br>ข้อมูลรอบอ่านครบ (<code>ai-draft/full/<\/code>) ยังไม่ได้ merge เข้า workbook ชีต <code>extraction<\/code> workbook ยังเป็นรายชื่อชุดเดิม 1,473 แถว<\/p>\n<hr>\n<h2 id=\"h-7\">4. บันทึกการดำเนินงาน<\/h2>\n<p>เรียงจากเก่าไปใหม่ ลงวันที่ทุกรายการ ห้ามลบของเก่าทิ้งแม้จะพบทีหลังว่าผิด ให้เขียนกำกับว่าผิดตรงไหนแทน<br>เพราะร่องรอยของข้อผิดพลาดคือสิ่งที่ทำให้ไม่พลาดซ้ำ<\/p>\n<h3 id=\"h-8\">6 ตุลาคม 2026 รอบสำรวจ<\/h3>\n<p>สกัด 69 paper จาก Drive สร้าง interactive HTML explorer และ dataset variant registry<br>พบว่า 20 จาก 75 ชื่อ เป็นคนละ dataset กัน และพบนิยาม imbalance ratio <b>9 แบบที่ขัดกัน<\/b> ในวงการนี้<br>ร่างนี้ถูกแทนด้วยงานรอบหลัง แต่ข้อมูลดิบสองอย่างหลังใช้ต่อได้และเป็นวัตถุดิบตรงของหัวข้อ reproducibility<\/p>\n<h3 id=\"h-9\">13 ตุลาคม 2026 วางโครงสร้างงานใหม่<\/h3>\n<ul><li>ตรวจพบว่าการนับ paper รอบแรกผิด Drive connector แบ่งหน้าแล้วข้ามไฟล์เงียบ ๆ จำนวนจริงคือ <b>76 เรื่อง ไม่ใช่ 69<\/b> แก้ด้วยการวนขอทุกหน้าแล้ว union ตาม file id (ดู <code>_archive/drive-inventory.md<\/code>)<\/li><li>สร้าง <code>SMOTE25_data_extraction.xlsx<\/code> เป็นไฟล์ทำงานหลัก<\/li><li>เขียน <code>_archive/workplan.md<\/code> 8 เฟส และ <code>decisions-pending.md<\/code><\/li><\/ul>\n<h3 id=\"h-10\">14 ตุลาคม 2026 รอบเติมชื่อ dataset<\/h3>\n<p>พบว่าช่องว่าง 33 เปอร์เซ็นต์ของรายชื่อ dataset **เกิดจากข้อจำกัดของการสกัดรอบแรกที่จำกัดไว้เอง 15 ชื่อต่อ paper<br>ไม่ใช่คุณสมบัติของ paper** อ่าน PDF ใหม่ 24 เรื่อง ปิดช่องว่างเหลือ 13 ชื่อ<\/p>\n<div class=\"tbox\"><table><thead><tr><th><\/th><th>ก่อน<\/th><th>หลัง<\/th><\/tr><\/thead><tbody><tr><td>paper ที่มีระเบียน<\/td><td>69<\/td><td>76<\/td><\/tr><tr><td>ชื่อ dataset ที่ระบุได้<\/td><td>990<\/td><td>1,446<\/td><\/tr><tr><td>แถว extraction<\/td><td>1,001<\/td><td>1,460<\/td><\/tr><tr><td>ชื่อที่ยังค้าง<\/td><td>~498<\/td><td>13<\/td><\/tr><\/tbody><\/table><\/div>\n<p>รายละเอียดและสิ่งที่พบระหว่างทางอยู่ใน <code>_archive/dataset-name-topup.md<\/code><\/p>\n<h3 id=\"h-11\">14 ตุลาคม 2026 สร้าง handoff และ commit เข้า repo ครั้งแรก<\/h3>\n<ul><li>สร้างไฟล์นี้ขึ้นมา เดิมโฟลเดอร์นี้ไม่มีเอกสารส่งต่อ มีแต่ README สถานะย่อ<\/li><li>ตั้งกติกาว่าทุกการดำเนินงานต้องเขียนลงข้อ 4 ทันที รวมรายละเอียดเล็กและสิ่งที่ลองแล้วไม่ได้ผล<\/li><li>โฟลเดอร์นี้ (ตอนนั้นอยู่ที่ <code>notes/data-section/<\/code>) ยังเป็น untracked มาตลอด commit นี้เป็นครั้งแรกที่เข้า git<\/li><li>repo นี้ยังไม่ได้ตั้ง <code>user.name<\/code> และ <code>user.email<\/code> ในเครื่อง ตั้งเป็น Kanvara001 / kanvara.t@kkumail.com แบบ local เฉพาะ repo นี้ ไม่ได้แตะ global config<\/li><li>commit ลง <code>main<\/code> ตามรูปแบบที่ repo นี้ใช้มาตลอด (ทุก commit ก่อนหน้าอยู่บน main) <b>ยังไม่ push<\/b><\/li><li>commit มีแค่ 22 ไฟล์ในโฟลเดอร์นี้ ตรวจแล้วไม่แตะไฟล์อื่นในโปรเจกต์<\/li><\/ul>\n<p><b>กับดักที่เจอ ถ้าใครทำงาน repo นี้จาก Linux หรือ WSL ต้องรู้<\/b><br>หลังรัน <code>git add<\/code> อยู่ดี ๆ ไฟล์อื่นทั้ง 33 ไฟล์ (<code>main.tex<\/code>, <code>acmart.cls<\/code>, <code>.gitignore<\/code> ฯลฯ)<br>ขึ้นเป็น modified ทั้งที่ไม่ได้แตะ สาเหตุคือ repo ถูก clone บน Windows ที่ <code>core.autocrlf<\/code> เปิดอยู่ใน global config<br>ไฟล์ในเครื่องจึงเป็น CRLF แต่ที่เก็บใน git เป็น LF พอ git ฝั่ง Linux มองด้วย <code>core.autocrlf=false<\/code><br>มันเห็นว่าทุกบรรทัดต่างกันหมด และการรัน <code>git add<\/code> ไป refresh index cache ทำให้ของที่เคยดูสะอาดโผล่มา<\/p>\n<p>แก้ด้วยการตั้ง <code>git config core.autocrlf true<\/code> แบบ local เฉพาะ repo นี้ แล้ว status กลับมาสะอาด<br><b>ห้ามเผลอ <code>git add -A<\/code> หรือ <code>git commit -a<\/code> ตอนที่อาการนี้ขึ้น<\/b> เพราะจะ commit การแปลง CRLF<br>ทับไฟล์ LaTeX ทั้งโปรเจกต์ กลายเป็น diff ปลอมหลายพันบรรทัดที่ทีมต้องมาแก้<br>และต้องขอสิทธิ์ลบไฟล์ในโฟลเดอร์ก่อน ไม่งั้น git ลบ <code>.lock<\/code> ของตัวเองไม่ได้ คำสั่ง git ครั้งถัดไปจะพัง<\/p>\n<p><b>push ต้องทำจาก Windows เอง<\/b> เข้าถึงเครื่องผ่าน Linux VM ที่ mount โฟลเดอร์มา<br>VM นั้นไม่มี credential ของ GitHub (ไม่มี credential helper ไม่มี gh ไม่มี ssh key)<br>และอ่าน Windows Credential Manager ไม่ได้ <code>git push<\/code> จึงล้มด้วย<br><code>could not read Username for 'https://github.com'<\/code><br>commit ทำจาก cloud ได้ แต่ push ให้เปิด terminal ใน <code>D:\\SMOTE25<\/code> แล้วรัน <code>git push origin main<\/code><\/p>\n<ul><li>push ครั้งแรกถูก reject เพราะ P push เข้ามาก่อน 3 commit (<code>0f19ca5<\/code> section 7 HTML draft, <code>3c08dbd<\/code> merge, <code>e135105<\/code> structure note) แตะคนละไฟล์กันหมด ไม่มี conflict rebase ทับไปแล้ว commit ของเราไปอยู่บนสุด<\/li><\/ul>\n<h3 id=\"h-12\">14 ตุลาคม 2026 ตรวจว่างานของ P ทับกับของเราตรงไหน<\/h3>\n<p>P push <code>notes/SMOTE25_evidence_map_v1.csv<\/code> และ <code>notes/smote25-development-brief.md<\/code> เข้ามา<br>ไฟล์ไม่ชนกับของเรา แต่ <b>เนื้อหาทับกัน 3 จุด<\/b><\/p>\n<p><b>corpus ตรงกันเป๊ะ<\/b> evidence map ของ P มี 73 แถว ของเรา 76 เรื่อง ส่วนต่าง 3 อธิบายได้ครบ<br>P นับ Global-CS เป็น 1 เรื่อง (เรานับ 2 เพราะมีฉบับ AAAI 2006 กับฉบับวารสาร 2010)<br>และ P ไม่นับ survey 2 เรื่อง 73 + 1 + 2 = 76 พอดี คือคนละเกณฑ์การนับ ไม่ใช่ paper หาย<\/p>\n<p><b>จุดที่ 1 คีย์ไม่ตรงกัน<\/b> P ใช้ <code>Buda-ROS<\/code> เราใช้ <code>ROS (Buda)<\/code>, P ใช้ <code>OREM<\/code> เรา <code>OREM-M<\/code>,<br>P ใช้ <code>SMOTE-ENN/Tomek<\/code> เรา <code>SMOTE-ENN / SMOTE-Tomek<\/code> ถ้าจะ join สองไฟล์ต้องทำ mapping<br>ทางแก้ที่เสนอ เอา ID ของ P (W01, W02, ...) มาใส่เป็นคอลัมน์ในชีต <code>papers<\/code> ของเรา<\/p>\n<p><b>จุดที่ 2 คอลัมน์ซ้ำกัน<\/b> evidence map มี significance test, Friedman, Wilcoxon, KEEL, UCI,<br>artificial data, AUC, F-measure, G-mean, MCC, SVM, XGBoost, code link<br>ซึ่งชีต <code>papers<\/code> ของเรามี <code>stat_test<\/code>, <code>classifiers_used<\/code>, <code>metrics_used<\/code>, <code>code_available<\/code> อยู่แล้ว<\/p>\n<p><b>จุดที่ 3 ระดับความน่าเชื่อถือไม่เท่ากัน และนี่คือจุดอันตราย<\/b><br>คอลัมน์ของ P ระบุที่มาไว้เองว่า \"Drive full-text phrase search of the main PDF, 6 Oct 2026<br>(mention, not confirmed use)\" และ \"first-pass from title and abstract; verify\"<br>แปลว่า <code>KEEL = yes<\/code> หมายถึง <b>คำว่า KEEL ปรากฏในไฟล์ PDF<\/b> ไม่ใช่ paper นั้นใช้ KEEL<br><b>ห้ามหยิบตัวเลขจากไฟล์นั้นมาแทนการตรวจของเรา<\/b> เพราะจะกลายเป็นการเอาข้อมูลระดับ \"มีคำนี้อยู่\"<br>มาใช้เป็น \"ใช้จริง\" ซึ่งเป็นความผิดพลาดแบบเดียวกับที่ section นี้ตั้งใจจะวิจารณ์<\/p>\n<p><b>แต่ใช้เป็นตัวจับ error ได้<\/b> ถ้า full-text search ของ P บอกว่า paper หนึ่งไม่มีคำว่า KEEL เลย<br>แต่ extraction ของเราบอกว่ามันใช้ dataset จาก KEEL แปลว่าฝั่งใดฝั่งหนึ่งผิด<br>รันเทียบทีเดียวครอบคลุมทั้ง 76 เรื่อง ถูกกว่าการไล่ตรวจมือ <b>ยังไม่ได้ทำ<\/b><\/p>\n<p><b>ต้องคุยกับ P<\/b> <code>smote25-development-brief.md<\/code> มีหัวข้อ \"Data angle\" อยู่ทั้ง 3 part<br>และมี \"Reporting checklist (proposed for the paper)\" 4 ข้อ ซึ่งทับกับข้อเสนอแนะด้านการประเมินผล<br>ที่ section นี้จะเขียน ต้องเคลียร์ว่าใครเป็นเจ้าของ checklist และ Data angle ของ P<br>คือเนื้อ section นี้หรือเป็นแค่การปูพื้นให้ส่วนของเขา <b>ยังไม่ได้คุย<\/b><\/p>\n<h3 id=\"h-13\">14 ตุลาคม 2026 ย้ายโฟลเดอร์ออกจาก notes<\/h3>\n<p>ย้าย <code>notes/data-section/<\/code> ไปเป็น <code>Data section/<\/code> ที่ระดับบนสุดของ repo<br>ใช้ <code>git mv<\/code> ประวัติไฟล์จึงตามไปด้วย git บันทึกเป็น rename ทั้ง 22 ไฟล์ ไม่ใช่ลบแล้วสร้างใหม่<br><code>notes/<\/code> เหลือเฉพาะของ P และลบโฟลเดอร์ว่าง <code>notes/build<\/code> ที่ค้างอยู่ทิ้ง<\/p>\n<p><b>ชื่อโฟลเดอร์มีเว้นวรรค<\/b> ต่างจากโฟลเดอร์อื่นใน repo ที่เป็นตัวเล็กไม่มีเว้นวรรค<br>(<code>sections/<\/code>, <code>tables/<\/code>, <code>figures/<\/code>, <code>notes/<\/code>, <code>template/<\/code>)<br>เวลาพิมพ์คำสั่งต้องใส่เครื่องหมายคำพูด เช่น <code>cd \"Data section\"<\/code> ไม่งั้น shell จะมองเป็นสองคำ<\/p>\n<p>push สำเร็จเป็น <code>45ad6c4<\/code> บน <code>origin/main<\/code> 22 ไฟล์ใต้ <code>Data section/<\/code> <code>notes/<\/code> เหลือเฉพาะของ P<\/p>\n<h3 id=\"h-14\">14 ตุลาคม 2026 ตัดสินขอบเขตงาน และจุดที่หยุดไว้<\/h3>\n<p><b>การแบ่งงานในทีม<\/b> รับผิดชอบด้าน <b>ข้อมูล<\/b> คนอื่นรับ <b>methodology<\/b> และ <b>metric<\/b><\/p>\n<p><b>คำตัดสิน<\/b> ทำตามแนวทางของเราให้เสร็จก่อน แล้วค่อยเอาไปรวมกับของคนอื่น<br>ไม่ต้องไปเคลียร์ขอบเขตกับ P ก่อนเริ่ม<\/p>\n<p><b>ผลที่ตามมา 2 ข้อ ยังไม่ได้ลงมือ<\/b><\/p>\n<ol><li><b>workbook เก็บข้อมูลให้ section คนอื่นอยู่<\/b> ชีต <code>papers<\/code> มี <code>classifiers_used<\/code>, <code>metrics_used<\/code>, <code>stat_test<\/code>, <code>code_available<\/code> และชีต <code>extraction<\/code> มี <code>outcome_metric<\/code>, <code>outcome_classifier<\/code>, <code>stat_test_on_this_row<\/code>, <code>significant<\/code> ช่องเหล่านี้เป็นอาณาเขต ของคน metric ไม่ใช่ของเรา และ evidence map ของ P ก็มีซ้ำอีกชุดแล้ว ถ้าตัดออก ภาระการตรวจลดลง เหลือเฉพาะ <code>data_type<\/code>, <code>modification_kind<\/code>, <code>source_repo<\/code>, ขนาด/คลาส/IR และ outcome สองช่องที่ใช้ทดสอบ H1 H2 <b>outcome ยังต้องเก็บ<\/b> เพราะข้อโต้แย้งของเราคือชนะบน *ข้อมูลแบบไหน* ไม่ใช่ชนะด้วย *metric อะไร*<\/li><li><b>ไม่ต้องตรวจครบ 1,460 แถวก่อนเขียน<\/b> ตัวเลข 85 ถึง 115 ชั่วโมงใน <code>_archive/workplan.md<\/code> มาจากสมมติว่าตรวจครบทุกแถวก่อน ซึ่งผิดลำดับ<\/li><\/ol>\n<p><b>งานชิ้นถัดไปที่ตกลงกันแล้ว<\/b> ร่างโครง Data section เป็นหัวข้อย่อย แล้วแมปว่าแต่ละหัวข้อ<br>ต้องการหลักฐานอะไร จากตารางไหน กี่แถว ระบุด้วยว่าหัวข้อไหนเขียนได้เลยจากที่มีอยู่<br>หัวข้อไหนต้องตรวจก่อน เพื่อให้เห็นทางที่สั้นที่สุดจากสถานะปัจจุบันไปถึงตัวหนังสือ<br>และไม่เสียเวลาตรวจช่องที่ section นี้ไม่ได้ใช้<\/p>\n<h3 id=\"h-15\">16 ตุลาคม 2026 ปิดช่องว่าง MWMOTE และสิ่งที่เจอในตาราง 5<\/h3>\n<p>อ่านตาราง 5 จากหน้า PDF มาให้ (ตารางเป็นรูปภาพ สกัดด้วยเครื่องไม่ได้) ครบ 20 แถว<br>ใส่เข้าระบบแล้วพร้อมตัวเลข N / features / minority / majority / %minority<br>เก็บต้นฉบับที่ลอกมาไว้ที่ <code>build/mwmote_table5.tsv<\/code><\/p>\n<p><b>ช่องว่างรายชื่อ dataset ปิดหมดแล้ว<\/b> เหลือแค่ Tomek Links 1 ชื่อ ซึ่งไม่ใช่ช่องว่างจริง<br>(paper 1976 ใช้ตัวอย่างสังเคราะห์ชุดเดียว ไม่มีชื่อ) ตอนนี้ 75 จาก 76 paper กระทบยอดครบ<br>รวม 1,458 ชื่อ 605 dataset ที่ต่างกัน workbook 1,473 แถว<\/p>\n<h4 id=\"h-16\">สิ่งที่เจอจากการตรวจเลขในตาราง 5<\/h4>\n<p><b>ก. satimage ถูกนับเป็นสอง dataset ในตารางเดียวกัน<\/b> นี่คือข้อที่สำคัญที่สุด<\/p>\n<div class=\"tbox\"><table><thead><tr><th>ชื่อในตาราง<\/th><th>N<\/th><th>minority<\/th><th>features<\/th><\/tr><\/thead><tbody><tr><td>Statlandsat<\/td><td>4435<\/td><td>class 4 (415)<\/td><td>37<\/td><\/tr><tr><td>Satimage<\/td><td>6435<\/td><td>class 2, 4, 5 (2036)<\/td><td>36<\/td><\/tr><\/tbody><\/table><\/div>\n<p>UCI Statlog Landsat Satellite มี <code>sat.trn<\/code> 4435 แถว และ <code>sat.tst<\/code> 2000 แถว รวม 6435<br><b>4435 + 2000 = 6435 พอดี<\/b> แปลว่า Statlandsat คือ training split ส่วน Satimage คือชุดเต็ม<br>เป็นแหล่งเดียวกัน แต่คนละ split และคนละวิธี binarize ถูกนับเป็น 2 ชุดใน 20 ชุด<br>ตรงกับกติกาข้อ 3 ของเราพอดี ชื่อต่างกันแต่เป็นข้อมูลเดียวกัน เก็บทั้งคู่และ note ไว้<br>จำนวน feature ที่ต่างกัน 37 กับ 36 ยิ่งชี้ว่าคนละการเตรียมข้อมูล <b>ต้องยืนยันกับเนื้อความใน paper<\/b><\/p>\n<p><b>ข. OCR คือ optdigits เฉพาะ training split และพิมพ์ผลรวมผิด<\/b><br>ตารางพิมพ์ N = 3826 แต่ minority + majority = 376 + 3447 = <b>3823<\/b><br><code>optdigits.tra<\/code> มี 3823 แถว และ <code>optdigits.tes<\/code> มี 1797 แถว รวม 5620<br>3823 ตรงกับ training split พอดี ดังนั้น 3826 คือพิมพ์ผิด <b>ต้องยืนยัน<\/b><\/p>\n<p><b>ค. Statlandsat พิมพ์ majority ผิดชัดเจน<\/b> ตารางพิมพ์ majority = 4435 ซึ่งเท่ากับ N<br>415 + 4435 = 4850 ไม่เท่ากับ 4435 ค่าที่ถูกคือ <b>4020<\/b><\/p>\n<p><b>ง. %Minority กับคอลัมน์ ratio ปัดไม่ตรงกัน 5 แถว<\/b><br>Robot (พิมพ์ 22 คำนวณได้ 21.15), Vehicle (24 / 23.30), Texture (28 / 27.39),<br>Phoneme (30 / 29.08), OCR (9 / 9.83) ไม่ใช่เรื่องใหญ่แต่บันทึกไว้<\/p>\n<p><b>จ. ขนาดไม่ตรงกับ release มาตรฐาน 4 ชุด<\/b> (แต่ภายในแถวบวกกันถูก)<br>Pageblocks 5476 (มาตรฐาน 5473), Vehicle 940 (846), Texture 5477 (5500), Phoneme 5227 (5404)<br>ยังไม่รู้ว่าเกิดจากอะไร เข้าทะเบียน variant ไว้ก่อน<\/p>\n<p><b>ฉ. คอลัมน์ที่หัวว่า Imbalance Ratio ไม่ใช่ imbalance ratio<\/b><br>ตาราง 5 ไม่ได้พิมพ์ IR แบบอัตราส่วนเลย แต่พิมพ์คู่สัดส่วนคลาสเช่น <code>0.04:0.96<\/code><br>ซึ่งเป็นสัดส่วนของ minority ไม่ใช่อัตราส่วนขนาดคลาส เอาไปเทียบกับ IR ของ paper อื่นตรง ๆ ไม่ได้<br>ต้องแปลงก่อน เป็นหลักฐานเพิ่มให้หัวข้อนิยาม IR ที่ขัดกัน 9 แบบ<\/p>\n<p><b>ช. benchmark ของ MWMOTE เป็นข้อมูลดัดแปลงแทบทั้งหมด<\/b> จาก 20 ชุด<br>มีเพียง Pima, Breast-cancer-original, Phoneme ที่เป็นปัญหาสองคลาสโดยกำเนิด<br>อีก 17 ชุดผู้เขียน binarize เอง (one-vs-rest หรือรวมหลายคลาสเป็น minority)<br>ส่วน Abalone เป็นการเลือกมาแค่ 2 คลาสจาก 28 คลาส<br><b>เป็นจุดข้อมูลตรงสำหรับ H1 แต่ต้องรอ data_type ที่ตรวจแล้วก่อนจึงจะอ้างได้<\/b><\/p>\n<p>ทั้งหมดในหัวข้อนี้มาจากการคำนวณเลขในตารางที่ลอกมา <b>ยังไม่ได้เปิด paper ยืนยันข้อ ก ข ค<\/b><\/p>\n<h3 id=\"h-17\">16 ตุลาคม 2026 ตรวจตาราง 5 ของ MWMOTE ทีละข้อ<\/h3>\n<p>ตรวจ 7 จาก 20 แถวเทียบกับเอกสารต้นทางของแต่ละ dataset ผลเต็มอยู่ใน <code>mwmote-table5-audit.md<\/code><br>ข้อมูลอ้างอิงที่ใช้เก็บไว้ที่ <code>build/mwmote_table5_sources.json<\/code> ผลเทียบที่ <code>build/mwmote_table5_audit.json<\/code><\/p>\n<p><b>ข้อ 1 Statlog Landsat ถูกนับสองครั้ง ยืนยันแล้ว<\/b> Satimage คือชุดเต็ม 6435<br>Statlandsat คือ <code>sat.trn<\/code> 4435 ซึ่งเป็น <b>subset ของ Satimage<\/b> (ตอนแรกเข้าใจกลับด้าน)<br>minority ตรงเป๊ะทั้งคู่ 415 (คลาส 4 ใน train) และ 2036 (คลาส 2+4+5 ในชุดเต็ม)<\/p>\n<p><b>ข้อ 2 OCR สมมติฐาน ถูก<\/b> เป็น <code>optdigits.tra<\/code> minority 376 ถูก majority 3447 ถูก<br>มีแต่ N ที่พิมพ์ 3826 ทั้งที่ควรเป็น 3823 บวกเลขผิดล้วน<\/p>\n<p><b>ข้อ 3 majority ผิด ไม่ใช่ N<\/b> N 4435 กับ minority 415 ต่างมีที่มายืนยันได้<br>ส่วน majority 4435 ไม่มีที่มา ถ้าถูก N ต้องเป็น 4850 ซึ่งไม่ตรงไฟล์ใดของ UCI<br>ค่าที่ถูกคือ 4020 ลักษณะความผิดคือลอกค่า N มาใส่ช่อง majority<\/p>\n<p><b>ข้อ 4 สองคอลัมน์ใช้วิธีปัดคนละแบบ<\/b> 4 แถวพิมพ์ค่าจริง 2 ทศนิยม (CTG, Statlandsat, Semeion, Libra)<br>อีก 16 แถวเป็นจำนวนเต็ม และ 5 แถว (Yeast, Robot, Vehicle, Texture, Phoneme) %Minority ปัดขึ้น<br>แต่คอลัมน์สัดส่วนปัดลง ทิศทางการปัดก็ไม่คงเส้นคงวา<\/p>\n<p><b>ข้อ 5 ไม่ได้เกิดจากการเลือกคลาส และตรงข้ามด้วยซ้ำ<\/b><br>Pageblocks minority 231 ตรงเป๊ะ (28+88+115) Texture minority 1500 ตรงเป๊ะ (3x500)<br>การเลือกคลาสถูกต้องสมบูรณ์ แต่ majority ผิดทั้งคู่ (+3 และ −23)<br>ถ้าเป็นเรื่องการเลือกคลาสจริง ความผิดต้องไปโผล่ที่ minority<br>Phoneme เป็นสองคลาสโดยกำเนิด ไม่มีคลาสให้เลือก แต่ผิดทั้งสองฝั่ง น่าจะคนละเวอร์ชันข้อมูล<br>Vehicle อธิบายไม่ได้ 940 ไม่ตรงทั้ง 846 และ 946 <b>ต้องดูว่า paper อ้างแหล่งไหน<\/b><\/p>\n<p><b>รูปแบบที่เห็น<\/b> ความผิดพลาดกระจุกอยู่ฝั่ง majority และ N ส่วน minority แม่น 5 จาก 7 ชุด<br>คอลัมน์ที่เขาระวังน้อยกว่า คือคอลัมน์ที่กำหนดค่า IR ขณะที่ minority ซึ่งเป็นสิ่งที่<br>oversampler ทำงานด้วยโดยตรงกลับแม่น <b>เป็นข้อสังเกตระดับ paper เดียว ยังไม่ใช่ข้อสรุประดับวงการ<\/b><\/p>\n<p><b>ข้อสังเกต เรื่อง IR มีสองแกน ไม่ใช่แกนเดียว<\/b><br>นอกจากนิยาม 9 แบบที่เก็บไว้ ยังมีแกนรูปแบบการพิมพ์ บาง paper รายงาน IR ของทั้ง dataset<br>เป็นตัวเลขเดียว บาง paper รายงานฝั่ง majority กับ minority แยกกัน (MWMOTE เป็นแบบหลัง)<br>สองแกนนี้แยกจากกัน เทียบข้าม paper ต้องปรับทั้งสองแกน<br><b>สิ่งที่ต้องทำ<\/b> เพิ่มคอลัมน์บันทึกรูปแบบการพิมพ์ในชีต <code>extraction<\/code> แยกจาก <code>ir_definition<\/code><\/p>\n<p><b>ยังค้าง<\/b> ยังไม่ได้เปิดเนื้อความใน MWMOTE ดูว่าเขาอ้างแหล่งและ split ไว้ว่าอย่างไร<br>และยังเหลืออีก 13 แถวที่ยังไม่ได้ตรวจเทียบ<\/p>\n<h3 id=\"h-18\">16 ตุลาคม 2026 แก้ค่าที่ผิดในตาราง 5 และอ่านเนื้อความ MWMOTE<\/h3>\n<p><b>วิธีแก้ที่ใช้ ไม่เขียนทับค่าที่ paper พิมพ์<\/b><br>ถ้าเขียนทับ เราจะทำลายหลักฐานที่เป็น finding ของเราเอง จึงเพิ่มคอลัมน์ใหม่ในชีต <code>extraction<\/code> แทน<br><code>n_minority<\/code>, <code>n_majority<\/code> (ตามที่พิมพ์) และ <code>values_corrected<\/code>, <code>n_instances_corrected<\/code>,<br><code>n_minority_corrected<\/code>, <code>n_majority_corrected<\/code>, <code>n_features_corrected<\/code>, <code>correction_basis<\/code><br><b>กติกาใหม่ ค่าที่ paper พิมพ์อยู่คอลัมน์เดิมเสมอ ค่าที่แก้อยู่คอลัมน์ <code>_corrected<\/code> เสมอ<\/b><br>คอลัมน์ <code>n_minority<\/code> กับ <code>n_majority<\/code> ใช้ได้กับทุก paper ไม่ใช่แค่ MWMOTE<\/p>\n<p><b>ค่าที่แก้แล้ว 4 แถว<\/b><\/p>\n<div class=\"tbox\"><table><thead><tr><th>dataset<\/th><th>ช่องที่ผิด<\/th><th>พิมพ์<\/th><th>แก้เป็น<\/th><\/tr><\/thead><tbody><tr><td>OCR<\/td><td>N<\/td><td>3826<\/td><td>3823<\/td><\/tr><tr><td>Statlandsat<\/td><td>majority<\/td><td>4435<\/td><td>4020<\/td><\/tr><tr><td>Statlandsat<\/td><td>features<\/td><td>37<\/td><td>36<\/td><\/tr><tr><td>Pageblocks<\/td><td>N / majority<\/td><td>5476 / 5245<\/td><td>5473 / 5242<\/td><\/tr><tr><td>Texture<\/td><td>N / majority<\/td><td>5477 / 3977<\/td><td>5500 / 4000<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Satimage ตรวจแล้วถูกทุกค่า ส่วน Phoneme กับ Vehicle ยังแก้ไม่ได้ ใส่ <code>values_corrected = no<\/code> พร้อมเหตุผล<\/p>\n<p><b>อ่านเนื้อความใน MWMOTE แล้ว สิ่งที่ paper บอกมีแค่นี้<\/b><br>\"We also use 20 real-world data sets collected from the UCI machine learning repository [41].\"<br>และ \"Some of the data sets have samples of more than two classes. We transform them to two-class<br>problems because of our interest.\" อ้างอิง [41] คือหน้าแรกของคลัง UCI ไม่ใช่ชุดข้อมูลเฉพาะเรื่อง<\/p>\n<p><b>สิ่งที่ paper ไม่ได้บอก และกลายเป็นประเด็นของ section เรา<\/b><\/p>\n<ol><li>ไม่ได้บอกว่าใช้ training split แต่ Statlandsat กับ OCR เป็น training split ชัดเจน ผู้อ่านที่โหลดชุดเต็มตามที่ paper บอกจะได้ข้อมูลคนละขนาดกับที่รายงาน<\/li><li>ไม่ได้บอกกติกาการเลือกคลาสเป็น minority มีแต่ในตารางซึ่งเป็นรูปภาพ<\/li><li>Phoneme กับ Texture น่าจะไม่ได้มาจาก UCI ค้นในคลัง UCI ไม่พบหน้า dataset ของทั้งสองชื่อ ทั้งคู่แจกผ่าน KEEL และ OpenML <b>ยังต้องยืนยันให้แน่นก่อนเขียน<\/b><\/li><li>ไม่ได้บอกว่าตัดแถวซ้ำหรือกรองข้อมูล ซึ่งเป็นคำอธิบายเดียวที่เหลือสำหรับ Phoneme<\/li><\/ol>\n<p><b>Phoneme<\/b> ขาด 177 แถว แบ่งเป็น minority 66 (4.2% ของคลาส) majority 111 (2.9% ของคลาส)<br>สัดส่วนใกล้เคียงกันทั้งสองคลาส เข้ากับการตัดแถวซ้ำมากกว่าการสุ่มตัด แต่ paper ไม่ได้บอก จึงยังพิสูจน์ไม่ได้<\/p>\n<p><b>Vehicle<\/b> ยังอธิบายไม่ได้ 940 ไม่ตรงทั้ง 846 (ชุดที่แจก) และ 946 (ก่อนกัน 100 แถวไว้ validate)<br>minority 219 ไม่ตรงกับคลาสใดเลย paper บอกแค่ว่ามาจาก UCI<\/p>\n<p><b>บั๊กที่เจอและแก้แล้ว<\/b> ข้อความใน cell ที่ขึ้นต้นด้วย <code>=<\/code> ทำให้ Excel มองเป็นสูตรและขึ้น <code>#VALUE!<\/code><br>ใส่ guard ใน <code>build/make_workbook.py<\/code> ให้เติม <code>'<\/code> นำหน้าข้อความที่ขึ้นต้นด้วย <code>=<\/code> <code>+<\/code> <code>-<\/code> <code>@<\/code><br>อัตโนมัติ (ยกเว้นคอลัมน์สูตรที่ตั้งใจใส่) recalc กลับมา 0 error<\/p>\n<h3 id=\"h-19\">16 ตุลาคม 2026 ตรวจตาราง 5 ต่อจนครบเท่าที่ตรวจได้ และหาเกณฑ์การเลือกคลาส<\/h3>\n<p><b>เกณฑ์การเลือกคลาสเป็น minority ไม่มีระบุไว้เลย<\/b> ค้นทั้งบทความแล้ว<br>ตารางบอกชัดว่าเลือกคลาสไหน (เช่น Pageblocks เลือก Graphic, Vert.line, Picture)<br>แต่เหตุผลมีอยู่ประโยคเดียวคือ <b>\"We transform them to two-class problems because of our interest\"<\/b><br>คำว่า Table 5 ปรากฏในบทความครั้งเดียว ไม่มีเกณฑ์ ไม่มีการอ้างงานก่อนหน้าที่ใช้การแบ่งแบบเดียวกัน<br>ผลคือการแบ่งสองคลาสของ 17 ชุดทำซ้ำได้ก็ต่อเมื่ออ่านค่าจากตารางที่เป็นรูปภาพ<br>(แก้ที่เคยบันทึกไว้ผิดเมื่อรอบก่อนว่า paper ไม่ได้บอกว่าเลือกคลาสไหน ที่จริงบอกไว้ในตาราง<br>สิ่งที่ไม่มีคือเหตุผล เป็นคนทักจุดนี้)<\/p>\n<p><b>ตรวจเพิ่มอีก 8 ชุด ถูกทุกค่าทั้งหมด<\/b> Abalone, Segment, Libra, Ecoli, Glass, Wine,<br>Breast-cancer-original, Pima<\/p>\n<p><b>สรุปสถานะตาราง 5 ทั้ง 20 แถว<\/b><\/p>\n<div class=\"tbox\"><table><thead><tr><th>ผล<\/th><th>จำนวน<\/th><th>รายชื่อ<\/th><\/tr><\/thead><tbody><tr><td>ถูกทุกค่า<\/td><td>9<\/td><td>Satimage, Segment, Libra, Ecoli, Glass, Wine, Breast-cancer-original, Pima, Abalone (ยกเว้น feature)<\/td><\/tr><tr><td>มีค่าผิด แก้แล้ว<\/td><td>4<\/td><td>Statlandsat, OCR, Pageblocks, Texture<\/td><\/tr><tr><td>อธิบายไม่ได้<\/td><td>2<\/td><td>Phoneme, Vehicle<\/td><\/tr><tr><td>ยังไม่มีแหล่งอ้างอิง<\/td><td>5<\/td><td>CTG, Semeion, Yeast, Robot, Breast-tissue<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>5 ชุดที่ค้าง<\/b> หาเอกสารที่ระบุจำนวนต่อคลาสไม่พบ (UCI, KEEL, OpenML ไม่มีหน้าไหนระบุ)<br>เปิดไฟล์ข้อมูลแล้วนับคอลัมน์คลาสก็จบ สมมติฐานที่ต้องตรวจบันทึกไว้ใน <code>correction_basis<\/code> ของแต่ละแถว<br>CTG (คลาส 3+4 = 134 ของ label แบบ CLASS 10 รูปแบบ), Semeion (digit 4 = 161),<br>Yeast (ME3+ME2+EXC+VAC+POX+ERL = 304), Robot (slight-left + slight-right = 1154),<br>Breast-tissue (car + fad = 36)<\/p>\n<p><b>รูปแบบชัดขึ้นเมื่อมีข้อมูลมากขึ้น<\/b> จาก 15 ชุดที่ตรวจได้ minority ถูกเป๊ะ 13 ชุด<br>ส่วน majority หรือ N ผิด 4 ชุด และทั้ง 4 ชุดนั้น minority ถูกเป๊ะหมด<br>คอลัมน์ที่กำหนดค่า IR คือคอลัมน์ที่ผิด ส่วนคอลัมน์ที่ oversampler ทำงานด้วยโดยตรงกลับแม่น<\/p>\n<p><b>จำนวน feature ผิดคนละทิศ 2 ชุด และน่าสนใจคนละแบบ<\/b><br>Statlandsat พิมพ์ 37 ส่วน UCI ระบุ 36 น่าจะนับคอลัมน์คลาสด้วย<br>Abalone พิมพ์ 7 ส่วน UCI ระบุ 8 ส่วนที่หายน่าจะเป็น attribute Sex ซึ่งเป็น nominal<br>วิธีที่ใช้ระยะทางมักตัดทิ้ง <b>ถ้าเป็นเช่นนั้นก็คือการดัดแปลงข้อมูลที่ไม่ได้ประกาศไว้<\/b><br>Semeion พิมพ์ 265 ต่างจาก 256 pixel อยู่ 9 ยังไม่ทราบที่มา ทั้งสามข้อยังเป็นการคาดเดา<\/p>\n<h3 id=\"h-20\">16 ตุลาคม 2026 เรื่อง feature และข้อสังเกต เรื่องชื่อสามัญ<\/h3>\n<p><b>feature paper บอกไว้ แต่อยู่ผิดที่<\/b> ไม่มีในส่วนข้อมูลเลย ไปอยู่ในส่วนสรุปและงานในอนาคต<br>\"In this paper, we use data sets with continuous features only\" เขียนไว้เป็นข้อจำกัดของวิธี<br>ไม่ได้เขียนเป็นขั้นตอนการเตรียมข้อมูล แต่ผลของมันคือการดัดแปลงข้อมูล<\/p>\n<p>ยืนยันกรณี Abalone ได้พอดี UCI ระบุ 8 attributes รวม <code>Sex<\/code> ที่เป็น nominal<br>และ KEEL ลงรายการ <code>abalone9-18<\/code> ว่ามี 8 attributes แบ่งเป็น 7 real และ 1 nominal<br>MWMOTE พิมพ์ 7 ส่วนที่หายคือ <code>Sex<\/code> <b>ไม่ใช่พิมพ์ผิด แต่เป็นการดัดแปลงที่ไม่ได้ประกาศไว้ในที่ที่ควรอยู่<\/b><br>ส่วน Statlandsat (37 เทียบ 36) กับ Semeion (265 เทียบ 256) อธิบายด้วยประโยคนี้ไม่ได้<br>เพราะเป็นการพิมพ์เกินไม่ใช่ขาด ยังไม่มีคำอธิบาย<\/p>\n<p><b>ข้อสังเกต ยืนยันด้วยตัวเลขแล้ว และแรงกว่าที่คาด<\/b><\/p>\n<p>แยกสองกรณีออกจากกัน ชุดที่แปลงแล้วเปลี่ยนชื่อ (เช่น <code>yeast-0-5-6-7-9_vs_4<\/code>) ไม่น่าห่วง<br>เพราะชื่อประกาศการแบ่งไว้ในตัวเอง ส่วนชุดที่ใช้ชื่อสามัญแต่เลือกคลาสเองเงียบ ๆ คือกรณีอันตราย<\/p>\n<p>เอาชุดชื่อสามัญ 9 ชุดของ MWMOTE เทียบกับทะเบียน imbalanced ของ KEEL<\/p>\n<div class=\"tbox\"><table><thead><tr><th>ชื่อที่พิมพ์<\/th><th>N / IR<\/th><th>ชุดของ KEEL<\/th><th>N / IR<\/th><th>ผล<\/th><\/tr><\/thead><tbody><tr><td>Ecoli<\/td><td>336 / 3.36<\/td><td><code>ecoli1<\/code><\/td><td>336 / 3.36<\/td><td>ตรงเป๊ะ<\/td><\/tr><tr><td>Glass<\/td><td>214 / 3.20<\/td><td><code>glass-0-1-2-3_vs_4-5-6<\/code><\/td><td>214 / 3.20<\/td><td>ตรงเป๊ะ<\/td><\/tr><tr><td>Abalone<\/td><td>731 / 16.40<\/td><td><code>abalone9-18<\/code><\/td><td>731 / 16.40<\/td><td>ตรงเป๊ะ (ตัด Sex)<\/td><\/tr><tr><td>Pima<\/td><td>768 / 1.87<\/td><td><code>pima<\/code><\/td><td>768 / 1.87<\/td><td>ตรงเป๊ะ สองคลาสโดยกำเนิด<\/td><\/tr><tr><td>Segment<\/td><td>2310 / 6.00<\/td><td><code>segment0<\/code><\/td><td>2308 / 6.02<\/td><td>ต่าง 2 แถว<\/td><\/tr><tr><td>Vehicle<\/td><td>940 / 3.29<\/td><td><code>vehicle0<\/code><\/td><td>846 / 3.25<\/td><td>IR ใกล้ N ต่าง 94<\/td><\/tr><tr><td>Pageblocks<\/td><td>5473 / 22.69<\/td><td><code>page-blocks0<\/code><\/td><td>5472 / 8.79<\/td><td>ไม่ตรงเลย<\/td><\/tr><tr><td>Yeast<\/td><td>1484 / 3.88<\/td><td>yeast ทุกตัว<\/td><td>1484 / 2.46-41.40<\/td><td>ไม่ตรงเลย<\/td><\/tr><tr><td>Wine<\/td><td>178 / 2.71<\/td><td>ไม่มีใน KEEL<\/td><td>-<\/td><td>สร้างเอง<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>ชื่อสามัญกำกวมได้ทั้งสองทาง<\/b> Ecoli, Glass, Abalone คือ benchmark มาตรฐานที่มีชื่อของตัวเองอยู่แล้ว<br>แต่ถูกพิมพ์ด้วยชื่อสามัญ ใครเอาไปเทียบกับ paper ที่รายงาน <code>ecoli1<\/code> จะไม่รู้ว่าเป็นปัญหาเดียวกัน<br>ส่วน Yeast กับ Pageblocks คือการแบ่งที่ผู้เขียนคิดเอง ไม่ตรงกับชุดมาตรฐานใดเลย<br>แต่ใช้ชื่อสามัญเหมือนกัน <b>ชื่อจึงบอกไม่ได้ว่าเป็นอย่างไหน<\/b><\/p>\n<p><b>แกนที่ควรใช้จำแนกคือ ประกาศหรือไม่ประกาศ ไม่ใช่ ดัดแปลงหรือไม่ดัดแปลง<\/b><br>ทะเบียนของ KEEL จัดกลุ่มตามช่วง IR และตั้งชื่อให้การแบ่งทุกแบบ อ่านชื่อก็รู้ว่าคลาสไหนเป็น minority<br>ข้อนี้ควรกลายเป็นแกนหนึ่งของการจำแนกใน section นี้ ไม่ใช่แค่เชิงอรรถ<\/p>\n<p><b>ยังไม่ได้ทำ<\/b> ตรวจข้าม paper ว่า <code>Yeast<\/code> หรือ <code>Glass<\/code> ในคนละ paper หมายถึงการแบ่งเดียวกันไหม<br>ตอนนี้ยืนยันได้แค่ว่าภายใน paper เดียวชื่อสามัญก็กำกวมแล้ว<\/p>\n<p><b>หยุดงานไว้ตรงนี้<\/b><\/p>\n<p>push สำเร็จเป็น <code>45ad6c4<\/code> บน <code>origin/main<\/code> ตรวจบน remote แล้วมี 22 ไฟล์ใต้ <code>Data section/<\/code><br>และ <code>notes/<\/code> บน remote เหลือเฉพาะของ P ปิดเรื่อง push ที่ค้างมาตั้งแต่ติด credential และโดน reject<\/p>\n<p><b>บทเรียนจากรอบนี้<\/b> ก่อนหน้านี้ รายงานว่าบันทึก overlap ลง handoff เป็น commit ที่สองแล้ว<br>ซึ่งไม่จริง มีแค่ 1 commit และไฟล์ไม่มีเนื้อหานั้น ตรวจพบตอนจะย้ายโฟลเดอร์<br>ทุกครั้งที่อ้างว่าเขียนอะไรลงไฟล์แล้ว ให้ <code>grep<\/code> ยืนยันในไฟล์จริงก่อนรายงาน<\/p>\n<h3 id=\"h-21\">16 ตุลาคม 2026 ร่างโครง section และแผนที่หลักฐาน<\/h3>\n<p><b>fetch ก่อนเริ่ม<\/b> <code>origin/main<\/code> ตรงกับ <code>HEAD<\/code> ที่ <code>d63c4c1<\/code> ไม่มีของใหม่จากฝ่ายอื่น ไม่ต้อง pull<br>fetch ทิ้ง <code>.git/objects/maintenance.lock<\/code> ไว้เพราะยังไม่มีสิทธิ์ลบ ขอสิทธิ์ลบในโฟลเดอร์ repo แล้วลบ lock ตัวนั้นทิ้ง<\/p>\n<p><b>งานรอบนี้<\/b> เลือกทำงานที่ตกลงไว้ 14 ต.ค. (ร่างโครง + แมปหลักฐาน) เพราะข้อ 7 ขั้นที่ 1 ยังไม่ได้ตัดสินในตอนนั้น<br>ผลอยู่ใน <code>_archive/section-outline.md<\/code> 9 หัวข้อ D1 ถึง D9 แต่ละหัวข้อเขียนเป็นคำถาม ไม่ใช่ข้อสรุป<br>บอกหลักฐานที่มี ไฟล์/คอลัมน์ที่อยู่ ขอบเขต (กี่ paper กี่แถว) และสถานะ พร้อมร่าง / ตรวจเฉพาะจุด / บล็อก<br>มีช่อง \"insight\" เว้นว่างไว้ทุกหัวข้อ ไม่ได้เติมแทน<br>ท้ายไฟล์มีตารางลำดับงาน 7 ขั้นที่สั้นที่สุดไปถึงตัวหนังสือ มีแค่ขั้นสุดท้ายที่ต้องรอคำตัดสินเรื่องนิยาม (ปิดแล้ว 29 ต.ค.)<\/p>\n<p><b>สิ่งที่เจอระหว่างทำ เรื่องขอบเขตของตัวเลขในข้อ 5<\/b><\/p>\n<ul><li>ค่าคุณลักษณะเชิงตัวเลขในชีตมีแค่ <b>9 จาก 76 paper<\/b> (154 แถว) อีก 67 paper มีแต่ชื่อ<\/li><li>ทะเบียน variant ที่ให้ตัวเลข \"20 จาก 75 ชื่อ\" สร้างจาก <b>8 paper<\/b> เท่านั้น (88 คู่ paper กับชื่อ) ไม่ใช่ทั้ง corpus ข้อ 5 เขียนไว้โดยไม่บอกขอบเขตนี้ ถ้าเอาไปเขียนต้องระบุ<\/li><li>นิยาม IR ที่ติดป้ายไว้อยู่ใน 150 แถวของ 8 paper เดียวกัน คอลัมน์ <code>ir_definition<\/code> ในชีตยังว่าง<\/li><li>ตารางใน <code>_archive/dataset-usage-recon.md<\/code> ข้อ 2 ใช้ตัวหาร 69 paper ซึ่งเก่าแล้ว ต้องรันใหม่ด้วย 76<\/li><\/ul>\n<p><b>บั๊กที่เจอและแก้แล้ว ใน guard ที่ใส่เมื่อเช้า 16 ต.ค.<\/b><br><code>v[:1] in \"=+-@\"<\/code> เป็น True เมื่อ <code>v<\/code> เป็นสตริงว่าง เพราะใน Python <code>\"\" in \"abc\"<\/code> เป็น True เสมอ<br>ผลคือทุกช่องที่ควรว่างกลายเป็น <code>'<\/code> ตัวเดียว รวม <b>1,705 ช่อง<\/b> ในชีต <code>extraction<\/code><br>(<code>ai_hint_data_type<\/code> 1,057 ช่อง, <code>group_in_paper<\/code> 648 ช่อง) ชีตอื่นไม่โดน<br>แก้เป็น <code>v and v[0] in \"=+-@\"<\/code> ใน <code>build/make_workbook.py<\/code> แล้ว regenerate<br>เทียบ workbook ก่อนและหลังทีละ cell ทุกชีต ต่างกันแค่ 1,705 ช่องนั้น จาก <code>'<\/code> เป็นว่าง ไม่มีค่าอื่นเปลี่ยน<br><b>ผลต่อการวิเคราะห์<\/b> ถ้าใครกรองแถวด้วย <code>ai_hint_data_type<\/code> ว่าง หรือนับ <code>group_in_paper<\/code> ที่มีค่า<br>ระหว่างเช้าถึงตอนนี้ จะได้ตัวเลขผิด เท่าที่รู้ยังไม่มีใครใช้<\/p>\n<p><b>ยังไม่ได้ทำ<\/b> ยังไม่ได้ commit รอดู <code>_archive/section-outline.md<\/code> ก่อน<\/p>\n<h3 id=\"h-22\">16 ตุลาคม 2026 เปลี่ยนทิศ: ดูการเลือกและจัดการข้อมูลทั้ง 76 paper ไม่ใช่ MWMOTE เรื่องเดียว<\/h3>\n<p><b>ทัก<\/b> handoff กับ outline ไปเน้น MWMOTE ทั้งที่สิ่งที่ต้องการคือภาพทั้งวงการ<br>ว่าแต่ละ paper เลือกและจัดการ data อย่างไร (MWMOTE ลงลึกเพราะตาราง 5 เป็นรูปภาพจนค้างนาน ไม่ได้ตั้งใจให้เป็นแกน)<\/p>\n<p><b>ไม่ได้อ่านใหม่ทั้งหมด<\/b> ถามว่าทำงานซ้ำไหม ตรวจแล้วพบว่า <code>ai-draft/papers.json<\/code> จากรอบ 6 ต.ค.<br>มีฟิลด์ระดับ paper ที่ตรงกับคำถามอยู่แล้ว 69 จาก 76 เรื่อง (<code>sources<\/code> <code>srcdet<\/code> <code>crit<\/code> <code>prep<\/code> <code>origin<\/code> <code>spec<\/code> <code>ev<\/code>)<br>แต่ไม่เคยถูกเอามาวิเคราะห์ข้าม paper ใช้แค่นับชื่อ dataset จึงทำแค่ 2 อย่าง<\/p>\n<ol><li><b>อ่าน PDF ใหม่เฉพาะ 7 เรื่องที่ไม่มีฟิลด์<\/b> INOS, SMOTE-IPF, HDE, NROMM, GOIO, DGOT, Loyalty-SMOTE ใช้ subagent เรื่องละตัว schema อยู่ที่ <code>ai-draft/new7/SCHEMA.md<\/code> ผลอยู่ที่ <code>ai-draft/new7/&lt;key&gt;.json<\/code> <b>ทุกค่ามีเลขหน้าและคำพูดยกมา<\/b> (13 ถึง 24 รายการต่อเรื่อง) ต่างจาก 69 เรื่องเดิมที่ไม่มีเลขหน้า NROMM อ่านทั้งตัว paper และ supplementary เลขหน้าขึ้นต้นด้วย main / supp สิ่งที่ subagent รายงานว่าผิดปกติ: NROMM โปรโตคอลขัดกันเอง (2-fold x5 ที่ supp p.13 กับ stratified 10-fold ที่ supp p.19) และชุด D1 ถึง D10 มีชื่อใน supp Table 1 แต่ไม่บอก repository, Loyalty-SMOTE บอกว่า group 3 มี 9 ชุดแต่ Table 4 มี 8, DGOT สะกดชื่อชุดไม่ตรงกันข้ามตาราง (page-blocks/page_blocks, bank/bank_small), HDE ติดป้าย madelon ว่ามาจาก KEEL, GOIO กับ DGOT ตารางเป็นรูปภาพ subagent อ่านจากหน้าที่ render <b>ยังไม่ได้สุ่มตรวจคำพูดของ subagent กับ PDF<\/b><\/li><li><b>ให้รหัส 4 มิติทั้ง 76 เรื่อง<\/b> <code>crit_type<\/code> (ให้เหตุผลไหม), <code>basis<\/code> (เหตุผลแบบไหน), <code>inherited_from<\/code> (ยกชุดมาจากใคร), <code>minority_rule<\/code> (บอกไหมว่าคลาสไหนเป็น minority) รหัสพร้อมนิยามอยู่ที่ <code>ai-draft/data_handling_codes.json<\/code> ให้รหัส 69 เรื่องจากข้อความในฟิลด์ ไม่ได้เปิด PDF จึงเป็นการตีความซ้อนบนร่างของ AI อีกชั้น ต้องตรวจ<\/li><\/ol>\n<p><code>build/data_handling_matrix.py<\/code> รวมทุกอย่างเป็น <code>out/data_handling_matrix.csv<\/code> (1 แถวต่อ paper พร้อมข้อความต้นทาง)<br>และ <code>out/data_handling_summary.json<\/code> (ตัวนับ) รายงานอ่านง่ายอยู่ที่ <code>_archive/data-handling-corpus.md<\/code><br><b>รายงาน md สร้างครั้งเดียวด้วยสคริปต์ inline ไม่ได้เก็บตัวสร้างไว้<\/b> ตัวเลขทุกตัวในนั้นมาจาก <code>out/data_handling_summary.json<\/code><br>ถ้าแก้รหัสแล้วรันสคริปต์ใหม่ md จะไม่อัปเดตตาม ต้องสร้างใหม่<\/p>\n<p><b>ตัวหาร<\/b> 72 paper เชิงประจักษ์ ตัด ENN, Tomek Links, AdaBoost, Survey: SMOTE Review ออก<br>(Tomek มีชุดตัวอย่าง toy แต่ไม่ได้ใช้ประเมินวิธี จึงตัด ถ้าไม่เห็นด้วยแก้ที่รหัส <code>n.a.<\/code>)<\/p>\n<p><b>สิ่งที่ตัวเลขขึ้นกับคำตัดสินที่ยังไม่มี<\/b> paper ที่ดัดแปลงข้อมูลอย่างน้อยหนึ่งแบบได้ 51 จาก 72<br>ถ้านับไฟล์ KEEL 2 คลาสเป็น Original (decisions-pending เรื่องที่ 2) เหลือ 46<\/p>\n<p><b>แก้รหัสระหว่างทาง<\/b> AB-SMOTE เคยใส่ \"threshold from Fernandez et al. 2013\" ใน <code>inherited_from<\/code><br>ซึ่งผิด เพราะยืมเกณฑ์คัด ไม่ได้ยืมรายชื่อ dataset เอาออกแล้ว เกณฑ์ยังอยู่ใน <code>basis<\/code><\/p>\n<p><b>มิติที่มีแค่ 7 เรื่อง<\/b> split, resample ใน fold, missing value, nominal, normalise, คอลัมน์ตารางคุณลักษณะ,<br>นิยามและรูปแบบพิมพ์ IR, ที่ประกาศการดัดแปลง 69 เรื่องเดิมไม่ได้เก็บเป็นช่อง <b>ห้ามตีความว่า paper ไม่บอก<\/b><br>ถ้าจะนับทั้ง corpus ต้องอ่านส่วน experimental setup ของ 69 เรื่องด้วย schema เดียวกัน<\/p>\n<p><b>แก้ <code>_archive/section-outline.md<\/code><\/b> D1 กลายเป็นหัวข้อฐานของทั้ง section ใช้ <code>_archive/data-handling-corpus.md<\/code> เป็นหลักฐานหลัก<br>MWMOTE เหลือเป็นกรณีตัวอย่างใน D3 D5 ตารางลำดับงานเปลี่ยน ขั้นแรกคือตรวจค่า \"ไม่มี\" ทั้ง corpus 35 paper<br>(ค่าที่บอกว่า paper ไม่ได้บอก ผิดได้ง่ายสุด และค้นคำใน PDF ได้โดยไม่ต้องอ่านทั้งเล่ม)<\/p>\n<p><b>ยังไม่ได้ commit<\/b> ของรอบนี้และรอบก่อนหน้ายังอยู่ใน working tree ทั้งหมด<\/p>\n<h3 id=\"h-23\">16 ตุลาคม 2026 หน้า SMOTE25 Dataset Atlas<\/h3>\n<p>ขอดูหน้ารวม dataset ที่เก็บมา หน้าเดิม <code>_archive/ai-draft/Data_Section_Explorer.html<\/code> เป็นของ 6 ต.ค. (69 paper 990 ชื่อ) เก่าเกินไป<br>จึงสร้างหน้าใหม่จากข้อมูลปัจจุบัน publish เป็น Artifact ส่วนตัว ชื่อ <b>SMOTE25 Dataset Atlas<\/b><br>(https://claude.ai/artifact/EuoyidJPHwz7deRmi2bMdc ยังไม่ได้แชร์ให้ใคร คนอื่นในทีมเปิดไม่ได้จนกว่า จะแชร์)<\/p>\n<p>มี 3 แท็บ <b>Datasets<\/b> (642 ชื่อหลัง normalise ค้นได้ กรองตามที่มา จำนวน paper และ variant กดแถวดู paper ที่ใช้)<br><b>Papers<\/b> (76 paper พร้อมรหัส 4 มิติ ข้อความต้นทาง และรายชื่อ dataset ทุกแถวของ paper นั้น)<br><b>ภาพรวมการจัดการข้อมูล<\/b> (กราฟแท่งจาก <code>out/data_handling_summary.json<\/code> กดแท่งเ 0, 768 (touch), 390 (touch) ผ่าน 55 ข้อ:<br>แท็บทั้ง 6 แสดงทีละแท็บ ไม่ล้นจอทุกแท็บทุกขนาด, ไม่มี JS error (MathJax โหลดไม่ได้เพราะ sandbox ไม่มีเน็ต ไม่ใช่ error ของหน้า),<br>ตัวเลขทุกแผงตรงกับ reconcile, คลิกชนิด/ค้น/ล้าง/Enter, top-N, ลิงก์ไป Datasets/Papers/audit, กดแถวชนิดในแผงผลเทียบได้ 143/541 และ 173/207, โหมด wrapper ไม่มี KNNOR/RBBoost, tooltip ทั้ง hover และ focus, แท็บเดิม (manuscript, Datasets, Papers, ภาพรวมการจัดการข้อมูล) ยังทำงาน, โหมดมืดดูแล้ว<br>ภาพหน้าจอเก็บไว้ใน session cloud ไม่ได้เข้า repo<\/p>\n<p><b>ที่ทำไม่ได้เพราะไม่มีข้อมูลมีโครงสร้าง<\/b> กราฟนิยาม IR รายแถว (มีแค่ตารางนิยามใน manuscript และข้อความอิสระ <code>ir_definition<\/code> ราย paper ต้องเข้ารหัสก่อน) · ตระกูล (prefix) ของชื่ออื่นนอกจาก yeast/ecoli/glass (ยังไม่ได้ตรวจกติกา prefix กับชื่ออื่น)<\/p>\n<p><b>ยังค้าง<\/b> หน้า Artifact ที่ publish ไว้ (version 5) ยังเป็นฉบับก่อน redesign ไม่ได้ publish ตามที่สั่ง · git ตามแผนเดิม<\/p>\n<h3 id=\"h-43\">19 ตุลาคม 2026 แก้การจัดแนวตาราง Section 1 (แยกตามชนิดข้อมูล) และ Section 2 (ราย paper) ในแท็บชนะ SMOTE<\/h3>\n<p>แก้แค่ <code>build/atlas_template.html<\/code> (CSS ของ <code>.matrix<\/code> + หัวตาราง) แล้ว rebuild <code>out/dataset-atlas.html<\/code> · <code>out/explorer_data.json<\/code> ไม่เปลี่ยนแม้แต่ไบต์เดียว · CSV ต้นทาง sha256 เท่าเดิม · reconcile 40/40<\/p>\n<ul><li>สาเหตุตาราง 1 (<code>#wn-sum<\/code>): โครงถูก (6 คอลัมน์ทุกแถว ไม่มี colspan) แต่หัวคอลัมน์ตัวเลขชิดซ้ายตามกฎ <code>th<\/code> ทั่วไป ขณะที่ <code>td.num<\/code> ชิดขวา ตารางกว้างเต็มจอจึงเห็นหัวกับตัวเลขอยู่คนละฝั่งของคอลัมน์<\/li><li>สาเหตุตาราง 2 (<code>#wn-matrix<\/code>): เหมือนข้อแรก บวกหัวคอลัมน์ชนิดข้อมูลเป็นป้าย <code>.dt<\/code> ที่ไม่ตัดบรรทัดและถูก <code>th<\/code> แปลงเป็นตัวพิมพ์ใหญ่ ตารางจึงกว้าง 1,257px เกินกล่อง 1,148px ความกว้างคอลัมน์ไม่สม่ำเสมอ (<code>table-layout:auto<\/code>) และหัวตาราง sticky ของตารางทั่วไปมีผลด้วย<\/li><li>แก้: เพิ่ม <code>class=\"num\"<\/code> และ <code>scope=\"col\"<\/code> ให้หัวคอลัมน์ตัวเลข, <code>&lt;colgroup&gt;<\/c ditcard, V-name_only_ext) · RSMOTE healthy older people2 (22,646 × 8, 4 คลาส 20,537/1,244/530/335 ตรง → V-multiclass_asis)<\/li><li>ได้ไฟล์แต่ใช้ไม่ได้ (บันทึกใน <code>FOUND_NOT_USABLE<\/code> พร้อมเหตุผล): Loyalty-SMOTE drug (ไฟล์มีเป้าหมาย 19 ตัว ไม่รู้ว่าใช้ตัวไหน → U-task_not_reconstructible), online (feature 38 vs ไฟล์ 58 → U-size_mismatch), gender by name (พิมพ์ 146,870 ไฟล์ 147,269 → U-size_mismatch) · CTGAN news (เป็น regression → U-task_not_reconstructible) · GDO parkinsons telemonitoring (22 vs 26 คอลัมน์, เป้าหมาย UPDRS ไม่มีเกณฑ์แบ่งที่พิมพ์ → U-task_not_reconstructible) · CGMOS charactertraj (ไฟล์ 2,858 trajectory vs พิมพ์ 2,860 × 3 → U-size_mismatch) · CTGAN mnist12, mnist28 (bucket เดิมของ SDGym ไม่เปิดสาธารณะแล้ว → U-no_public_file พร้อมเหตุผล)<\/li><li>แก้บั๊กใน verify_ext.py: ชื่อที่ใช้ค้นไฟล์เก็บเป็น set ซึ่งเรียงต่างกันทุกครั้งที่รัน Python (hash randomisation) ทำให้ \"ไฟล์ที่ใกล้สุด\" ของ entry ที่ขนาดไม่ตรงสลับได้เมื่อมีไฟล์ขนาดเท่ากัน (vehicle/vehicle3) → เปลี่ยนเป็น list เรียงตามชื่อ entry ก่อน · ตรวจแล้ว: รันสองครั้งได้ผลเท่ากัน และเทียบกับไฟล์ก่อนรอบนี้ต่างเฉพาะ 13 entry ที่ตั้งใจ (5 ตรวจได้, 8 ใช้ไม่ได้/เหตุผลใหม่)<\/li><li>รวม: <b>991 entry 65 paper 261 ไฟล์<\/b> (เดิม 986/65/256) · 200 ชื่อรอบแรก: ตรวจได้ 97 ชื่อ (119 entry), ได้ไฟล์แต่ไม่ตรง 48, modified ไม่พิมพ์ขนาด 8, ยังไม่ได้ไฟล์ 47<\/li><\/ul>\n<p><b>วัดความยาก<\/b> (<code>difficulty/measure.py<\/code>, ทั้งชุดใหม่ ~35 นาที) — task เดิม 594 task ค่าตรงเดิมทุกคอลัมน์ · task ใหม่ 12: creditcard (binary, noise 0.24, ไม่ติดธง), sales win loss (binary, noise 0.52, ไม่ติดธง), healthy older people2 OvR 4, k1b OvR 6 (dense 0.4 GB/สำเนา ใช้หน่วยความจำสูงสุด 3.6 GB)<\/p>\n<ul><li>ไม่ได้วัด la12: dense 1.6 GB ต่อสำเนา × ราว 9 สำเนา ≈ 14 GB เกินเครื่อง (7 GB) → <code>NOT_MEASURED<\/code> (entry ยังนับว่าตรวจได้ แบบเดียวกับ covertype) · CLUTO อ่านเป็น sparse แล้วแปลงเป็น dense ใน measure.load<\/li><li>ผล: binary/binarise <b>238 task<\/b> (703 entry 46 paper) · OvR 347 · small sample 160 (67%), >19<\/td><td>380<\/td><td>283<\/td><td>29<\/td><td>64<\/td><\/tr><tr><td>F-measure<\/td><td>18<\/td><td>287<\/td><td>217<\/td><td>16<\/td><td>50<\/td><\/tr><tr><td>Recall<\/td><td>12<\/td><td>193<\/td><td>130<\/td><td>21<\/td><td>42<\/td><\/tr><tr><td>Precision<\/td><td>7<\/td><td>113<\/td><td>62<\/td><td>5<\/td><td>46<\/td><\/tr><tr><td>Accuracy<\/td><td>4<\/td><td>69<\/td><td>62<\/td><td>1<\/td><td>6<\/td><\/tr><tr><td>MCC<\/td><td>3<\/td><td>52<\/td><td>40<\/td><td>0<\/td><td>8<\/td><\/tr><tr><td>AUC-PR<\/td><td>1<\/td><td>7<\/td><td>3<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>Specificity<\/td><td>1<\/td><td>7<\/td><td>1<\/td><td>0<\/td><td>6<\/td><\/tr><\/tbody><\/table><\/div>\n<p>(แถว = รวมที่เทียบไม่ได้: G-mean 4, F-measure 4, MCC 4, AUC-PR 4)<\/p>\n<p><b>แยกชนิดข้อมูล (สัดส่วนชนะของที่ตัดสินได้)<\/b>: original 79.4%, repository-defined 81.2%, modified 74.9%, synthetic 94.4% (2 paper, 17/18; รวม Toy ของ OREM-M), บอกไม่ได้ 87.6%<\/p>\n<p><b>H1 (modified/synthetic ชนะบ่อยกว่า original) — ไม่ได้รับการสนับสนุน<\/b><\/p>\n<ul><li>ดิบ 75.7% (373/493) vs 79.4% (327/412)<\/li><li>GEE OR 0.69 [0.43, 1.08] p 0.10 · ภายใน paper OR 0.62 [0.39, 0.99] p 0.04 (12 paper) · mixed model OR 0.75 [0.58, 0.98]<\/li><li>ทิศทางกลับด้านกับสมมติฐาน แต่ไม่ทน: หนึ่งผลต่อ dataset 0.66 (p 0.19) / 0.51 (p 0.17); กติกา A 0.83 (p 0.58) / 0.69 (p 0.43); ราย paper 4 vs 7 เท่ากัน 3 (sign p 0.55)<\/li><li>repository-defined ไม่ต่างจาก original (OR 1.19, p 0.61); \"บอกที่มาไม่ได้\" ชนะดิบสูงสุดถ้าไม่นับ synthetic (2 paper 17/18) แต่หายเมื่อคุม paper (OR 0.99)<\/li><li>(8 พ.ย. รอบสอง: ตัวเลข H1 ขยับเพราะ Toy ของ OREM-M 3 แถวย้ายจาก original เป็น synthetic)<\/li><\/ul>\n<p><b>H2 (ใส่ชุดมาตรฐานชุดเดียวเพื่อความน่าเชื่อถือ)<\/b> — เข้าเงื่อนไข 2 paper (MWMOTE 1+19, RUSBoost 1+14) ชนะบนชุดมาตรฐานทั้งคู่ บนข้อมูลดัดแปลง/บอกที่มาไม่ได้ชนะ 52/65 = 80.0% (ไม่รวม 2 dataset ของ MWMOTE ที่จับคู่ record ไม่ได้; ถ้ารวม 54/71) เท่ากับข้อมูลแบบเดียวกันใน 21 paper ที่มีชุดมาตรฐาน ≥ 2 และมีข้อมูลอื่นด้วย 482/600 = per ไฟล์เล็ก มิติต่ำ)<\/li><li>H2 มีแค่ 2 paper<\/li><\/ul>\n<h2 id=\"h-12\">10. วิธีรันซ้ำ (จาก <code>Data section/<\/code>)<\/h2>\n<pre><code>python3 build/reconcile_counts.py --check        # 47/47\npython3 build/winloss_allmetric.py               # all-metric + กลุ่มตัวเทียบ\npython3 build/allmetric_links.py                 # ผูกแถวกับ record และชนิดข้อมูล\npython3 build/hypotheses.py                      # H1–H3 (ต้องมี statsmodels)\npython3 build/difficulty_outcomes.py             # ความยากกับผลชนะ\npython3 difficulty/reference_collection.py &amp;&amp; python3 difficulty/reference_collection_check.py\npython3 build/make_atlas.py &amp;&amp; python3 build/atlas_analysis_checks.py &amp;&amp; python3 build/consistency_check.py\npython3 build/preview/build_preview.py           # พรีวิว PDF\npython3 build/make_final.py                      # ฉบับพร้อม merge<\/code><\/pre>\n<h2 id=\"h-13\">11. สิ่งที่ยังต้องใช้คน<\/h2>\n<ol><li><b>ทบทวนสิ่งที่ ตัดสินแทน<\/b> (หัวข้อ 0) โดยเฉพาะข้อความที่มีคอมเมนต์ <code>% 29 Oct 2026<\/code> ใน draft ซึ่งเป็นการตีความ<\/li><li><b>merge กับ P<\/b>: คัดลอก <code>manuscript/data-section-final.tex<\/code> ไป <code>sections/<\/code>, เพิ่ม <code>\\input<\/code> ใน main.tex, ต่อ <code>manuscript/data-section-final.bib<\/code> เข้า <code>references.bib<\/code>, คัดลอก <code>manuscript/figures/data-difficulty.pdf<\/code> ไป <code>figures/<\/code> (ทดสอบแล้ว: main.tex + ส่วนนี้คอมไพล์ด้วย biber ได้ 17 หน้า ไม่มี undefined citation/reference จากส่วนนี้) และตกลงเรื่องเนื้อหาที่ซ้อนกับ Section 7<\/li><li><b>git push<\/b> (commit แล้ว ยังไม่ push)<\/li><li>เทียบไฟล์ mirror ที่เหลือกับไฟล์ทางการ (UCI ทางการดาวน์โหลดผ่าน browser ได้แล้ว 8 พ.ย.; KEEL sci2s.ugr.es ยังไม่ได้)<\/li><\/ol>\n<p>(ข้อเดิม: V-author_release และขนาด +1 ของ Loyalty-SMOTE รับแล้ว 8 พ.ย. · Kaggle ดาวน์โหลดแล้ว 11 ชุด (9 พ.ย. เพิ่ม Sales Win Loss, Credit Card Fraud))<\/p>"},"updated":"9 พ.ย. 2026"};

}

  const el = document.getElementById(a.getAttribute("href").slice(1)); if (el) el.scrollIntoView({block:"start"}); });
["handoff","conc"].forEach(k => $("#b-"+k).addEventListener("click", () => { cur = k;
  ["handoff","conc"].forEach(x => $("#b-"+x).setAttribute("aria-pressed", x === k)); render(); }));
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(); const blocks = [...$("#doc").children];
  if (!q) { blocks.forEach(b => b.classList.remove("hide")); $("#n").textContent = ""; return; }
  let n = 0, lastH = null;
  blocks.forEach(b => { const hit = b.textContent.toLowerCase().includes(q); const isH = /^H[1-6]$/.test(b.tagName);
    if (isH) { lastH = b; b.classList.add("hide"); }
    if (hit) { n++; b.classList.remove("hide"); if (lastH) lastH.classList.remove("hide"); } else if (!isH) b.classList.add("hide"); });
  $("#n").textContent = n + " ช่วงที่พบ";
});
$("#upd").textContent = D.updated ? "สถานะ " + D.updated : "";
$("#src").textContent = `ที่มา: handoff.md (${D.handoff.lines.toLocaleString()} บรรทัด) และ CONCLUSIONS.md ในโฟลเดอร์ Data section · สร้างด้วย build/make_handoff_html.py`;
render();
</script>
