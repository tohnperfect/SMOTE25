<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>SMOTE Evaluation Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a period ledger. Practices are rows, the four publication periods are shaded share cells,
   and a dot strip places every study that used the practice on a 1997-2026 axis. Same tokens as the
   Section 7 draft so the two pages read as one set. */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#15202b; --ink-2:#465462; --muted:#6c7986;
  --rule:#d9dfe5; --rule-2:#ebeff3;
  --accent:#1f5fbf; --accent-soft:#e7eefa; --cell:#2a78d6;
  --new:#1d6f3c; --new-soft:#e4f2e8; --up:#1f5fbf; --up-soft:#e7eefa; --down:#9c3f0c; --down-soft:#fbeee4;
  --gone:#6c4a9e; --gone-soft:#efe9f7; --flat:#5f6b77; --flat-soft:#edf0f3;
  --dot:#2a78d6; --tick:#c3cbd3; --grid:#e5e9ee;
  --c1:#2a78d6; --c2:#eb6834; --c3:#5f6b77; --quote:#f6f8fa;
  --f-serif:"STIX Two Text","Noto Serif Thai",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1317; --paper:#161b20; --ink:#e7ecf0; --ink-2:#b4bfc9; --muted:#8b97a3;
    --rule:#2a323a; --rule-2:#20272e;
    --accent:#6ea6f2; --accent-soft:#1a2a40; --cell:#3987e5;
    --new:#6cc58c; --new-soft:#173022; --up:#6ea6f2; --up-soft:#1a2a40; --down:#f0a06a; --down-soft:#3a2416;
    --gone:#b9a0e6; --gone-soft:#2a2238; --flat:#a3aeb9; --flat-soft:#222a32;
    --dot:#6ea6f2; --tick:#3a444e; --grid:#232b33;
    --c1:#3987e5; --c2:#d95926; --c3:#8b97a3; --quote:#1b2127;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1317; --paper:#161b20; --ink:#e7ecf0; --ink-2:#b4bfc9; --muted:#8b97a3;
  --rule:#2a323a; --rule-2:#20272e;
  --accent:#6ea6f2; --accent-soft:#1a2a40; --cell:#3987e5;
  --new:#6cc58c; --new-soft:#173022; --up:#6ea6f2; --up-soft:#1a2a40; --down:#f0a06a; --down-soft:#3a2416;
  --gone:#b9a0e6; --gone-soft:#2a2238; --flat:#a3aeb9; --flat-soft:#222a32;
  --dot:#6ea6f2; --tick:#3a444e; --grid:#232b33;
  --c1:#3987e5; --c2:#d95926; --c3:#8b97a3; --quote:#1b2127;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
header.top{padding-block:28px 14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
h1 .th{display:block;font-weight:400;font-size:.55em;color:var(--ink-2);margin-top:4px}
h2{font-family:var(--f-serif);font-size:21px;font-weight:600;margin:0;text-wrap:balance}
h2 .th{font-weight:400;font-size:.75em;color:var(--ink-2);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink-2);padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.seg button:focus-visible,.tabs button:focus-visible,.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;min-width:0}
.stack{display:grid;gap:18px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.pair p{margin:0}
.pair .en{font-family:var(--f-serif);font-size:16px;line-height:1.6}
.pair .th{font-family:var(--f-serif);font-size:15px;line-height:1.85;border-left:1px solid var(--rule-2);padding-left:18px}
.lang-en .pair{grid-template-columns:minmax(0,1fr)} .lang-en .pair .th{display:none}
.lang-th .pair{grid-template-columns:minmax(0,1fr)} .lang-th .pair .en{display:none} .lang-th .pair .th{border:0;padding:0}
.lang-en .tl{display:none} .lang-th .el{display:none}
.lang-th .tl{display:inline;font-size:inherit;color:inherit}
.tl{display:block;font-size:12px;color:var(--muted);font-weight:400}
.periods{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.periods span{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--rule-2);border-radius:6px;padding:3px 8px;color:var(--ink-2)}
.changes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.chg h3{font-size:13px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.chg ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chg li{font-size:13px;color:var(--ink-2)}
.chg li b{color:var(--ink);font-weight:500}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.t-new{background:var(--new-soft);color:var(--new)} .t-rising{background:var(--up-soft);color:var(--up)} .t-declining{background:var(--down-soft);color:var(--down)}
.t-abandoned{background:var(--gone-soft);color:var(--gone)} .t-stable{background:var(--flat-soft);color:var(--flat)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 12px}
.tabs button{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.scroll{overflow-x:auto;min-width:0}
table.rm{border-collapse:collapse;width:100%;min-width:980px;font-variant-numeric:tabular-nums}
.rm th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule)}
.rm th small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--f-mono)}
.rm td{padding:7px 8px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.rm tr.topic td{background:var(--bg);font-weight:600;font-size:12.5px;color:var(--ink-2);padding-block:6px}
.rowbtn{all:unset;cursor:pointer;display:block;font-weight:500;color:var(--ink)}
.rowbtn::before{content:"▸";display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
tr.open .rowbtn::before{transform:rotate(90deg)}
.cell{position:relative;width:92px;height:28px;border-radius:4px;background:var(--rule-2);overflow:hidden}
.cell i{position:absolute;left:0;top:0;bottom:0;background:var(--cell);opacity:.85}
.cell span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:12px;color:var(--ink)}
.cell span em{font-style:normal;font-size:10.5px;color:var(--muted)}
.cell.hi span b{color:#fff;text-shadow:0 0 2px rgba(0,0,0,.35)}
.yr{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.yr small{display:block;font-family:var(--f-ui);color:var(--muted);font-size:11px;max-width:120px;white-space:normal}
.strip svg{display:block}
tr.detail td{background:var(--bg);font-size:12.5px;color:var(--ink-2)}
.who{display:flex;flex-wrap:wrap;gap:4px 10px}
.who span{white-space:nowrap}
table.lead{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
.lead th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule)}
.lead td{padding:7px 8px;border-bottom:1px solid var(--rule-2)}
.lead td.r,.lead th.r{text-align:right}
.lead tr.era td{background:var(--bg);font-weight:600;color:var(--ink-2);font-size:12.5px}
.warn{border:1px dashed var(--rule);border-radius:8px;padding:10px 12px;color:var(--ink-2);font-size:13px;background:var(--bg)}
.note{font-size:12.5px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);display:grid;gap:6px}
.th-inline{color:var(--muted)}
.lang-both .tl-same{display:none}
.lang-en .th-inline,.lang-en h1 .th,.lang-en h2 .th{display:none}
.chip .tl{display:none} .lang-th .chip .el{display:none} .lang-th .chip .tl{display:inline}
.tabs .tl{display:inline;margin-left:6px;font-size:11.5px} .lang-th .tabs .tl{margin-left:0;font-size:inherit}
.chg li .tl{display:inline;margin-left:6px;font-size:11.5px} .lang-th .chg li .tl{margin-left:0;font-size:inherit}

/* findings */
.intro .pair{margin-top:6px}
.fidx{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:14px}
.fidx a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--bg)}
.fidx a:hover{border-color:var(--accent)} .fidx a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fno{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--paper);font-weight:600;font-size:13px;font-family:var(--f-ui)}
.finding{display:grid;gap:12px}
.fhead{display:flex;gap:12px;align-items:flex-start}
.fhead h2{font-size:22px}
.fhead h2 .tl{font-size:.72em;font-weight:400;color:var(--ink-2);margin-top:2px}
.lang-th .fhead h2 .tl{font-size:inherit;color:inherit}
.verdict{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.verdict .pair .en{font-size:17px}
h4.ev{display:flex;gap:10px;align-items:baseline;margin:10px 0 0;font-size:14px;font-weight:600;border-top:1px solid var(--rule-2);padding-top:12px}
h4.ev .tl{display:inline;margin-left:8px;font-weight:400;color:var(--muted);font-size:13px}
.lang-th h4.ev .tl{margin-left:0;color:inherit;font-weight:600;font-size:inherit}
.evn{font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px}
h5{font-size:12.5px;margin:4px 0 6px;color:var(--ink-2);font-weight:600}
h5 .tl{display:inline;margin-left:6px;font-weight:400}
.lang-th h5 .tl{margin-left:0}
.bars{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) 64px;gap:10px;align-items:center}
.bl{font-size:13px;color:var(--ink);line-height:1.3;min-width:0}
.bl .tl{font-size:11.5px}
.bt{height:12px;background:var(--rule-2);border-radius:3px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:0 3px 3px 0}
.bv{font-size:13px;text-align:right;color:var(--ink)} .bv em{font-style:normal;color:var(--muted);font-size:11.5px}
.bars.small .bar{grid-template-columns:minmax(0,200px) minmax(0,1fr) 54px}
.bars.big .bar{grid-template-columns:minmax(0,330px) minmax(0,1fr) 70px}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.qk{display:block;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.qk .tl{text-transform:none;letter-spacing:0;display:inline;margin-left:6px}
.lang-th .qk .tl{margin-left:0}
blockquote.qt{margin:0;background:var(--quote);border:1px solid var(--rule-2);border-radius:6px;padding:8px 10px;font-family:var(--f-serif);font-size:14.5px;line-height:1.5;color:var(--ink)}
blockquote.qt cite{display:block;margin-top:4px;font-family:var(--f-mono);font-style:normal;font-size:11.5px;color:var(--muted)}
.forest{display:grid;gap:2px;font-variant-numeric:tabular-nums}
.fr{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) 70px;gap:10px;align-items:center;min-height:22px}
.fl{font-size:13px;line-height:1.25} .fl .tl{font-size:11px}
.ftop{margin-top:6px} .ftop span:first-child{font-weight:600;font-size:12.5px;color:var(--ink-2)} .ftop .tl{display:inline;margin-left:6px;font-weight:400}
.lang-th .ftop .tl{margin-left:0}
.ftrack{position:relative;height:18px}
.ftrack .one{position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--ink-2)}
.ftrack .ci{position:absolute;top:8px;height:2.5px;border-radius:2px}
.ftrack .pt{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;box-shadow:0 0 0 2px var(--paper)}
.fn{font-size:12px;text-align:right;color:var(--ink)} .fn em{font-style:normal;color:var(--muted)}
.fh .ft{position:relative;height:16px;font-size:11px;color:var(--muted)}
.ft b{position:absolute;transform:translateX(-50%);font-weight:400;white-space:nowrap}
.ftl b .tl{display:none} .lang-th .ftl b .tl{display:inline} .lang-th .ftl b .el{display:none}
.fh .fn .tl{display:none}
svg.sc{width:100%;height:auto;max-width:760px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px}
.legend i.dash{width:18px;height:0;border-top:2px dashed var(--ink-2);border-radius:0}
.legend .tl{display:inline;margin-left:4px} .lang-both .legend .tl{display:none}
.chains{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chain{border:1px solid var(--rule-2);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.chain .src{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chain .ln{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px}
.chain .arrow{color:var(--accent);font-weight:600}
.funnel{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.funnel div{border:1px solid var(--rule);border-radius:8px;padding:6px 12px;background:var(--bg);font-size:13px;display:grid}
.funnel div b{font-size:20px;font-family:var(--f-serif);font-variant-numeric:tabular-nums}
.funnel div .tl{font-size:11.5px}
.funnel .side{border-style:dashed}
.funnel > span{color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
details.all summary{cursor:pointer;color:var(--accent);font-size:13px}
details.all summary .tl{display:inline;margin-left:6px}
.lang-both details.all summary .tl{display:none}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.lead.sum td:first-child .tl{display:block;font-size:11px}
.caveat{background:var(--bg);border:1px dashed var(--rule);border-radius:8px;padding:10px 12px}
.caveat > b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.caveat > b .tl{display:inline;text-transform:none;letter-spacing:0;margin-left:6px}
.lang-th .caveat > b .tl{margin-left:0}
.caveat .pair .en,.caveat .pair .th{font-size:14px}
/* question-and-answer explainer (Thai first) */
.xe{display:block;font-size:.78em;color:var(--muted);font-weight:400;line-height:1.35}
.lang-th .xe{display:none!important}
.lang-en .xt{display:none!important}
.lang-en .xe{display:inline;font-size:inherit!important;color:inherit;font-weight:inherit!important;line-height:inherit;margin-top:0!important}
.lang-both .xsame{display:none}
.pair.tf .th{border-left:0;padding-left:0;font-size:16px;line-height:1.8;color:var(--ink)}
.pair.tf .en{border-left:1px solid var(--rule-2);padding-left:18px;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.lang-en .pair.tf .en{border:0;padding:0;font-size:16px;color:var(--ink)}
.qa{display:grid;gap:14px}
.qtop{display:grid;gap:4px}
.qn{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.qn .xe,.ansl .xe,h3.whyh .xe,.key > b .xe,details.ex summary .xe,.rlg .xe,h5 .xe,.qk .xe{display:inline;margin-left:8px;font-size:.9em;text-transform:none;letter-spacing:0}
.lang-en .qn .xe,.lang-en .ansl .xe,.lang-en h3.whyh .xe,.lang-en .key > b .xe,.lang-en details.ex summary .xe,.lang-en .rlg .xe,.lang-en h5 .xe,.lang-en .qk .xe{margin-left:0;font-size:inherit}
h2.qq{font-family:var(--f-serif);font-size:24px;line-height:1.4}
h2.qq .xe{font-size:.62em;margin-top:4px}
h2.qi .xe{font-size:.62em}
.ans{background:var(--accent-soft);border-radius:10px;padding:14px 18px;display:grid;gap:8px}
.ansl{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.ansb{font-family:var(--f-serif);font-size:27px;font-weight:600;line-height:1.3;color:var(--ink)}
.ansb .xe{font-size:.6em;font-weight:400;margin-top:2px}
.src{font-size:12.5px;color:var(--muted);margin:0}
h3.whyh{font-size:15px;margin:6px 0 0;color:var(--ink-2)}
.why{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;border-top:1px solid var(--rule-2);padding-top:18px}
.whyn{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.whyb{display:grid;gap:12px;min-width:0}
h4.wt{margin:2px 0 0;font-family:var(--f-serif);font-size:20px;line-height:1.4;font-weight:600}
h4.wt .xe{font-size:.7em;margin-top:2px}
dl.how{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px 16px;margin:0}
dl.how dt{padding-top:2px;font-size:12.5px}
.lang-en dl.how{grid-template-columns:150px minmax(0,1fr)}
dl.how dt .xt,.lang-en dl.how dt .xe{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px}
dl.how dt .xe{font-size:11px;margin:3px 0 0 4px}
.k-look .xt,.lang-en .k-look .xe{background:var(--flat-soft);color:var(--flat)}
.k-found .xt,.lang-en .k-found .xe{background:var(--accent-soft);color:var(--accent)}
.k-means .xt,.lang-en .k-means .xe{background:var(--new-soft);color:var(--new)}
.k-care .xt,.lang-en .k-care .xe{background:var(--down-soft);color:var(--down)}
dl.how dd{margin:0;min-width:0;display:grid;gap:10px}
dd > .pair.tf + .pair.tf{margin-top:2px}
.key{border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;background:var(--bg)}
.key > b{display:block;font-size:13px;margin-bottom:4px}
.key .pair.tf .th{font-size:15px}
.ruler{display:grid;gap:10px;font-variant-numeric:tabular-nums}
.rl{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) minmax(0,220px);gap:4px 16px;align-items:center}
.rll{font-size:13.5px;line-height:1.3}
.rll .xe{font-size:11px}
.rll em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px}
.lang-both .rll em .xe{display:none}
.rlk{position:relative;height:22px}

AUC, F1, G-mean, P20 (precision at top 20%)","data":"evaluation data","quote":"For each combination of dataset, oversampler and classifier, the top results were generated. This gave a total of 3996 results.","where":"p. 11-12, Sec. 4.2-4.3"},{"short":"FW-SMOTE 2022","selected":"method parameters, sampling rate","criterion":"AUC","data":"evaluation data","quote":"The only “parameter” choice that was made based on the average test performance was the amount of oversampling N.","where":"p. 7-8, Sec. 4.1; p. 9-10, Sec. 4.3, Table 4; Supplementary Appendix A (p. 29)"},{"short":"SOS 2022","selected":"method parameters, best variant","criterion":"F1","data":"evaluation data","quote":"In Tables 7 and 8, we list the best hyperparameters.","where":"p. 768, Sec. 4.3, Table 3 ('We used T = 50 in Table 2. Others for T produce sub-optimal results in Table 3'); p. 771, App. A, Tables 7-8"},{"short":"SVDD-WSMOTE 2022","selected":"method parameters, classifier hyperparameters","criterion":"G-mean, other: EM = majority outliers + IR x minority outliers + number of support vectors (SVDD fit), not stated","data":"inner validation (training data only)","quote":"using stratified cross-validation in the training dataset based on G-Means performance metric","where":"p. 34, Sec. 5.3 (SVM C and kernel width); p. 28, Sec. 5.1, Eq. (26) (SVDD C1 and kernel width)"},{"short":"NROMM 2023","selected":"method parameters, classifier hyperparameters, best variant","criterion":"not stated, AvAcc, CBA","data":"not stated","quote":"The parameters of classification algorithms, reference algorithms, and the proposed algorithm throughout the experimental study are presented in Table 4.","where":"Supp. p. 14, Sec. 7.4; Supp. p. 15, Table 4; p. 9, Sec. 5.3, Table 5"},{"short":"GLOS 2023","selected":"best variant, method parameters","criterion":"not stated, G-mean, other: Pave, other: IAM (not defined in the paper)","data":"evaluation data","quote":"Furthermore, we selected the best result of all decomposition strategies as the final results of each method to analyze the performance of all approaches.","where":"p. 2079, Sec. 4.1; p. 2081, Sec. 4.3, Fig. 7"},{"short":"OREM 2023","selected":"classifier hyperparameters, none (fixed settings)","criterion":"not stated","data":"inner validation (training data only)","quote":"The penalty parameter C is optimized through the build-in 5-fold cross validation of LIBSVM.","where":"p. 6175, Sec. 4.1.1; p. 6176, Table 3 and Sec. 4.1.4"},{"short":"MKC-SMOTE 2024","selected":"method parameters","criterion":"MAUC, G-mean","data":"evaluation data","quote":"Results indicate that k = 5 consistently achieved the best performance for both MAUC and MG across the CART and SVM classifiers.","where":"p. 196936, Sec. IV.B, Table 6 (k = 5 and dup_size = 2 fixed on p. 196932; defaults for classifiers and competitors, pp. 196933-196935, Table 2)"},{"short":"GMMSampling 2024","selected":"method parameters","criterion":"other: GMM likelihood on a development split of the minority-class training data (number of components)","data":"inner validation (training data only)","quote":"When the value of the likelihood function on the development test begins to decrease, the process is terminated and the current number of components is selected.","where":"pp. 5191-5192, Sec. 3.2 and footnote 1"},{"short":"MLOS 2025","selected":"method parameters","criterion":"AUC, G-mean, Sensitivity/Recall","data":"evaluation data","quote":"Since MLOS achieves the optimal performance at α = 0.4, this study sets α to 0.4.","where":"pp. 9-10, Sec. 4.4, Fig. 6, Table 4"},{"short":"GOIO 2025","selected":"none (fixed settings), classifier hyperparameters","criterion":"not stated","data":"not stated","quote":"For consistency, we utilize a set of reasonable hyperparameters for the baseline and classifier according to their papers or codes, as detailed in Tables III and IV.","where":"p. 6458, Sec. IV-D, Tables III-IV"},{"short":"CISO 2025","selected":"method parameters","criterion":"PR-AUC","data":"other: five disjoint KEEL tuning datasets excluded from all evaluation","quote":"The selection criterion, fixed prior to evaluation, is the mean PR-AUC across the tuning datasets and the four classifiers.","where":"p. 17, Sec. 5.5; p. 18, Table 2"},{"short":"GDHS 2025","selected":"method parameters","criterion":"mGM, MAUC","data":"evaluation data","quote":"achieves the best performance on most of the datasets, and both the average and mean rank are optimal.","where":"pp. 8-9, Sec. 4.2, Tables 2-3, Fig. 6"},{"short":"MC-NCLWO 2025","selected":"method parameters","criterion":"AvAcc","data":"not stated","quote":"Based on the experimental results across multiple datasets, to ensure the algorithm’s stability and robustness, we set 2 as the default of decay factor α for subsequent experiments.","where":"pp. 152630-152631, Sec. V.E, Fig. 9"},{"short":"QC-SMOTE 2026","selected":"method parameters","criterion":"AUC, F1","data":"not stated","quote":"an overshoot factor of 1.25, and a purity threshold of 0.3. These values correspond to the default configuration used in the main experiments.","where":"p. 10, Sec. 4.5.3, Table 5"}]}}}</script>
<script>
(function () {
'use strict';
const D = JSON.parse(document.getElementById('rm-data').textContent);
const ERAS = ['≤2009', '2010-2015', '2016-2020', '2021-2026'];
const ERA_EN = {'≤2009': '1997–2009', '2010-2015': '2010–2015', '2016-2020': '2016–2020', '2021-2026': '2021–2026'};
const BY = Object.fromEntries(D.emp.map(p => [p.key, p]));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const big = n => n == null ? 'n/a' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const TOPICS = [
  ['data', 'Data', 'ข้อมูล'], ['learners', 'Learners and competitors', 'ตัวจำแนกและคู่เทียบ'], ['measures', 'Measures and other evidence', 'ตัวชี้วัดและหลักฐานอื่น'],
  ['protocol', 'Protocol and tuning', 'โปรโตคอลและการปรับจูน'], ['stats', 'Statistical testing', 'การทดสอบทางสถิติ'], ['reporting', 'Reporting', 'การรายงานผล']];
const TH = {
  'UCI repository': 'คลัง UCI', 'KEEL repository': 'คลัง KEEL', 'Synthetic data': 'ข้อมูลสังเคราะห์', 'Private or application data': 'ข้อมูลเฉพาะหรือข้อมูลจากการใช้งานจริง',
  'Image data': 'ข้อมูลภาพ', 'Fewer than 10 real datasets': 'ใช้ข้อมูลจริงน้อยกว่า 10 ชุด', 'Reason for data stated': 'ระบุเหตุผลที่เลือกข้อมูล',
  'C4.5/C5.0': 'C4.5/C5.0', 'k-NN': 'k-NN', 'SVM': 'SVM', 'Rule learner (RIPPER etc.)': 'ตัวเรียนรู้กฎ (RIPPER ฯลฯ)', 'Naive Bayes': 'Naive Bayes', 'MLP/NN': 'MLP/โครงข่ายประสาทเทียม',
  'Random forest or gradient boosting': 'Random forest หรือ gradient boosting', 'Single base learner': 'ใช้ตัวจำแนกตัวเดียว', 'No-resampling baseline': 'มีเส้นฐานที่ไม่ปรับสมดุล',
  'Reason for learners stated': 'ระบุเหตุผลที่เลือกตัวจำแนก', 'Accuracy or error rate': 'Accuracy หรืออัตราความผิดพลาด', 'ROC curve only (no AUC value)': 'เส้นโค้ง ROC อย่างเดียว (ไม่มีค่า AUC)',
  'AUC': 'AUC', 'G-mean': 'G-mean', 'F1 / F-measure': 'F1 / F-measure', 'Recall / TPR': 'Recall / TPR', 'MAUC': 'MAUC', 'MCC': 'MCC', 'PR-AUC': 'PR-AUC',
  'Direct measure of resampled data': 'วัดข้อมูลหลังปรับสมดุลโดยตรง', '2-D or projected plots of samples': 'กราฟสองมิติหรือภาพฉายของตัวอย่าง',
  'Single hold-out': 'hold-out ครั้งเดียว', 'Single k-fold CV': 'k-fold CV รอบเดียว', 'Repeated k-fold CV / 5x2 CV': 'k-fold CV แบบทำซ้ำ / 5×2 CV',
  'Train-only resampling stated': 'ระบุว่าปรับสมดุลเฉพาะข้อมูลฝึก', 'Settings chosen on evaluation data': 'เลือกค่าบนข้อมูลที่ใช้ประเมิน', 'Nested or held-out tuning': 'ปรับจูนแบบ nested หรือชุดแยก',
  'No significance test': 'ไม่มีการทดสอบนัยสำคัญ', 't-test': 't-test', 'Wilcoxon signed-rank': 'Wilcoxon signed-rank', 'Friedman': 'Friedman',
  'Corrected multiple comparison': 'การเปรียบเทียบพหุคูณแบบปรับแก้', 'Bayesian test': 'การทดสอบแบบเบย์', 'Cites Demšar (2006)': 'อ้าง Demšar (2006)',
  'Mean ± standard deviation': 'ค่าเฉลี่ย ± ส่วนเบี่ยงเบนมาตรฐาน', 'Average-rank table': 'ตารางอันดับเฉลี่ย', 'Win/tie/loss counts': 'นับชนะ/เสมอ/แพ้',
  'Running time': 'เวลาประมวลผล', 'Code released': 'เผยแพร่โค้ด'};
const TREND = {
  new: ['New since 2016', 'เกิดขึ้นใหม่ตั้งแต่ปี 2016', 'first used in 2016 or later'],
  rising: ['Rising', 'เพิ่มขึ้น', 'share at least 20 points higher in 2021–2026 than in 1997–2009'],
  declining: ['Declining', 'ลดลง', 'share at least 20 points lower in 2021–2026 than in 1997–2009'],
  abandoned: ['Abandoned', 'เลิกใช้', 'last used in 2015 or earlier'],
  stable: ['Stable', 'คงที่', 'change of less than 20 points']};
const TREND_ORDER = ['new', 'rising', 'declining', 'abandoned', 'stable'];
let lang = 'both', topic = 'all', open = {};
try { const s = JSON.parse(localStorage.getItem('smote25-roadmap') || '{}'); if (s.lang) lang = s.lang; if (s.topic) topic = s.topic; } catch (e) {}
const save = () => { try { localStorage.setItem('smote25-roadmap', JSON.stringify({lang: lang, topic: topic})); } catch (e) {} };
const bi = (en, th) => '<span class="el">' + esc(en) + '</span><span class="tl' + (th === en ? ' tl-same' : '') + '">' + esc(th) + '</span>';
const pair = (en, th) => '<div class="pair"><p class="en">' + en + '</p><p class="th">' + th + '</p></div>';
const chip = t => '<span class="chip t-' + t + '">' + bi(TREND[t][0], TREND[t][1]) + '</span>';
const shortOf = k => BY[k] ? BY[k].short + ' ' + BY[k].year : k;

function strip(keys) {
  const w = 230, h = 30, x0 = 1996.5, x1 = 2026.5, X = y => 6 + (w - 12) * (y - x0) / (x1 - x0);
  let s = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="years of the studies that used this practice">';
  s += '<line x1="6" x2="' + (w - 6) + '" y1="' + (h - 5) + '" y2="' + (h - 5) + '" stroke-width="1" style="stroke:var(--tick)" />';
  [2000, 2010, 2020].forEach(y => { s += '<line x1="' + X(y) + '" x2="' + X(y) + '" y1="2" y2="' + (h - 5) + '" style="stroke:var(--grid)" />'; });
  D.emp.forEach(p => { s += '<circle cx="' + X(p.year) + '" cy="' + (h - 5) + '" r="1.6" style="fill:var(--tick)" />'; });
  const seen = {};
  keys.forEach(k => { const p = BY[k]; if (!p) return; seen[p.year] = (seen[p.year] || 0) + 1; const cy = h - 5 - 6 * (seen[p.year] - 1) - 4;
    s += '<circle cx="' + X(p.year) + '" cy="' + Math.max(3, cy) + '" r="3" style="fill:var(--dot)"><title>' + esc(p.short + ' ' + p.year) + '</title></circle>'; });
  return s + '</svg>';
}
function cell(r, e) {
  const sh = r.share[e], n = r.by_era[e], N = D.era_n[e];
  return '<div class="cell' + (sh >= 55 ? ' hi' : '') + '" title="' + esc(n + ' of ' + N + ' studies in ' + ERA_EN[e]) + '"><i style="width:' + sh + '%"></i><span><b>' + sh + '%</b><em>' + n + '/' + N + '</em></span></div>';
}
function changes() {
  return '<section class="panel"><h2>What changed <span class="th">อะไรเปลี่ยนไปบ้าง</span></h2>' +
    pair('Each practice is labelled by comparing its share of studies in 1997–2009 with its share in 2021–2026. A practice first used in 2016 or later is new; one last used in 2015 or earlier is abandoned.',
      'แต่ละแนวปฏิบัติถูกจัดกลุ่มโดยเทียบสัดส่วนงานที่ใช้ในช่วง 1997–2009 กับช่วง 2021–2026 แนวปฏิบัติที่เริ่มใช้ตั้งแต่ปี 2016 เป็นต้นมาถือว่าเกิดขึ้นใหม่ ส่วนแนวปฏิบัติที่ใช้ครั้งสุดท้ายในปี 2015 หรือก่อนหน้าถือว่าเลิกใช้') +
    '<div class="changes">' + TREND_ORDER.filter(t => t !== 'stable').map(t => {
      const rows = D.roadmap.filter(r => r.trend === t);
      return '<div class="chg"><h3>' + chip(t) + '<span class="note">' + rows.length + '</span></h3><ul>' + rows.map(r => '<li><b>' + bi(r.label, TH[r.label] || r.label) + '</b> · ' +
        (t === 'new' ? 'from ' + r.first : t === 'abandoned' ? r.first + '–' + r.last : r.share[ERAS[0]] + '% → ' + r.share[ERAS[3]] + '%') + '</li>').join('') + '</ul></div>';
    }).join('') + '</div>' +
    '<div class="periods">' + ERAS.map(e => '<span>' + ERA_EN[e] + ': ' + D.era_n[e] + ' studies</span>').join('') + '</div></section>';
}
function ledger() {
  const T = topic === 'all' ? TOPICS : TOPICS.filter(t => t[0] === topic);
  let h = '<section class="panel"><h2>Practice ledger <span class="th">ตารางแนวปฏิบัติรายช่วงเวลา</span></h2>' +
    pair('Shaded cells give the share of studies in each period that follow the practice. The strip places every study that follows it on a 1997–2026 axis; grey ticks mark all empirical studies. Select a practice to list its studies.',
      'ช่องแรเงาแสดงสัดส่วนของงานในแต่ละช่วงที่ใช้แนวปฏิบัตินั้น แถบจุดวางงานทุกเรื่องที่ใช้แนวปฏิบัตินั้นบนแกนปี 1997–2026 ขีดสีเทาคืองานเชิงทดลองทั้งหมด เลือกแนวปฏิบัติเพื่อดูรายชื่องาน') +
    '<div class="tabs" role="group" aria-label="Topic"><button id="tp-all" data-topic="all" aria-pressed="' + (topic === 'all') + '">' + bi('All', 'ทั้งหมด') + '</button>' +
    TOPICS.map(t => '<button id="tp-' + t[0] + '" data-topic="' + t[0] + '" aria-pressed="' + (topic === t[0]) + '">' + bi(t[1], t[2]) + '</button>').join('') + '</div>' +
    '<div class="scroll"><table class="rm"><thead><tr><th>' + bi('Practice', 'แนวปฏิบัติ') + '</th>' + ERAS.map(e => '<th>' + ERA_EN[e] + '<small>n = ' + D.era_n[e] + '</small></th>').join('') +
    '<th>' + bi('Studies over time', 'งานตามช่วงเวลา') + '<small>1997 · 2026</small></th><th>' + bi('First', 'ครั้งแรก') + '</th><th>' + bi('Last', 'ครั้งล่าสุด') + '</th><th>' + bi('Trend', 'แนวโน้ม') + '</th></tr></thead><tbody>';
  T.forEach(t => {
    h += '<tr class="topic"><td colspan="9">' + bi(t[1], t[2]) + '</td></tr>';
    D.roadmap.filter(r => r.topic === t[0]).forEach((r, i) => {
      const id = t[0] + '-' + i, isOpen = !!open[id];
      h += '<tr class="' + (isOpen ? 'open' : '') + '"><td><button class="rowbtn" id="row-' + id + '" data-row="' + id + '" aria-expanded="' + isOpen + '">' + bi(r.label, TH[r.label] || r.label) + '</button><span class="note">' + r.n + ' studies</span></td>' +
        ERAS.map(e => '<td>' + cell(r, e) + '</td>').join('') + '<td class="strip">' + strip(r.keys || []) + '</td>' +
        '<td class="yr">' + (r.first || '–') + '<small>' + esc(r.first_key ? shortOf(r.first_key) : '') + '</small></td><td class="yr">' + (r.last || '–') + '<small>' + esc(r.last_key ? shortOf(r.last_key) : '') + '</small></td><td>' + chip(r.trend) + '</td></tr>';
      if (isOpen) h += '<tr class="detail"><td colspan="9"><div class="who">' + (r.keys || []).map(k => '<span>' + esc(shortOf(k)) + '</span>').join('') + '</div></td></tr>';
    });
  });
  return h + '</tbody></table></div><p class="note">' + bi('Counts come from the coded evaluation designs of the 71 empirical studies. Reasons, direct measures and the explicit or implied selection of settings come from the second, page-referenced reading.', 'ตัวเลขมาจากการลงรหัสการออกแบบการประเมินผลของงานเชิงทดลอง 71 เรื่อง ส่วนเหตุผล การวัดโดยตรง และการเลือกค่าบนข้อมูลประเมินมาจากการอ่านรอบที่สองที่มีเลขหน้ากำกับ') + '</p></section>';
}
function leaders() {
  const rows = ERAS.map(e => {
    const E = D.emp.filter(p => p.era === e && p.cpy != null && p.year <= 2024).sort((a, b) => b.cpy - a.cpy).slice(0, 3);
    return '<tr class="era"><td colspan="8">' + ERA_EN[e] + '</td></tr>' + E.map(p => '<tr><td><b>' + esc(p.short) + '</b> ' + p.year + '</td><td class="r">' + big(p.cites) + '</td><td class="r">' + p.cpy.toFixed(1) + '</td><td class="r">' + (p.n_real == null ? 'n/a' : p.n_real) + '</td><td class="r">' + p.n_clf + '</td><td>' + esc(p.test_class) + '</td><td>' + esc(p.tuning_class === 'Unclear' ? 'Not stated' : p.tuning_class) + '</td><td>' + (p.has_code ? 'yes' : 'no') + '</td></tr>').join('');
  }).join('');
  return '<section class="panel"><h2>Most cited studies of each period <span class="th">งานที่ถูกอ้างอิงมากที่สุดในแต่ละช่วง</span></h2>' +
    pair('Citations from OpenAlex, retrieved ' + esc(D.retrieved) + ', divided by years since publication. Studies from 2025 and 2026 are left out because their counts are too young. The most cited studies of the early periods used few datasets and seldom tested; later leaders test more but are cited far less, in part because they are younger.',
      'จำนวนการอ้างอิงจาก OpenAlex ดึงเมื่อ ' + esc(D.retrieved) + ' หารด้วยจำนวนปีนับจากปีที่ตีพิมพ์ ไม่รวมงานปี 2025 และ 2026 เพราะยังใหม่เกินไป งานที่ถูกอ้างอิงมากที่สุดในช่วงแรกใช้ชุดข้อมูลน้อยและแทบไม่ทดสอบทางสถิติ งานที่นำในช่วงหลังทดสอบมากขึ้นแต่ถูกอ้างอิงน้อยกว่ามาก ส่วนหนึ่งเพราะยังใหม่') +
    '<div class="scroll" style="margin-top:12px"><table class="lead"><thead><tr><th>' + bi('Study', 'งาน') + '</th><th class="r">' + bi('Citations', 'การอ้างอิง') + '</th><th class="r">' + bi('Per year', 'ต่อปี') + '</th><th class="r">' + bi('Real datasets', 'ชุดข้อมูลจริง') + '</th><th class="r">' + bi('Learners', 'ตัวจำแนก') + '</th><th>' + bi('Test', 'การทดสอบ') + '</th><th>' + bi('Settings', 'การเลือกค่า') + '</th><th>' + bi('Code', 'โค้ด') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
}
function families() {

const CHAIN_SRC_TH = {0: 'Sáez, Krawczyk และ Woźniak 2016 (งานศึกษาความยากของข้อมูล ไม่อยู่ในคลังบทความ)', 1: 'AMDO 2018', 2: 'SPIDER2 2010 (Napierała, Stefanowski และ Wilk)', 3: 'Lango และ Stefanowski 2018; Janicka et al. 2019 (ไม่อยู่ในคลังบทความ)', 4: 'benchmark ของ VS-SMOTE (Qiu et al. 2025 ไม่อยู่ในคลังบทความ)'};
const DIRECT = {
  'SMOTE-IPF-2015': ['Counts what share of the points SMOTE created a noise filter then deletes.', 'นับว่าตัวอย่างที่ SMOTE สังเคราะห์ ถูกตัวกรอง noise ลบทิ้งไปกี่เปอร์เซ็นต์'],
  'CTGAN-2019': ['On simulated data whose true distribution is known, measures how likely the synthetic rows are under that distribution.', 'สร้างข้อมูลจำลองที่รู้การแจกแจงจริง แล้ววัดว่าแถวที่สังเคราะห์เข้ากับการแจกแจงจริงแค่ไหน (likelihood)'],
  'GAMO-2019': ['Reports FID, a distance between real and generated images (lower is closer).', 'วัด FID ซึ่งเป็นระยะห่างระหว่างภาพจริงกับภาพที่สร้าง (ยิ่งต่ำยิ่งเหมือน)'],
  'SPE-2020': ['Counts easy and hard majority examples left after under-sampling.', 'นับว่าคลาสส่วนมากที่เหลือหลังสุ่มตัด มีตัวอย่างง่ายและยากอย่างละเท่าไร'],
  'GLOS-2023': ['Counts safe, borderline and small-disjunct examples as a parameter changes.', 'นับจำนวนตัวอย่างแบบ safe, borderline และกลุ่มย่อยเล็ก เมื่อเปลี่ยนค่าพารามิเตอร์'],
  'CISO-2025': ['Measures MMD between synthetic points and held-out minority points, and trains a classifier to tell real from synthetic; this result goes against CISO itself.', 'วัด MMD ระหว่างตัวอย่างสังเคราะห์กับคลาสส่วนน้อยที่กันไว้ และใช้ classifier แยกของจริงกับของสังเคราะห์ ผลส่วนนี้ไม่เป็นผลดีต่อ CISO เอง']};
const MODEL_TH = {'SMOTE 2002': ['compares C4.5 tree sizes', 'เทียบขนาดต้นไม้ C4.5'], 'Batista et al. 2004': ['compares the number of rules', 'เทียบจำนวนกฎที่ได้'], 'Random Balance 2015': ['ensemble diversity diagrams', 'แผนภาพความหลากหลายของสมาชิก ensemble'],
  'SOUP 2019': ['compares tree node counts', 'เทียบจำนวนโหนดของต้นไม้'], 'OREM 2023': ['ensemble diversity (Q-statistic)', 'ความหลากหลายของ ensemble (Q-statistic)']};
const REPO_TH = l => l.replace('(method in corpus)', '(วิธีในคลังบทความ)').replace('UCI repository (Asuncion and Newman 2007 record)', 'คลังข้อมูล UCI (Asuncion และ Newman 2007)')
  .replace('KEEL data-set repository', 'คลังชุดข้อมูล KEEL').replace('KEEL software paper', 'บทความซอฟต์แวร์ KEEL').replace('imbalanced-learn (Lemaître et al. 2017, preprint record)', 'ไลบรารี imbalanced-learn (Lemaître et al. 2017)');

/* ================= question 1: citations ================= */
function q1() {
  const f = F.cites, tp_ = f.top_profile, rp = f.rest_profile, line = f.line;
  const exp = y => Math.expm1(line[0] + line[1] * y);
  const P = k => f.points.find(p => p.key === k);
  const ex = ['ADASYN-2008', 'SPE-2020', 'SHSampler-2022'].map(P);
  const mi = infRow('metric_issue'), cd = infRow('code'), sb = infRow('smote_base'), at = infRow('anytest');
  let h = qHead(1, 'q1', 'Were studies that evaluated in a particular way more successful, that is, more cited?', 'paper ที่ใช้วิธีประเมินผลแต่ละแบบ ประสบความสำเร็จ (ถูกอ้างอิงเยอะ) ไหม',
    'No. How a study was evaluated is not linked to its citations.', 'ไม่สัมพันธ์กันเลย',
    'Citations follow a paper\'s age and whether later work uses the method as a baseline. The one clear signal is negative: studies that define a measure incorrectly are cited about a third as often.',
    'จำนวนการอ้างอิงขึ้นกับอายุของ paper และการที่งานรุ่นหลังเอาวิธีนั้นไปเป็นคู่เทียบ ไม่ได้ขึ้นกับว่าประเมินผลละเอียดแค่ไหน สัญญาณเดียวที่ชัดเป็นทางลบ คือ paper ที่นิยาม metric ผิดถูกอ้างอิงประมาณหนึ่งในสามของเรื่องอื่น');
  h += '<p class="src">' + ib('Citation counts: OpenAlex, retrieved ' + f.retrieved + '. Studies analysed: the ' + f.eligible + ' empirical studies published up to 2024 (the ' + f.young + ' from 2025 and 2026 are too new; Global-CS 2006 has no record).',
    'ยอดอ้างอิงจาก OpenAlex ดึงวันที่ ' + f.retrieved + ' ใช้ ' + f.eligible + ' เรื่องที่มีการทดลองและตีพิมพ์ถึงปี 2024 (ตัด ' + f.young + ' เรื่องปี 2025 และ 2026 เพราะยังใหม่เกินไป และ Global-CS 2006 ที่ไม่มีข้อมูลใน OpenAlex)') + '</p>';

  h += why(1, 'The ten most cited papers are not the most carefully evaluated', '10 เรื่องที่ถูกอ้างอิงมากที่สุด ไม่ใช่เรื่องที่ประเมินผลละเอียดที่สุด', [
    {k: 'look', en: 'We ranked the ' + f.eligible + ' studies by citations and compared how the top ten were evaluated with the other ' + rp.n + '.', th: 'เรียง ' + f.eligible + ' เรื่องตามยอดอ้างอิง แล้วเทียบวิธีประเมินผลของ 10 อันดับแรกกับอีก ' + rp.n + ' เรื่อง'},
    {k: 'found', html: table([['', ''], ['Top 10 most cited', '10 อันดับแรก', 1], ['The other ' + rp.n, 'อีก ' + rp.n + ' เรื่อง', 1]], [
      [ib('Published before 2010', 'ตีพิมพ์ก่อนปี 2010'), ofN(tp_.pre2010, tp_.n), ofN(rp.pre2010, rp.n)],
      [ib('Real datasets used (median)', 'จำนวนชุดข้อมูลจริงที่ใช้ (ค่ากลาง)'), '<b>' + tp_.med_ds + '</b>', '<b>' + rp.med_ds + '</b>'],
      [ib('Ran a statistical test', 'มีการทดสอบทางสถิติ'), ofN(tp_.test, tp_.n), ofN(rp.test, rp.n, 1)],
      [ib('Released code', 'ปล่อยโค้ด'), ofN(tp_.code, tp_.n), ofN(rp.code, rp.n, 1)],
      [ib('Citations per year (median)', 'ยอดอ้างอิงต่อปี (ค่ากลาง)'), '<b>' + fmt1(tp_.med_cpy) + '</b>', '<b>' + fmt1(rp.med_cpy) + '</b>']], 'two-col') +
      exBox('Show the ten papers', 'ดูรายชื่อ 10 เรื่อง', table([['Paper', 'เรื่อง'], ['Year', 'ปี', 1], ['Citations', 'ยอดอ้างอิง', 1], ['Real datasets', 'ชุดข้อมูลจริง', 1], ['Statistical test', 'ทดสอบสถิติ'], ['Code', 'โค้ด']],
        f.top.map(p => ['<b>' + esc(p.short) + '</b>', p.year, big(p.cites), p.n_real == null ? 'n/a' : p.n_real, ib((TEST[p.test] || [p.test, p.test])[0], (TEST[p.test] || [p.test, p.test])[1]), p.code ? ib('yes', 'มี') : ib('no', 'ไม่มี')])))},
    {k: 'means', en: 'If careful evaluation brought citations, the top ten would use many datasets and statistical tests. They do the opposite. Most are first-generation methods such as SMOTE (2002), Borderline-SMOTE (2005) and ADASYN (2008), which almost every later paper runs as a competitor and therefore cites. Their citations come from being the baseline, not from how they were evaluated.',
      th: 'ถ้าการประเมินที่ละเอียดทำให้ถูกอ้างอิงมาก 10 อันดับแรกควรเป็นเรื่องที่ใช้ข้อมูลเยอะและทดสอบสถิติ แต่ผลกลับตรงข้าม ส่วนใหญ่เป็นวิธีรุ่นแรก เช่น SMOTE (2002) Borderline-SMOTE (2005) และ ADASYN (2008) ซึ่ง paper รุ่นหลังแทบทุกเรื่องเอาไปเป็นคู่เทียบและต้องอ้างอิง ยอดจึงมาจากการเป็นวิธีพื้นฐาน ไม่ได้มาจากวิธีประเมินผล'}]);

  h += why(2, 'But raw counts are unfair: older papers have had longer to collect citations', 'แต่เทียบยอดดิบตรง ๆ ไม่ยุติธรรม เพราะ paper เก่ามีเวลาสะสมยอดนานกว่า', [
    {k: 'look', en: 'We plotted every study\'s citations against its year and fitted the dashed line: the count a paper of that year would be expected to have.', th: 'พล็อตยอดอ้างอิงของทุกเรื่องเทียบกับปีที่ตีพิมพ์ แล้วลากเส้นประ ซึ่งบอกว่า paper ปีนั้นควรได้ยอดประมาณเท่าไร'},
    {k: 'found', html: legendSc + scatter(f.points, line, ex.map(p => p.key)) + tp('Each extra year of age multiplies the expected count by about ' + f.year_ratio.toFixed(2) + '. Three examples, marked on the chart, compare the real count with the line:', 'paper ที่เก่ากว่า 1 ปี ได้ยอดที่คาดไว้มากขึ้นประมาณ ' + f.year_ratio.toFixed(2) + ' เท่า ตัวอย่าง 3 เรื่องที่วงไว้ในกราฟ เทียบยอดจริงกับเส้น:') +
      table([['Paper', 'เรื่อง'], ['Real citations', 'ยอดจริง', 1], ['Expected for its year', 'ยอดที่คาดตามปี', 1], ['Real ÷ expected', 'ยอดจริง ÷ ยอดที่คาด', 1]],
        ex.map(p => { const e = exp(p.year), r = p.cites / e; return ['<b>' + esc(p.short) + '</b> ' + p.year, big(p.cites), big(Math.round(e)), '<b>×' + (r < 0.1 ? r.toFixed(2) : r.toFixed(1)) + '</b> ' + (r >= 1 ? ib('above the line', 'อยู่เหนือเส้น') : ib('below the line', 'อยู่ใต้เส้น'))]; }))},
    {k: 'means', en: 'So we compare each paper with the line, not with raw counts. For any practice (say, running a statistical test) we ask: on average, how far above the line are papers that follow it, compared with papers that do not? We call the answer the citation multiplier.',
      th: 'เราจึงเทียบแต่ละ paper กับเส้นนี้แทนยอดดิบ แล้วถามว่า paper ที่ทำแนวปฏิบัติหนึ่ง (เช่น ทดสอบสถิติ) โดยเฉลี่ยอยู่เหนือเส้นมากกว่า paper ที่ไม่ได้ทำกี่เท่า เรียกค่านี้ว่า “ตัวคูณการอ้างอิง”'}],
    '<div class="key"><b>' + ib('How to read a multiplier', 'วิธีอ่านตัวคูณ') + '</b>' +
      tp('<b>×1</b> cited the same as papers of the same age without the practice. <b>×2</b> twice as much. <b>×0.5</b> half as much. The <b>range</b> is where the true value probably lies (95% confidence). If the range <b>crosses ×1</b>, the data cannot tell the practice apart from no effect. If the <b>whole range</b> is on one side of ×1, the difference is real (statistically significant).',
        '<b>×1</b> ถูกอ้างอิงเท่ากับ paper อายุเท่ากันที่ไม่ได้ทำ <b>×2</b> มากกว่าสองเท่า <b>×0.5</b> ครึ่งเดียว <b>ช่วง</b> คือช่วงที่ค่าจริงน่าจะอยู่ (ความเชื่อมั่น 95%) ถ้าช่วง<b>คร่อม ×1</b> แปลว่าข้อมูลไม่พอจะบอกว่าต่างจากไม่มีผล ถ้า<b>ทั้งช่วง</b>อยู่ฝั่งเดียวของ ×1 ถือว่าต่างจริง (มีนัยสำคัญทางสถิติ)') + '</div>');

  const pr = [['repeated', 'Repeats the train and test split several times', 'แบ่งข้อมูลฝึกและทดสอบซ้ำหลายรอบ'], ['inside', 'Says resampling touches training data only', 'ระบุว่าปรับสมดุลเฉพาะข้อมูลฝึก ไม่แตะข้อมูลทดสอบ'],
    ['evalsel', 'Tunes settings on the data it reports (a flaw)', 'เลือกค่าพารามิเตอร์บนข้อมูลชุดที่ใช้รายงานผล (เป็นจุดอ่อน)'], ['anytest', 'Runs a significance test', 'ทดสอบนัยสำคัญทางสถิติ'],
    ['corr', 'Uses a corrected (e.g. Holm) or Bayesian test', 'ใช้การทดสอบแบบปรับแก้ (เช่น Holm) หรือแบบเบย์'], ['method_ref', 'Cites a testing guide (e.g. Demšar 2006)', 'อ้างอิงคู่มือวิธีทดสอบ (เช่น Demšar 2006)']];
  h += why(3, 'After allowing for age, protocol, tuning and testing make no difference', 'เมื่อปรับตามอายุแล้ว โปรโตคอล การปรับจูน และการทดสอบ ไม่สัมพันธ์กับการอ้างอิง', [
    {k: 'look', en: 'We computed the multiplier for each of the 24 practices we coded. These six are about protocol, tuning and testing; all 24 are listed at the end of this question.', th: 'คำนวณตัวคูณของแนวปฏิบัติทั้ง 24 แบบที่บันทึกไว้ 6 แบบนี้เกี่ยวกับโปรโตคอล การปรับจูน และการทดสอบ (ดูครบ 24 แบบได้ท้ายคำถามนี้)'},
    {k: 'found', html: ruler(pr.map(x => ({en: x[1], th: x[2], r: infRow(x[0])})))},
    {k: 'means', en: 'Every range crosses ×1, so none of these practices is linked to more or fewer citations. For example, papers that run a significance test sit at ×' + at.ratio.toFixed(2) + ', but the range runs from ' + at.lo.toFixed(2) + ' to ' + at.hi.toFixed(2) + ': the true value could be under half or over ' + at.hi.toFixed(1) + ' times. A good practice (training-only resampling) and a flawed one (tuning on the reported data) both sit near ×1: readers neither reward nor punish them.',
      th: 'ทุกช่วงคร่อม ×1 จึงไม่มีแนวปฏิบัติใดในกลุ่มนี้ที่ทำให้ถูกอ้างอิงมากขึ้นหรือน้อยลง เช่น paper ที่ทดสอบนัยสำคัญได้ ×' + at.ratio.toFixed(2) + ' แต่ช่วงคือ ' + at.lo.toFixed(2) + ' ถึง ' + at.hi.toFixed(2) + ' ค่าจริงอาจน้อยกว่าครึ่งหรือมากกว่า ' + at.hi.toFixed(1) + ' เท่าก็ได้ ทั้งแนวปฏิบัติที่ดี (ปรับสมดุลเฉพาะข้อมูลฝึก) และที่มีจุดอ่อน (เลือกค่าบนข้อมูลที่รายงาน) อยู่ใกล้ ×1 เหมือนกัน คนอ้างอิงไม่ได้ให้รางวัลหรือลงโทษเรื่องนี้'}]);

  h += why(4, 'The one clear signal: papers that define a measure incorrectly are cited about a third as often', 'สัญญาณเดียวที่ชัด: paper ที่นิยาม metric ผิด ถูกอ้างอิงประมาณหนึ่งในสาม', [
    {k: 'look', en: 'We checked the formula of every measure each paper reports against its standard definition. ' + f.issue_rows.length + ' of the ' + f.eligible + ' studies define a measure incorrectly or do not say how it is computed.', th: 'ตรวจสูตรของทุกตัวชี้วัดที่แต่ละ paper รายงาน เทียบกับนิยามมาตรฐาน พบ ' + f.issue_rows.length + ' จาก ' + f.eligible + ' เรื่องที่นิยามผิด หรือไม่บอกว่าคำนวณอย่างไร'},
    {k: 'found', html: ruler([{en: 'Defines a measure incorrectly', th: 'นิยาม metric ผิด', r: mi}]) +
      tiles([{v: fmt1(f.issue_med[0]), en: 'median citations per year, these ' + f.issue_rows.length + ' papers', th: 'ยอดอ้างอิงต่อปี (ค่ากลาง) ของ ' + f.issue_rows.length + ' เรื่องนี้', hl: 1}, {v: fmt1(f.issue_med[1]), en: 'median citations per year, the other papers', th: 'ยอดอ้างอิงต่อปี (ค่ากลาง) ของเรื่องอื่น'}]) +
      exBox('Show the ' + f.issue_rows.length + ' papers and what is wrong', 'ดู ' + f.issue_rows.length + ' เรื่อง และสิ่งที่ผิด', table([['Paper', 'เรื่อง'], ['Citations', 'ยอดอ้างอิง', 1], ['What is wrong', 'ผิดตรงไหน']],
        f.issue_rows.map(p => ['<b>' + esc(p.short) + '</b> ' + p.year, big(p.cites), ib((ISSUE_TH[p.key] || [p.problem])[0], (ISSUE_TH[p.key] || [p.problem, p.problem])[1])])))},
    {k: 'means', en: 'This is the only practice whose whole range lies below ×1. These papers are cited about a third as often as papers of the same age (×' + mi.ratio.toFixed(2) + ', range ' + mi.lo.toFixed(2) + '–' + mi.hi.toFixed(2) + ').',
      th: 'เป็นแนวปฏิบัติเดียวที่ทั้งช่วงอยู่ต่ำกว่า ×1 paper กลุ่มนี้ถูกอ้างอิงประมาณหนึ่งในสามของ paper อายุเท่ากัน (×' + mi.ratio.toFixed(2) + ' ช่วง ' + mi.lo.toFixed(2) + '–' + mi.hi.toFixed(2) + ')'},
    {k: 'care', en: 'We tested 24 practices. Even with no real effect anywhere, about one would look different by chance, so treat this as a hint, not proof. It also does not show that readers spot the wrong formula; these papers may simply appear in venues that are read less, which we did not adjust for.',
      th: 'เราทดสอบ 24 แนวปฏิบัติ ต่อให้ไม่มีผลจริงเลย ก็คาดได้ว่าจะมีราว 1 แบบที่ดูต่างโดยบังเอิญ จึงถือเป็นข้อบ่งชี้ ยังไม่ใช่ข้อพิสูจน์ และไม่ได้แปลว่าคนอ่านจับได้ว่าสูตรผิด อาจเป็นเพราะ paper กลุ่มนี้ตีพิมพ์ในที่ที่คนอ่านน้อยกว่า ซึ่งเราไม่ได้ปรับ'}]);

  h += why(5, 'Releasing code goes with about twice the citations, but it does not pass the test', 'การปล่อยโค้ดสัมพันธ์กับยอดอ้างอิงประมาณ 2 เท่า แต่ยังไม่ผ่านเกณฑ์นัยสำคัญ', [
    {k: 'look', en: 'The same multiplier for the two practices that came closest to the line: releasing code (' + cd.n_users + ' studies) and running SMOTE as a competitor (' + sb.n_users + ' studies).', th: 'ใช้ตัวคูณแบบเดียวกันกับ 2 แนวปฏิบัติที่เกือบผ่านเกณฑ์ คือปล่อยโค้ด (' + cd.n_users + ' เรื่อง) และมี SMOTE เป็นคู่เทียบ (' + sb.n_users + ' เรื่อง)'},
    {k: 'found', html: ruler([{en: 'Releases code', th: 'ปล่อยโค้ด', r: cd}, {en: 'Runs SMOTE as a competitor', th: 'มี SMOTE เป็นคู่เทียบ', r: sb}])},
    {k: 'means', en: 'Both ranges start just below ×1 (' + cd.lo.toFixed(2) + ' and ' + sb.lo.toFixed(2) + '), so we cannot yet say they make a difference. It is a signal worth watching: released code makes it easy for others to run the method as a competitor, and so to cite it.',
      th: 'ช่วงของทั้งสองเริ่มต่ำกว่า ×1 เพียงเล็กน้อย (' + cd.lo.toFixed(2) + ' และ ' + sb.lo.toFixed(2) + ') จึงยังสรุปไม่ได้ว่าต่างจริง แต่เป็นสัญญาณที่น่าติดตาม เพราะโค้ดที่เปิดให้ใช้ทำให้คนอื่นเอาวิธีไปเป็นคู่เทียบได้ง่าย และต้องอ้างอิงตามมา'}]);

  const topics = {data: ['Data', 'ข้อมูล'], learners: ['Learners and competitors', 'classifier และคู่เทียบ'], measures: ['Measures', 'ตัวชี้วัด'], protocol: ['Protocol and tuning', 'โปรโตคอลและการปรับจูน'], stats: ['Statistical testing', 'การทดสอบทางสถิติ'], reporting: ['Reporting', 'การรายงานผล'], outcomes: ['Outcomes', 'ผลลัพธ์']};
  const all = [];
  Object.keys(topics).forEach(t => { all.push({group: topics[t]}); f.influence.filter(r => r.topic === t && r.ratio != null).forEach(r => all.push({r: r})); });
  h += exBox('Show the multiplier for all 24 practices', 'ดูตัวคูณของทั้ง 24 แนวปฏิบัติ', ruler(all));
  return h + '</section>';
}

/* ================= question 2: data ================= */
function q2() {
  const f = F.data, a = f.access, ku = f.keel_uci, pubN = f.reasons.find(r => r.code === 'public_benchmark').n;
  let h = qHead(2, 'q2', 'Which test data do studies use, why, and are studies that use downloadable data cited more?', 'เอา data test อะไรมา ทำไมเลือกชุดนั้น และ paper ที่ใช้ data ที่คนอื่นโหลดได้ ถูกอ้างอิงเยอะกว่าไหม',
    'Mostly UCI and KEEL, and using them brings no extra citations.',
    'ส่วนใหญ่ใช้ UCI และ KEEL แต่การใช้ไม่ได้ทำให้ถูกอ้างอิงมากขึ้น',
    ku.uci + ' of ' + f.n + ' studies use UCI data and ' + ku.keel + ' use KEEL data. ' + f.stated + ' of ' + f.n + ' explain their choice, mostly to cover a range of imbalance ratios and sizes or to follow an earlier paper. The citations go to the repositories, not to the papers that use them. Datasets are handed down from paper to paper, and ' + a.modified + ' studies change the data before use but only ' + a.released.length + ' release the changed version.',
    ku.uci + ' จาก ' + f.n + ' เรื่องใช้ข้อมูลจาก UCI และ ' + ku.keel + ' เรื่องใช้ KEEL มี ' + f.stated + ' จาก ' + f.n + ' เรื่องที่บอกเหตุผลการเลือก ส่วนใหญ่เพื่อให้ครอบคลุม IR และขนาดที่หลากหลาย หรือใช้ตาม paper ก่อนหน้า ยอดอ้างอิงไปตกที่ตัวคลังข้อมูล ไม่ใช่ paper ที่ใช้ข้อมูล ชุดข้อมูลถูกส่งต่อจาก paper หนึ่งไปอีก paper และมี ' + a.modified + ' เรื่องที่ดัดแปลงข้อมูลก่อนใช้ แต่มีแค่ ' + a.released.length + ' เรื่องที่ปล่อยชุดที่ดัดแปลงแล้ว');

  h += why(1, f.stated + ' of ' + f.n + ' studies give a reason; most want variety in imbalance ratio and size, or follow an earlier paper', f.stated + ' จาก ' + f.n + ' เรื่องให้เหตุผล ส่วนใหญ่เพื่อให้ครอบคลุม IR และขนาดที่หลากหลาย และใช้ตาม paper ก่อนหน้า', [
    {k: 'look', en: 'We read the dataset section of every study, copied the sentence that says why those datasets were chosen with its page, and grouped the reasons. A study can give several. We counted only what is written, not what the authors might have meant.', th: 'อ่านส่วนที่อธิบายชุดข้อมูลของทุกเรื่อง คัดประโยคที่บอกว่าทำไมเลือกชุดนั้นพร้อมเลขหน้า แล้วจัดกลุ่มเหตุผล เรื่องหนึ่งให้ได้หลายเหตุผล นับเฉพาะที่เขียนไว้ ไม่เดาเจตนาผู้เขียน'},
    {k: 'found', html: bars(f.reasons.map(r => ({en: DREASON[r.code][0], th: DREASON[r.code][1], n: r.n, of: f.n, c: r.code === 'public_benchmark' ? '--c3' : '--c1'})), f.n) +
      exBox('Show one sentence for each reason', 'ดูประโยคตัวอย่างของแต่ละเหตุผล', '<div class="quotes">' + f.reasons.filter(r => r.ex).map(r => qcard(r.ex, DREASON_EX[r.code], ib(DREASON[r.code][0], DREASON[r.code][1]))).join('') + '</div>' +
        '<p class="note">' + ib('No reason given (' + f.not_stated.length + '): ', 'ไม่ให้เหตุผล (' + f.not_stated.length + ' เรื่อง): ') + esc(f.not_stated.join(', ')) + '</p>')},
    {k: 'means', en: 'Data are chosen to cover a spread of imbalance ratios and sizes, or because an earlier paper used them. Only ' + pubN + ' studies say they chose data because anyone can download it (grey bar).',
      th: 'ข้อมูลถูกเลือกเพื่อให้ครอบคลุม IR และขนาดที่หลากหลาย หรือเพราะ paper ก่อนหน้าใช้ มีเพียง ' + pubN + ' เรื่องที่บอกว่าเลือกเพราะใคร ๆ ก็โหลดได้ (แท่งสีเทา)'}]);

  h += why(2, 'Datasets are handed down in chains', 'ชุดข้อมูลถูกส่งต่อกันเป็นสาย', [
    {k: 'look', en: 'We kept only the cases where a paper itself says which earlier work its datasets come from.', th: 'เก็บเฉพาะกรณีที่ paper เขียนเองว่าชุดข้อมูลมาจากงานไหน'},
    {k: 'found', html: '<div class="chains">' + f.chains.map((c, i) => '<div class="chain"><div class="src">' + ib(c.source, CHAIN_SRC_TH[i] || c.source) + '</div>' + c.items.map(it => '<div class="ln"><span class="arrow">→</span><div><b>' + esc(it.short) + '</b>' + qcard(it, CHAIN_TH[it.key]) + '</div></div>').join('') + '</div>').join('') + '</div>'},
    {k: 'means', en: 'For example, Sáez et al. (2016) picked hard multi-class KEEL sets; MC-RBO and MC-CCR (2020) say they took them from that study, and NROMM (2023) says it uses the same 20 sets as MC-RBO and MC-CCR. This keeps results comparable, but the data are inherited rather than chosen for each new question.',
      th: 'ตัวอย่าง Sáez et al. (2016) คัดชุดข้อมูลหลายคลาสจาก KEEL ที่ยาก MC-RBO และ MC-CCR (2020) เขียนว่าเอามาจากงานนั้น แล้ว NROMM (2023) เขียนว่าใช้ 20 ชุดเดียวกับ MC-RBO และ MC-CCR ทำให้ผลเทียบกันได้ แต่ข้อมูลถูกสืบทอดมา ไม่ได้ถูกเลือกใหม่ตามคำถามของแต่ละงาน'}]);

  const repo = f.repo.slice();
  h += why(3, 'The credit goes to the repositories themselves', 'เครดิตไปตกที่ตัวคลังข้อมูลเอง', [
    {k: 'look', en: 'We looked up, in OpenAlex, the papers that introduce the KEEL and UCI repositories and the imbalanced-learn library, next to the best-known methods in our corpus.', th: 'ดึงยอดอ้างอิงจาก OpenAlex ของ paper ที่แนะนำคลังข้อมูล KEEL และ UCI และไลบรารี imbalanced-learn เทียบกับวิธีที่ดังที่สุดในคลังบทความ'},
    {k: 'found', html: bars(repo.map(r => ({en: r.label, th: REPO_TH(r.label), n: r.cites, v: big(r.cites), c: r.kind === 'method' ? '--c1' : '--c2'}))) +
      '<div class="legend"><span><i style="background:var(--c2)"></i>' + ib('repository or tool', 'คลังข้อมูลหรือเครื่องมือ') + '</span><span><i style="background:var(--c1)"></i>' + ib('method in the corpus', 'วิธีในคลังบทความ') + '</span></div>'},
    {k: 'means', en: 'Every paper that uses KEEL or UCI data cites the repository paper, so the citations pile up there. The UCI record (' + big(repo.find(r => r.label.indexOf('UCI') === 0).cites) + ') is cited more than any method except SMOTE.',
      th: 'ทุก paper ที่ใช้ข้อมูลจาก KEEL หรือ UCI ต้องอ้างอิง paper ของคลังนั้น ยอดอ้างอิงจึงไปรวมที่คลัง UCI (' + big(repo.find(r => r.label.indexOf('UCI') === 0).cites) + ') ถูกอ้างอิงมากกว่าทุกวิธี ยกเว้น SMOTE'}]);

  const dr = [['keel', 'Uses KEEL datasets', 'ใช้ชุดข้อมูลจาก KEEL'], ['uci', 'Uses UCI datasets', 'ใช้ชุดข้อมูลจาก UCI'], ['many_ds', 'Uses 18 or more real datasets (the median)', 'ใช้ชุดข้อมูลจริง 18 ชุดขึ้นไป (ค่ากลาง)'],
    ['data_reason', 'Explains why the data were chosen', 'อธิบายเหตุผลที่เลือกข้อมูล'], ['private', 'Some data cannot be downloaded', 'มีข้อมูลบางชุดที่โหลดไม่ได้']];
  const uci = infRow('uci');
  h += why(4, 'Papers that use KEEL or UCI are not cited any more', 'paper ที่ใช้ข้อมูล KEEL หรือ UCI ไม่ได้ถูกอ้างอิงมากขึ้นเลย', [
    {k: 'look', en: 'The same citation multiplier as in question 1: each paper is compared with papers of the same age.', th: 'ใช้ตัวคูณการอ้างอิงแบบเดียวกับคำถามที่ 1 คือเทียบแต่ละ paper กับ paper อายุเท่ากัน'},
    {k: 'found', html: ruler(dr.map(x => ({en: x[1], th: x[2], r: infRow(x[0])})))},
    {k: 'means', en: 'All five sit close to ×1 with ranges that cross it. The likely reason: almost everyone uses these repositories (' + uci.n_users + ' of ' + uci.n + ' use UCI), so using them does not make a paper stand out. Even papers with some data that cannot be downloaded are not cited less.',
      th: 'ทั้ง 5 แบบอยู่ใกล้ ×1 และช่วงคร่อม ×1 เหตุผลที่น่าจะเป็นคือ เกือบทุกเรื่องใช้คลังเหล่านี้อยู่แล้ว (' + uci.n_users + ' จาก ' + uci.n + ' เรื่องใช้ UCI) การใช้จึงไม่ทำให้ paper ไหนโดดเด่น แม้แต่ paper ที่มีข้อมูลบางชุดโหลดไม่ได้ ก็ไม่ได้ถูกอ้างอิงน้อยลง'}]);

  h += why(5, 'Downloadable, but not reproducible: ' + a.modified + ' studies change the data, only ' + a.released.length + ' release the changed version', 'โหลดได้ แต่ทำซ้ำไม่ได้: ' + a.modified + ' เรื่องดัดแปลงข้อมูลเอง แต่ปล่อยออกมาแค่ ' + a.released.length + ' เรื่อง', [
    {k: 'look', en: 'For each study we checked whether the original data are public, whether the authors changed them (merging classes into two, under-sampling to raise the imbalance ratio, adding noise) and, if so, whether they released the changed version.', th: 'ตรวจทุกเรื่องว่าข้อมูลต้นฉบับเปิดเผยไหม ผู้เขียนดัดแปลงข้อมูลไหม (เช่น รวมหลายคลาสให้เหลือ 2 คลาส สุ่มตัดเพื่อเพิ่ม IR หรือเติม noise) และถ้าดัดแปลง ได้ปล่อยชุดที่ดัดแปลงแล้วไหม'},
    {k: 'found', html: bars([{en: 'all real data can be downloaded', th: 'ข้อมูลจริงทุกชุดโหลดได้', n: a.all_public, of: f.n}, {en: 'says where each dataset comes from', th: 'บอกแหล่งของทุกชุดข้อมูล', n: a.per_src, of: f.n},
      {en: 'changes the data before use', th: 'ดัดแปลงข้อมูลก่อนใช้', n: a.modified, of: f.n, c: '--c2'}, {en: 'of these, releases the changed data', th: 'ในนั้น ปล่อยชุดที่ดัดแปลงแล้ว', n: a.released.length, of: a.modified, c: '--c2'}], f.n) +
      '<p class="note">' + ib('Released the changed data: ', 'ปล่อยชุดที่ดัดแปลงแล้ว: ') + esc(a.released.join(', ')) + '</p>'},
    {k: 'means', en: 'Anyone can download the originals, but without the changed version nobody can rebuild exactly the data in the paper (for instance, which examples were removed by under-sampling). So the data are open, yet the results are hard to reproduce.',
      th: 'ใคร ๆ ก็โหลดชุดต้นฉบับได้ แต่ถ้าไม่มีชุดที่ดัดแปลงแล้ว ก็สร้างข้อมูลให้ตรงกับใน paper ไม่ได้ (เช่น ไม่รู้ว่าสุ่มตัดตัวอย่างไหนออก) ข้อมูลจึงเปิด แต่ผลทำซ้ำได้ยาก'}]);
  return h + '</section>';
}

/* ================= question 3: beyond the classifier ================= */
function q3() {
  const f = F.beyond, g = f.groups, inf = f.inf_direct;
  let h = qHead(3, 'q3', 'Besides scoring a classifier, is there another way, such as measuring the data directly?', 'นอกจากวัดผลผ่าน classifier มีวิธีแบบอื่นไหม เช่นวัดข้อมูลตรง ๆ',
    'No study evaluates without a classifier.', 'ไม่มีเรื่องไหนประเมินโดยไม่ใช้ classifier เลย',
    'Only ' + g.direct + ' studies also measure the resampled data directly, and only as extra evidence. Other non-score evidence is mostly 2-D pictures (' + g.visual + ' studies) or theory and big-O (' + g.analytic + ' studies).',
    'มีแค่ ' + g.direct + ' เรื่องที่วัดข้อมูลหลังปรับสมดุลโดยตรง และใช้เป็นแค่หลักฐานเสริม หลักฐานอื่นที่ไม่ใช่คะแนน ส่วนใหญ่เป็นกราฟ 2 มิติ (' + g.visual + ' เรื่อง) หรือทฤษฎีและ big-O (' + g.analytic + ' เรื่อง)');

  h += why(1, 'All ' + f.n + ' studies judge resampling by a classifier\'s score', 'ทั้ง ' + f.n + ' เรื่องตัดสินการปรับสมดุลด้วยคะแนนของ classifier', [
    {k: 'look', en: 'We went through every results table and figure of every study and sorted each result: is it a classifier score (accuracy, G-mean, AUC and so on) or something else? Each non-score result was recorded with its page.', th: 'ไล่ดูทุกตารางและรูปผลการทดลองของทุกเรื่อง แยกว่าผลไหนเป็นคะแนนของ classifier (เช่น accuracy, G-mean, AUC) ผลไหนไม่ใช่ และบันทึกเลขหน้าของผลที่ไม่ใช่คะแนนทุกรายการ'},
    {k: 'found', html: tiles([{v: f.n + '/' + f.n, en: 'report classifier scores', th: 'มีคะแนนของ classifier'}, {v: f.without_classifier + '/' + f.n, en: 'evaluate without any classifier', th: 'ประเมินโดยไม่ใช้ classifier', hl: 1},
      {v: g.direct + '/' + f.n, en: 'also measure the resampled data directly', th: 'วัดข้อมูลหลังปรับสมดุลโดยตรงด้วย'}, {v: g.none + '/' + f.n, en: 'report classifier scores and nothing else', th: 'มีแค่คะแนน classifier ไม่มีหลักฐานอื่น'}])},
    {k: 'means', en: 'The standard recipe in this field is: resample the training data, train a classifier, score it on test data. The resampled data are always judged indirectly, through the classifier.',
      th: 'สูตรมาตรฐานของงานสายนี้คือ ปรับสมดุลข้อมูลฝึก แล้วฝึก classifier แล้ววัดคะแนนบนข้อมูลทดสอบ ข้อมูลที่ปรับแล้วจึงถูกตัดสินทางอ้อมผ่าน classifier เสมอ'}]);

  h += why(2, 'The ' + g.direct + ' studies that measure the data directly do so as a side check', g.direct + ' เรื่องที่วัดข้อมูลตรง ๆ ใช้เป็นแค่การตรวจเสริม', [
    {k: 'look', en: 'For these studies we noted what exactly is measured and where. An independent second reader checked each one.', th: 'บันทึกว่าแต่ละเรื่องวัดอะไรและอยู่หน้าไหน และให้ผู้ตรวจอีกคนตรวจซ้ำทุกเรื่อง'},
    {k: 'found', html: table([['Paper', 'เรื่อง'], ['What is measured, in plain words', 'วัดอะไร (ภาษาง่าย)'], ['Where', 'หน้า']],
      f.direct.map(p => ['<b>' + esc(p.short) + '</b>', ib((DIRECT[p.key] || [p.details])[0], (DIRECT[p.key] || [p.details, p.details])[1]), '<span class="sub">' + esc(p.where) + '</span>']))},
    {k: 'means', en: 'All six still use classifier scores as the main result that decides whether the method is better. CTGAN and GAMO are GAN-based and borrow their measures (likelihood, FID) from work on generative models. The ' + inf.n_users + ' of them old enough to count are cited ×' + inf.ratio.toFixed(1) + ', but the range (' + inf.lo.toFixed(2) + '–' + inf.hi.toFixed(2) + ') is too wide to conclude anything with so few papers.',
      th: 'ทั้ง 6 เรื่องยังใช้คะแนน classifier เป็นผลหลักในการตัดสินว่าวิธีดีกว่า CTGAN และ GAMO เป็นงานสาย GAN ซึ่งยืมตัววัด (likelihood, FID) มาจากงานสร้างข้อมูล ' + inf.n_users + ' เรื่องในกลุ่มนี้ที่เก่าพอจะนับยอดอ้างอิงได้ ×' + inf.ratio.toFixed(1) + ' แต่ช่วง (' + inf.lo.toFixed(2) + '–' + inf.hi.toFixed(2) + ') กว้างเกินจะสรุปได้ เพราะมีแค่ไม่กี่เรื่อง'}]);

  h += why(3, 'Other evidence is mostly pictures and theory, not measurement', 'หลักฐานแบบอื่นส่วนใหญ่เป็นภาพและทฤษฎี ไม่ใช่การวัด', [
    {k: 'look', en: 'The same sorting, for everything that is not a classifier score. A study can fall in several groups. Hand-drawn diagrams and plots of the original data only are not counted.', th: 'ใช้การแยกแบบเดียวกันกับผลทุกอย่างที่ไม่ใช่คะแนน เรื่องหนึ่งอยู่ได้หลายกลุ่ม ไม่นับภาพวาดแผนผังและกราฟของข้อมูลต้นฉบับอย่างเดียว'},
    {k: 'found', html: bars([{en: 'pictures: 2-D plots, PCA or t-SNE views, histograms', th: 'ภาพ: กราฟ 2 มิติ ภาพฉาย PCA หรือ t-SNE histogram', n: g.visual, of: f.n}, {en: 'analysis: theorems, bounds, big-O', th: 'การวิเคราะห์: ทฤษฎีบท ขอบเขต big-O', n: g.analytic, of: f.n},
      {en: 'model traits, e.g. tree size or number of rules', th: 'ลักษณะของโมเดล เช่น ขนาดต้นไม้ จำนวนกฎ', n: g.model, of: f.n}, {en: 'direct measurement of the resampled data', th: 'วัดข้อมูลหลังปรับสมดุลโดยตรง', n: g.direct, of: f.n, c: '--c2'},
      {en: 'nothing besides classifier scores', th: 'ไม่มีอะไรนอกจากคะแนน classifier', n: g.none, of: f.n, c: '--c3'}], f.n)},
    {k: 'means', en: 'A 2-D plot shows where synthetic points land on a toy dataset: useful to see, but it gives no number on real data. Theory and big-O say the method is sound and how long it takes, not how good the data it produces are. Five studies describe the trained model instead, for example SMOTE (2002) compares tree sizes and Batista et al. (2004) the number of rules.',
      th: 'กราฟ 2 มิติแสดงว่าจุดสังเคราะห์ไปตกตรงไหนบนข้อมูลตัวอย่างที่สร้างขึ้นเอง ช่วยให้เห็นภาพ แต่ไม่ได้ให้ตัวเลขบนข้อมูลจริง ทฤษฎีและ big-O บอกว่าวิธีถูกต้องและใช้เวลาเท่าไร ไม่ได้บอกว่าข้อมูลที่ได้ดีแค่ไหน อีก 5 เรื่องอธิบายลักษณะของโมเดลแทน เช่น SMOTE (2002) เทียบขนาดต้นไม้ และ Batista et al. (2004) เทียบจำนวนกฎ'}],
    exBox('Show the ' + f.model.length + ' model-trait studies and the ' + f.none.length + ' score-only studies', 'ดู ' + f.model.length + ' เรื่องที่รายงานลักษณะโมเดล และ ' + f.none.length + ' เรื่องที่มีแค่คะแนน',
      '<ul class="plain">' + f.model.map(p => '<li><b>' + esc(p.short) + '</b>: ' + ib((MODEL_TH[p.short] || [p.details])[0], (MODEL_TH[p.short] || [p.details, p.details])[1]) + '</li>').join('') + '</ul>' +
      '<p class="note">' + ib('Classifier scores only: ', 'มีแค่คะแนน classifier: ') + esc(f.none.join(', ')) + '</p>'));
  return h + '</section>';
}

/* ================= question 4: how models are chosen ================= */
function q4() {
  const f = F.select, sel = f.sel_n, named = f.named_n;
  const fam = Object.keys(f.clf_families).slice(0, 6);
  const pop = f.learner_reasons.find(r => r.code === 'popular').n;
  let h = qHead(4, 'q4', 'How are the models chosen? Is it by sensitivity alone?', 'model ที่ใช้ เลือกมาจากอะไร ใช้ sen (sensitivity) อย่างเดียวไหม',
    'No, in both senses of the question.', 'ไม่ใช่ ทั้งสองความหมายของคำถาม',
    'Classifiers are mostly chosen because they are common (' + pop + ' studies); only ' + f.sens.length + ' choose one because it is sensitive to imbalance. Settings are mostly chosen by G-mean or AUC; sensitivity alone decides in only ' + f.sens_only.length + ' studies, both as a rule inside the method.',
    'classifier ส่วนใหญ่ถูกเลือกเพราะนิยมใช้ (' + pop + ' เรื่อง) มีแค่ ' + f.sens.length + ' เรื่องที่เลือกเพราะไวต่อ imbalance ส่วนค่าพารามิเตอร์ถูกเลือกด้วย G-mean หรือ AUC เป็นหลัก ใช้ sensitivity อย่างเดียวมีแค่ ' + f.sens_only.length + ' เรื่อง และเป็นกฎภายในตัววิธีเอง');
  h += '<div class="key"><b>' + ib('Two readings of the question; we answer both', 'คำถามนี้ตีความได้ 2 แบบ เราตอบทั้งสองแบบ') + '</b>' +
    tp('<b>(a)</b> Which classifier is used, and why? For example, because it is sensitive to imbalance. <b>(b)</b> Which measure picks the best setting or variant? For example, sensitivity.',
      '<b>(ก)</b> ใช้ classifier ตัวไหน เพราะอะไร เช่น เพราะมันไวต่อ imbalance <b>(ข)</b> ใช้ตัวชี้วัดอะไรเลือกค่าพารามิเตอร์หรือรุ่นที่ดีที่สุด เช่น sensitivity') + '</div>';

  h += why(1, '(a) Classifiers are chosen because they are common; only ' + f.sens.length + ' studies choose one because it is sensitive to imbalance', '(ก) classifier ส่วนใหญ่ถูกเลือกเพราะนิยมใช้ มีแค่ ' + f.sens.length + ' เรื่องที่เลือกเพราะไวต่อ imbalance', [
    {k: 'look', en: 'We found the sentence where each study says why it uses its classifiers, with the page, and grouped the reasons.', th: 'หาประโยคที่แต่ละเรื่องบอกว่าทำไมใช้ classifier ตัวนั้น พร้อมเลขหน้า แล้วจัดกลุ่มเหตุผล'},
    {k: 'found', html: bars(f.learner_reasons.map(r => ({en: LREASON[r.code][0], th: LREASON[r.code][1], n: r.n, of: f.n, c: r.code === 'sensitive_to_imbalance' ? '--c2' : '--c1'})), f.n) +
      '<p class="note">' + ib(f.learner_stated + ' of ' + f.n + ' studies give a reason; ' + (f.n - f.learner_stated) + ' do not. Most used: ', f.learner_stated + ' จาก ' + f.n + ' เรื่องให้เหตุผล อีก ' + (f.n - f.learner_stated) + ' เรื่องไม่ให้ classifier ที่ใช้บ่อย: ') + esc(fam.map(k => k + ' (' + f.clf_families[k] + ')').join(', ')) + '</p>' +
      exBox('Show the ' + f.sens.length + ' studies that chose a classifier for its sensitivity, and other examples', 'ดู ' + f.sens.length + ' เรื่องที่เลือกเพราะไวต่อ imbalance และตัวอย่างอื่น',
        '<div class="quotes">' + f.sens.map(s => qcard(s, LQ_TH[s.key], ib(LREASON.sensitive_to_imbalance[0], LREASON.sensitive_to_imbalance[1]))).join('') +
        ['popular', 'diverse_paradigms', 'follows_prior_work'].map(c => { const r = f.learner_reasons.find(x => x.code === c); return r && r.ex ? qcard(r.ex, LQ_TH[r.ex.key], ib(LREASON[c][0], LREASON[c][1])) : ''; }).join('') + '</div>')},
    {k: 'means', en: 'Classifiers are picked for being widely used or for covering different kinds of learner, so results look general. Choosing one because it reacts to imbalance is rare.',
      th: 'classifier ถูกเลือกเพราะนิยมใช้ หรือเพื่อให้ครอบคลุมหลายแบบ ผลจะได้ดูทั่วไป การเลือกเพราะมันไวต่อ imbalance พบน้อยมาก'}]);

  h += why(2, '(b) ' + sel + ' studies pick a setting, only ' + named + ' say which measure decides, mostly G-mean or AUC', '(ข) ' + sel + ' เรื่องมีการเลือกค่า แต่บอกเกณฑ์แค่ ' + named + ' เรื่อง ส่วนใหญ่ใช้ G-mean และ AUC', [
    {k: 'look', en: 'For every study we recorded what is chosen (SMOTE\'s k, how many points to create, a classifier hyperparameter, or the best variant of the method), which measure decides, and on which data.', th: 'บันทึกทุกเรื่องว่ามีการเลือกอะไร (เช่น ค่า k ของ SMOTE จำนวนตัวอย่างที่จะสังเคราะห์ hyperparameter ของ classifier หรือรุ่นที่ดีที่สุดของวิธี) ใช้ตัวชี้วัดอะไรตัดสิน และตัดสินบนข้อมูลชุดไหน'},
    {k: 'found', html: '<div class="funnel"><div><b>' + f.n + '</b>' + ib('studies with experiments', 'เรื่องที่มีการทดลอง') + '</div><span>→</span><div><b>' + sel + '</b>' + ib('choose some setting', 'มีการเลือกค่า') + '</div><span>→</span><div><b>' + named + '</b>' + ib('name the measure', 'บอกตัวชี้วัดที่ใช้เลือก') + '</div><div class="side"><b>' + f.internal_n + '</b>' + ib('use a rule of the method (e.g. likelihood)', 'ใช้เกณฑ์ภายในของวิธี (เช่น likelihood)') + '</div><div class="side"><b>' + f.ns_n + '</b>' + ib('do not say', 'ไม่บอก') + '</div></div>' +
      '<h5>' + ib('Measure used to choose (number of studies)', 'ตัวชี้วัดที่ใช้เลือก (จำนวนเรื่อง)') + '</h5>' + bars(Object.keys(f.criteria).map(k => ({en: k, th: k, n: f.criteria[k], of: named, c: k === 'Sensitivity/Recall' ? '--c2' : '--c1'})), named)},
    {k: 'means', en: 'G-mean (' + f.criteria['G-mean'] + ') and AUC (' + f.criteria['AUC'] + ') do most of the choosing. Sensitivity is among the measures in ' + (f.criteria['Sensitivity/Recall'] || 0) + ' studies. Every measure used to choose is also one the study reports as a result.',
      th: 'G-mean (' + f.criteria['G-mean'] + ') และ AUC (' + f.criteria['AUC'] + ') เป็นเกณฑ์หลัก sensitivity อยู่ในเกณฑ์ของ ' + (f.criteria['Sensitivity/Recall'] || 0) + ' เรื่อง และทุกตัวชี้วัดที่ใช้เลือก เป็นตัวเดียวกับที่รายงานเป็นผลด้วย'}]);

  const SO = {'RACOG-2015': ['Keeps adding synthetic points and stops when sensitivity on validation data stops improving (the spread over the last 10 rounds falls below 0.02). The authors note precision or F-measure could be used instead.', 'เพิ่มตัวอย่างสังเคราะห์ไปเรื่อย ๆ และหยุดเมื่อ sensitivity บนข้อมูลตรวจสอบไม่ดีขึ้นแล้ว (ความแปรปรวนของ 10 รอบล่าสุดต่ำกว่า 0.02) ผู้เขียนบอกเองว่าใช้ precision หรือ F-measure แทนได้'],
    'OBU-2018': ['Trains two models from two ways of under-sampling and keeps the one with higher positive-class accuracy, which is sensitivity. The paper does not say on which data this is measured.', 'ฝึกโมเดล 2 ตัวจากการสุ่มตัด 2 แบบ แล้วเก็บตัวที่ accuracy ของคลาสบวก (คือ sensitivity) สูงกว่า paper ไม่ได้บอกว่าวัดบนข้อมูลชุดไหน']};
  h += why(3, 'Sensitivity alone decides in only ' + f.sens_only.length + ' studies, as a rule inside the method', 'ใช้ sensitivity อย่างเดียวมีแค่ ' + f.sens_only.length + ' เรื่อง และเป็นกฎภายในตัววิธีเอง', [
    {k: 'look', en: 'We picked out the studies whose only deciding measure is sensitivity and had a second reader check them against the paper.', th: 'คัดเรื่องที่ใช้ sensitivity เป็นเกณฑ์ตัดสินเพียงตัวเดียว แล้วให้ผู้ตรวจอีกคนตรวจกับต้นฉบับ'},
    {k: 'found', html: '<div class="two">' + f.sens_only.map(s => '<div class="card"><h5>' + esc(s.short) + '</h5>' + tp((SO[s.key] || ['', ''])[0], (SO[s.key] || ['', ''])[1]) + quoteHTML(s) + '</div>').join('') + '</div>'},
    {k: 'means', en: 'Both use sensitivity as a stopping or keep-the-better-model rule inside the method. Neither uses it to choose a classifier or to decide the experiment\'s result.',
      th: 'ทั้งสองเรื่องใช้ sensitivity เป็นกฎหยุด หรือกฎเลือกเก็บโมเดลที่ดีกว่า ภายในขั้นตอนของวิธีเอง ไม่ได้ใช้เลือก classifier หรือใช้ตัดสินผลการทดลอง'}]);

  const du = f.data_used;
  h += why(4, 'A bigger worry: ' + (du['evaluation data'] || 0) + ' of ' + sel + ' choose settings on the same data they report', 'สิ่งที่น่ากังวลกว่า: ' + (du['evaluation data'] || 0) + ' จาก ' + sel + ' เรื่องเลือกค่าบนข้อมูลชุดเดียวกับที่รายงานผล', [
    {k: 'look', en: 'For the ' + sel + ' studies that choose a setting, on which data the choice is made.', th: 'ใน ' + sel + ' เรื่องที่มีการเลือกค่า เลือกบนข้อมูลชุดไหน'},
    {k: 'found', html: bars([{en: 'the test folds that are reported', th: 'fold ทดสอบชุดเดียวกับที่รายงานผล', n: du['evaluation data'] || 0, of: sel, c: '--c2'}, {en: 'not stated', th: 'ไม่บอก', n: du['not stated'] || 0, of: sel, c: '--c3'},
      {en: 'separate validation data inside the training data', th: 'ข้อมูลตรวจสอบที่แยกไว้ในข้อมูลฝึก', n: du['inner validation (training data only)'] || 0, of: sel}, {en: 'separate tuning datasets', th: 'ชุดข้อมูลสำหรับปรับจูนแยกต่างหาก', n: du['other'] || 0, of: sel}], sel) +
      exBox('Show all ' + sel + ' studies with their quotes', 'ดูทั้ง ' + sel + ' เรื่องพร้อมข้อความจากบทความ', table([['Paper', 'เรื่อง'], ['Chosen', 'สิ่งที่เลือก'], ['Measure', 'ตัวชี้วัด'], ['Data', 'ข้อมูล'], ['Quote and page', 'ข้อความและเลขหน้า']],
        f.table.map(r => ['<b>' + esc(r.short) + '</b>', trList(r.selected), esc(r.criterion), trList(r.data), (r.quote ? '“' + esc(r.quote) + '”' : '') + '<div class="sub">' + esc(r.where || '') + '</div>'])))},
    {k: 'means', en: 'If you pick the setting that scores best on the test folds and then report the score on those same folds, the proposed method looks better than it really is. Only ' + (du['inner validation (training data only)'] || 0) + ' studies keep a separate validation set inside the training data.',
      th: 'ถ้าเลือกค่าที่ทำให้คะแนนบน fold ทดสอบสูงสุด แล้วรายงานคะแนนบน fold เดียวกันนั้น วิธีที่เสนอจะดูดีเกินจริง มีแค่ ' + (du['inner validation (training data only)'] || 0) + ' เรื่องที่แยกข้อมูลตรวจสอบไว้ในข้อมูลฝึก'}]);
  return h + '</section>';
}

function findings() {
  const q = [['q1', 'Evaluation method and citations', 'วิธีประเมินกับยอดอ้างอิง', 'Not linked', 'ไม่สัมพันธ์กัน'], ['q2', 'Test data and why', 'data test และเหตุผลที่เลือก', 'UCI and KEEL; no citation gain', 'UCI และ KEEL; ไม่ได้ทำให้ถูกอ้างอิงเพิ่ม'],
    ['q3', 'Measuring without a classifier', 'วัดตรงโดยไม่ผ่าน classifier', 'None; 6 add a direct check', 'ไม่มี; 6 เรื่องวัดตรงเป็นส่วนเสริม'], ['q4', 'How models are chosen', 'เลือก model จากอะไร', 'Not by sensitivity alone', 'ไม่ได้ใช้ sensitivity อย่างเดียว']];
  return '<section class="panel intro"><h2 class="qi">' + ib('Your four questions: the answers and why', 'คำถาม 4 ข้อของคุณ: คำตอบ และทำไมถึงได้คำตอบนั้น') + '</h2>' +
    tp('Each question starts with a short answer. Below it, every reason says <b>what we looked at</b>, <b>what we found</b> and <b>what it means</b>. Paper lists and quotes are folded away; open them if you want to check.',
      'แต่ละคำถามเริ่มด้วยคำตอบสั้น ๆ ข้างล่างเป็นเหตุผลทีละข้อ แต่ละข้อบอกว่า <b>เราดูอะไร</b> <b>เจออะไร</b> และ<b>จึงสรุปว่าอะไร</b> รายชื่อ paper และข้อความที่ยกมาถูกพับไว้ กดเปิดเมื่ออยากตรวจ') +
    '<nav class="fidx">' + q.map((x, i) => '<a href="#' + x[0] + '"><span class="fno">' + (i + 1) + '</span><span><b>' + ib(x[1], x[2]) + '</b><small>' + ib(x[3], x[4]) + '</small></span></a>').join('') + '</nav>' +
    '<p class="src">' + ib('Corpus: 76 papers, of which 71 run experiments. Every count comes from the coded data behind Section 7; every quote carries its page.', 'คลังบทความ 76 เรื่อง มีการทดลอง 71 เรื่อง ตัวเลขทุกตัวมาจากข้อมูลที่บันทึกไว้สำหรับหัวข้อที่ 7 และข้อความที่ยกมาทุกข้อมีเลขหน้า') + '</p></section>' +
    q1() + q2() + q3() + q4();
}

function render() {
  document.body.classList.remove('lang-both', 'lang-en', 'lang-th'); document.body.classList.add('lang-' + lang);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.getElementById('app').innerHTML = findings() + changes() + ledger() + leaders() + families() + foot();
}
document.addEventListener('click', e => {
  const l = e.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; save(); render(); return; }
  const t = e.target.closest('[data-topic]'); if (t) { topic = t.dataset.topic; save(); render(); document.getElementById('tp-' + topic).focus(); return; }
  const r = e.target.closest('[data-row]'); if (r) { const id = r.dataset.row; open[id] = !open[id]; render(); const b = document.getElementById('row-' + id); if (b) b.focus(); }
});
render();
})();

</script>
