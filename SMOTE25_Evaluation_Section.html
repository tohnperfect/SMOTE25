<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a manuscript sheet on a cool desk. Outline rail at left, English text in the reading
   column, figures span the column. Explorer, LaTeX and Notes are
   sibling views under one sticky tab bar. */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#15202b; --ink-2:#465462; --muted:#6c7986;
  --rule:#d9dfe5; --rule-2:#ebeff3;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e7eefa;
  --flag:#9c3f0c; --flag-soft:#fbeee4; --ok:#1d6f3c; --ok-soft:#e4f2e8; --todo:#b3261e; --todo-soft:#fbe8e7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --o0:#a3abb4; --o1:#5598e7; --o2:#1c5cab; --o3:#0d366b;
  --grid:#e5e9ee; --axis:#c3cbd3;
  --f-serif:"STIX Two Text",Georgia,"Times New Roman",serif;
  --f-thai:"STIX Two Text",Georgia,serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 8px 24px rgba(21,32,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1317; --paper:#161b20; --ink:#e7ecf0; --ink-2:#b4bfc9; --muted:#8b97a3;
    --rule:#2a323a; --rule-2:#20272e;
    --accent:#6ea6f2; --accent-ink:#0b1420; --accent-soft:#1a2a40;
    --flag:#f0a06a; --flag-soft:#3a2416; --ok:#6cc58c; --ok-soft:#173022; --todo:#f28b82; --todo-soft:#3d1c1a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --o0:#5a6573; --o1:#3987e5; --o2:#86b6ef; --o3:#cde2fb;
    --grid:#232b33; --axis:#3a444e; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1317; --paper:#161b20; --ink:#e7ecf0; --ink-2:#b4bfc9; --muted:#8b97a3;
  --rule:#2a323a; --rule-2:#20272e;
  --accent:#6ea6f2; --accent-ink:#0b1420; --accent-soft:#1a2a40;
  --flag:#f0a06a; --flag-soft:#3a2416; --ok:#6cc58c; --ok-soft:#173022; --todo:#f28b82; --todo-soft:#3d1c1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --o0:#5a6573; --o1:#3987e5; --o2:#86b6ef; --o3:#cde2fb;
  --grid:#232b33; --axis:#3a444e; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto}

/* header */
.masthead{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
.masthead .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.masthead h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.masthead h1 .th{display:block;font-family:var(--f-thai);font-weight:400;font-size:.55em;color:var(--ink-2);margin-top:4px}
.meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);margin-inline:-16px;padding-inline:16px}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500}
.tab small{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1.2}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tabs{min-width:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg-label{font-size:12px;color:var(--muted);margin-right:6px}

/* draft */
.draft{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;padding-top:24px}
.outline{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;font-size:13px}
.outline h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
.outline ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.outline a{display:grid;grid-template-columns:34px 1fr;padding:5px 8px;border-radius:5px;color:var(--ink-2);text-decoration:none}
.outline a:hover{background:var(--paper)}
.outline a .n{color:var(--muted);font-variant-numeric:tabular-nums}
.outline a .t2{grid-column:2;font-size:11.5px;color:var(--muted)}
.outline .legend-note{margin-top:16px;padding:10px;border:1px dashed var(--rule);border-radius:6px;font-size:12px;color:var(--ink-2);line-height:1.45}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding-block:36px 44px;padding-inline:clamp(16px,4vw,56px);box-shadow:var(--shadow);min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:8px}
.sheet-head .latexname{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sheet-head h2{font-family:var(--f-serif);font-size:24px;font-weight:600;margin:0}
.sec{padding-top:26px;scroll-margin-top:80px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 12px}
.sec-h .n{font-family:var(--f-serif);color:var(--muted);font-size:20px;font-variant-numeric:tabular-nums;min-width:1.4em}
.sec-h .en{font-family:var(--f-serif);font-size:20px;font-weight:600;margin:0}
.sec-h .th{font-family:var(--f-thai);font-size:16px;color:var(--ink-2);font-weight:400}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 36px;margin-bottom:14px}
.pair .en{font-family:var(--f-serif);font-size:16.5px;line-height:1.62;max-width:68ch}
.pair .th{font-family:var(--f-thai);font-size:15px;line-height:1.9;color:var(--ink);max-width:68ch;border-left:1px solid var(--rule-2);padding-left:18px}
.pair p{margin:0}
.lang-en .pair{grid-template-columns:minmax(0,1fr)} .lang-en .pair .th{display:none}
.lang-th .pair{grid-template-columns:minmax(0,1fr)} .lang-th .pair .en{display:none}
.lang-th .pair .th{border-left:0;padding-left:0}
.lang-en .sec-h .th,.lang-th .sec-h .en{display:none}
.lang-th .sec-h .th{font-size:20px;color:var(--ink);font-weight:600}
.num{font-variant-numeric:tabular-nums;text-decoration:underline dotted var(--muted);text-underline-offset:3px;text-decoration-thickness:1px}
.cites{white-space:normal;color:var(--ink-2)}
.nb{white-space:nowrap}
.cite{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;font-size:.92em;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:2px}
.cite:hover{text-decoration-color:var(--accent)}
.todo{background:var(--todo-soft);color:var(--todo);padding:1px 5px;border-radius:3px;font-family:var(--f-ui);font-size:.8em;font-weight:500}
.xref{color:var(--ink-2);text-decoration:none;border-bottom:1px dotted var(--muted)}
ul.check{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:10px}
ul.check li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 36px;padding:10px 0;border-top:1px solid var(--rule-2)}
ul.check .en{font-family:var(--f-serif);font-size:16px;line-height:1.55}
ul.check .th{font-family:var(--f-thai);font-size:14.5px;line-height:1.85;border-left:1px solid var(--rule-2);padding-left:18px}
ul.check b{font-weight:600}

cted weak learners) are cited from other work [8, 12], not shown.","runtime_reported":false,"code_available":null,"key_result":"AdaBoost boosts any weak learner without knowing its edge, with training error decreasing exponentially in T and generalization controlled by the VC-dimension of the weighted vote; extensions handle multiclass (M1, M2) and regression (R).","eval_strengths":"Rigorous, distribution-free error bounds for binary, multiclass and regression settings.","eval_weaknesses":"No empirical evaluation at all in this paper; error rate is the only notion of performance and class imbalance is not considered.","where":"Sec. 4 (4.1 Fig. 2, 4.2 Theorem 6, 4.3 Theorems 7-8), Sec. 5 (5.1-5.3, Figs. 3-5, Theorems 9-11)","flags":"Text extraction complete; Sections 1-3 (on-line allocation and applications) are theory and were skimmed, Sections 4-5 read in detail.","metric_issue":null,"integrity":[],"era":"≤2009","empirical":false,"no_resampling_baseline":false,"smote_baseline":false,"uses_keel":false,"uses_uci":false,"has_code":false,"metric_families":["Overall"],"outcome":null,"bibkey":"freund1997adaboost"},{"key":"OSS-1997","short":"OSS","method":"One-sided selection (OSS)","title":"Addressing the Curse of Imbalanced Training Sets: One-Sided Selection","authors":"Kubat, Matwin","year":1997,"venue":"ICML","folder":"Binary","drive_id":"1OdoqDWkQSturmgk9F8bx5u_PgHLVdsjz","supp_ids":[],"paper_type":"method","setting":"binary","approach":"undersampling","data_type":"tabular","datasets":{"n_real":7,"n_synthetic":0,"sources":["private (oil-spill radar images, sleep EEG data from TU Graz)","UCI"],"ir_range":"4.0-20 (computed from Table 3 counts)","n_classes_range":"2","notes":"oil1 (24/480), oil2 (21/350), kr (150/750), br (140/700) from authors' projects; UCI glass class 7 (28/182), vowel class 0 (90/900), vehicle class 1 (168/676) binarized one-vs-rest; all attributes continuous; some g7/veh1 examples randomly discarded so every fold has identical class proportions (Ta -1240 images, 2048-D Inception-v3 features). Multiclass IR = largest/smallest class size."},"classifiers":["C4.5","KNN"],"clf_families":["C4.5/C5.0","k-NN"],"n_clf":2,"baselines":["AdaBoost / AdaBoost.M2","AdaMEC-Calib","AdaBoost.NC + random oversampling","LPAdaBoost (primal)","LPUBoost (primal)","Dual-LPAdaBoost","Dual-LPUBoost"],"n_baselines":7,"metrics_n":["G-mean","AUC","MAUC","Runtime"],"metric_details":"G-mean = geometric mean of class-wise accuracies (sqrt(TPR x TNR) for two classes). AUC is computed from crisp predictions as (1 + TPR - FPR)/2 (supplement Sec. 2.1), i.e. a single-threshold value equal to balanced accuracy, not a ROC-curve area. Avg-AUC (Hand and Till) for multiclass: average over one-vs-one class pairs of the same single-point AUC built from TPR_ij and FPR_ij. Reported values are averages at the best parameter setting of each method. Training time compared in Fig. 3; asymptotic complexity in Table 1.","primary_metric":null,"protocol":null,"protocol_class":"Not stated","cv_k":null,"protocol_note":null,"n_runs":null,"resampling_inside_cv":null,"tuning":"All boosters use T=10 rounds. kNN k varied in {3,5,10} (k=10 for hyperspectral), C4.5 parameters per Quinlan. Competitor grids: LPUBoost nu in {0.1,0.2}, D=1/nu, beta in {2,4,8}; Dual-LPUBoost adds D_LB in {25,50,100}; AdaBoost.NC lambda in {2,9}; AdaMEC-Calib C+=IR with two 80% random subsamples for training/calibration. LexiBoost needs no cost tuning. Results reported 'corresponding to the best parameter settings for each contending algorithm'; how the best setting was selected (validation vs test) not stated.","tuning_class":"Selected on evaluation data","tests_n":["Friedman","Wilcoxon signed-rank","Kruskal-Wallis","Mann-Whitney"],"stat_tests":["Friedman","Wilcoxon signed-rank","Kruskal-Wallis","Mann-Whitney"],"test_class":"Omnibus, no corrected post-hoc","stat_test_details":"Real-world KEEL sets: Friedman test across datasets (significant in all cases) followed by pairwise Wilcoxon signed-rank tests against the control (LexiBoost or Dual-LexiBoost), no multiple-comparison correction stated. Hyperspectral and ImageNet (too few datasets): per-dataset Kruskal-Wallis test, then Wilcoxon rank-sum (Mann-Whitney) tests counted as win/tie/loss vs control only on datasets where Kruskal-Wallis is significant. Supplement Table 7: signed-rank test of untuned vs tuned LexiBoost normalisation terms.","reporting":["average rank table","win/tie/loss counts","best-in-bold","per-dataset table","supplementary tables","line plot vs IR/parameter","runtime table","case study / real application","parameter sensitivity"],"reporting_details":"Main paper: Fig. 3 average G-mean (kNN) on synthetic data broken down by IR, size, overlap and outliers, with training times; Table 1 complexity; Table 3 average ranks with Friedman and Wilcoxon signed-rank outcomes for two-class and multiclass KEEL (C4.5 and kNN); Table 4 average ranks and rank-sum W/T/L for hyperspectral and ImageNet; Fig. 4 KSC classification map. Supplement (1OtT48iUkd5Fr_0zq1qHojlRvCKDURId8): illustrative 15-point example; formal metric definitions; per-dataset AUC and G-mean tables with IR and average ranks for two-class KEEL (Tables 1-2, C4.5 and kNN), multiclass KEEL (Tables 3-4), hyperspectral (Table 5) and ImageNet (Table 6) with Kruskal-Wallis/rank-sum markers; Table 7 effect of tuning the class-normalisation terms (untuned better, signed-rank test); Fig. 1 synthetic results with C4.5; Tables 8-9 hyperspectral and ImageNet with C4.5 (all methods G-mean 0 on ImageNet with C4.5). No std or per-run variance reported.","runtime_reported":true,"code_available":"https://github.com/Shounak-D/LexiBoost","key_result":"Dual-LexiBoost attains the best average ranks on synthetic, KEEL two-class and multiclass, hyperspectral and ImageNet tasks, statistically matching cost-tuned Dual-LPUBoost on two-class data and beating all other boosters, without any cost tuning and at lower training time.","eval_strengths":"Wide range of uropean card-holders, ref [2])","Payment Simulation (mobile money simulation)","Record Linkage (NRW cancer registry)","KDDCUP-99","synthetic 4x4 checkerboard (Gaussian)"],"ir_range":"94.48-3448.82 (real); 10 (checkerboard)","n_classes_range":"2","notes":"Large-scale data (284,807 to 6,362,620 samples). KDDCUP-99 binarized into DOS vs. PRB and DOS vs. R2L. Checkerboard: 16 Gaussian components, 1,000 minority vs 10,000 majority, covariance 0.1I (also 0.05I and 0.15I variants for overlap study). Each real dataset paired with specific classifiers (Table III). Extended resampler and ensemble comparisons use only Credit Fraud (plus Payment Simulation in Fig. 7)."},"classifiers":["KNN","Decision Tree","SVM","MLP","AdaBoost","Bagging","Random Forest","GBDT (LightGBM)","Logistic Regression","C4.5"],"clf_families":["k-NN","CART/DT","SVM","MLP/NN","Boosting ensemble","Random Forest","Gradient boosting","Logistic Regression","C4.5/C5.0"],"n_clf":9,"baselines":["No resampling (ORG)","Random undersampling","NCR (Clean)","SMOTE","EasyEnsemble","BalanceCascade","NearMiss","ENN","Tomek links","AllKNN","OSS","Random oversampling","ADASYN","Borderline-SMOTE","SMOTE-ENN","SMOTE-Tomek","RUSBoost","SMOTEBoost","UnderBagging","SMOTEBagging"],"n_baselines":20,"metrics_n":["AUPRC","F1","G-mean","MCC","Recall/TPR","Precision","Runtime"],"metric_details":"Minority class treated as positive. Sec. II defines G-mean non-standardly as sqrt(Recall x Precision) (not sqrt(TPR x TNR)). AUCPRC = area under precision-recall curve (no interpolation details). Decision threshold for F1/G-mean/MCC not stated. Synthetic and Table V/VII experiments report AUCPRC only. Table V also reports number of training samples and resampling time.","primary_metric":"AUPRC / Average precision","protocol":"Real data: single hold-out split 60% train / 20% validation (for early stopping, e.g. GBDT) / 20% test; checkerboard: train, validation and test sets sampled independently from the same distribution","protocol_class":"Single hold-out","cv_k":null,"protocol_note":"60/20/20 train/validation/test split, 10 runs (whether the split is redrawn is not stated)","n_runs":"10 independent runs","resampling_inside_cv":true,"tuning":"No tuning reported. SPE: k=20 bins, absolute-error hardness unless stated; base-classifier settings fixed (Table II: KNN k=5, DT max depth=10, MLP 128 hidden units, SVM C=1000, AdaBoost/Bagging/RF n_estimators=10, GBDT 10 rounds). Ensembles compared at n=10, 20, 50 base models; baselines via imbalanced-learn 0.4.3 defaults (parameters not stated).","tuning_class":"Fixed / default settings","tests_n":[],"stat_tests":[],"test_class":"None","stat_test_details":"No statistical significance test; claims of 'significantly outperforms' rest on mean +/- std over 10 runs.","reporting":["per-dataset table","mean +/- std","runtime table","line plot vs IR/parameter","parameter sensitivity","scatter/2D visualization of synthetic samples","convergence plot"],"reporting_details":"Table II: AUCPRC on checkerboard for 8 classifiers x 6 methods; Fig. 5: test AUCPRC over training iterations at 3 overlap levels; Fig. 6: training-set and predicted-probability visualization on checkerboard; Table IV: AUCPRC, F1, G-mean, MCC on 5 real datasets x 5 classifiers (Clean/SMOTE entries missing where infeasible); Table V: AUCPRC of ORG + 13 resamplers + SPE with 5 classifiers on Credit Fraud, with #samples and resampling time; Table VI: 6 ensembles at n=10/20/50 with 4 metrics and #samples; Fig. 7: performance vs n=1..100 over 10 runs on Credit Fraud and Payment Simulation; Table VII: AUCPRC with 0-75% injected missing values; Fig. 8: sensitivity to k (1-50) and hardness function. Footnote 4 points to GitHub for additional results on more datasets and classifiers.","runtime_reported":true,"code_available":"github.com/ZhiningLiu1998/self-paced-ensemble","key_result":"SPE gives the best AUCPRC/F1/G-mean/MCC on all 5 highly imbalanced large-scale tasks with all classifiers, matching oversampling ensembles with about 1/300 of the training data and far less resampling time.","eval_strengths":"Many base classifiers and 19 competing methods, very high IR large-scale data, runtime and training-set size reported, robustness tests for overlap, missing values and hyperparameters.","eval_weaknesses":"Only 5 real datasets (extended comparisons on one dataset), single hold-out split, no statistical tests, non-standard G-mean definition, threshold not stated, baselines with untuned defaults, distance-based baselines omitted on large datasets.","where":"Sec. II (criteria), Sec. VI A-C, Tables II-VII, Figs. 4-8","flags":"n_baselines counts the no-resampling ORG setting. Table V title says 12 resampling methods but lists 13. Table VI MCC values nearly identical to G-mean for several methods (possible typo in paper). Best-in-bold formatting not visible in extracted text.","metric_issue":"G-mean defined as sqrt(Recall x Precision) instead of sqrt(TPR x TNR)","integrity":[],"era":"2016-2020","empirical":true,"no_resampling_baseline":true,"smote_baseline":true,"uses_keel":false,"uses_uci":false,"has_code":true,"metric_families":["Composite","Other","Ranking","Single-class"],"outcome":"A","bibkey":"liu2020spe"},{"key":"ROS-Buda-2018","short":"Buda et al.","method":"Systematic CNN imbalance study (ROS, RUS, two-phase training, thresholding)","title":"A systematic study of the class imbalance problem in convolutional neural networks","authors":"Buda, Maki, Mazurowski","year":2018,"venue":"Neural Networks","folder":"Both","drive_id":"1bcz47iqd0GS1B8AjmUSpreGFoYCGevWe","supp_ids":["1ZCVsLX8Gy3d5FAoM2_Bnh4ZR32Vsp5ST","1fXdqrvVj5v5EkGXztUJUwfgenRywViux","1v9F1tkAEVVKtjEnT88dd6dGECZQaK68h","1ZN7mX9hlFBdCO58zCbkSsmJiRPEAcvMQ"],"paper_type":"empirical-study","setting":"multiclass","approach":"oversampling","data_type":"image","datasets":{"n_real":3,"n_synthetic":0,"sources":["MNIST","CIFAR-10","ImageNet (ILSVRC-2012)"],"ir_range":"rho 2-5000 (MNIST 10-5000, CIFAR-10 2-50, ImageNet 10-100)","n_classes_range":"10-1000","notes":"Balanced benchmarks artificially imbalanced by subsampling the training set under two parametrized forms: step imbalance (rho = max/min class size, mu = fraction of minority classes 0.1-0.9) and linear imbalance (rho only). MNIST: 4050 step + 450 linear training sets; CIFAR-10: rho in {2,10,20,50}, mu in {0.2,0.5,0.8}, fixed lowest-label classes as minority; ImageNet: 3 step settings (mu=0.1/rho=10, 0.8/50, 0.9/100), 5 subsets. Test sets kept balanced (1000/class MNIST and CIFAR-10, 50/class ImageNet)."},"classifiers":["LeNet-5 (MNIST)","All-CNN (CIFAR-10)","ResNet-10 (ImageNet)"],"clf_families":["CNN"],"n_clf":1,"baselines":["No handling (baseline)","Random oversampling","Random undersampling","Two-phase training with ROS pre-training","Two-phase training with RUS pre-training","Thresholding with prior class probabilities","ROS + thresholding","RUS + thresholding"],"n_baselines":8,"metrics_n":["AUC","ROC curve","Accuracy/Error","Confusion matrix"],"metric_details":"Main metric: multi-class ROC AUC (Provost and Domingos), the average of per-class one-vs-rest AUCs, using scikit-learn (all thresholds from test responses, trapezoid rule); threshold-independent. Overall accuracy reported separately (Sec. 4.4, Fig. 6) mainly to show the effect of thresholding (dividing softmax outputs by estimated class priors). Accuracy explicitly argued to be misleading under imbalance (Sec. 3.4). Confusion matrices only in Appendix C.","primary_metric":"AUC","protocol":"Provided train/test split of each benchmark; training set artificially imbalanced, test set left balanced and unchanged; CIFAR-10 step imbalance additionally rerun 3 times on reshuffled stratified train/test splits (Appendix A)","protocol_class":"Fixed benchmark split","cv_k":null,"protocol_note":null,"n_runs":"MNIST: 50 repetitions per parameter combination (random minority classes); CIFAR-10: 8 runs per case (4 base learning rates x 2 repeats), best kept; ImageNet: 1 run, 3 runs for highest imbalance","resampling_inside_cv":true,"tuning":"Architectures and training hyperparameters fixed from literature (SGD with momentum, fixed iterations per dataset so number of weight updates is constant across imbalance levels; no pretraining). CIFAR-10: base learning rate chosen from {0.05, 0.005, 0.0005, 0.00005} and the model with the best TEST-set score over all 8 runs was kept. Two-phase training: same hyperparameters with base LR x 0.1 in phase 2. Sampling always to full balance except Sec. 4.5 (partial ratios on MNIST rho=1000).","tuning_class":"Selected on evaluation data","tests_n":[],"stat_tests":[],"test_class":"None","stat_test_details":"No statistical tests; variability only discussed qualitatively (ImageNet runs differ by more than 4 AUC points, so 1-2 point differences may be noise).","reporting":["line plot vs IR/parameter","per-dataset table","convergence plot","confusion matrix table","supplementary tables"],"reporting_details":"Figs. 3-4: multi-class ROC AUC vs rho and vs number of minority classes (step imbalance) on MNIST and CIFAR-10; Fig. 5: linear imbalance; Table 4: ImageNet AUC per setting and run; Fig. 6: accuracy with and without thresholding; Fig. 7: partial over/undersampling ratios; Fig. 8: train/test accuracy convergence (overfitting check). Supplements (not read, described from titles): Appendix A reshuffled-split reruns for CIFAR-10, Appendix B additional convergence plots, Appendix C and C.2 confusion matrices (C.2 for CIFAR-10). Training cost noted (5 days per ResNet-10 on a GTX 1070) but no runtime comparison.","runtime_reported":false,"code_available":null,"key_result":"Imbalance strongly hurts CNNs (more so for complex tasks); random oversampling to full balance is best in almost all settings and does not overfit, while thresholding on priors is needed to maximize accuracy.","eval_strengths":"Controlled, parametrized imbalance (step vs linear, rho and mu) with thousands of trained networks on MNIST, threshold-free multi-class AUC on a balanced fixed test set, and explicit separation of data-size and imbalance effects.","eval_weaknesses":"Only random resampling (no SMOTE-type or loss-based methods), CIFAR-10 model selection on the test set (optimistic bias), very few ImageNet runs, no statistical tests, single architecture per dataset.","where":"Sec. 3 (setup, 3.4 metrics), Sec. 4, Figs. 3-8, Table 4, Appendices A-C","flags":"Supplements not read (large figure dumps per instructions). Study name used as method; approach set to oversampling since ROS is the recommended method.","metric_issue":null,"integrity":[],"era":"2016-2020","empirical":true,"no_resampling_baseline":true,"smote_baseline":false,"uses_keel":false,"uses_uci":false,"has_code":false,"metric_families":["Other","Overall","Ranking"],"outcome":"D","bibkey":"buda2018systematic"},{"key":"CTGAN-2019","short":"CTGAN","method":"CTGAN (and TVAE)","title":"Modeling Tabular Data using Conditional GAN","authors":"Xu, Skoularidou, Cuesta-Infante, Veeramachaneni","year":2019,"venue":"NeurIPS","folder":"Both","drive_id":"12J5xurnC4wZRavsb4XXYUj9ocXsOk4O0","supp_ids":["1fbdBhn-6IR96LnKQxzPm5_LqxIEGo89Y"],"paper_type":"method","setting":"both","approach":"generative","data_type":"tabular","datasets":{"n_real":8,"n_synthetic":7,"sources":["UCI","Kaggle","MNIST","bnlearn Bayesian network repository (simulated oracles)"],"ir_range":null,"n_classes_range":"binary and multiclass labels (class counts not stated); 1 regression task","notes":"Real: adult, census, covertype, credit (Kaggle credit card fraud), intrusion (KDD Cup 99), news (regression), MNIST12 and MNIST28 (binarized MNIST as 144/784 binary columns). Simulated oracles: Gaussian mixtures grid, gridr, ring and Bayesian networks asia, alarm, child, insurance (10k train/10k test each). Imbalance addressed is in categorical columns (636/1048 have a category above 90%), not the label; label IR not reported. Supp. Table 1 gives train/test sizes and column types."},"classifiers":["Decision Tree","Linear SVM","MLP","AdaBoost","Logistic Regression","Linear Regression (regression task)"],"clf_families":["CART/DT","SVM","MLP/NN","Boosting ensemble","Logistic Regression"],"n_clf":5,"baselines":["CLBN (Chow-Liu Bayesian network)","PrivBN (PrivBayes)","MedGAN","VeeGAN","TableGAN","Identity (real training data, reference)"],"n_baselines":6,"metrics_n":["Fidelity/likelihood","F1","Macro-F1","Accuracy/Error","Other"],"metric_details":"Simulated data: likelihood fitness Lsyn (likelihood of synthetic rows under the true oracle) and Ltest (likelihood of real test rows under an oracle refit on synthetic data, detects mode collapse). Real data: machine learning efficacy, i.e., train prediction models on synthetic data and test on the real test set (train-synthetic-test-real); F1 for binary tasks (adult, census, credit), macro-F1 for covertype and intrusion, accuracy for MNIST12/28, R2 for news; score averaged over several prediction models per dataset. Threshold and positive class not stated. Supp. Table 2 also lists accuracy, F1, macro-F1, micro-F1 of models trained on real data.","primary_metric":"F1 (machine learning efficacy on real data)","protocol":"Fixed train/test split per real dataset (e.g., adult 23k/10k, credit 264k/20k; Supp. Table 1); simulated train and test sets sampled independently from the oracle (10k/10k); generators fit on train only, evaluators trained on synthetic data and tested on real test data","protocol_class":"Fixed benchmark split","cv_k":null,"protocol_note":null,"n_runs":null,"resampling_inside_cv":true,"tuning":"All generators trained with batch size 500 for 300 epochs. CTGAN: WGAN-GP + PacGAN (pac 10), Adam lr 2e-4; TVAE: Adam lr 1e-3. Evaluation models chosen per dataset to give reasonable performance on real data with fixed settings (AdaBoost 50 estimators, DT depth 20/30, MLP 50/100 units; Supp. Table 2). Baseline generator hyperparameters not stated in the paper (deferred to the SDGym benchmark).","tuning_class":"Unclear","tests_n":[],"stat_tests":[],"test_class":"None","stat_test_details":"No statistical tests; no variance or repeated runs reported.","reporting":["win/tie/loss counts","average rank table","per-dataset table","ablation study","supplementary tables"],"reporting_details":"Table 1: number of real datasets (of 8) on which each GAN beats CLBN and PrivBN (CTGAN 7 and 8); Table 2: averages per experiment group (GM sim., BN sim., real clf F1, real reg R2); Table 3: ablation (GMM5/GMM10/MinMax normalization, without training-by-sampling, without conditional vector, GAN loss variants) as relative change on real classification sets. Supplement: dataset statistics and URLs (Table 1), evaluator models and their real-data accuracy/F1/macro-F1/micro-F1/R2 (Table 2), full per-dataset Lsyn/Ltest and F1/macro-F1/accuracy/R2 results with an aggregated rank per method in brackets (Table 3, method labels contain typos such as TVAE(3) and TGAN), and CTGAN training pseudo-code (Algorithm 1).","runtime_reported":false,"code_available":"https://github.com/DAI-Lab/CTGAN (benchmark: https://github.com/DAI-Lab/SDGym)","key_result":"CTGAN beats both Bayesian network baselines on most real datasets in machine learning efficacy (7/8 vs CLBN, 8/8 vs PrivBN) while prior GANs do not, and its conditional generator with training-by-sampling is critical on imbalanced data (credit F1 drops to 0 without it).","eval_strengths":"Open benchmark mixing simulated oracles (allowing likelihood-based fidelity) with real datasets, multiple evaluators averaged, Identity upper bound and a component ablation.","eval_weaknesses":"Not evaluated as a minority oversampler for imbalanced classification (synthetic data replaces rather than augments training data), single split with no repeats, variance or statistical tests, label imbalance not quantified, F1 positive class and threshold unspecified.","where":"Sec. 5 (5.1 datasets, 5.2 metrics, 5.3 results, 5.4 ablation), Fig. 3, Tables 1-3; Supplement Tables 1-3","f h both training and test ACSA/GM (overfitting analysis); Table 4: SUN397; Table 5 and Fig. 5: FID and sample images for GAMO2pix vs cDCGAN. Supplement: proof of Theorem 1, max training steps, augmentation parameters, grid-search spaces and final architectures for GAMO, cGAN/cDCGAN, CN and GAMO2pix, plus Table 8 with mean ACSA/GM of Baseline CN, SMOTE+CN, cGAN+CN, GAMO without D and GAMO on 5 tabular datasets under 10-fold stratified CV (best boldfaced; GAMO average 0.67/0.62 vs SMOTE+CN 0.66/0.57), and Keras code listings for MNIST and Fashion-MNIST.","runtime_reported":false,"code_available":"https://github.com/SankhaSubhra/GAMO","key_result":"GAMO achieves the highest ACSA and GM on all image benchmarks (e.g., CIFAR-10 ACSA 0.49 vs 0.45 baseline) and generalises better from train to test than SMOTE or random oversampling, with GAMO2pix giving lower FID than cDCGAN.","eval_strengths":"Class-balanced multiclass metrics (ACSA, GM), 10 repetitions with std, several image domains with controlled IR, component ablation, train vs test gap analysis, and tuned baselines including SMOTE, ROS, augmentation, DOS and cGAN.","eval_weaknesses":"Very small test sets (100 or 20 per class), grid-search criterion unclear (possible test-set selection), no statistical tests despite small margins, single classifier family, no runtime comparison.","where":"Sec. 4 (4.1-4.4), Sec. 5, Tables 1-5, Figs. 1, 4, 5; Supplement Secs. 2 and 4, Tables 1-8","flags":"n_baselines includes 3 ablation variants. SMOTE k grid garbled in supplement text ('13, 5, 7l'). For Fashion-MNIST SMOTE is applied in the feature space of the baseline CN.","metric_issue":null,"integrity":[],"era":"2016-2020","empirical":true,"no_resampling_baseline":true,"smote_baseline":true,"uses_keel":true,"uses_uci":true,"has_code":true,"metric_families":["Composite","Multi-class avg","Other"],"outcome":"A","bibkey":"mullick2019gamo"},{"key":"HDE-2021","short":"HDE","method":"HD-Ensemble (Hybrid Data-level Ensemble)","title":"A hybrid data-level ensemble to enable learning from highly imbalanced dataset","authors":"Chen, Duan, Kang, Qiu","year":2021,"venue":"Information Sciences","folder":"Both","drive_id":"158sVhWL_cG7GjnGlXyvV1JBebIYn7lu9","supp_ids":[],"paper_type":"method","setting":"binary","approach":"ensemble","data_type":"tabular","datasets":{"n_real":42,"n_synthetic":0,"sources":["KEEL","LibSVM"],"ir_range":"9.08-970.6","n_classes_range":"2","notes":"28 KEEL datasets (KEEL max IR about 100) plus 14 LibSVM datasets made highly imbalanced by randomly removing minority instances (all IR > 9, 4 with IR > 400); a pre-experiment confirmed class-wise accuracy differences on the 14. 129 to 20,034 instances, 3 to 5,000 features (Table 1). Datasets uploaded to GitHub. 13 datasets with IR > 50 analysed separately. Group-2 comparison tables (7-9) include a few KEEL sets not listed in Table 1 (e.g., Glass6, Glass4, Yeast2vs8). Experiment 2 drops cod, gisette and skinnonskin for cost."},"classifiers":["C4.5"],"clf_families":["C4.5/C5.0"],"n_clf":1,"baselines":["SMOTEBoost","EUSBoost","RUSBoost","SMOTEBagging","UnderBagging","EasyEnsemble","IIVotes","CBIS","SNGEIP","sNED"],"n_baselines":10,"metrics_n":["AUC","G-mean"],"metric_details":"AUC and G-mean chosen as standard for imbalance; accuracy explicitly rejected. How AUC is obtained from C4.5 ensemble outputs and the G-mean definition/threshold are not stated. Group-2 comparison uses AUC only.","primary_metric":"AUC","protocol":"5-fold stratified CV repeated 10 times (5x10 CV); group-2 baselines (CBIS, SNGEIP, sNED) compared using results copied from their original papers","protocol_class":"Repeated k-fold CV","cv_k":5,"protocol_note":null,"n_runs":"10x (5-fold)","resampling_inside_cv":true,"tuning":"All ensembles use 40 C4.5 base classifiers. Group-1 baselines run from KEEL implementations (their parameter values not stated). HD-Ensemble defaults k=5, lambda=0.85, q=30, justified by Experiment 2 sensitivity runs on the same benchmark datasets (la ult parameters chosen on the same benchmark datasets, group-2 comparison uses numbers copied from other papers (possibly different folds and protocols), 14 datasets artificially imbalanced by random minority removal, no runtime despite costly sequential training.","where":"Sec. 4 (4.1 setup, 4.2 Experiment 1, 4.3 Experiment 2), Tables 1-10, Figs. 5-10","flags":"resampling_inside_cv set true because resampling is internal to ensemble training on training folds (not stated explicitly). Table 3 average/Best-Worst row not legible in extracted text (abstracted from Sec. 4.2.1 prose).","metric_issue":null,"integrity":["baseline numbers copied from original papers (group 2)"],"era":"2021-2026","empirical":true,"no_resampling_baseline":false,"smote_baseline":false,"uses_keel":true,"uses_uci":false,"has_code":true,"metric_families":["Composite","Ranking"],"outcome":"A","bibkey":"chen2021hde"},{"key":"KNNOR-2022","short":"KNNOR","method":"KNNOR (K-Nearest Neighbor OveRsampling)","title":"KNNOR: An oversampling technique for imbalanced datasets","authors":"Islam, Belhaouari, Rehman, Bensmail","year":2022,"venue":"Applied Soft Computing","folder":"Both","drive_id":"1OdXr9aiyUPN_oW3P2WgVhUX6KEOID-FB","supp_ids":[],"paper_type":"method","setting":"binary","approach":"oversampling","data_type":"tabular","datasets":{"n_real":19,"n_synthetic":0,"sources":["KEEL","UCI (origin of KEEL binarized sets)","CM1 (from ref [42])","UTKFace and CIFAR-10 (qualitative image demo only)"],"ir_range":"1.82-44.0","n_classes_range":"2","notes":"19 small datasets randomly drawn from 62 KEEL-style sets with fewer than 1000 instances (Table 2: 177 to 900 instances); multiclass UCI sets binarized by grouping classes. Image experiments (UTKFace male vs female, CIFAR-10 airplane vs rest) only show generated images, no metrics. A simulated two-cluster set (Fig. 14) and IRIS/Haberman/thyroid plots are illustrations only."},"classifiers":["SVM","kNN","Decision Tree","MLP"],"clf_families":["SVM","k-NN","CART/DT","MLP/NN"],"n_clf":4,"baselines":["polynom-fit-SMOTE","ProWSyn","SMOTE-IPF","Lee","SMOBD","G-SMOTE","CCR","LVQ-SMOTE","Assembled-SMOTE","SMOTE-TomekLinks","SMOTE","No oversampling"],"n_baselines":12,"metrics_n":["AUC","F1","G-mean","Other"],"metric_details":"G-score = sqrt(TPR x TNR); F1 on the minority (positive) class; AUC as area under ROC; P20 = share of true positives among the top 20% of test points ranked by positive-class probability (20% used instead of 20 points because some sets have fewer than 20 positives). Threshold for F1/G not stated. Metrics follow Kovacs' smote-variants benchmark.","primary_metric":null,"protocol":"Repeated stratified 5-fold CV with 3 repeats, identical folds for all oversamplers (following Kovacs' smote-variants evaluation)","protocol_class":"Repeated k-fold CV","cv_k":5,"protocol_note":null,"n_runs":"3x (5-fold)","resampling_inside_cv":null,"tuning":"Up to 35 randomly chosen parameter combinations per oversampler and 6 per classifier (SVM C in {1,10} with L1/L2 and hinge/squared hinge; kNN k in {3,5,7}, uniform/distance; DT gini/entropy, max depth 3/5/unbounded; MLP 1 hidden layer, ReLU/logistic, 10/50/100% of features as units); for each dataset, oversampler and classifier the top result over these combinations is kept (3996 results, over 2 million jobs). No separate validation split mentioned.","tuning_class":"Selected on evaluation data","tests_n":[],"stat_tests":[],"test_class":"None","stat_test_details":"No statistical tests; comparison based on mean scores over datasets and average ranks.","reporting":["average rank table","rank frequency plot","scatter/2D visualization of synthetic samples","supplementary tables"],"reporting_details":"Table 5: top 9 oversamplers per metric (AUC, F1, G, P20) and classifier by mean score over 19 datasets, with SMOTE and no-oversampling baselines; Table 6: overall ranking by averaging metrics over classifiers and taking the mean of per-metric ranks (KNNOR rank 1 on all four); Fig. 22: frequency of each rank per oversampler; Figs. 19-21: synthetic points from KNNOR and other oversamplers on Haberman/thyroid with varying k and distance threshold; Figs. 23-24: generated face and airplane images. Per-dataset results said to be in additional documents (not in this batch).","runtime_reported":false,"code_available":"https://github.com/ashhadulislam/smote_variants (comparison code); https://pypi.org/project/augmentdata/ (KNNOR library)","key_result":"Averaged over 19 KEEL datasets and four classifiers, KNNOR obtains the best mean rank on AUC, F1, G-mean and P20 against Kovacs' top-10 oversamplers, SMOTE and no oversampling, and ranks first more often than any competitor.","eval_strengths":"Strong, well-chosen baseline set (top 10 from an 85-method benchmark) evaluated in a common framework with four classifiers, four imbalance-aware metrics and identical repeated stratified folds.","eval_weaknesses":"Best-of-grid results selected on the CV test folds (optimistic), only 19 small low-to-moderate IR datasets, no statistical tests, per-dataset results not in the paper, image experiment purely qualitative, no runtime despite a large parameter search.","where":"Sec. 4 (4.1-4.4), Sec. 5, Tables 2-6, Figs. 19-24","flags":"Table 6 column labels look swapped (values under 'G' match F1 scale, under 'F1' match P20, under 'P20' match G) and row order is not sorted by average rank (CCR 7.5 listed 2nd). Abstract speaks of 'accuracy of classifiers' but the reported metrics are AUC, F1, G and P20. resampling_inside_cv not stated (framework from Kovacs likely oversamples training folds only).","metric_issue":null,"integrity":["Table 6 column labels appear swapped"],"era":"2021-2026","empirical":true,"no_resampling_baseline":true,"smote_baseline":true,"uses_keel":true,"uses_uci":true,"has_code":true,"metric_families":["Composite","Other","Ranking"],"outcome":"A","bibkey":"islam2022knnor"},{"key":"FW-SMOTE-2022","short":"FW-SMOTE","method":"FW-SMOTE","title":"FW-SMOTE: A feature-weighted oversampling approach for imbalanced classification","authors":"Maldonado, Vairetti, Fernandez, Herrera","year":2022,"venue":"Pattern Recognition","folder":"Both","drive_id":"1h1nQZUohr_gcy-JCNHVK6GOe6hUPtWlw","supp_ids":["124itYR-fOAgolcNnK7EuD7TYlZ0KPjII"],"paper_type":"method","setting":"binary","approach":"oversampling","data_type":"tabular","datasets":{"n_real":42,"n_synthetic":0,"sources":["UCI","KEEL","microarray datasets from Maldonado et al. [6]"],"ir_range":"4.85-32.78","n_classes_range":"2","notes":"30 low-dimensional sets (6-19 attributes, 92-4177 samples; mostly KEEL binarized versions such as ecoli-0-1 vs 5, yeast4, glass4) and 12 high-dimensional microarray sets (2308-17,404 attributes, 50-203 samples). Table 1 lists IR, #Att, #Samples, %class(min,maj)."},"classifiers":["k-NN (k=5)","Linear SVM (C=1)","Logistic Regression"],"clf_families":["k-NN","SVM","Logistic Regression"],"n_clf":3,"baselines":["SMOTE","Borderline-SMOTE","Safe-Level SMOTE","ADASYN","Adaptive Neighbor SMOTE","Density-Based SMOTE","MWMOTE","Relocating Safe-Level SMOTE","RBO","PCA + SMOTE","Feature selection + oversampling combos in Sec. 4.4: Fisher/Relief/CFS/BFE-SVM filters with SMOTE, Borderline-SMOTE, Safe-Level SMOTE"],"n_baselines":10,"metrics_n":["AUC","G-mean"],"metric_details":"AUC used as validation and main performance metric (computation details not given). G-mean = geometric mean of sensitivity and specificity from the binary confusion matrix, reported 'for completeness'. Both reported x100 as mean +/- std over datasets; per-dataset values in supplement.","primary_metric":"AUC","protocol":"10-fold cross-validation","protocol_class":"Single k-fold CV","cv_k":10,"protocol_note":null,"n_runs":null,"resampling_inside_cv":true,"tuning":"Classifiers at defaults: k-NN k=5, SVM C=1, LR no parameter. All oversamplers k=5 neighbors; oversampling amount N in {1,3} (100% and 300%), best of the two chosen on average TEST performance for all methods. FW-SMOTE grid search within training set over r in {n/2, 3n/4, n}, p in {1,2,inf}, alpha in {0.4,0.6}, plus 4 feature-ranking methods (Fisher, MI, Eigenvector Centrality, Correlation) and 4 OWA RIM quantifiers. PCA+SMOTE keeps components explaining >=90% variance. Baselines otherwise use default settings. Sec. 4.4 feature-selection runs use n* in {50,100,250,1000} top features.","tuning_class":"Selected on evaluation data","tests_n":["Friedman","Iman-Davenport","Holm"],"stat_tests":["Friedman","Iman-Davenport","Holm"],"test_class":"Corrected multiple comparison","stat_test_details":"Friedman with Iman-Davenport correction on AUC ranks per classifier and per dataset group (F = 13.28/7.99/9.11 low-dim, 6.26/6.75/5.82 high-dim for k-NN/SVM/LR; p < 0.01). Holm post-hoc vs best-ranked method with beta = 5% (threshold beta/(j-1)); rejections marked with asterisk. Holm applied on AUC only; G-mean has W/T/L only.","reporting":["average rank table","mean +/- std","win/tie/loss counts","p-value table","per-dataset table","best-in-bold","supplementary tables","parameter sensitivity"],"reporting_details":"Tables 2-3 (low-dim, high-dim) and Table 5 (feature selection, high-dim): average Friedman rank, mean AUC and G-mean x100 +/- std, W/T/L vs top-ranked method, Holm p-values, per classifier. Table 4: percentage of datasets in which each FW-SMOTE parameter value (ranking method, r, p, quantifier, alpha) gave the best AUC. Supplement (Appendix A, Tables A.1-A.6): per-dataset AUC (A.1-A.3) and G-mean (A.4-A.6) for k-NN, SVM and LR for all 11 methods on all 42 datasets, best in bold, with averages over low-dim (XLDD) and high-dim (XHDD) sets.","runtime_reported":false,"code_available":"http://github.com/cvairetti","key_result":"FW-SMOTE obtains the best average rank and is significantly better (Holm) than all SMOTE variants with k-NN, SVM and LR on low- and high-dimensional data, except SVM on high-dimensional data where most methods tie; with feature selection it also beats two-step filter + oversampling pipelines.","eval_strengths":"42 datasets including 12 high-dimensional microarrays, three classifiers, 10 oversampling competitors, Friedman/Iman-Davenport + Holm with W/T/L, and full per-dataset AUC and G-mean tables in the supplement.","eval_weaknesses":"Oversampling amount is chosen on average test performance and FW-SMOTE gets a large grid search while baselines use defaults (favoring the proposal); single 10-fold run without repeats on tiny microarray sets (50-203 samples); Holm test only on AUC; no runtime measurements despite complexity claims.","where":"Sec. 4 (4.1-4.4), Tables 1-5; Supplementary Appendix A, Tables A.1-A.6","flags":"Stored in 'Both' folder but all experiments are binary. resampling_inside_cv inferred from statement that parameter tuning is done within the training set and 'the test set remains unseen until the final performance assessment'. Text says Table 4 covers 'four classification approaches' but only three classifiers are used. Table 1 lists glass-0-6 vs 5 class percentages reversed (91.7, 8.3).","metric_issue":null,"integrity":[],"era":"2021-2026","empirical":true,"no_resampling_baseline":false,"smote_baseline":true,"uses_keel":true,"uses_uci":true,"has_code":true,"metric_families":["Composite","Ranking"],"outcome":"B","bibkey":"maldonado2022fwsmote"},{"key":"GDO-2022","short":"GDO","method":"GDO","title":"Gaussian Distribution Based Oversampling for Imbalanced Data Classification","authors":"Xie, Qiu, Zhang, Peng, Chen","year":2022,"venue":"IEEE TKDE","folder":"Both","drive_id":"1SArTXqhIfEC2b0elAxJQzFFKHrqpbqNZ","supp_ids":[],"paper_type":"method","setting":"binary","approach":"oversampling","data_type":"tabular","datasets":{"n_real":52,"n_synthetic":1,"sources":["KEEL","UCI","private (Internet video traffic, esophageal cancer clinical records)"],"ir_range":"1.82-128.87","n_classes_range":"2","notes":"40 KEEL sets (IR 1.82-128.87; 12 with IR < 9, 28 with IR >= 9), 10 large UCI sets (>4000 instances, IR 2-113.05; multiclass ones co ualization of synthetic samples","case study / real application"],"reporting_details":"Tables 6-7: per-dataset AUC and G-mean on 40 KEEL sets sorted by IR, best in bold; Tables 8-9: same for 10 large sets. Fig. 7: 'winning times' (count of datasets with best value) per method, also split by low (IR < 9) vs high IR. Table 10: Wilcoxon R+, R-, p-values. Fig. 8: AUC/G-mean vs alpha on 5 datasets. Tables 11-12 runtime and Tables 13-14 memory usage (KEEL and large sets). Figs. 4-5: 2D artificial data and synthetic samples of each oversampler. Figs. 9-10: histograms of AUC/G-mean on video traffic and esophageal cancer applications.","runtime_reported":true,"code_available":null,"key_result":"GDO wins most datasets (14/40 AUC, 16/40 G-mean on KEEL; 7/10 on large sets), especially high-IR sets, is significantly better than all 7 competitors by Wilcoxon on KEEL data, and uses least memory, but runs 10 to 100 times slower than the compared methods on most KEEL sets.","eval_strengths":"Large and diverse benchmark (40 KEEL, 10 large UCI, 2 real applications) with runtime and memory measurements and analysis split by low vs high imbalance.","eval_weaknesses":"Single classifier (SVM); 'AUC' is actually balanced accuracy at one threshold; only pairwise Wilcoxon without multiple-comparison correction and no test on large sets; no repeats or std reported; baselines limited to older SMOTE variants; tuning procedure and alpha used not described in text; no code.","where":"Sec. 3.6 (Figs. 4-5), Sec. 4.1-4.8, Tables 2-14, Figs. 6-10","flags":"Stored in 'Both' folder but experiments are binary (multiclass UCI sets binarized). Tables 5-14 are images and their contents were not in the extracted text; baseline names inferred from text (Sec. 3.6 case study names SMOTE, Borderline1-SMOTE, SMOTE-ENN, SMOTE-TomekLinks, ADASYN; Sec. 4.3-4.4 names SVM-CS and BalanceCascade; Sec. 4.3 says five oversamplers, one cost-sensitive, one ensemble). Resampling-inside-CV not explicitly stated ('for each fo  geometric novelty and majority clearance diagnostics; certified fraction computed at fit time. Results analyzed per classifier, not pooled.","primary_metric":"AUPRC / Average precision","protocol":"Cross-validation with resampling, scaling and imputation fitted on training folds only (number of folds and repeats not stated in the extracted text); preregistered protocol; disjoint tuning suite","protocol_class":"Single k-fold CV","cv_k":"other","protocol_note":"fold count not stated","n_runs":null,"resampling_inside_cv":true,"tuning":"CISO tuned once on the 5 held-out tuning datasets by grid search (k in {5,7}, alpha in {-1,0,0.5,1,2}, q in {1.2,1.5,2.0}, beta in {0.1,0.2,0.4}, eps0=0.1; 90 configs) maximizing mean PR-AUC over tuning sets and 4 classifiers (ties by G-mean, then smaller |alpha|), then frozen. Baselines use imbalanced-learn defaults with k-type parameters matched to CISO's k; no per-dataset tuning for any method. Classifier hyperparameters not stated.","tuning_class":"Nested / held-out tuning","tests_n":["Friedman","Holm","Wilcoxon signed-rank"],"stat_tests":["Friedman","Holm","Wilcoxon signed-rank","Spearman correlation"],"test_class":"Corrected multiple comparison","stat_test_details":"Per classifier and metric: Friedman on mean ranks, then Holm-corrected comparisons of CISO vs every method (control-vs-all); pairwise Wilcoxon signed-rank on per-dataset scores with Holm correction; ablations tested by Wilcoxon with Holm across the ablation family; Spearman correlation for certified fraction vs PR-AUC gain. Ties defined as |delta| < 1e-3 for W/T/L. Four confirmatory questions with preset decision rules; Q1-Q4 all reported as not met.","reporting":["average rank table","win/tie/loss counts","p-value table","box plot","ablation study","parameter sensitivity","line plot vs IR/parameter","runtime plot","sampler reliability (failure rate) analysis"],"reporting_details":"Table 3: mean rank, mean PR-AUC, W/T/L and Holm p per classifier (37 sets); Fig. 2 box p lse,"code_available":null,"key_result":"RESCALE-new beats traditional rescaling significantly on 13 of 20 datasets for both consistent and inconsistent cost matrices (W/T/L 13/7/0 and 13/6/1), and in pure multiclass imbalance improves MAUC over C4.5 on 6 of 10 sets, losing on 2.","eval_strengths":"Separates consistent and inconsistent cost settings, uses both balanced and imbalanced data, repeated 10x10-fold CV with per-dataset mean +/- std and significance-based win/tie/loss.","eval_weaknesses":"Single base learner (C4.5), randomly generated rather than real cost matrices, only one baseline for the imbalance experiment, per-dataset t-tests on overlapping CV folds without multi-dataset tests, and no imbalance-specific metrics beyond MAUC.","where":"Experiments section (unnumbered), Tables 2-6","flags":"Conference version (AAAI 2006) of the same work later extended as the 2010 Computational Intelligence journal paper (Global-CS-2010). Rescaling implemented by weighting training examples, so no resampling leakage arises, but the paper does not state whether class sizes for the 1/n_i weights come from training folds only.","metric_issue":null,"integrity":[],"era":"≤2009","empirical":true,"no_resampling_baseline":true,"smote_baseline":false,"uses_keel":false,"uses_uci":true,"has_code":false,"metric_families":["Other","Ranking"],"outcome":"A","bibkey":"zhou2006globalcs"},{"key":"Global-CS-2010","short":"Global-CS","method":"RESCALE-new (Global-CS)","title":"On Multi-Class Cost-Sensitive Learning","authors":"Zhou, Liu","year":2010,"venue":"Computational Intelligence","folder":"Multiclass","drive_id":"1bReNAIswhhGIh5BdrWZg5GlfndPLLBBf","supp_ids":[],"paper_type":"method","setting":"multiclass","approach":"cost-sensitive","data_type":"tabular","datasets":{"n_real":14,"n_synthetic":6,"sources":["UCI","synthetic Gaussian"],"ir_range":null,"n_classes_range":"3-11","notes":"Same 20 multiclass sets as the 2006 version (Table 2): 10 balanced (incl. 6 synthetic 2D Gaussian sets wi ly match the 2006 version, but some W/T/L counts differ slightly (e.g., NEW vs OLD on consistent matrices 12/8/0 here vs 13/7/0 in 2006). One ICM W/T/L cell in Table 5 was truncated in the text extraction. Over-sampling appears to be duplication-based (stated as duplicating examples); under-sampling scheme not detailed.","metric_issue":null,"integrity":[],"era":"2010-2015","empirical":true,"no_resampling_baseline":true,"smote_baseline":false,"uses_keel":false,"uses_uci":true,"has_code":false,"metric_families":["Other","Ranking"],"outcome":"B","bibkey":"zhou2010globalcs"},{"key":"DSRBF-2011","short":"DSRBF","method":"DSRBF (dynamic SMOTE in memetic RBFNN training); also introduces SSRBF (Static-SMOTE)","title":"A dynamic over-sampling procedure based on sensitivity for multi-class problems","authors":"Fernandez-Navarro, Hervas-Martinez, Gutierrez","year":2011,"venue":"Pattern Recognition","folder":"Multiclass+Both","drive_id":"10NyBqjLq7etYOKtdKCbiB0WpjTXZppW1","supp_ids":[],"paper_type":"method","setting":"both","approach":"oversampling","data_type":"tabular","datasets":{"n_real":13,"n_synthetic":0,"sources":["UCI","private (Staphylococcus aureus microbial growth, Saureus4)"],"ir_range":null,"n_classes_range":"2-10","notes":"12 UCI sets + 1 real predictive-microbiology set (Saureus4, 4 classes); 5 binary and 8 multi-class problems; CYTvsPOX and ME2vsOther derived from Yeast; imbalance reported as minimum prior p* (0.003-0.297) and patterns per class, not IR (Table 3); datasets and partitions published on authors' website"},"classifiers":["RBFNN trained by memetic algorithm (MRBF)","MLP trained with RProp (for CSNN baselines)"],"clf_families":["MLP/NN"],"n_clf":1,"baselines":["MRBF (no resampling)","SSRBF (static SMOTE preprocessing)","OS (cost-proportional oversampling, CSNN)","SmoteOS (SMOTE preprocessing, CSNN)","TMNN (threshold-moving NN)","Hard-ensemble (HE)","Soft-ensemble (SE)"],"n_baselines":7,"metrics_n":["Accuracy/Error","Min-sensitivity","Confusion matrix" r m sensitivity","runtime_reported":false,"code_available":true,"key_result":"With RF, MC-MBRC has the best average rank on all four metrics (e.g., AvAcc rank 1.1, best on 18 of 20 datasets) and is significantly better than most competitors, while remaining stable under increasing overlap and label noise.","eval_strengths":"Four multiclass metrics, 10 resampling competitors, four classifiers, 30x2-fold CV, plus controlled overlap, label-noise and ablation experiments.","eval_weaknesses":"Full per-dataset results only for a 10-tree RF; AvAcc is the TN-inflated one-vs-rest accuracy average; no std reported; Nemenyi used without stated Friedman omnibus; no no-resampling baseline on real data; overlap and ablation studies use only binary synthetic data; fuzzifier m selected on the evaluation datasets; resampling placement relative to CV folds not stated.","where":"Sec. 2.3 (metrics), Sec. 4 (setup, Tables 1-2), Sec. 5.1-5.4 (Tables 3-7, Figs. 4-7), Appendix A.1-A.3 (Tables 8-17)","flags":"Code certified reproducible by Code Ocean (badge, no URL in text) while data availability says on request; appendix Tables 9-13 reuse main-baseline column headers (MDO, CURE_SMOTE, NRAS, kmeans_SMOTE, MC-CCR) although text says they report SMOTE, ROS, BLSMOTE, SMOTE-IPF, BoostOBU, so mapping is ambiguous; datasets used in the noise experiment not listed explicitly","metric_issue":"AvAcc defined as mean one-vs-rest accuracy (inflated by true negatives)","integrity":["Nemenyi used without a stated Friedman omnibus test"],"era":"2021-2026","empirical":true,"no_resampling_baseline":false,"smote_baseline":true,"uses_keel":true,"uses_uci":true,"has_code":true,"metric_families":["Composite","Multi-class avg"],"outcome":"B","bibkey":"ma2024mcmbrc"},{"key":"GMMSampling-2024","short":"GMMSampling","method":"GMMSampling","title":"GMMSampling: a new model-based, data difficulty-driven resampling method for multi-class imbalanced data","authors":"Naglik, Lango","year":2024,"venue":"Machine Learning","folder":"Multiclass","drive_id":"1Ganmekz6p4uVF8Ih34-0hPCvw8aC2WH6","supp_ids":[],"paper_type":"method","setting":"multiclass","approach":"hybrid","data_type":"tabular","datasets":{"n_real":11,"n_synthetic":4,"sources":["UCI","multi-imbalance library (artificial)"],"ir_range":"2-164 (mean 27.6)","n_classes_range":"3-9","notes":"Datasets from SOUP studies (Janicka et al. 2019), covering multi-majority, multi-minority and gradual configurations; minority/majority class assignment taken from SOUP paper based on size and safe-level difficulty; some original classes merged (e.g., Cleveland_2 0+1, Vehicle opel_saab); Art1-4 are 3-class (120/240/840)"},"classifiers":["CART","Naive Bayes","kNN","Random Forest","Gradient Boosting Trees"],"clf_families":["CART/DT","Naive Bayes","k-NN","Random Forest","Gradient boosting"],"n_clf":5,"baselines":["GlobalCS","Static-SMOTE","MDO","SOUP","MC-CCR","ROS (OVA)","RUS (OVA)","k-means SMOTE (OVA)","KDE sampling (OVA)","All-kNN (OVA)"],"n_baselines":10,"metrics_n":["Balanced accuracy","Macro-F1","G-mean","MCC","AUPRC"],"metric_details":"Balanced accuracy = average of class recalls; F-score = macro-averaged binary F-score over classes; G-mean = geometric mean of class recalls; MCC multiclass; AP = macro-averaged binary average precision summarizing PR curves; metric choice justified by lack of consensus (cites Brzezinski et al. 2018, Chicco and Jurman 2020)","primary_metric":"Balanced accuracy","protocol":"Stratified 5-fold CV, averaged over 10 runs","protocol_class":"Repeated k-fold CV","cv_k":5,"protocol_note":null,"n_runs":"10x","resampling_inside_cv":true,"tuning":"Number of GMM components per minority class selected automatically by early stopping on dev-set likelihood (internal train/dev split of minority data); classifier hyperparameters not reported (sklearn implementations); baselines from multi-imbalance library, imbalanced-learn, authors' MC-CCR code and custom KDE, settings not reported","tuning_class":"Nested / held-out tun
