petitors including recent multiclass methods (MC-CCR, MC-RBO, MC-MBRC) plus no-resampling reference, rank-based post-hoc testing and a feature-noise robustness study.","eval_weaknesses":"Contradictory CV description (10-fold vs 5-fold) and post-hoc test naming (Holm vs Shaffer), per-dataset results absent from the paper, TN-inflated AvAcc definition, defaults only with alpha chosen on evaluation datasets, normalization appears applied before splitting, no runtime, noise study limited to SVM and 4 datasets.","where":"Sec. V (A-F, Table 1, Figs. 8-10), Sec. VI (Figs. 11-13, Table 2)","flags":"Table 1 (dataset statistics) and Table 2 values not extractable as text, so IR and class ranges unknown; GitHub link cited for result tables (path /result), code presence in repo not explicitly stated; how binary samplers (SMOTE, ADASYN, etc.) were applied to multiclass not stated","metric_issue":"AvAcc defined as mean one-vs-rest accuracy (inflated by true negatives)","integrity":["leakage: normalization appears applied before splitting","inconsistent fold count and post-hoc test name"],"era":"2021-2026","empirical":true,"no_resampling_baseline":true,"smote_baseline":true,"uses_keel":true,"uses_uci":false,"has_code":true,"metric_families":["Composite","Multi-class avg"],"outcome":"B","bibkey":"tao2025mcnclwo"}]</script>
<script>
/* Draft prose, v2 (structure modelled on the form of the two surveys in SMOTE25/Survey and on recent JAIR surveys;
   no content taken from them). Tokens: {t:name} computed value, [[KEY,KEY]] citation, {ref:id} cross-reference,
   {{todo:text}} item for a co-author to supply. Every number in the prose is a {t:} token. */
const SECTION = {
  en: 'Empirical Comparisons and Benchmarks', th: '', label: 'sec:empirical', num: 7
};
const INTRO = [
  {en:'A method in the SMOTE family is judged through an evaluation design: the data it is tested on, the learners trained on its output, the competitors it is compared with, the measures, the protocol that separates fitting from testing, and the statistics used to compare results. This section analyses those designs across the {t:emp} empirical studies in our corpus. Every study is listed with its coded design in the evaluation map of Appendix B ({ref:tab-map}).',
   th:''},
  {en:'Each study reports that its proposal works, but the evidence is rarely read across studies, and the designs differ enough that their numbers cannot be pooled. The analysis below supports one thesis:',
   th:''},
  {thesis:true,
   en:'Evaluation in this literature has broadened over 25 years, but the steps that most often decide a comparison (how settings are chosen, how measures are defined and how baselines are run) have not become more rigorous.',
   th:''},
  {en:'We organise the evidence around six questions:', th:''},
  {rq:[
   {id:'RQ1', en:'On which data are methods compared?', th:'', ref:'sec-data'},
   {id:'RQ2', en:'Against which learners and competitors?', th:'', ref:'sec-learners'},
   {id:'RQ3', en:'Which measures are reported, and are they defined consistently?', th:'', ref:'sec-measures'},
   {id:'RQ4', en:'How are training and test data separated, and how are settings chosen?', th:'', ref:'sec-protocol'},
   {id:'RQ5', en:'How is a difference shown to be significant, and how are results reported?', th:'', ref:'sec-stats'},
   {id:'RQ6', en:'What do the comparisons conclude, and do the conclusions agree across studies?', th:'', ref:'sec-outcomes'}
  ]},
  {en:'{ref:sec-corpus} describes the corpus and the coding, and {ref:sec-notation} fixes the notation for the measures. {ref:sec-data} to {ref:sec-outcomes} answer the six questions in turn, {ref:sec-threats} states the limits of this analysis, and {ref:sec-standard} turns the findings into a minimum evaluation standard.',
   th:''}
];
const PROSE = [
{ id:'corpus', label:'sec:empirical-corpus',
  en:'Corpus and Coding Scheme', th:'',
  blocks:[
  {en:'The corpus is the SMOTE25 collection selected for this survey ({{todo:point to the selection procedure in Section 3}}): {t:all} papers after duplicate copies were merged. Of these, {t:emp} report an empirical evaluation on imbalanced data; the other {t:nonemp} are two surveys [[PradiptaReview-2021,StopOversampling-2022]] and three foundational works that predate imbalance-aware evaluation [[ENN-1972,TomekLinks-1976,AdaBoost-1997]]. Among the empirical studies, {t:bin} evaluate binary problems, {t:mc} multi-class problems and {t:both} both, and their number has grown with each period ({ref:fig-corpus}). Percentages in this section refer to the {t:emp} empirical studies.',
   th:''},
  {fig:'fig-corpus'},
  {en:'For each study we coded, from the full text and supplementary files, the benchmark data, base learners, competing methods, measures with their exact definitions, the validation protocol, how hyperparameters were chosen, the statistical tests, and the form in which results are reported. A field the paper does not state was coded as not reported and never inferred. Four derived codes involve judgement: the protocol class, the hyperparameter-selection class, the flags for measure-definition problems and the outcome class of {ref:sec-outcomes}. Sixteen of the most consequential codings were re-checked against the PDFs in a second pass, and all sixteen were confirmed.',
   th:''}
  ]},
{ id:'notation', label:'sec:empirical-notation',
  en:'Notation and Measures', th:'',
  blocks:[
  {en:'A measure summarises a confusion matrix, or a ranking of scores, into one number. For a binary problem we treat the minority class as positive and write TP, FN, FP and TN for the cells of the confusion matrix. The single-class rates are',
   th:''},
  {eq:'rates'},
  {en:'where TPR is also called recall or sensitivity and TNR specificity. Measures that combine these rates at one decision threshold are',
   th:''},
  {eq:'fbeta'}, {eq:'gmean'}, {eq:'mcc'},
  {en:'where β weights recall against precision (β = 1 gives F1) and BA is balanced accuracy. The area under the ROC curve does not depend on a threshold. For a scoring function s it is the probability that a random positive example is ranked above a random negative one,',
   th:''},
  {eq:'auc'},
  {en:'where ties count one half. For C classes, let R_i be the recall of class i and m_ij the number of class-i examples predicted as class j. The multi-class measures used in the corpus are',
   th:''},
  {eq:'mg'}, {eq:'mauc'}, {eq:'cba'},
  {en:'where MG is the class-wise geometric mean, AvAcc the average class accuracy, A(i|j) the AUC of separating class i from class j using the scores for class i, and CBA the class balance accuracy {{todo:cite the original sources of MAUC (Hand and Till 2001), CBA (Mosley 2013) and confusion entropy (Wei et al. 2010)}}. {ref:tab-measures} groups the measures into families and lists what each family captures {{todo:cite methodological sources for the advantages and limitations listed in this table}}.',
   th:''},
  {table:'tab-measures'}
  ]},
{ id:'data', label:'sec:empirical-data',
  en:'Benchmark Data (RQ1)', th:'',
  blocks:[
  {en:'Benchmark data are the datasets on which a method is fitted and scored, together with the imbalance they carry. Evaluation relies almost entirely on public tabular benchmarks ({ref:tab-sources}). UCI datasets are used in {t:uci_of} and the KEEL repository in {t:keel_of}; most KEEL imbalanced sets are binarised versions of UCI data {{todo:cite the KEEL data set repository (Alcalá-Fdez et al. 2011) for this origin, or drop the clause}}. {t:syn_of_cap} add synthetic data, mainly to show where a sampler places new points near the class boundary. Only {t:nontab} studies go beyond tabular data, to images, time series, text or mixed data [[ROS-Buda-2018,GAMO-2019,INOS-2013,COG-OS-2007]].',
   th:''},
  {table:'tab-sources'},
  {en:'The number of real datasets per study has a median of {t:ds_med} (interquartile range {t:ds_q1} to {t:ds_q3}; range {t:ds_min} to {t:ds_max}) and has grown steadily, from a median of {t:med_e1} before 2010 to {t:med_e4} since 2021 ({ref:fig-datasets}). Early method papers were often shown on two to four datasets [[SMOTEBoost-2003,Borderline-SMOTE-2005,Safe-Level-SMOTE-2009]], while recent large comparisons use 50 to 90 [[RBBoost-2015,KMeansSMOTE-2018,G-SMOTE-2019]]. {t:ir_of_cap} report the imbalance ratio (IR) of their benchmarks.',
   th:''},
  {fig:'fig-datasets'}
  ]},
{ id:'learners', label:'sec:empirical-learners',
  en:'Base Learners and Competing Methods (RQ2)', th:'',
  blocks:[
  {en:'A base learner is the classifier trained on the resampled data, and a resampler is judged only through it. C4.5/C5.0 trees are the most common learner ({t:c45_ofp}), followed by k-NN ({t:knn_ofp}), SVM ({t:svm_ofp}), CART ({t:cart_ofp}) and multilayer perceptrons ({t:mlp_ofp}) ({ref:fig-learners}). Random forests and gradient boosting appear in {t:ens_pre} studies before 2016 but in {t:ens_e4} since 2021, while the use of C4.5 has declined. The median study uses {t:clf_med} learners, yet {t:clf1_of} rely on a single one. That share has not fallen and stands at {t:single_e4} since 2021. With one learner, the effect of a sampler cannot be separated from its interaction with that learner. A recent pre-registered comparison found that a new oversampler was not significantly better than class weighting, random oversampling or no resampling across four learners that include random forest and gradient boosting [[CISO-2025]].',
   th:''},
  {fig:'fig-learners'},
  {en:'A competing method is any alternative run on the same benchmarks. Studies compare against a median of {t:base_med} competitors. SMOTE itself is a competitor in {t:smote_of}, and an untreated reference without resampling is included in {t:nores_of}. The remaining {t:nonores} studies report only gains of one sampler over another, so a reader cannot tell whether resampling helps at all on those benchmarks. In {t:copied} studies some or all competitor results were copied from earlier publications instead of being re-run on the same folds [[SMOTE-2002,COG-OS-2007,SplitBal-2015,HDE-2021,NROMM-2023]]. In the most extreme case only the proposed method was run, and every competitor score was taken from a published benchmark [[QC-SMOTE-2026]].',
   th:''}
  ]},
{ id:'measures', label:'sec:empirical-measures',
  en:'Performance Measures in Use (RQ3)', th:'',
  blocks:[
  {en:'Overall accuracy or error rate appears in only {t:acc_of}, and never as the only measure. G-mean is the most used measure ({t:gmean_ofp}), followed by AUC ({t:auc_ofp}), recall ({t:recall_ofp}), F1 ({t:f1_ofp}) and precision ({t:prec_ofp}); a typical study reports {t:met_med} measures ({ref:fig-metrics}). Binary and multi-class studies use different vocabularies. Binary studies centre on AUC, G-mean, and minority-class recall and F1. Multi-class studies use MG, MAUC ({t:mauc_ofp}), AvAcc and, in a group of recent papers, CBA and confusion entropy [[MC-RBO-2020,MC-CCR-2020,MC-MBRC-2024]].',
   th:''},
  {fig:'fig-metrics'},
  {en:'Threshold-free measures (ROC-AUC, MAUC or PR-AUC) appear in {t:thrfree_of}. The other {t:thrdep} studies judge samplers only at the default decision threshold of the classifier, which mixes the quality of the synthetic data with the calibration of the classifier. Precision-recall summaries are rare: PR-AUC is reported in {t:auprc} studies and MCC in {t:mcc}, nearly all published since 2018 [[SPE-2020,CISO-2025,GMMSampling-2024]] {{todo:add a methodological source on PR-AUC versus ROC-AUC under imbalance}}.',
   th:''},
  {en:'The same name does not always denote the quantity defined in {ref:sec-notation}. We found definition problems in {t:metissue} studies ({ref:tab-metric}). Two report as AUC the single-threshold value (TPR + TNR)/2, which is BA in Equation {ref:eq-gmean} and not the area of Equation {ref:eq-auc} [[GDO-2022,DLexiBoost-2020]]. Two compute MAUC from hard-label confusion matrices instead of scores [[SHSampler-2022,GDHS-2025]]. Two define AvAcc as the mean one-versus-rest accuracy, which true negatives inflate [[MC-MBRC-2024,MC-NCLWO-2025]]. G-mean is sometimes the geometric mean of recall and precision instead of TPR and TNR [[SPE-2020,CGMOS-2016]], and some studies never state how binary measures are averaged over classes [[SCUT-2015,CBHSID-2022]]. Values that share a name are therefore not comparable across studies.',
   th:''},
  {table:'tab-metric'}
  ]},
{ id:'protocol', label:'sec:empirical-protocol',
  en:'Validation Protocol and Hyperparameter Selection (RQ4)', th:'',
  blocks:[
  {en:'A validation protocol decides which examples are used to fit the resampler and the learner and which are used to score them. Stratified k-fold cross-validation is the norm ({ref:tab-protocols}; {{todo:cite a methodological source for the advantages and limitations of each protocol}}): {t:repcv_of} repeat it and {t:singlecv_of} run it once, with k = 10 ({t:k10} studies) and k = 5 ({t:k5}) as the usual choices. Hold-out designs remain common, and {t:fixed} deep or generative studies use fixed benchmark splits [[ROS-Buda-2018,CTGAN-2019,GAMO-2019]]. One study does not describe its protocol at all [[DLexiBoost-2020]]. Overall, {t:repeated_of} average results over repeated partitions; the rest report one estimate per dataset.',
   th:''},
  {table:'tab-protocols'},
  {en:'{ref:fig-pipeline} places the remaining decisions in one run of an experiment. Resampling and tuning belong inside the training part. Only {t:inside_of} state or describe unambiguously that resampling was confined to training data, and {t:insidenull} studies do not say. For one study the reported numbers of synthetic samples equal the full minority-class size, which implies that the whole dataset was oversampled before 5-fold CV [[AB-SMOTE-2020]]; another appears to normalise features before splitting [[MC-NCLWO-2025]].',
   th:''},
  {fig:'fig-pipeline'},
  {en:'Hyperparameter selection is the weakest step ({ref:fig-tuning}). Only {t:nested_of} tune parameters inside the training data, through nested CV or a disjoint set of tuning datasets [[LS-2008,A-SUWO-2016,MC-RBO-2020,CISO-2025]]. {t:fixedt_of_cap} use fixed or default settings for every method, which is even-handed but can penalise methods with poor defaults. In {t:evalsel_of}, the reported configuration of the proposed method, or the amount of resampling, was chosen by looking at results on the evaluation data, typically by reporting the best point of a grid evaluated on the same folds; the remaining {t:unclear} do not say how settings were chosen. Search budgets are often unequal: G-SMOTE is selected from 294 configurations against 2 for SMOTE [[G-SMOTE-2019]], and k-means SMOTE keeps, for each measure, the best cross-validated score over its grid [[KMeansSMOTE-2018]]. This share rose from {t:evalsel_e1} before 2010 to {t:evalsel_e4} since 2021, over the same period in which statistical testing became common ({ref:sec-stats}).',
   th:''},
  {fig:'fig-tuning'}
  ]},
{ id:'stats', label:'sec:empirical-stats',
  en:'Statistical Testing (RQ5)', th:'',
  blocks:[
  {en:'A significance test asks whether a difference in scores across datasets is larger than chance would produce. {t:anytest_of_cap} use one. The Wilcoxon signed-rank test ({t:wilcoxon} studies) and the Friedman test ({t:friedman}) dominate, with Holm ({t:holm}), Bonferroni–Dunn ({t:bd}), Shaffer ({t:shaffer}) and Nemenyi ({t:nemenyi}) as post-hoc procedures. Grouped by what they control ({ref:fig-tests}): {t:tcorr_of} apply a corrected multiple-comparison procedure, in {t:tcorr_fried} cases Friedman followed by a post-hoc test against the proposed method; {t:tpair_of} use only pairwise tests without correction, although they compare the proposal with a median of {t:pw_base_med} competitors; {t:tomni} stop at an omnibus test; {t:tbayes} use Bayesian signed-rank tests [[SHSampler-2022,MLOS-2025,GDHS-2025]]; and {t:tnone_of} report no test.',
   th:''},
  {fig:'fig-tests'},
  {en:'The share of studies with any test rose from {t:anytest_e1} before 2010 to {t:anytest_e4} since 2021, and the share with corrected or Bayesian procedures from {t:corr_e1} to {t:corr_e4}. Inconsistencies remain, such as a Nemenyi diagram drawn after a non-significant Friedman test [[SOUP-2019]], a Nemenyi test without an omnibus test [[MC-MBRC-2024]], and two different post-hoc procedures named for the same analysis [[MC-NCLWO-2025]]. Tests are also run on the folds used to pick hyperparameters ({ref:sec-protocol}), so a significant result does not remove selection bias.',
   th:''}
  ]},
{ id:'reporting', label:'sec:empirical-reporting',
  en:'Reporting of Results (RQ5)', th:'',
  blocks:[
  {en:'Reporting is the form in which scores reach the reader. Results are mostly given as per-dataset tables ({t:perds_ofp}), usually with the best value in bold, and summarised by average ranks ({t:rank_ofp}) and tables of p-values ({t:pval_ofp}); win/tie/loss counts appear in {t:wtl} studies. Variability is less visible: only {t:std_of} give standard deviations with their means. Visual evidence is common, with 2-D plots of synthetic samples in {t:scatter} studies, parameter-sensitivity curves in {t:sens} and ablation studies in {t:ablation}. ROC curves ({t:rocplot}), box plots ({t:box}) and critical-difference diagrams ({t:cd}) are rare.',
   th:''},
  {en:'Cost and reproducibility receive less attention. Only {t:runtime_of} measure running time, although many proposals add clustering, optimisation or generative training on top of SMOTE. Code is available for {t:code_of}, rising from none before 2010 to {t:code_e3} in 2016 to 2020 and {t:code_e4} since 2021 ({ref:fig-trend}). {t:supp} studies move per-dataset results to supplementary files, and some main texts show only ranks [[MDO-2016,RBO-2019]] or only figures [[GLOS-2023]], which prevents re-analysis. We also found tables that contradict the text of the same paper [[SMOTEBoost-2003,SMOTE-ENN-Tomek-2004,Loyalty-SMOTE-2026]].',
   th:''},
  {fig:'fig-trend'}
  ]},
{ id:'outcomes', label:'sec:empirical-outcomes',
  en:'What the Comparisons Conclude (RQ6)', th:'',
  blocks:[
  {en:'An outcome is what a study concludes about its own proposal. We coded it into four classes ({ref:tab-outcomes}). Of the {t:nmethod} studies that propose a method, {t:outAB} report it as the best overall: {t:outA} with no stated exception and {t:outB} with an exception the authors state themselves, such as a measure, learner, competitor or data condition where the proposal is not better or not significantly better. Only one reports no advantage over simple baselines [[CISO-2025]], and that study is also the only one that pre-registered its protocol.',
   th:''},
  {table:'tab-outcomes'},
  {en:'These wins do not add up to a ranking. A method that leads in one study is placed below the proposal in every later study that includes it: MDO is a competitor in {t:mdo_users} later studies and MC-CCR in {t:mccr_users}, and each of those studies reports its own method ahead on its main summary measure [[GMMSampling-2024,GDHS-2025,MC-MBRC-2024]]. Because each comparison uses its own folds, settings and measure definitions, the corpus cannot say which of these methods is better, only that each is better under the protocol of the paper that proposed it.',
   th:''}
  ]},
{ id:'threats', label:'sec:empirical-threats',
  en:'Threats to Validity', th:'',
  blocks:[
  {en:'Four limits apply to the counts above. First, the corpus is the collection assembled for this survey, not an exhaustive sample, so shares describe these {t:emp} studies and may not hold for the whole literature {{todo:align with the selection procedure in Section 3}}. Second, coding was done by one extraction pass per paper; the four judgement codes were not double-coded, although the sixteen codings that the argument relies on most were re-checked against the PDFs. Third, some tables are images in the PDFs, so a few counts of datasets, classes or imbalance ratios are missing, and missing values were left empty rather than estimated. Fourth, each study is counted once per attribute, so a study that reports one measure in a footnote counts the same as one that builds its argument on it.',
   th:''}
  ]},
{ id:'standard', label:'sec:empirical-standard',
  en:'A Minimum Evaluation Standard', th:'',
  blocks:[
  {en:'The analysis answers its six questions as follows. Methods are compared on more data and with more learners than before (RQ1, RQ2), but a third still use one learner and a quarter omit the untreated baseline. Measures share names without sharing definitions (RQ3). Settings are often chosen on the evaluation data, and this has become more common (RQ4), so the wider use of statistical tests (RQ5) does not make the reported gains safer. Nearly every study concludes that its proposal is best, and those conclusions do not form a consistent ranking (RQ6). {ref:tab-remedies} pairs each observed problem with a remedy. We recommend that every new SMOTE-family method be evaluated to this standard.',
   th:''},
  {table:'tab-remedies'},
  {en:'A shared benchmark that fixes the folds, the tuning budget and the measure definitions, and that is re-run when a new method appears, would let these comparisons accumulate instead of restarting with each paper {{todo:link to the future-work agenda in Section 8}}.',
   th:''}
  ]}
];

/* Equations: TeX shared by the HTML (KaTeX, MathML output) and the LaTeX export. */
const EQS = {
  rates: {n:1, label:'eq:empirical-rates', tex:'\\mathrm{TPR}=\\frac{TP}{TP+FN},\\qquad \\mathrm{TNR}=\\frac{TN}{TN+FP},\\qquad \\mathrm{Prec}=\\frac{TP}{TP+FP}'},
  fbeta: {n:2, label:'eq:empirical-fbeta', tex:'F_\\beta=\\frac{(1+\\beta^2)\\,\\mathrm{Prec}\\cdot\\mathrm{TPR}}{\\beta^2\\,\\mathrm{Prec}+\\mathrm{TPR}}'},
  gmean: {n:3, label:'eq:empirical-gmean', tex:'\\text{G-mean}=\\sqrt{\\mathrm{TPR}\\cdot\\mathrm{TNR}},\\qquad \\mathrm{BA}=\\frac{\\mathrm{TPR}+\\mathrm{TNR}}{2}'},
  mcc: {n:4, label:'eq:empirical-mcc', tex:'\\mathrm{MCC}=\\frac{TP\\cdot TN-FP\\cdot FN}{\\sqrt{(TP+FP)(TP+FN)(TN+FP)(TN+FN)}}'},
  auc: {n:5, label:'eq:empirical-auc', tex:'\\mathrm{AUC}=\\Pr\\bigl(s(x^{+})>s(x^{-})\\bigr)'},
  mg: {n:6, label:'eq:empirical-mg', tex:'\\mathrm{MG}=\\Bigl(\\prod_{i=1}^{C}R_i\\Bigr)^{1/C},\\qquad \\mathrm{AvAcc}=\\frac{1}{C}\\sum_{i=1}^{C}R_i'},
  mauc: {n:7, label:'eq:empirical-mauc', tex:'\\mathrm{MAUC}=\\frac{2}{C(C-1)}\\sum_{i<j}\\frac{A(i\\mid j)+A(j\\mid i)}{2}'},
  cba: {n:8, label:'eq:empirical-cba', tex:'\\mathrm{CBA}=\\frac{1}{C}\\sum_{i=1}^{C}\\frac{m_{ii}}{\\max\\bigl(\\sum_{j}m_{ij},\\ \\sum_{j}m_{ji}\\bigr)}'}
};

(function () {
'use strict';
function boot() {

  catch (e) {
    var er = document.getElementById('err');

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

function main() {
const ALL = JSON.parse(document.getElementById('data').textContent);
const BY = Object.fromEntries(ALL.map(p => [p.key, p]));
const EMP = ALL.filter(p => p.empirical);
const ERAS = ['≤2009', '2010-2015', '2016-2020', '2021-2026'];
const ERA_EN = {'≤2009': 'before 2010', '2010-2015': '2010–2015', '2016-2020': '2016–2020', '2021-2026': '2021–2026'};
const SETTINGS = [{k: 'binary', en: 'Binary', th: '', c: '--s1'}, {k: 'multiclass', en: 'Multi-class', th: '', c: '--s2'}, {k: 'both', en: 'Both', th: '', c: '--s3'}];
const TEST_CATS = [
  {k: 'None', en: 'No test', c: '--o0'},
  {k: 'Pairwise only (uncorrected)', en: 'Pairwise, uncorrected', c: '--o1'},
  {k: 'Omnibus, no corrected post-hoc', en: 'Omnibus only', c: '--o2'},
  {k: 'Corrected multiple comparison', en: 'Corrected multiple comparison', c: '--o3'},
  {k: 'Bayesian', en: 'Bayesian', c: '--s3'}];
const TUNE_CATS = [
  {k: 'Nested / held-out tuning', en: 'Nested or held-out tuning', c: '--o3'},
  {k: 'Fixed / default settings', en: 'Fixed or default settings', c: '--o1'},
  {k: 'Unclear', en: 'Not stated', c: '--o0'},
  {k: 'Selected on evaluation data', en: 'Selected on evaluation data', c: '--s2'}];
const PROTO_ORDER = ['Repeated k-fold CV', 'Single k-fold CV', '5x2 CV', 'Repeated hold-out', 'Single hold-out', 'Fixed benchmark split', 'Not stated'];
const PERIODS = [[1997, 2001], [2002, 2005], [2006, 2009], [2010, 2013], [2014, 2017], [2018, 2021], [2022, 2026]];
const THRFREE = ['AUC', 'ROC curve', 'AUPRC', 'MAUC', 'AUCm'];
const has = (p, m) => p.metrics_n.indexOf(m) >= 0;
const cnt = (S, f) => S.filter(f).length;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pct = (c, n) => n ? Math.round(100 * c / n) : 0;
function median(a) { a = a.filter(x => x != null).sort((x, y) => x - y); if (!a.length) return null; const m = a.length / 2; return a.length % 2 ? a[Math.floor(m)] : (a[m - 1] + a[m]) / 2; }
function quantExcl(a, q) { a = a.filter(x => x != null).sort((x, y) => x - y); const n = a.length, m = (n + 1) * q, j = Math.floor(m), f = m - j; if (j < 1) return a[0]; if (j >= n) return a[n - 1]; return a[j - 1] + f * (a[j] - a[j - 1]); }
const fmtNum = x => (x == null ? 'n/a' : (Math.round(x * 10) / 10).toString());
const OUT_LABEL = {A: 'Best, no stated exception', B: 'Best, with stated exceptions', C: 'No advantage over simple baselines', D: 'Comparative study'};

const state = {view: 'draft', lang: 'en', f: {q: '', setting: 'all', era: 'all', approach: 'all', test: 'all', tune: 'all', proto: 'all', outcome: 'all', issues: false, all: false}, sort: {k: 'year', dir: 1}, latexScope: 'all'};
try { const s = JSON.parse(localStorage.getItem('smote25-sec7-en') || '{}'); if (s.view) state.view = s.view; } catch (e) {}
const hv = location.hash.replace('#', ''); if (['draft', 'explorer', 'latex', 'notes'].indexOf(hv) >= 0) state.view = hv;
function save() { try { localStorage.setItem('smote25-sec7-en', JSON.stringify({lang: state.lang, view: state.view})); } catch (e) {} }

/* ---------------- statistics: the single source of every number ---------------- */
function usersOf(rx, selfKey) { return EMP.filter(p => p.key !== selfKey && (p.baselines || []).some(b => rx.test(b))).length; }
function computeStats(S) {
  const N = S.length, era = e => S.filter(p => p.era === e);
  const E1 = era(ERAS[0]), E3 = era(ERAS[2]), E4 = era(ERAS[3]);
  const nr = S.map(p => p.datasets.n_real);
  const repeated = p => ['Repeated k-fold CV', '5x2 CV', 'Repeated hold-out'].indexOf(p.protocol_class) >= 0;
  const corr = p => p.test_class === 'Corrected multiple comparison' || p.test_class === 'Bayesian';
  const ens = p => p.clf_families.indexOf('Random Forest') >= 0 || p.clf_families.indexOf('Gradient boosting') >= 0;

  '<div class="panel"><h3>Where each part comes from</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Source</th><th>Used for</th><th>Status</th></tr></thead><tbody>' +
  '<tr><td><b>Evaluation designs coded from ' + EMP.length + ' empirical studies</b> (Binary, Multiclass and Both folders, duplicates merged)</td><td>Every number in 7.1 and 7.3 to 7.9; Tables 2, 3, 5 and 6 (counts); Figures 1 to 8; Appendix B</td><td><span class="pill ok">from the corpus</span></td></tr>' +
  '<tr><td><b>Three foundational works</b> (Wilson ENN, Tomek links, AdaBoost)</td><td>Counted in the corpus (7.1); excluded from all statistics</td><td><span class="pill neu">counted only</span></td></tr>' +
  '<tr><td><b>Two reviews in the Survey folder</b></td><td>Form of the section only; counted in 7.1; excluded from all statistics</td><td><span class="pill neu">form only</span></td></tr>' +
  '<tr><td><b>General methodology</b></td><td>Equations in 7.2; advantages and limitations in Tables 1 and 4; the KEEL origin clause in 7.3; PR-AUC remark in 7.5</td><td><span class="pill bad">needs citations (TODO)</span></td></tr>' +
  '<tr><td><b>Our synthesis</b></td><td>Thesis, the recap and standard in 7.11, recommended practice in Table 6</td><td><span class="pill neu">authors\' argument</span></td></tr>' +
  '</tbody></table></div></div>' +
  '<div class="panel"><h3>What was coded</h3><p>Each PDF was read in full by an extraction pass that recorded datasets (count, source, IR, classes), base learners, competitors, measures with their exact definitions, validation protocol, repeats, whether resampling was confined to training data, hyperparameter settings, statistical tests, reporting forms, runtime and code. Values a paper does not state were left empty. Supplementary files were read where they hold results; the four ROS (Buda) appendices were catalogued by title only.</p></div>' +
  '<div class="panel"><h3>Derived categories</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Code</th><th>Values and rule</th></tr></thead><tbody>' +
  '<tr><td>Protocol class</td><td>Repeated k-fold CV · Single k-fold CV · 5×2 CV · Repeated hold-out · Single hold-out · Fixed benchmark split · Not stated. Mixed designs take the class of the main benchmark.</td></tr>' +
  '<tr><td>Hyperparameters</td><td><b>Nested or held-out tuning</b>: chosen inside training folds or on separate tuning datasets. <b>Fixed or default</b>: preset values for all methods. <b>Selected on evaluation data</b>: the reported setting, grid optimum or resampling amount was picked by looking at results on the data used to report performance, including defaults fixed by sensitivity runs on the evaluation datasets. <b>Not stated</b>.</td></tr>' +
  '<tr><td>Statistical test</td><td><b>Corrected multiple comparison</b>: any family-wise correction (Holm, Shaffer, Hochberg, Nemenyi, Bonferroni–Dunn, Tukey HSD, Hsu MCB). <b>Omnibus only</b>. <b>Pairwise, uncorrected</b>: Wilcoxon, t-tests or CV F-tests only. <b>Bayesian</b>. <b>No test</b>.</td></tr>' +
  '<tr><td>Outcome</td><td><b>A</b> best with no stated exception · <b>B</b> best, but the authors state a measure, learner, competitor or data condition where it is not better (per-dataset losses alone do not count) · <b>C</b> no advantage over simple baselines · <b>D</b> comparative study. Coded from each paper\'s own conclusions.</td></tr>' +
  '<tr><td>Measure families</td><td>Names normalised (TPR, sensitivity and recall become Recall/TPR; Hand–Till AUC becomes MAUC). Threshold-free = AUC, ROC curve, PR-AUC, MAUC or AUCm as reported, which includes the two studies whose “AUC” is a single-threshold value.</td></tr>' +
  '<tr><td>Cite keys</td><td>First-author surname + year + method name, following references.bib (chawla2002smote). Search a key in the Evidence explorer.</td></tr>' +
  '</tbody></table></div></div>' +
  '<div class="panel"><h3>Verification log</h3><p>Sixteen codings that the prose relies on were re-checked against the PDFs by an independent pass. All were confirmed; caveats are kept in the entries.</p><div class="vlog">' + VLOG.map(r => '<div><span class="who"><button class="cite" data-key="' + r[1] + '">' + esc(r[0]) + '</button></span><span><span class="pill ok">confirmed</span> ' + esc(r[2]) + '</span></div>').join('') + '</div></div>' +
  '<div class="panel"><h3>Known extraction gaps</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Study</th><th>Note</th></tr></thead><tbody>' +
  ALL.filter(p => p.flags && /image|garbled|not in the|not available|truncat|cut off|scrambled|OCR|not extract/i.test(p.flags)).map(p => '<tr><td><button class="cite" data-key="' + esc(p.key) + '">' + esc(p.short + ' ' + p.year) + '</button></td><td>' + esc(p.flags) + '</td></tr>').join('') + '</tbody></table></div></div>' +
  '<div class="panel inv"><h3>Corpus inventory</h3><p>Grouped by Drive folder. Papers present in two folders are listed under both.</p>' +
  folders.map(f => { const L = ALL.filter(p => inFolder(p, f)).sort((a, b) => a.year - b.year); return '<h4>' + f + ' (' + L.length + ')</h4><ul>' + L.map(p => '<li><button class="cite" data-key="' + esc(p.key) + '">' + esc(p.short + ' ' + p.year) + '</button> <span style="color:var(--muted)">' + esc(p.paper_type) + '</span></li>').join('') + '</ul>'; }).join('') + '</div></div>';
}

/* ---------------- shell, events ---------------- */
function setView(v) {
  state.view = v; save();
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === v)));
  document.querySelectorAll('main > section[data-view]').forEach(s => { s.hidden = s.dataset.view !== v; });
  if (v === 'explorer' && !document.getElementById('ptable')) renderExplorerShell();
  if (v === 'latex') renderLatex();
  if (v === 'notes' && !document.querySelector('#v-notes .notes')) renderNotes();
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  requestAnimationFrame(rerenderAll);
}
function setLang(l) {
  state.lang = l; save();
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  const d = document.getElementById('v-draft'); d.classList.remove('lang-both', 'lang-en', 'lang-th'); d.classList.add('lang-' + l);
  const keep = charts.filter(c => !document.getElementById('sheet').contains(c.el));
  renderDraft(); keep.forEach(c => charts.push(c));
}
document.getElementById('meta').innerHTML = '<span><b>' + ALL.length + '</b> papers coded</span><span><b>' + EMP.length + '</b> with experiments</span><span>Section <b>7</b> of the JAIR draft</span><span>Updated 8 Oct 2026 · VI Lab</span>';

const tip = document.getElementById('tip');
function showTip(target, x, y) {
  const lines = target.getAttribute('data-tip').split('\n');
  tip.textContent = '';
  lines.forEach((l, i) => { const d = document.createElement(i === 0 ? 'b' : 'div'); d.textContent = l; if (i === 0) d.style.display = 'block'; tip.appendChild(d); });
  tip.hidden = false;
  const r = tip.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  let left = x + 14, top = y + 14; if (left + r.width > vw - 8) left = x - r.width - 14; if (top + r.height > vh - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
document.addEventListener('pointermove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top); } });
document.addEventListener('focusout', () => { tip.hidden = true; });
document.addEventListener('scroll', () => { tip.hidden = true; }, true);
function copyText(id, btn) {
  const pre = document.getElementById(id), text = pre.textContent;
  const done = ok => { btn.textContent = ok ? 'Copied' : 'Text selected, press Ctrl+C'; setTimeout(() => { btn.textContent = 'Copy'; }, 1800); };
  const fallback = () => { const det = pre.closest('details'); if (det) det.open = true; const r = document.createRange(); r.selectNodeContents(pre); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); done(false); };
  try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (e) { fallback(); }
}
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('.tab'); if (tab) { setView(tab.dataset.view); return; }
  const lg = t.closest('[data-lang]'); if (lg) { setLang(lg.dataset.lang); return; }
  const cp = t.closest('[data-copy]'); if (cp) { e.preventDefault(); copyText(cp.dataset.copy, cp); return; }
  const c = t.closest('.cite, .m, .pt'); if (c && c.dataset.key) { openPaper(c.dataset.key); return; }
  if (t.id === 'drawer-close' || t.id === 'scrim') { closePaper(); return; }
  const j = t.closest('[data-jump]'); if (j) { e.preventDefault(); const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'}); return; }
  const so = t.closest('[data-sort]'); if (so) { const k = so.dataset.sort; state.sort = {k: k, dir: state.sort.k === k ? -state.sort.dir : 1}; renderExplorerBody(); return; }
  if (t.id === 'f-reset') { state.f = {q: '', setting: 'all', era: 'all', approach: 'all', test: 'all', tune: 'all', proto: 'all', outcome: 'all', issues: false, all: false}; renderExplorerShell(); return; }
  const sc = t.closest('[data-scope]'); if (sc) { state.latexScope = sc.dataset.scope; renderLatex(); return; }
});
document.addEventListener('input', e => {
  const id = e.target.id; if (!id || id.indexOf('f-') !== 0) return;
  const key = id.slice(2);
  if (key === 'issues' || key === 'all') state.f[key] = e.target.checked; else state.f[key] = e.target.value;
  renderExplorerBody();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('drawer').hidden) closePaper(); });
let rtm = null;
if (window.ResizeObserver) new ResizeObserver(() => { clearTimeout(rtm); rtm = setTimeout(rerenderAll, 120); }).observe(document.querySelector('main'));
window.addEventListener('resize', () => { clearTimeout(rtm); rtm = setTimeout(rerenderAll, 120); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerenderAll); } catch (e) {}
new MutationObserver(rerenderAll).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

setLang(state.lang);
setView(state.view);
window.__smote25 = {ST: ST, tokenValue: tokenValue, repoFiles: repoFiles};
}
})();

</script>
