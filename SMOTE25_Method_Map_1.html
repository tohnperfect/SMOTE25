MOTE","ADASYN","Adaptive Neighbor SMOTE","DBSMOTE","MWMOTE","Relocating Safe-Level SMOTE","RBO","PCA + SMOTE"],"n_datasets":"42 (30 UCI/KEEL low-dimensional + 12 high-dimensional microarray)","classifiers":["kNN","Logistic regression","Linear SVM"],"metrics":["AUC","G-mean"],"limitations":"Many tuning parameters make configuration search time-consuming; future work: Big Data scalability, hybrid under/oversampling, and deep learning extensions.","code_url":"http://github.com/cvairetti","read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1h1nQZUohr_gcy-JCNHVK6GOe6hUPtWlw","label":"PDF"},{"folder":"Both","id":"124itYR-fOAgolcNnK7EuD7TYlZ0KPjII","label":"Supplementary"}],"uid":"P55","paper_scope":"Binary","scope_differs":true,"smote_rel":"Core","smote_via":["Neighbour choice"],"smote_link":"Same interpolation, but neighbours are found with a feature-weighted (OWA) Minkowski distance.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"Two-class formulation; 42 datasets: 30 low-dimensional UCI/KEEL + 12 high-dimensional microarray","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Neighbour choice"],"class_category":"Binary only","class_evidence_pdf":"Defined for labels {-1,+1} (Sec. 3.3, p.5). 42 two-class datasets: 30 low-dimensional UCI/KEEL and 12 high-dimensional microarray sets (Table 1, p.7; Sec. 4.1, pp.6-7); binary AUC and G-mean.","class_reduced":"Low-dimensional sets are mostly KEEL 'x vs y' and one-vs-rest versions of multiclass sources (Table 1, p.7); the paper does not describe the reduction.","class_multiclass_how":"","smote_explain":"The only change is how the k nearest minority neighbours are found: Euclidean distance is replaced by a feature-weighted Minkowski distance whose weights come from a supervised feature ranking, and low-ranked features can be dropped from the distance (Eqs. 4-5, 9-12, pp.4-5; Algorithm 1 steps 2-9). Seeds, the number per seed, the random partner and placement on the segment are as in SMOTE (Algorithm 1 steps 10-14), and the method reduces to SMOTE with equal weights and p = 2 (p.6).","pdf_check_note":"","pdf_checked":"28 Oct 2026"},{"file_id":"1SArTXqhIfEC2b0elAxJQzFFKHrqpbqNZ","acronym":"GDO","title":"Gaussian Distribution Based Oversampling for Imbalanced Data Classification","authors":"Xie, Qiu, Zhang, Peng, et al.","year":2022,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"40 binary KEEL + 10 large UCI + 2 real binary tasks; multi-class assumed reducible via OVA/OVO","data_type":["Tabular","Text"],"strategy":["Oversampling"],"mechanism":["Probabilistic/density model","k-NN neighborhood","Borderline/safe-level weighting"],"core_idea":"Weights each minority instance by kNN majority proportion plus distance ratio to majority neighbors, roulette-selects anchors by weight, and generates samples along random directions at Gaussian-distributed distances scaled by nearest-minority distance.","multiclass_handling":null,"builds_on":[],"baselines":["SMOTE","Borderline-SMOTE1","SMOTE-ENN","SMOTE-TomekLinks","ADASYN","SVM-CS","BalanceCascade"],"n_datasets":"50 (40 KEEL + 10 large UCI) + 2 real-world (video traffic, esophageal cancer)","classifiers":["SVM"],"metrics":["AUC","G-mean","Runtime","Memory usage"],"limitations":"High time complexity: runtime 10 to 100 times that of compared methods on most KEEL datasets; future work is a fast GDO.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":false,"non_tabular":true,"folders":["Both"],"files":[{"folder":"Both","id":"1SArTXqhIfEC2b0elAxJQzFFKHrqpbqNZ","label":"PDF"}],"uid":"P56","paper_scope":"Binary","scope_differs":true,"smote_rel":"Not counted","smote_via":[],"smote_link":"Moves from an anchor in a random direction by a Gaussian distance; the nearest minority neighbour sets only the scale."},{"file_id":"1OdXr9aiyUPN_oW3P2WgVhUX6KEOID-FB","acronym":"KNNOR","title":"KNNOR: An oversampling technique for imbalanced datasets","authors":"Islam, Belhaouari, Rehman, Bensmail","year":2022,"venue":"Applied Soft Computing","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"19 binary KEEL datasets (multi-class UCI sets recast as binary); multi-class left to future work","data_type":["Tabular","Image"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Noise/overlap filtering"],"core_idea":"Ranks minority points by distance to k-th minority neighbor, keeps densest fraction, generates points by chained interpolation toward each of k neighbors (step bounded by min inter-class distance), rejecting candidates with other-class k-NN.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["polynom-fit-SMOTE","ProWSyn","SMOTE-IPF","Lee","SMOBD","G-SMOTE","CCR","LVQ-SMOTE","Assembled-SMOTE","SMOTE-TomekLinks"],"n_datasets":"19 (KEEL) + 2 image sets (UTKFace, CIFAR-10; qualitative only)","classifiers":["kNN","SVM","Decision tree","MLP"],"metrics":["AUC","G-mean","F1","Precision at top 20% (P20)"],"limitations":"Future work: extend to multi-class by applying per minority class, apply to streaming data, and combine with algorithm-level methods such as ensemble SVM or extreme learning.","code_url":"https://pypi.org/project/augmentdata/","read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":true,"folders":["Both"],"files":[{"folder":"Both","id":"1OdXr9aiyUPN_oW3P2WgVhUX6KEOID-FB","label":"PDF"}],"uid":"P57","paper_scope":"Binary","scope_differs":true,"smote_rel":"Core","smote_via":["Seed selection","Neighbour choice","Placement rule","Post-filtering"],"smote_link":"Starts from dense seeds, chains interpolation through k neighbours with a step bounded by the inter-class distance, and rejects candidates whose neighbours belong to another class.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"Algorithms 1-2 split the data into Smin and Smaj (pp.4, 7). 19 KEEL two-class sets; image demos are also one class vs the rest. Per-class multiclass use is named only as future work (conclusion, p.16).","class_rule_source":"PDF checked 28 Oct 2026","smote_via_v1":["Seed selection","Placement rule","Post-filtering"],"class_category":"Binary only","class_evidence_pdf":"19 two-class datasets (18 KEEL plus CM1; Table 2, Sec. 4.1, p.11) and two-class image demos (UTKFace; CIFAR-10 airplane vs rest; Sec. 6, p.14). Multiclass use only future work (Sec. 7, p.16).","class_reduced":"KEEL splits of multiclass UCI sources (Sec. 4.1, p.11); CIFAR-10 one-vs-rest.","class_multiclass_how":"","smote_explain":"Seeds are only the densest d% of minority points, ranked by distance to their k-th minority neighbour, with d chosen automatically (Alg. 1, Sec. 3.1, pp.3-4). Instead of one random partner, the point moves step by step through all k nearest minority neighbours, each step bounded by the smallest majority-minority distance (Eq. 5, Alg. 2, Sec. 3.2, pp.6-8). A candidate is kept only if all its k nearest neighbours are minority points (Alg. 3, Sec. 3.3, p.8).","pdf_check_note":"Eq. 1 printed as extrapolation (probable sign typo).","pdf_checked":"28 Oct 2026"},{"file_id":"1qsLZZQiLE03-QC2QfVXC99G2RDkkpuSr","acronym":"SHSampler","title":"Combating Mutuality with Difficulty Factors in Multi-class Imbalanced Data: A Similarity-based Hybrid Sampling","authors":"Zheng, Yan, Zhang, Zhang","year":2022,"venue":null,"paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec IV-A: 20 multi-class imbalanced KEEL datasets","data_type":["Tabular"],"strategy":["Hybrid sampling","Undersampling","Oversampling"],"mechanism":["Class-interrelation (multi-class)","Adaptive sample weighting","Noise/overlap filtering","Geometric region"],"core_idea":"Global distance-based dissimilarity (to own class) and similarity (to other classes) scores flag overlap, noise, disjuncts; above-average classes lose difficult samples by roulette selection; below-average classes oversampled from weighted seeds inside class-relation-constrained balls.","multiclass_handling":"Native: all classes rebalanced to mean class size; sample weights scaled by pairwise relative-majority/minority size ratios.","builds_on":[],"baselines":["OVO-SMOTE","Global-CS","MDO","MC-RBO","MC-CCR","SOUP"],"n_datasets":"20 (KEEL)","classifiers":["Decision Tree","Random Forest","Naive Bayes"],"metrics":["MAUC","mGM"],"limitations":"With extremely small classes, seed selection repeatedly picks the same samples, so gains shrink; future work targets robust strategies for extreme data distributions.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":false,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"1qsLZZQiLE03-QC2QfVXC99G2RDkkpuSr","label":"PDF"}],"uid":"P58","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Not counted","smote_via":[],"smote_link":"Samples inside class-relation-constrained balls around weighted seeds, not between seed and neighbour."},{"file_id":"1DZx1dNxh97R0K0V6ClCrQUvNWabQzk96","acronym":"SOS","title":"SOS: Score-based Oversampling for Tabular Data","authors":"Kim, Lee, Shin, Park, et al.","year":2022,"venue":"KDD","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"6 tabular datasets: 4 binary (Default, Shoppers, Surgical, WeatherAUS) + 2 multi-class (Buddy, Satimage)","data_type":["Tabular"],"strategy":["Oversampling","Generative model"],"mechanism":["Score-based generative","Diffusion"],"core_idea":"Trains a score network (SDE diffusion) per class; generates minority records by denoising Gaussian noise or by forward-noising a non-target record and reversing with the target network; fine-tunes scores where class gradients align.","multiclass_handling":"Native: one score network per class; each minor class oversampled to largest class size; other classes serve as non-target.","builds_on":["Score-based generative models (SDE)"],"baselines":["SMOTE","Borderline-SMOTE","ADASYN","MedGAN","VEEGAN","TableGAN","TVAE","CTGAN","OCT-GAN","BAGAN"],"n_datasets":"6 (UCI, Kaggle; 4 binary, 2 multi-class)","classifiers":["Decision tree","Logistic regression","AdaBoost","MLP"],"metrics":["Weighted F1"],"limitations":"SGMs for tabular data are still at an early phase; future work could design drift/diffusion functions specialized to tabular data.","code_url":"https://github.com/JayoungKim408/SOS","read_status":"full","approach":"Deep generative","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1DZx1dNxh97R0K0V6ClCrQUvNWabQzk96","label":"PDF"}],"uid":"P59","paper_scope":"Binary+Multiclass","scope_differs":false,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1JBCOQ5HpJrHPs0L3CAIIegHcK0ecJY4c","acronym":"Stop Oversampling","title":"Stop Oversampling for Class Imbalance Learning: A Critical Review","authors":"Hassanat, Tarawneh, Altarawneh, Almuhaimeed","year":2022,"venue":"arXiv:2202.03579 (preprint)","paper_type":"Survey","class_setting":"Survey","class_setting_evidence":"Table of 72 oversamplers mostly binary (5 multi-class); validation on binary Yeast4/5/6 and Vehicle3","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling","Data cleaning"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Adaptive sample weighting","Clustering","Evolutionary/optimization","Probabilistic/density model","Mahalanobis distance","Noise/overlap filtering"],"core_idea":"Reviews 72 oversamplers and proposes validation: hide 10-50% of majority examples, oversample, count synthetic minority samples nearer (Hassanat distance) to majority; all methods produce majority-like samples, so authors advise avoiding oversampling.","multiclass_handling":null,"builds_on":[],"baselines":["SMOTE","SMOTE-TomekLinks","SMOTE-ENN","Borderline-SMOTE1/2","ADASYN","Safe-Level-SMOTE","MWMOTE","DSMOTE","SOI-CJ","62 further oversamplers (72 in total)"],"n_datasets":"3 (UCI Yeast4, Yeast5, Yeast6) + 1 (Vehicle3) for best methods","classifiers":[],"metrics":["Error rate (share of synthetic samples nearest to majority, Hassanat distance)"],"limitations":"Future work: validate more oversampling methods and datasets; study real-world applications comparing predictions with/without oversampling and against ensemble methods.","code_url":null,"read_status":"full","approach":"Survey / study","smote_based":false,"non_tabular":false,"folders":["Survey"],"files":[{"folder":"Survey","id":"1JBCOQ5HpJrHPs0L3CAIIegHcK0ecJY4c","label":"PDF"}],"uid":"P60","paper_scope":"Binary","scope_differs":false,"smote_rel":"Study","smote_via":[],"smote_link":"Proposes no generator; tests 72 oversamplers, mostly SMOTE-based, and finds they create majority-like samples."},{"file_id":"1WnqpH5Mj-1Lx6t9qCT9GA3XzZWdbNXPm","acronym":"SVDDWSMOTE","title":"SVDD-based weighted oversampling technique for imbalanced and overlapped dataset learning","authors":"Tao, Zheng, Chen, Zhang et al.","year":2022,"venue":"Information Sciences","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"24 binary datasets from 16 UCI (multi-class merged one-vs-others) + bearing-fault data","data_type":["Tabular"],"strategy":["Oversampling","Data cleaning"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Geometric region","Borderline/safe-level weighting","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"SVDD class boundary (larger minority penalty; DPC-flagged noisy minority down-weighted) removes overlapped/noisy instances; minority weighted by boundary closeness and sparsity; weighted SMOTE rejects synthetics falling inside the SVDD boundary.","multiclass_handling":null,"builds_on":["SMOTE","SVDD"],"baselines":["Random oversampling","SMOTE","Borderline-SMOTE","Safe-Level-SMOTE","ADASYN","MWMOTE","Cluster-SMOTE","A-SUWO","k-means SMOTE","SPIDER"],"n_datasets":"24 (from 16 UCI) + 4 synthetic 2-D + 8 bearing-fault scenarios","classifiers":["BPNN","LDA","SVM (RBF)"],"metrics":["F-measure","G-mean","AUC","Runtime"],"limitations":"Future work: adapt the method to multi-class imbalanced classification problems.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1WnqpH5Mj-1Lx6t9qCT9GA3XzZWdbNXPm","label":"PDF"}],"uid":"P61","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Neighbour choice","Post-filtering"],"smote_link":"Weighted SMOTE: seeds are weighted by closeness to the SVDD boundary and sparsity, and synthetic points inside the majority SVDD boundary are rejected.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"24 binary datasets from 16 UCI (multi-class merged one-vs-others) + bearing-fault data","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection","Post-filtering"],"class_category":"Binary only","class_evidence_pdf":"Four 2-D simulated two-class sets (Sec. 5.1), 24 binary datasets from 16 UCI sources (Table 2, pp.34-35) and bearing-fault data with fault types against normal (Table 8, pp.44-45). Defined for one majority and one minority class (Eqs. 7-8, 24); multiclass is future work (Sec. 6).","class_reduced":"One-vs-others or class-vs-class (Abalone 16 vs 6, Yeast3-5) (Sec. 5.3; Table 2).","class_multiclass_how":"","smote_explain":"Noisy or overlapped minority points inside the majority SVDD sphere are removed before generation (Secs. 4.1-4.2). Each remaining seed gets a number of points proportional to a weight combining closeness to the boundary and sparsity (Eqs. 21-24), and the partner is drawn from its 5 nearest neighbours in proportion to their weights (Eq. 25, p.25). Placement is SMOTE's; synthetic points that fall inside the SVDD boundary are rejected and regenerated, and any still missing are filled by copying the seed (Alg. steps 36-52, pp.26-27).","pdf_check_note":"Majority points outside the SVDD sphere are also removed before oversampling.","pdf_checked":"28 Oct 2026"},{"file_id":"12Vjoct1Jgw1isC7imxxEaRfiMapHtQT5","acronym":"GLOS","title":"Global-local information based oversampling for multi-class imbalanced data","authors":"Han, Guo, Li, Wang","year":2023,"venue":"Int J Mach Learn Cybern","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec 4.1: 21 multi-class UCI and KEEL datasets","data_type":["Tabular"],"strategy":["Oversampling","Undersampling"],"mechanism":["Borderline/safe-level weighting","Mahalanobis distance","SMOTE interpolation","Geometric region","Adaptive sample weighting","Class-interrelation (multi-class)"],"core_idea":"Hypersphere same-class neighbor counts give instance/class discreteness; sparse classes are minority; their sparse instances, typed safe/borderline/small-disjunct, are oversampled via MMO (Mahalanobis), AMBO (adaptive interpolation) or RRO (radial random); sparse majority instances removed.","multiclass_handling":"Native: classes labeled minority/majority by comparing class discreteness with global DID; AMBO weights neighbors by class role.","builds_on":["MDO"],"baselines":["C4.5 without sampling","SMOTE","Borderline-SMOTE","ADASYN","MDO","MC-RBO (as MC-BRO)"],"n_datasets":"21 (UCI, KEEL)","classifiers":["C4.5 (best of OAA, OAO, OAHO, A&O decompositions)"],"metrics":["Pave","Pminave","Pmin","G (multi-class G-mean)","Gminave","Gmin","CBA"],"limitations":"Results depend on two parameters (DID radius factor and partition thresholds); future work aims to set them adaptively from data complexity.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"12Vjoct1Jgw1isC7imxxEaRfiMapHtQT5","label":"PDF"}],"uid":"P62","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Partial","smote_via":["Seed selection","Sample allocation","Neighbour choice","Placement rule"],"smote_link":"One of its three generators (AMBO) uses adaptive interpolation; the others are Mahalanobis (MMO) and radial random (RRO), chosen by instance type.","class_rule":"Multiclass rule","mc_strategy":"Per-class generator or region","class_rule_note":"Native: classes labeled minority/majority by comparing class discreteness with global DID; AMBO weights neighbors by class role.","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Placement rule"],"class_category":"Multiclass only","class_evidence_pdf":"21 multiclass UCI/KEEL datasets with 3 to 11 classes kept (Sec. 4.1, Table 1). One parameter-tuning run on Sonar (Fig. 7, p.2079) also reports GLOS results; the paper does not state Sonar's class count (two classes in the standard UCI version).","class_reduced":"","class_multiclass_how":"Classes are labelled minority or majority by comparing their discreteness with the dataset-wide value (Eqs. 1, 2, 5); minority seeds are typed safe, borderline or small-disjunct and each type gets its own generator (MMO, AMBO, RRO) (Algs. 1-3).","smote_explain":"Only one of GLOS's three generators interpolates: AMBO, used for borderline seeds (Alg. 2, p.2076). Its partner is any instance inside a radius-R sphere, possibly of another class, and the step is capped at the seed's nearest-neighbour distance rather than covering the whole segment (Alg. 2 line 12). The number of points per seed comes from discreteness and is split across classes by their discreteness ratios. The other two generators place points on Mahalanobis contours (MMO) or at random within a radius (RRO).","pdf_check_note":"Provisional: Multiclass only; would be Binary + Multiclass if the two-class Sonar tuning run (Fig. 7) counts. Decision for P.","pdf_checked":"28 Oct 2026"},{"file_id":"1wcaZXGQaSvPcubKplx_4XeMOAhj6vLIk","acronym":"NROMM","title":"Noise-robust oversampling for imbalanced data classification","authors":"Liu, Liu, Yu, Zhong et al.","year":2023,"venue":"Pattern Recognition","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Sec 5: 20 multi-class KEEL datasets; Sec 5.3: 10 binary datasets (D1-D10) vs PA, SVDDWSMOTE, FW-SMOTE","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling","Data cleaning","Decomposition (OVO/OVA)"],"mechanism":["Clustering","k-NN neighborhood","SMOTE interpolation","Borderline/safe-level weighting","Noise/overlap filtering","Evolutionary/optimization","Class-interrelation (multi-class)","Heterogeneous distance metric"],"core_idea":"CFSFDP clusters each class; minority split into inland/borderline/trapped by in-cluster k-NN density; interpolates inland/borderline, uses loss-optimized adaptive embedding near trapped samples; removes borderline/trapped majority samples; HEEM/VDM handle categorical features.","multiclass_handling":"OVE: each non-largest class oversampled against union of larger classes (incl. synthetic); final cleaning of overlap-region inland samples.","builds_on":["PAIO","CFSFDP","SMOTE","MC-RBO"],"baselines":["MC-CCR","MC-RBO","SMOTE-all","S-SMOTE","MDO","SMOM","SMOTE-IPF","KNNOR","PA","SVDDWSMOTE"],"n_datasets":"20 (KEEL, multi-class) + 10 binary (supplementary)","classifiers":["C5.0","MLP","KNN","NB","SVM"],"metrics":["AvAcc","CBA","MG","CEN","AUC","G-mean"],"limitations":"Performs relatively poorly on datasets with a large percentage of borderline samples; future work will extend NROMM to graph-structured data.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1wcaZXGQaSvPcubKplx_4XeMOAhj6vLIk","label":"PDF"},{"folder":"Both","id":"1kMbA-zTreEFt_aYr4ZHAiNQZSFIq3H6p","label":"Supplementary"}],"uid":"P63","paper_scope":"Binary+Multiclass","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Neighbour choice","Placement rule","Post-filtering"],"smote_link":"Interpolates inland and borderline minority samples inside CFSFDP clusters; trapped samples use an optimized embedding instead, and borderline majority samples are removed.","class_rule":"Multiclass rule","mc_strategy":"Class by class","class_rule_note":"OVE: each non-largest class oversampled against union of larger classes (incl. synthetic); final cleaning of overlap-region inland samples.","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection","Neighbour choice","Post-filtering"],"class_category":"Binary + Multiclass","class_evidence_pdf":"20 KEEL multiclass datasets with 3 to 10 classes kept (Sec. 5.1; Table 2, p.7) and 10 two-class KEEL datasets (D1-D10) in the validity check (Sec. 5.3, p.9; Table 6; Supp. Table 1).","class_reduced":"D1-D10 are KEEL two-class versions of multiclass sources (one-vs-rest such as Yeast4, Ecoli4; merged splits such as Ecoli-3-5 vs 0-6-7) (Supp. Table 1).","class_multiclass_how":"One-versus-ensemble: classes sorted by size, each non-largest class oversampled against the original and synthetic data of all larger classes (Sec. 4.2.1; Fig. 4); afterwards inland samples of the overlap region are removed (Sec. 4.2.2).","smote_explain":"Clustering splits minority samples into inland, borderline and trapped (Sec. 3.2). Inland and borderline seeds are interpolated, inland ones with a partner from the same cluster and borderline ones with a nearby majority neighbour; trapped seeds get points from an optimised embedding, not interpolation (Sec. 3.3, Eqs. 2-4). The number of points per seed follows (1 - local density) times the class-size gap, categorical values come from a VDM-constrained set near the seed (Sec. 4.1), and borderline and trapped majority samples are removed afterwards.","pdf_check_note":"Core vs Partial debatable: trapped seeds (6-84% per dataset) are not interpolated. The binary and multiclass variants appear to be run on separate data.","pdf_checked":"28 Oct 2026"},{"file_id":"1X0ALAnYA_2dUSvX_Ms3cSYTN0d-xZnKV","acronym":"OREM / OREM-M","title":"Oversampling With Reliably Expanding Minority Class Regions for Imbalanced Data Learning","authors":"Zhu, Liu, Zhu","year":2023,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec 4: 28 two-class UCI datasets (OREM) + 21 multi-class datasets (OREM-M)","data_type":["Tabular"],"strategy":["Oversampling","Ensemble"],"mechanism":["SMOTE interpolation","Geometric region","k-NN neighborhood","Class-interrelation (multi-class)","Boosting"],"core_idea":"Per minority sample, neighbors up to q consecutive majority points form a candidate region; neighbors whose connecting-segment hypersphere contains no majority point become seeds; interpolation toward seeds, halved toward majority seeds.","multiclass_handling":"OREM-M: one-by-one generation favoring smaller classes; synthetic dropped if nearest neighbor is another minority class (conflicting synthetic removed).","builds_on":["AdaBoost.M2 (OREMBoost)"],"baselines":["SMOTE","MWMOTE","FWSMOTE","INOS","RACOG/wRACOG","RBO","GDO","MDO","SMOM","MC-RBO"],"n_datasets":"28 two-class (UCI) + 21 multi-class (UCI, ordinal regression)","classifiers":["C4.5","MLP","SVM (linear)","CART (in ensembles)"],"metrics":["F1","G-mean","AUC","macro-F1","MG","MAUC"],"limitations":"Needs preset synthetic count and generates equal amounts per sample; relies on local minority information, unreliable when minority extremely scarce; lightweight versions needed for large-scale data.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Both","Multiclass"],"files":[{"folder":"Both","id":"1X0ALAnYA_2dUSvX_Ms3cSYTN0d-xZnKV","label":"PDF"},{"folder":"Multiclass","id":"1AR_PnhKLkrZvvVyM3JsZsw34L_VUHUHu","label":"PDF (copy)"},{"folder":"Both","id":"13-DOzcKKFjohQv5x8Se3OV6G1IwWAjdj","label":"Supplementary"}],"uid":"P64","paper_scope":"Binary+Multiclass","scope_differs":true,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Neighbour choice","Placement rule","Post-filtering","Inside a pipeline"],"smote_link":"Widens the neighbour set to a candidate region that may include majority points, interpolates toward clean seeds, and halves the step toward majority seeds.","class_rule":"Multiclass rule","mc_strategy":"Class by class","class_rule_note":"OREM (Alg. 1) is two-class; OREM-M (Alg. 2, Sec. 3.2, p.6172) extends it: classes drawn in random order weighted by remaining quota, a synthetic point is dropped when its nearest neighbour is another minority class. OREM is tested on 28 two-class sets, OREM-M on 21 multiclass sets (never on two classes); OREMBoost on both.","class_rule_source":"PDF checked 28 Oct 2026","smote_via_v1":["Neighbour choice","Placement rule"],"class_category":"Binary + Multiclass","class_evidence_pdf":"OREM on 28 two-class UCI datasets (Sec. 4.1.1, Table 2, p.6174); OREM-M on 21 multiclass datasets with 3 to 10 classes kept (Sec. 4.2.1, Table 6, p.6177); OREMBoost on both (Sec. 4.3, Tables 10-11).","class_reduced":"20 of OREM's 28 sets come from multiclass sources reduced to one or merged classes vs the rest (Table 2).","class_multiclass_how":"OREM-M (Alg. 2, Sec. 3.2, p.6172): only classes with imbalance degree above 1.2 are oversampled; one point at a time, a class is drawn in proportion to its remaining quota, and a synthetic point is rejected if its nearest neighbour belongs to another minority class. Native multiclass, not OvO/OvR.","smote_explain":"OREM keeps every minority point as a seed with equal counts (Alg. 1). It replaces the k-NN partner set with 'assistant seeds' from a candidate region that grows until q = 5 consecutive majority points are met, keeping a candidate only if the sphere on the seed-candidate segment holds no majority point, so borderline majority points can be partners (Alg. 1; Sec. 3.1.2). The point is x_i + g(x_s - x_i) with g ~ U[0,1], halved when the partner is a majority point. OREM-M adds class-quota sampling and a nearest-neighbour rejection filter (Alg. 2), and OREMBoost runs the generator inside each AdaBoost.M2 round (Alg. 3).","pdf_check_note":"Variants: OREM is B, OREM-M is M, OREMBoost is BM; the paper is BM through OREMBoost and the union.","pdf_checked":"28 Oct 2026"},{"file_id":"1Ganmekz6p4uVF8Ih34-0hPCvw8aC2WH6","acronym":"GMMSampling","title":"GMMSampling: a new model-based, data difficulty-driven resampling method for multi-class imbalanced data","authors":"Naglik, Lango","year":2024,"venue":"Machine Learning","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec 4.1: 15 multi-class datasets (11 real UCI + 4 artificial), multi-majority/multi-minority/gradual configurations","data_type":["Tabular"],"strategy":["Hybrid sampling"],"mechanism":["Probabilistic/density model","Clustering","k-NN neighborhood","Class-interrelation (multi-class)","Noise/overlap filtering"],"core_idea":"Fits a GMM per minority class (components chosen by dev-set likelihood early stopping) and samples new points from each component, more from unsafe subconcepts (safe-level weighted); removes lowest-safe-level majority examples.","multiclass_handling":"Native: classes split into minority/majority; all resampled to average of largest minority and smallest majority size using class-similarity safe levels.","builds_on":["SOUP","Gaussian Mixture Model"],"baselines":["RUS","All-kNN","ROS","K-means-SMOTE","KDE sampling","MDO","Global-CS","Static-SMOTE","SOUP","MC-CCR"],"n_datasets":"15 (11 real UCI + 4 artificial)","classifiers":["CART","Naive Bayes","k-NN","Random Forest","Gradient Boosting Trees"],"metrics":["Balanced accuracy","G-mean","F1 (macro)","MCC","Average precision (macro)"],"limitations":"GMM suppo centre (Algs. 3-4, p.6).","pdf_check_note":"Two-class evidence is synthetic data only. The post-generation step moves rather than deletes samples.","pdf_checked":"28 Oct 2026"},{"file_id":"1nDMgSh4CWdvhylkyrZcsi9re42GzStAk","acronym":"MKC-SMOTE","title":"MKC-SMOTE: A Novel Synthetic Oversampling Method for Multi-Class Imbalanced Data Classification","authors":"Wang, Awang","year":2024,"venue":"IEEE Access","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec IV-A: 21 multi-class imbalanced UCI datasets","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Noise/overlap filtering","Class-interrelation (multi-class)"],"core_idea":"Minority samples whose 5-NN (all classes) are at least half same-class become seeds; synthetics placed along and beyond the line from kNN centroid to seed; twice needed generated, farthest-from-centroid discarded.","multiclass_handling":"Classes with Nmax/Ni above 1.45 oversampled toward largest-class size; neighbor screening uses all classes.","builds_on":["SMOTE"],"baselines":["No sampling","SMOTE","MDO","k-means SMOTE","RM-SMOTE","FIY-SMOTE","MC-CCR"],"n_datasets":"21 (UCI)","classifiers":["CART","SVM"],"metrics":["MAUC","MG"],"limitations":"Future work: seed selection for extremely rare classes, other distance metrics (e.g., Mahalanobis), mixed attribute types, adaptive k selection.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"1nDMgSh4CWdvhylkyrZcsi9re42GzStAk","label":"PDF"}],"uid":"P67","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Neighbour choice","Placement rule","Post-filtering"],"smote_link":"Uses the line from the seed’s kNN centroid through the seed, extending past the seed, instead of the seed–neighbour segment; keeps the half of candidates nearest the centroid.","class_rule":"Multiclass rule","mc_strategy":"To the largest class","class_rule_note":"Classes with Nmax/Ni above 1.45 oversampled toward largest-class size; neighbor screening uses all classes.","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection","Placement rule"],"class_category":"Multiclass only","class_evidence_pdf":"21 UCI datasets, all multiclass (Abstract; Sec. IV-A-1, p.5; Table 1), all classes kept and scored with multiclass MG and MAUC (Eqs. 6-7, p.6); 5-fold CV, CART and SVM. No two-class experiment.","class_reduced":"","class_multiclass_how":"Every class with N_max/N_i > 1.45 is oversampled towards the largest class size, each class independently, with the neighbour search over all classes (Alg. 1; Sec. III, pp.4-5). No decomposition.","smote_explain":"A minority point is a seed only if at least half of its 5 nearest neighbours, taken from all classes, share its class (Sec. III step 2; Alg. 1). Instead of a random minority partner, the method uses the centroid of the seed's neighbours and places new points on the line from that centroid through the seed, possibly beyond the seed (Sec. III steps 3-5; Alg. 1 lines 23-26). It generates twice the needed number and keeps the candidates nearest the centroid (Sec. III step 6, p.5).","pdf_check_note":"Add Neighbour choice (kNN centroid replaces the random partner) and Post-filtering (over-generation and removal of far candidates). Per-dataset class counts in Table 1 could not be extracted.","pdf_checked":"28 Oct 2026"},{"file_id":"1HN7VjTMcK-1k2qneVgplL4ZfTVYqQiK5","acronym":"GDHS","title":"GDHS: An efficient hybrid sampling method for multi-class imbalanced data classification","authors":"Yan, Lv, Han, Yu, et al.","year":2025,"venue":"Neurocomputing","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec 4.1: 14 multi-class KEEL datasets + 6 two-class software defect datasets (camel, hive, velocity, xalan, ering"],"class_category":"Binary + Multiclass","class_evidence_pdf":"20 datasets (Sec. 4.1, Table 1, pp.6-7): 14 KEEL multiclass sets with all classes kept (3 to 10 classes, e.g. car, glass, yeast, zoo) and 6 two-class software-defect sets (camel-1.4, camel-1.6, hive-0.12.0, velocity-1.5, xalan-2.4, xerces-1.2). All three variants run on all 20 sets (Tables 5-8, pp.10-11).","class_reduced":"None; the defect sets are natively two-class.","class_multiclass_how":"Mean class size m is the target (Eq. 1): classes below m are oversampled up to m, classes above m are cleaned by one of three strategies (Sec. 3.2, pp.5-6). No decomposition.","smote_explain":"Generation interpolates between a minority seed and one of its 5 same-class neighbours (Eq. 3, p.3), but each seed-direction pair gets a weight that favours safe seeds (same-class share among neighbours, Eq. 2) and directions whose synthetic region holds few other-class points (Eqs. 5-10). Each minority class is filled to the mean class size by weighted random draws rather than a fixed number per seed (Alg. 1). Afterwards, original majority points in the synthetic regions, or overlapping other majority classes, are removed (Sec. 3.2, Eqs. 11-16).","pdf_check_note":"Add Seed selection (safe factor weights seeds). Eq. 3 draws a random value per feature, so points fill the box between seed and neighbour rather than the segment; the paper presents this as SMOTE. Only original majority points are filtered.","pdf_checked":"28 Oct 2026"},{"file_id":"1LPHYXmZjSX0GQEZsamv27HsJPpkT52vA","acronym":"GOIO","title":"GOIO: Generative Oversampling Approach to Class Imbalance and Overlap of Tabular Data","authors":"Ren, Ding, Yang, Cheung","year":2025,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"18 real-world datasets with one target class as minority for binary classification + 5 two-class synthetic","data_type":["Tabular"],"strategy":["Oversampling","Generative model"],"mec etic points drawn inside hypersphere.","multiclass_handling":"Iterative class-by-class in descending class size; for each class, all larger classes act as the majority set.","builds_on":["NCLWO"],"baselines":["SMOTE","Borderline-SMOTE","ADASYN","MWMOTE","A-SUWO","G-SMOTE","SMOTE-IPF","MC-CCR","MC-RBO","MC-MBRC"],"n_datasets":"23 (KEEL)","classifiers":["k-NN","CART","Naive Bayes","SVM"],"metrics":["F-beta (macro)","Average accuracy","Class balanced accuracy (CBA)","Confusion entropy (CEN)"],"limitations":"Higher computational complexity than traditional oversampling due to iterative noise cleaning and adaptive generation; not optimized for high-dimensional or unstructured data (images, time series); future deep learning integration.","code_url":"https://github.com/taoliangliang/MC-NCLWO","read_status":"full","approach":"Hybrid sampling","smote_based":false,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"17x6NWBqjstuf9-XZIL1Gg1LojLU9qVHK","label":"PDF"}],"uid":"P70","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Not counted","smote_via":[],"smote_link":"Samples inside a cooling-law hypersphere around each minority point, not along the direction to a neighbour."},{"file_id":"1MgRNYVAXU8VYZF13piF_4UVCPCT6Q_8n","acronym":"MLOS","title":"Synthetic oversampling with Mahalanobis distance and local information for highly imbalanced class-overlapped data","authors":"Yan, Zheng, Han, Yu et al.","year":2025,"venue":"Expert Systems with Applications","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"16 two-class highly imbalanced (IR>10), overlapped datasets from KEEL, UCI, PROMISE","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling","Data cleaning"],"mechanism":["Mahalanobis distance","Radial basis/potential function","k-NN neighborhood","Geometric region","Noise/overlap filtering"],"core_idea":"Whitens data by majority covariance; each minority seed gets radius from 5-NN auxiliary sample with nearest majority RBF density; samples in that hypersphere, rescales onto seed's contour; cleans overlapping majority and dense synthetic samples.","multiclass_handling":null,"builds_on":["SWIMMD","SWIMRBF"],"baselines":["SMOTE","Borderline-SMOTE","ADASYN","MWMOTE","MAHAKIL","CCR","SWIMMD","SWIMRBF","LDAS","GDO"],"n_datasets":"16 (KEEL, UCI, PROMISE)","classifiers":["SVM"],"metrics":["AUC","G-mean","Recall"],"limitations":"Scaling factor alpha only tested at a few values in [0,1]; setting for real applications left to researchers. Future work: extend to multi-class scenarios.","code_url":"https://github.com/ytyancp/MLOS","read_status":"full","approach":"Hybrid sampling","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1MgRNYVAXU8VYZF13piF_4UVCPCT6Q_8n","label":"PDF"}],"uid":"P71","paper_scope":"Binary","scope_differs":true,"smote_rel":"Not counted","smote_via":[],"smote_link":"Samples inside a hypersphere around the seed and rescales onto its Mahalanobis contour; the 5-NN sample sets only the radius."},{"file_id":"1kJZCKYe3QR2tSvb54AfOhHd5XNzkdJ6g","acronym":"CISO","title":"Certified Interpolation Oversampling: Per-Instance Safety Guarantees for Imbalanced Learning","authors":"Yadav, Vijay","year":2026,"venue":"arXiv:2501.15790 (preprint)","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"37 binary KEEL + 8 UCI datasets; multi-class sets binarized smallest-class-vs-rest","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Adaptive sample weighting","Probabilistic/density model"],"core_idea":"Anchors drawn by safety score (majority clearance x (1 - regional majority density)) with signed temperature; two minority neighbors weighted by clearance and q-Gaussian locality; truncated q-Gaussian placement on segment; per-instance certified clearance.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["Class weighting","Random oversampling","SMOTE","Borderline-SMOTE","ADASYN","SMOTE-ENN","SMOTE-Tomek","KMeans-SMOTE","Safe-Level-SMOTE","G-SMOTE"],"n_datasets":"45 (37 KEEL + 8 UCI) + 5 KEEL used only for tuning","classifiers":["LR","SVC (RBF)","RF","HistGradientBoosting"],"metrics":["PR-AUC","ROC-AUC","G-mean","MMD2 (fidelity)","Certified fraction"],"limitations":"Not significantly better than SMOTE, class weighting or random oversampling on PR-AUC; about 39x SMOTE cost; binary only, multiclass extension and adaptive temperature left for future work.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1kJZCKYe3QR2tSvb54AfOhHd5XNzkdJ6g","label":"PDF"}],"uid":"P72","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Neighbour choice","Placement rule"],"smote_link":"Picks anchors by a safety score, weights two minority neighbours, and places points on the segment with a truncated q-Gaussian instead of a uniform λ.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"37 binary KEEL + 8 UCI datasets; multi-class sets binarized smallest-class-vs-rest","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection","Neighbour choice","Placement rule"],"class_category":"Binary only","class_evidence_pdf":"Binary labels only (Sec. 3.1, p.5). 37 binary KEEL datasets for evaluation, 5 KEEL datasets for tuning and 8 larger UCI datasets (Sec. 5.1, p.15; Tables 1-2). Multiclass is future work (Sec. 7, p.34).","class_reduced":"Multiclass sources made binary as smallest class vs rest (Sec. 5.1; Table 1 caption), e.g. Waveform, Statlog Landsat, Page Blocks, Letter; KEEL sets are ready-made binary versions.","class_multiclass_how":"","smote_explain":"Anchors are drawn with replacement in proportion to a safety score, so each anchor gets a varying number of points (Eqs. 8-9, p.8). Two different minority neighbours of the anchor are drawn with weights from their clearance and a q-Gaussian locality kernel (Eqs. 10-11). The new point lies on the segment between those two neighbours, not between anchor and neighbour, with lambda drawn from a truncated q-Gaussian instead of U(0,1) (Eqs. 12-14, p.12). Nothing is removed afterwards. Running time is 39 times SMOTE's at the median (Sec. 6.7, p.29).","pdf_check_note":"The anchor is not an endpoint of the segment.","pdf_checked":"28 Oct 2026"},{"file_id":"1V9E9guns3UmIBq2vj0dzdZ90SMgM9WXv","acronym":"DGOT","title":"Diffusion GAN-Based Oversampling for Imbalanced Tabular Data","authors":"Ren, Ding, Cheung","year":2026,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Sec IV-A: 22 datasets = 15 binary + 7 multi-class (UCI, imbalanced-learn)","data_type":["Tabular"],"strategy":["Oversampling","Generative model"],"mechanism":["GAN","Diffusion"],"core_idea":"GAN whose generator is a conditional denoising-diffusion chain with few large steps (predicts x0, samples posterior); time-dependent discriminator with SNR-weighted noise-sensitive auxiliary classifier; trained generator synthesizes minority-class tabular samples.","multiclass_handling":"Native class-conditional generation; each minority class oversampled until d times majority size; macro-averaged metrics.","builds_on":["Denoising diffusion GAN","ACGAN"],"baselines":["SMOTE","Borderline-SMOTE","SMOTE-TomekLinks","CTGAN","TVAE","SOS","No resampling"],"n_datasets":"22 (UCI, imbalanced-learn): 15 binary + 7 multi-class","classifiers":["XGBoost","KNN","Decision Tree","Logistic Regression","Random Forest"],"metrics":["Accuracy","F1","MCC"],"limitations":"Future work: extend the approach to other data types and further reduce computational resource overhead.","code_url":"https://github.com/MLneuers/DGOT","read_status":"full","approach":"Deep generative","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1V9E9guns3UmIBq2vj0dzdZ90SMgM9WXv","label":"PDF"}],"uid":"P73","paper_scope":"Binary+Multiclass","scope_differs":false,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1PK1o_aazCwaEO0yx3bTeXHQHRfaai90K","acronym":"Loyalty-SMOTE","title":"Loyalty-SMOTE: Data synthesis algorithm for effective imbalanced data classification","authors":"Hu, Li, Li, Zhang et al.","year":2026,"venue":"Neural Networks","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"30 binary UCI/KEEL datasets (group 1) + 5 multiclass UCI datasets (group 4)","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling","Data cleaning"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Noise/overlap filtering","Class-interrelation (multi-class)"],"core_idea":"Loyalty (inverse-distance-weighted same- minus different-class k-NN influence) flags noise (Loyalty<0); boundary minority samples (0<=Loyalty<=m) are SMOTE-oversampled; then Loyalty recheck removes minority noise and LOF removes majority noise.","multiclass_handling":"Attraction relabels unloyal samples to most-attracting class; experiments treat largest class as majority, smallest as minority.","builds_on":["SMOTE","LOF"],"baselines":["SMOTE","SMOTE-ENN","SMOTE-TomekLinks","Borderline-SMOTE","Safe-Level-SMOTE"],"n_datasets":"59 in 5 groups: 30 (UCI/KEEL) + 5 multiclass (UCI) + 24 (Kaggle)","classifiers":["SVM"],"metrics":["F1","AUC","Recall","G-mean","Runtime"],"limitations":"Longer runtime and higher time complexity than traditional imbalanced data methods; future work will focus on reducing time complexity.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1PK1o_aazCwaEO0yx3bTeXHQHRfaai90K","label":"PDF"}],"uid":"P74","paper_scope":"Binary+Multiclass","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Neighbour choice","Post-filtering"],"smote_link":"Applies SMOTE only to boundary minority samples (0 ≤ Loyalty ≤ m), then removes noise with a Loyalty recheck and LOF.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"Loyalty and the Attraction relabelling use all classes, but SMOTE grows only one minority class (Sec. 3.3, p.6). The 5 multiclass sets are run as largest class vs smallest class and scored with binary metrics (Sec. 4.4.4, p.12). Earlier coded as native multiclass; corrected.","class_rule_source":"PDF checked 28 Oct 2026","smote_via_v1":["Seed selection","Post-filtering"],"class_category":"Binary only","class_evidence_pdf":"30 binary UCI/KEEL datasets (group 1, Table 2) plus other two-class groups, and 5 multiclass UCI datasets (group 4, Table 5: yeast 10 classes, HR 3, employee 3, Drug200 4, MEDV 9) with results in Sec. 4.4.4 and Tables 15-18.","class_reduced":"Group 1 includes KEEL x_vs_y splits and one-vs-rest versions of multiclass sources (Table 2); reduction not described.","class_multiclass_how":"On multiclass data the largest class is the majority and the smallest the minority (Sec. 4.4.4); SMOTE oversamples only the smallest class (Sec. 3.3); low-Loyalty samples are relabelled to the class with the highest Attraction before generation (Eq. 9, Sec. 3.2). Whether the middle classes stay in the data is read differently by two checks; only one class is ever oversampled, and results use binary metrics.","smote_explain":"Generation is plain SMOTE (k = 5) applied only to boundary minority samples whose Loyalty, an inverse-distance-weighted balance of same-class and other-class neighbours, lies between 0 and m (Sec. 3.3). Samples with negative Loyalty are treated as possible noise and kept out of generation, so the partner pool is also restricted. Afterwards Loyalty is recomputed: flagged minority samples still below 0 are removed and flagged majority samples are removed by an LOF test (Sec. 3.4, Eqs. 10-12).","pdf_check_note":"Provisional: the PDF check read this as Binary + Multiclass; coded Binary only under rule 1 (only the smallest class is ever oversampled, binary metrics). Decision for P. Category decision needed: only the smallest class is oversampled on multiclass data, scored with binary metrics.","pdf_checked":"28 Oct 2026"},{"file_id":"1ic15ixamezP9A2bop_KHS6t0UcU3MpgY","acronym":"QC-SMOTE","title":"QC-SMOTE: Quality-Controlled SMOTE for Imbalanced Classification","authors":"Upman, Gowda","year":2026,"venue":"Preprint","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"30 binary benchmark datasets (VS-SMOTE set); one-vs-rest multi-class extension stated but not evaluated","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"Seeds drawn by trust score (safe-level, local minority density, majority isolation); best-of-K interpolated candidates scored by candidate and midpoint purity plus majority clearance; regime-adaptive range; low-quality candidates replaced by duplicating trusted minority.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["SMOTE","Borderline-SMOTE1","SMOTE-WE","K-SMOTE","RSMOTE","SMOTEWB","SMOTE-CD","VS-SMOTE"],"n_datasets":"30 (VS-SMOTE binary benchmark: ecoli, glass, yeast, vehicle, page-blocks, etc.; IR 1.82-32.73)","classifiers":["CatBoost"],"metrics":["AUC-ROC","Macro F1"],"limitations":"Slower than SMOTE (about 39x); future work: mixed/categorical features, integration with deep representation learning, learnable trustworthiness for dynamic or streaming data.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1ic15ixamezP9A2bop_KHS6t0UcU3MpgY","label":"PDF"}],"uid":"P75","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Placement rule","Post-filtering"],"smote_link":"Trust-scored seeds; best-of-K interpolated candidates scored by purity and majority clearance; poor candidates are replaced by duplicating trusted minority points.","class_rule":"One-vs-rest stated","mc_strategy":"","class_rule_note":"Each underrepresented class is the target against all other classes (Sec. 3.1, p.4; Sec. 3.7, p.7), but all 30 datasets are binary (Sec. 4.1, Table 1); the multiclass rule is never run.","class_rule_source":"PDF checked 28 Oct 2026","smote_via_v1":["Seed selection","Placement rule","Post-filtering"],"class_category":"Binary only","class_evidence_pdf":"30 binary datasets from the VS-SMOTE benchmark (KEEL-style), IR 1.82 to 32.73 (Table 1, p.8; Sec. 4.1, p.8). CatBoost, repeated stratified CV, oversampling on training folds only (Secs. 4.2-4.3, p.8). A one-vs-rest use is described (Sec. 3.1, p.4; Sec. 3.7, p.7) but never run.","class_reduced":"Uses ready-made KEEL two-class splits (one-vs-rest such as ecoli1-4, glass0/1/6, vehicle0-3, yeast1/3/4/5; merged-class splits such as glass-0-1-2-3_vs_4-5-6, yeast-1-2-8-9_vs_7) (Table 1, p.8); the paper does not describe the reduction.","class_multiclass_how":"","smote_explain":"Seeds are drawn in proportion to a trust score combining safe level, minority density and distance from the majority class (Eqs. 2-6, Sec. 3.2, p.5), and the number of attempts per seed also follows trust (Eq. 7, Sec. 3.3, p.6). Each candidate is still x_i + lambda(x_j - x_i) with a 5-NN minority partner, but lambda ~ U(0, alpha_r) shrinks with overlap and the best of K_r candidates is kept by a purity and clearance score (Eqs. 8-18, Secs. 3.4-3.5, pp.6-7). A candidate that fails the thresholds is replaced by a copy of the most trusted point near the seed (Eqs. 19-21, Sec. 3.6, p.7).","pdf_check_note":"Add Sample allocation (trust-proportional attempts per seed, Sec. 3.3, Eq. 7; ablated in Table 4). Fallback copies the most trusted point among the seed and its neighbours, not a global prototype. Fallback outputs duplicates, but interpolation stays the main generator (Core). Baseline scores copied from published VS-SMOTE tables. Conclusion mentions PR-AUC, which no table reports.","pdf_checked":"28 Oct 2026"},{"file_id":"16NgWw7JEwOLWb0JrhEPihfDOZdnEcGrG","acronym":"AdaBoost.NC","title":"Multiclass Imbalance Problems: Analysis and Potential Solutions","authors":"Wang, Yao","year":2012,"venue":"IEEE Trans. Systems, Man, and Cybernetics, Part B","paper_type":"Foundational","class_setting":"Multiclass","class_setting_evidence":"Artificial Gaussian sets with 1-20 minority or 1-20 majority classes, plus 12 UCI multi-class datasets (3-10 classes)","data_type":["Tabular"],"strategy":["Ensemble","Oversampling","Undersampling","Decomposition (OVO/OVA)"],"mechanism":["Boosting","Random resampling","Adaptive sample weighting","Class-interrelation (multi-class)"],"core_idea":"Shows that adding minority classes (multiminority) or majority classes (multimajority, more harmful) degrades AdaBoost with or without random resampling; random oversampling + AdaBoost.NC (boosting weights penalized by ensemble ambiguity, λ=9) gives the best G-mean and minority recall with no OVO/OVA decomposition.","multiclass_handling":"Native: AdaBoost.NC learns all classes at once after every class is randomly oversampled to the largest class size; OAA with outputs weighted by inverse class proportion performs about the same, so decomposition is judged unnecessary.","builds_on":["AdaBoost.NC (Wang, Chen, Yao 2010)","Negative correlation learning","AdaBoost"],"baselines":["AdaBoost (OrAda)","ROS + AdaBoost (OvAda)","RUS + AdaBoost (UnAda)","SMOTEBoost (k=5)","OAA versions of all models (-d)","OAA with weighted combination (-dw)"],"n_datasets":"12 UCI (New-thyroid, Balance, Car, Nursery, Glass, Annealing, Solarflare2, Page, Ecoli, Cleveland, Yeast, Satimage) + artificial multiminority/multimajority sets","classifiers":["C4.5 (51-tree ensembles)"],"metrics":["MAUC","Extended G-mean","Recall","Precision","F-measure"],"limitations":"λ is fixed by hand (large λ helps but is not tuned); AdaBoost.NC gives up some majority-class recall and MAUC. Future work: conditions and parameters under which ensembles help, other two-class methods (RAMOBoost, RareBoost, JOUS-Boost, cost-sensitive) under multiclass, and theory.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":false,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"16NgWw7JEwOLWb0JrhEPihfDOZdnEcGrG","label":"PDF"}],"uid":"P76","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Not counted","smote_via":[],"smote_link":"Oversamples by random duplication inside AdaBoost.NC, not by interpolation; SMOTEBoost appears only as a baseline (stable MAUC and G-mean, but zero minority recall on Balance)."}]</script>
<script>
(function(){
'use strict';
function boot(){

  try{
  var P=JSON.parse(document.getElementById('data').textContent);

  var SETTINGS=['Binary','Multiclass','Binary+Multiclass','Survey'];

  var APPR=[['Oversampling','OS'],['Undersampling','US'],['Hybrid sampling','HY'],['Ensemble','EN'],['Deep generative','DG'],['Cost-sensitive','CS'],['Algorithm-level','AL'],['Survey / study','SV']];
  var CODE={};APPR.forEach(function(a){CODE[a[0]]=a[1];});
  var DATA=['Tabular','Image','Time series','Text'];
  var DT_SHORT={'Image':'IMG','Time series':'TS','Text':'TXT'};
  var TYPES=['New method','Empirical study','Survey','Foundational'];
  var VIA=[['Seed selection','which minority points become seeds, or how they are weighted'],
    ['Sample allocation','how many synthetic points each seed, cluster or class gets'],
    ['Neighbour choice','which neighbour is paired with the seed: distance metric, cluster, or a majority neighbour'],
    ['Placement rule','where the new point lands: the distribution of λ, a region around the segment, or extrapolation'],
    ['Post-filtering','removing or rejecting synthetic or original samples after generation'],
    ['Inside a pipeline','SMOTE runs as a step of boosting, bagging, a wrapper or classifier training']];

  var RULES=[['Binary rule','the generation rule is written for one minority class against the rest; more classes need decomposition or reduction'],
    ['One-vs-rest stated','a rule for several classes is stated (each class against the rest) but never run on more than two classes'],
    ['Multiclass rule','the rule itself generates for several classes (target sizes, class order, class-conditional generation or the ensemble)']];
  var STRATS=['To the largest class','To the mean class size','Class by class','Per-class generator or region','Through the ensemble'];
  var TESTED=[['Binary','Tested on binary only'],['Binary+Multiclass','Tested on both'],['Multiclass','Tested on multiclass only']];
  var CATS=[['Binary only','every experiment that generates data is two-class, including multiclass sources reduced to two classes'],
    ['Multiclass only','generates with three or more classes kept and is never run on two-class data'],
    ['Binary + Multiclass','the same generator is run on two-class data and on data with three or more classes kept']];
  var S={view:'table',q:'',set:{},nontab:false,appr:{},data:{},type:{},via:{},rule:{},cat:{},smote:false,study:false,mismatch:false,sortKey:'year',sortDir:1,open:{}};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function keys(o){return Object.keys(o).filter(function(k){return o[k];});}
  function mismatch(p){return !!p.scope_differs;}
  function yy(y){return '\u2019'+String(y).slice(2);}
  function ntTags(p){return p.data_type.filter(function(d){return DT_SHORT[d];}).map(function(d){return '<span class="flag">'+DT_SHORT[d]+'</span>';}).join('');}
  function hay(p){return [p.acronym,p.title,p.authors,p.venue,p.year,p.core_idea,p.multiclass_handling,p.n_datasets,p.limitations,p.approach,p.class_setting,p.paper_scope,(p.mechanism||[]).join(' '),(p.builds_on||[]).join(' '),(p.baselines||[]).join(' '),(p.classifiers||[]).join(' '),(p.metrics||[]).join(' '),(p.strategy||[]).join(' '),p.data_type.join(' '),p.smote_link,(p.smote_via||[]).join(' ')].join(' ').toLowerCase();}
  P.forEach(function(p){p._h=hay(p);p._mm=mismatch(p);});

  function pass(p,skip){
    skip=skip||{};
    var s=keys(S.set); if(!skip.set&&s.length&&s.indexOf(p.class_setting)<0) return false;
    if(S.nontab&&!p.non_tabular) return false;
    var a=keys(S.appr); if(!skip.appr&&a.length&&a.indexOf(p.approach)<0) return false;
    var d=keys(S.data); if(d.length&&!p.data_type.some(function(x){return d.indexOf(x)>=0;})) return false;
    var t=keys(S.type); if(t.length&&t.indexOf(p.paper_type)<0) return false;
    var v=keys(S.via); if(v.length&&!(p.smote_via||[]).some(function(x){return v.indexOf(x)>=0;})) return false;
    if(S.smote&&!p.smote_based) return false;
    if(S.study&&p.smote_rel!=='Study') return false;
    var ru=keys(S.rule); if(ru.length&&ru.indexOf(p.class_rule)<0) return false;
    var ca=keys(S.cat); if(ca.length&&ca.indexOf(p.class_category)<0) return false;
    if(S.mismatch&&!p._mm) return false;
    if(S.q){var terms=S.q.toLowerCase().split(/\s+/).filter(Boolean);for(var i=0;i<terms.length;i++){if(p._h.indexOf(terms[i])<0) return false;}}
    return true;
  }
  function rows(){
    var r=P.filter(function(p){return pass(p);});
    var k=S.sortKey,dir=S.sortDir;
    r.sort(function(a,b){
      var x,y;
      if(k==='year'){x=a.year;y=b.year;if(x!==y) return (x-y)*dir;return a.acronym.localeCompare(b.acronym);}
      x=String(a[k]).toLowerCase();y=String(b[k]).toLowerCase();
      return (x<y?-1:x>y?1:a.year-b.year)*dir;
    });
    return r;
  }

  /* static parts */
  var yrs=P.map(function(p){return p.year;});
  document.getElementById('meta').innerHTML='<b>'+P.length+'</b> papers · <b>'+Math.min.apply(null,yrs)+'–'+Math.max.apply(null,yrs)+'</b> · Drive SMOTE25 (Survey, Binary, Multiclass, Both) · read 6 Oct 2026, +1 on 19 Oct 2026 · generation rule and class category (PDF-checked) added 28 Oct 2026';
  function cnt(f){return P.filter(f).length;}
  var nt={};P.forEach(function(p){p.data_type.forEach(function(d){if(DT_SHORT[d]) nt[d]=(nt[d]||0)+1;});});
  function apprMix(set){var m={};P.forEach(function(p){if(p.class_setting===set) m[p.approach]=(m[p.approach]||0)+1;});return APPR.filter(function(a){return m[a[0]];}).sort(function(x,y){return m[y[0]]-m[x[0]];}).slice(0,3).map(function(a){return m[a[0]]+' '+a[0].toLowerCase();}).join(' · ');}
  var th='';
  SETTINGS.forEach(function(s){th+='<button class="tile" type="button" data-act="set" data-v="'+esc(s)+'" aria-pressed="false"><span class="lab">'+SET_LABEL[s]+'</span><span class="num mono">'+cnt(function(p){return p.class_setting===s;})+'</span><span class="sub">'+esc(apprMix(s))+'</span></button>';});
  th+='<button class="tile" type="button" data-act="nontab" data-v="nontab" aria-pressed="false"><span class="lab">Non-tabular data</span><span class="num mono">'+cnt(function(p){return p.non_tabular;})+'</span><span class="sub">'+Object.keys(nt).map(function(d){return nt[d]+' '+d.toLowerCase();}).join(' · ')+'</span></button>';
  document.getElementById('tiles').innerHTML=th;

  function fbtn(act,v,label,extra){return '<button class="f" type="button" data-act="'+act+'" data-v="'+esc(v)+'" aria-pressed="false">'+(extra||'')+esc(label)+'</button>';}
  var g='<div class="group"><span class="glab">Approach</span>';

      else if(a==='data') on=!!S.data[v]; else if(a==='type') on=!!S.type[v]; else if(a==='via') on=!!S.via[v]; else if(a==='study') on=S.study; else if(a==='smote') on=S.smote; else if(a==='mismatch') on=S.mismatch; else if(a==='rule') on=!!S.rule[v]; else if(a==='cat') on=!!S.cat[v];

  var toastT;
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2200);}
  function openPanel(html){var o=document.getElementById('overlay');o.innerHTML='<div class="panel" role="dialog" aria-modal="true">'+html+'</div>';o.hidden=false;var c=o.querySelector('[data-act="close"]');if(c) c.focus();}
  function closePanel(){var o=document.getElementById('overlay');o.hidden=true;o.innerHTML='';}
  function copyText(txt,label){
    function fallback(){openPanel('<div class="panel-head"><div><h2>'+esc(label)+'</h2><div class="sub">Clipboard is blocked here. The text is selected; press Ctrl+C or Cmd+C.</div></div><button class="btn" type="button" data-act="close">Close</button></div><textarea id="copybox" readonly>'+esc(txt)+'</textarea>');var ta=document.getElementById('copybox');ta.focus();ta.select();}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(label+' copied');},fallback);}else fallback();
    }catch(e){fallback();}
  }

  document.addEventListener('click',function(ev){
    try{
      var o=document.getElementById('overlay');
      if(ev.target===o){closePanel();return;}
      var b=ev.target.closest('[data-act]'); if(!b) return;
      var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
      if(a==='set'){S.set[v]=!S.set[v];}
      else if(a==='nontab'){S.nontab=!S.nontab;}
      else if(a==='appr'){S.appr[v]=!S.appr[v];}
      else if(a==='data'){S.data[v]=!S.data[v];}
      else if(a==='type'){S.type[v]=!S.type[v];}
      else if(a==='via'){S.via[v]=!S.via[v];}
      else if(a==='study'){S.study=!S.study;}
      else if(a==='smote'){S.smote=!S.smote;}
      else if(a==='mismatch'){S.mismatch=!S.mismatch;}
      else if(a==='rule'){S.rule[v]=!S.rule[v];}
      else if(a==='cat'){S.cat[v]=!S.cat[v];}
      else if(a==='view'){S.view=v;try{history.replaceState(null,'','#'+v);}catch(e){}}
      else if(a==='sort'){if(S.sortKey===v) S.sortDir=-S.sortDir; else {S.sortKey=v;S.sortDir=1;}}
      else if(a==='toggle'){S.open[v]=!S.open[v];}
      else if(a==='detail'){var p=BY[v];openPanel('<div class="panel-head"><div><h2>'+esc(p.acronym)+'</h2><div class="sub"><span class="mono">'+p.year+'</span> · '+esc(p.approach)+'</div></div><button class="btn" type="button" data-act="close">Close</button></div>'+detail(p));return;}
      else if(a==='close'){closePanel();return;}
      else if(a==='reset'){S.q='';S.set={};S.nontab=false;S.appr={};S.data={};S.type={};S.via={};S.rule={};S.cat={};S.smote=false;S.study=false;S.mismatch=false;S.open={};document.getElementById('q').value='';}
      else if(a==='latex'){copyText(latex(rows()),'LaTeX table ('+rows().length+' rows)');return;}
      else if(a==='csv'){copyText(csv(rows()),'CSV ('+rows().length+' rows)');return;}
      else return;
      render();
    }catch(e){showErr(e);}
  });
  document.addEventListener('input',function(ev){if(ev.target&&ev.target.id==='q'){S.q=ev.target.value.trim();render();}});
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'&&!document.getElementById('overlay').hidden){closePanel();}
    else if(ev.key==='/'&&document.activeElement&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){ev.preventDefault();document.getElementById('q').focus();}
  });
  var hv=(location.hash||'').replace('#','');
  if(hv==='matrix'||hv==='timeline'||hv==='flags'||hv==='rule'||hv==='cat'||hv==='table') S.view=hv;
  render();
  }catch(e){showErr(e);}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>

</body>
</html>
