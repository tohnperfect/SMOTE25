"PDF"},{"folder":"Both","id":"1mzs8B7Q-7qtV1GYjVhSMM5qEiNEQoYrL","label":"Supplementary"}],"uid":"P26","paper_scope":"Binary","scope_differs":true,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Inside a pipeline"],"smote_link":"Each ensemble member gets random class proportions; the enlarged class is grown with SMOTE, inside bagging or AdaBoost.M2.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"86 two-class imbalanced datasets: 20 HDDT collection + 66 KEEL","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Inside a pipeline","Sample allocation"],"class_category":"Binary only","class_evidence_pdf":"Stated for two-class problems (Abstract; Sec. 1, p.97); Algorithms 1-2 use labels y in {-1,+1} (pp.98, 100). Two-class 2-D Gaussian simulation (Sec. 5, p.100). 86 binary datasets: 20 HDDT (Table 2, p.102) and 66 KEEL (Table 3, p.103), 5x2-fold CV, J48 (Sec. 6, p.101). Multiclass extension listed as future work only (Sec. 7, p.110).","class_reduced":"66 KEEL sets derived from 16 sources (footnote 7, p.101) as one-vs-rest or merged-group splits (e.g. ecoli-0-1-4-7_vs_2-3-5-6, yeast-2_vs_4, page-blocks-1-3_vs_4); HDDT sets such as letter, pendigits, satimage are presumably binarised, reduction not described.","class_multiclass_how":"","smote_explain":"Each ensemble member gets a training set of the original size with a random class split (Alg. 1 lines 6-7, p.98): the class that must grow is filled with SMOTE (k = 5; Sec. 3, p.97) and the other is randomly undersampled, and when the split is inverted SMOTE grows the original majority class (Alg. 1 lines 12-15; Sec. 4.1, p.98). Partner and placement are as in SMOTE. Generation is redone for every member of a plain or bagging ensemble, or in every AdaBoost.M2 round (RB-Boost, Alg. 2, Sec. 4.2, p.100).","pdf_check_note":"Add Seed selection: the oversampled class is random and can be the original majority (Alg. 1 line 15). The proposal also includes stand-alone Random Balance ensembles (E-RB, BAG-RB), not only RB-Boost. Whether growing the majority class counts as a seed-selection change is debatable.","pdf_checked":"28 Oct 2026"},{"file_id":"1ZIWXUhaCqxK_bGMQ6E0Awx_XKRK9pugY","acronym":"SCUT","title":"SCUT: Multi-Class Imbalanced Data Classification using SMOTE and Cluster-based Undersampling","authors":"Agrawal, Viktor, Paquet","year":2015,"venue":"IC3K 2015 (Int. Joint Conf. on Knowledge Discovery, Knowledge Engineering and Knowledge Management)","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"8 multi-class datasets (7 KEEL + Wine Quality UCI), 3-10 classes","data_type":["Tabular"],"strategy":["Hybrid sampling","Oversampling","Undersampling"],"mechanism":["SMOTE interpolation","Clustering"],"core_idea":"Sets every class to the mean class size m: classes below m are SMOTE-oversampled to m; classes above m are EM-clustered and instances randomly drawn near-uniformly across clusters to total m.","multiclass_handling":"Native: each class resampled independently to the mean class size; no decomposition.","builds_on":["SMOTE","Cluster-based undersampling"],"baselines":["SMOTE","Random undersampling (RU)","CUT (cluster undersampling only)","No sampling (Original)"],"n_datasets":"8 (7 KEEL + 1 UCI)","classifiers":["J48 (C4.5)","SMO (SVM)","Naive Bayes","IBk (kNN, k=5)"],"metrics":["G-mean","F-measure","AUC"],"limitations":"Target class size fixed to the mean; optimal size strategy (e.g., sampling from the EM mixture) and very large, extremely imbalanced datasets left for future work.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"1ZIWXUhaCqxK_bGMQ6E0Awx_XKRK9pugY","label":"PDF"}],"uid":"P27","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Core","smote_via":["Sample allocation"],"smote_link":"Multi-class: SMOTE-oversamples every class below the mean class size up to the mean, while larger classes are cluster-undersampled.","class_rule":"Multiclass rule","mc_strategy":"To the mean class size","class_rule_note":"Native: each class resampled independently to the mean class size; no decomposition.","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Sample allocation"],"class_category":"Multiclass only","class_evidence_pdf":"8 multiclass datasets with all classes kept: 7 KEEL (Thyroid 3 classes, Lymphography 4, Pageblocks 5, Dermatology 6, Autos 6, Ecoli 8, Yeast 10) and UCI Wine Quality (7) (Sec. 3.1, Table 1). No two-class experiment. 10-fold CV with J48, SMO, Naive Bayes, IBk (Sec. 3).","class_reduced":"","class_multiclass_how":"Mean class size m is the common target: classes below m are SMOTEd up to m with a per-class rate, classes above m are reduced to m by EM clustering and near-uniform sampling across clusters (Sec. 2, Fig. 1; Sec. 3.1). No decomposition, no ensemble.","smote_explain":"Synthetic points come from standard SMOTE run inside each under-represented class (Fig. 1); the only change is how many points each class gets, enough to reach the mean class size m with a rate computed per class (Sec. 2). Seeds, partners within the class and placement are as in SMOTE, and generation is a one-off step before training. The EM cluster-based undersampling acts on real points of the large classes, not on synthetic ones.","pdf_check_note":"SMOTE k not stated; whether SCUT is applied only to training folds is not stated.","pdf_checked":"28 Oct 2026"},{"file_id":"1yGWVTPRefcNsLsRoUhyeS16S7Qnj_YLR","acronym":"SMOTE-IPF","title":"SMOTE-IPF: Addressing the noisy and borderline examples problem in imbalanced classification by a re-sampling method with filtering","authors":"Saez, Luengo, Stefanowski, Herrera","year":2015,"venue":"Information Sciences","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"30 synthetic two-class + 9 real-world binary KEEL datasets (multi-class merged into two classes), plus noisy variants","data_type":["Tabular"],"strategy":["Oversampling","Data cleaning"],"mechanism":["SMOTE interpolation","Noise/overlap filtering"],"core_idea":"SMOTE balances classes to 50%, then the Iterative-Partitioning Filter splits data into 9 random partitions, trains C4.5 on each, removes examples misclassified by majority vote, repeating until under 1% removed for 3 iterations.","multiclass_handling":null,"builds_on":["SMOTE","Iterative-Partitioning Filter (IPF)"],"baselines":["No preprocessing","SMOTE","SMOTE-ENN","SMOTE-TL","Safe-Level-SMOTE","Borderline-SMOTE1","Borderline-SMOTE2"],"n_datasets":"30 synthetic + 9 real-world (KEEL) + class/attribute-noise versions (20%, 40%)","classifiers":["C4.5","k-NN","SVM","RIPPER","PART"],"metrics":["AUC"],"limitations":"Parameter choice is IPF's main drawback: it has numerous parameters and the filter's behavior is quite dependent on their values.","code_url":"http://www.keel.es","read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1yGWVTPRefcNsLsRoUhyeS16S7Qnj_YLR","label":"PDF"}],"uid":"P28","paper_scope":"Binary","scope_differs":true,"smote_rel":"Core","smote_via":["Post-filtering"],"smote_link":"Standard SMOTE followed by an Iterative-Partitioning Filter that removes noisy original and synthetic examples.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"30 synthetic two-class + 9 real-world binary KEEL datasets (multi-class merged into two classes), plus noisy variants","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Post-filtering"],"class_category":"Binary only","class_evidence_pdf":"30 synthetic two-class 2-D datasets (Sec. 4.1, pp.190-191) and 9 real datasets, each one minority class vs the rest, 8 from KEEL (Sec. 4.2, p.191; Table 1, p.192), with class or attribute noise added.","class_reduced":"Multiclass sources turned into two classes by joining one or more classes as positive and the rest as negative (Sec. 4.2, p.191), likely ecoli, newthyroid and cleveland.","class_multiclass_how":"","smote_explain":"Generation is plain SMOTE with k = 5, oversampling to a 50/50 balance (Sec. 3.2, p.189). The only change is a filter applied afterwards: the Iterative-Partitioning Filter, an ensemble of C4.5 models on 9 partitions with majority voting, repeated until fewer than 1% of examples are removed in 3 rounds, which removes noisy original and synthetic examples of both classes (Sec. 3.1, pp.188-189; Sec. 3.3, p.190).","pdf_check_note":"Neighbours found with HVDM rather than Euclidean distance.","pdf_checked":"28 Oct 2026"},{"file_id":"1nZ42HkNUc7_nBN2r-vfsfSSVQdaRGqVb","acronym":"SplitBal","title":"A novel ensemble method for classifying imbalanced data","authors":"Sun, Song, Zhu, Sun et al.","year":2015,"venue":"Pattern Recognition","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"46 highly imbalanced binary KEEL datasets (IR 8.1 to 41.4)","data_type":["Tabular"],"strategy":["Ensemble"],"mechanism":["Bagging/random subspace","Clustering"],"core_idea":"Majority class is randomly split (SplitBal) or K-means clustered (ClusterBal) into IR bins of minority size; each bin plus all minority trains a classifier; outputs fused by MaxDistance rule weighting probabilities by inverse distance.","multiclass_handling":null,"builds_on":["Kittler ensemble combination rules"],"baselines":["RUS","ROS","SMOTE","MetaCost","EasyEnsemble","RUSBoost","SMOTEBoost","UnderBagging","EM1vs1","Chi-GTS (fuzzy rule-based)"],"n_datasets":"46 (KEEL)","classifiers":["Naive Bayes","C4.5","RIPPER","Random Forest","SMO (SVM)","IBk (k-NN, k=5)"],"metrics":["AUC"],"limitations":"Only the class imbalance characteristic is addressed; other data characteristics such as dataset shift, class overlapping and small disjuncts are left for future study.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1nZ42HkNUc7_nBN2r-vfsfSSVQdaRGqVb","label":"PDF"}],"uid":"P29","paper_scope":"Binary","scope_differs":true,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1OfwH1GejH2Ryj3nWqPH4Ia-cn2c85vYQ","acronym":"A-SUWO","title":"Adaptive Semi-Unsupervised Weighted Oversampling (A-SUWO) for Imbalanced Datasets","authors":"Nekooeimehr, Lai-Yuen","year":2016,"venue":"Expert Systems with Applications","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"16 public datasets; multi-class ones converted to two-class (Table 3.1)","data_type":["Tabular"],"strategy":["Oversampling","Data cleaning"],"mechanism":["SMOTE interpolation","Clustering","k-NN neighborhood","Adaptive sample weighting","Borderline/safe-level weighting","Noise/overlap filtering"],"core_idea":"Removes noise, clusters minority via complete-linkage hierarchical clustering that blocks merges across majority sub-clusters; sizes sub-clusters by cross-validated LDA error; interpolates within sub-clusters, favoring instances near majority neighbors.","multiclass_handling":null,"builds_on":["SMOTE","MWMOTE","Agglomerative complete-linkage clustering"],"baselines":["Random oversampling","SMOTE","Borderline-SMOTE","Safe-Level SMOTE","Cluster-SMOTE","SBC","CBOS","MWMOTE"],"n_datasets":"16 (public benchmark datasets)","classifiers":["SVM (RBF)","Logistic regression","k-NN","LDA"],"metrics":["F-measure","G-mean","AUC"],"limitations":"Future work: apply A-SUWO to multi-class classification problems.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1OfwH1GejH2Ryj3nWqPH4Ia-cn2c85vYQ","label":"PDF"}],"uid":"P30","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Neighbour choice"],"smote_link":"Interpolates within minority sub-clusters that may not cross majority sub-clusters, sizes them by classification error, and favours seeds near the majority class.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"16 public datasets; multi-class ones converted to two-class (Table 3.1)","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Neighbour choice","Sample allocation","Seed selection"],"class_category":"Binary only","class_evidence_pdf":"Drive PDF is the 2016 dissertation, Chapter 3 being the A-SUWO paper. Defined for binary problems (p.24; Sec. 3.5, p.46). 16 datasets, each a minority class vs the rest (Table 3.1, p.35); multiclass use only future work (Sec. 3.5, p.46).","class_reduced":"12 multiclass sources reduced to named class(es) vs all other classes (e.g. Vehicle van, Ecoli pp, Glass 1, Segment WINDOW) (Table 3.1, p.35).","class_multiclass_how":"","smote_explain":"Minority points are grouped by a complete-linkage clustering that will not merge two minority sub-clusters across a majority sub-cluster (Sec. 3.1, pp.26-28). Each sub-cluster's quota is proportional to its cross-validated classification error (Sec. 3.2, Eqs. 3.2-3.3), seeds are drawn with weights favouring closeness to the majority class (Sec. 3.3, Eqs. 3.4-3.9), and the partner is one of the seed's nearest neighbours in the same sub-cluster (Alg. 3.1, p.33). Placement stays uniform on the segment (Eq. 3.10).","pdf_check_note":"Page references are to the dissertation, not the ESWA article.","pdf_checked":"28 Oct 2026"},{"file_id":"1OwzELxOJ_DqE_oFqC3MyJj7x9sQx7YzB","acronym":"CGMOS","title":"CGMOS: Certainty Guided Minority OverSampling","authors":"Zhang, Ma, Gan, Jiang et al.","year":2016,"venue":"CIKM 2016 (ACM)","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"30 UCI datasets; multi-class ones converted to smallest-class vs rest binary","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","Probabilistic/density model","Adaptive sample weighting","k-NN neighborhood"],"core_idea":"Seed-selection weight = average relative change in KDE-based Bayesian posterior certainty of all majority and minority samples if a minority point is added there; SMOTE interpolation from weighted seeds; theoretical expected-gain guarantee over SMOTE.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["No oversampling","Random duplication","SMOTE","Borderline-SMOTE","ADASYN","MWMOTE","RAMOBoost"],"n_datasets":"30 (UCI)","classifiers":["Bayesian KDE classifier","kNN","SVM (RBF)","Neural network (1 hidden layer)","Random forest","AdaBoost.M1"],"metrics":["AUC","ROC curve","Precision","Recall","F-score","G-score"],"limitations":null,"code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1OwzELxOJ_DqE_oFqC3MyJj7x9sQx7YzB","label":"PDF"}],"uid":"P31","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection"],"smote_link":"Chooses SMOTE seeds by the expected gain in KDE-based posterior certainty, with a proven expected gain over SMOTE.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"30 UCI datasets; multi-class ones converted to smallest-class vs rest binary","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection"],"class_category":"Binary only","class_evidence_pdf":"Set up for two classes only (Sec. 2, p.1624; Sec. 5, p.1629). 30 UCI datasets used as two-class problems (Sec. 4.1, p.1626; Table 1, p.1627).","class_reduced":"Multiclass datasets keep the smallest class as minority and merge the rest (Sec. 4.1, p.1626); which datasets is not stated.","class_multiclass_how":"","smote_explain":"CGMOS keeps SMOTE's interpolation step unchanged (Sec. 2.3, p.1625). Seeds are drawn in proportion to a weight: the average relative change in kernel-density posterior certainty over all training points if a minority point were added at that seed (Eqs. 5-6, p.1625). Sec. 3 proves that the expected certainty gain is at least that of SMOTE on the training data (Theorem 1).","pdf_check_note":"","pdf_checked":"28 Oct 2026"},{"file_id":"1bWUoc6-OoSvVbY_LDzHA2LP-g9g2IVaV","acronym":"MDO","title":"To Combat Multi-Class Imbalanced Problems by Means of Over-Sampling Techniques","authors":"Abdi, Hashemi","year":2016,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"20 multi-class UCI and KEEL datasets, 3-26 classes","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["Mahalanobis distance","k-NN neighborhood","Adaptive sample weighting"],"core_idea":"Selects minority samples having at least K1 same-class among K2 neighbors (weighted by this ratio), transforms the class to PCA space, and generates synthetic points with the seed's Mahalanobis distance to the class mean.","multiclass_handling":"Native, no decomposition: each minority class oversampled separately up to the majority class size.","builds_on":[],"baselines":["SMOTE","Random oversampling","Borderline-SMOTE (OAA)","ADASYN (OAA)"],"n_datasets":"20 (UCI, KEEL)","classifiers":["C4.5","RIPPER","kNN (k=5)"],"metrics":["MAUC","G-mean","Minority precision","Minority recall","Minority F-measure"],"limitations":"Slow for high-dimensional data; only numeric attributes handled; future work: nominal/mixed attributes, other distances (e.g., Hellinger), and comparison with OAA/OAO two-class oversamplers.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":false,"non_tabular":false,"folders":["Both","Multiclass"],"files":[{"folder":"Multiclass","id":"1bWUoc6-OoSvVbY_LDzHA2LP-g9g2IVaV","label":"PDF"},{"folder":"Both","id":"1Mg6uMRcl3DBW6pl_gUHttNwhRnBHIshn","label":"PDF (copy)"}],"uid":"P32","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Not counted","smote_via":[],"smote_link":"Draws points on the seed’s Mahalanobis contour around the class mean, not between two instances."},{"file_id":"12KDC3jaa429TWX4hq-t7gXh6LIHJE3h6","acronym":"SMOM","title":"Synthetic minority oversampling technique for multiclass imbalance problems","authors":"Zhu, Lin, Liu","year":2017,"venue":"Pattern Recognition","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"27 multiclass imbalanced datasets (UCI and ordinal regression benchmarks)","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Clustering","Borderline/safe-level weighting","Class-interrelation (multi-class)"],"core_idea":"SMOTE-style interpolation where each of a trapped instance's k neighbor directions gets a selection weight penalizing over-generalization into other (especially minority) classes; NBDOS clustering finds outstanding instances, which use uniform direction selection.","multiclass_handling":"Native: each minority class oversampled to largest class size; direction weights consider all other classes jointly.","builds_on":["SMOTE"],"baselines":["No oversampling","ROS","SMOTE","ADASYN","Safe-Level-SMOTE","MWMOTE","MDO"],"n_datasets":"27 (UCI + ordinal regression benchmarks)","classifiers":["C4.5","AdaBoost.M1 (C4.5)","MLP","Naive Bayes"],"metrics":["MG (G-mean)","MAUC","Recall (smallest minority class)","Precision (smallest minority class)"],"limitations":"Implementation is complex (NBDOS clustering, two-round filtration); handles only continuous attributes, with nominal and ordinal attributes left for future work.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Both","Multiclass"],"files":[{"folder":"Multiclass","id":"12KDC3jaa429TWX4hq-t7gXh6LIHJE3h6","label":"PDF"},{"folder":"Both","id":"1IK1wZWtVuSE1maDdYZTfxS8q4k8RxF-c","label":"PDF (copy)"},{"folder":"Both","id":"1o77w3qlr4KT4ARNCUJ5_CdBlZGJMQQK5","label":"Supplementary"}],"uid":"P33","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Core","smote_via":["Neighbour choice"],"smote_link":"Keeps SMOTE interpolation but weights each neighbour direction to stop synthetic points reaching into other classes (multi-class over-generalization).","class_rule":"Multiclass rule","mc_strategy":"To the largest class","class_rule_note":"Native: each minority class oversampled to largest class size; direction weights consider all other classes jointly.","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Neighbour choice"],"class_category":"Multiclass only","class_evidence_pdf":"Read from the supplement only: the main PDF in Drive contains the INOS paper, not SMOM. 27 multiclass datasets, UCI and ordinal-regression benchmarks, all classes kept, with per-group minority and majority metrics (Supp. Tables S3-S10, S17-S20). No two-class experiment appears in the supplement.","class_reduced":"","class_multiclass_how":"Each minority class is processed in turn against all other classes and oversampled until all classes have the same size (Supp. Sec. 7, Table S21); neighbours are searched over all classes; no decomposition or ensemble.","smote_explain":"SMOM keeps SMOTE-style interpolation between a seed and one of its k1 = 12 neighbours (Supp. Secs. 3, 5). For trapped instances, each neighbour direction gets a selection weight that penalises directions whose segment sphere contains instances of other classes (Algorithm S1; Supp. Sec. 3), so directions are drawn by weight rather than uniformly. NBDOS clustering decides which instances are outstanding (uniform directions) or trapped (weighted directions).","pdf_check_note":"Main PDF mislinked in Drive; placement law and allocation not confirmed from the main text.","pdf_checked":"28 Oct 2026"},{"file_id":"1BQhzFFIr90ZfPvyDUjdop6hDMz_XS9Tv","acronym":"AMDO","title":"AMDO: an Over-Sampling Technique for Multi-Class Imbalanced Problems","authors":"Yang, Kuang, Zhang, Zhang","year":2018,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"15 multi-class UCI/KEEL (10 numeric, 5 nominal/mixed) + 2 precipitation datasets","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["Mahalanobis distance","k-NN neighborhood","Adaptive sample weighting"],"core_idea":"Extends MDO to mixed-type data via HVDM neighbor search and GSVD projection; iteratively oversamples the smallest class until IR is at most 1.5 (partial balance) and draws real-valued synthetic samples on the seed's Mahalanobis contour.","multiclass_handling":"Native, no decomposition; partially balanced iterative scheme repeatedly enlarges the current smallest class.","builds_on":["MDO","DSRBF/SSRBF"],"baselines":["MDO","MDO+","Static-SMOTE (SSMOTE)","Global-CS (RESCALEnew)","AdaBoost.NC","OVO-SMOTE","C4.5 (no resampling)"],"n_datasets":"15 (UCI, KEEL) + 2 real-world (precipitation phase)","classifiers":["C4.5"],"metrics":["Pmin (smallest-class precision)","Pavg (average precision)","AUCm","MAUC"],"limitations":"Performance may be limited on low-dimensional data; future work: combining AMDO with ensembles, speeding up the procedure, and parameter optimization.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":false,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"1BQhzFFIr90ZfPvyDUjdop6hDMz_XS9Tv","label":"PDF"}],"uid":"P34","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Not counted","smote_via":[],"smote_link":"Draws points on the seed’s Mahalanobis contour (MDO for mixed data), not between two instances."},{"file_id":"1-1mPFa1PhFoS-xPWg37_YMgXfPEW4Yqj","acronym":"k-means SMOTE","title":"Improving Imbalanced Learning Through a Heuristic Oversampling Method Based on K-Means and SMOTE","authors":"Douzas, Bacao, Last","year":2018,"venue":"Information Sciences","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"Binary datasets; multi-class UCI sets binarized one-vs-rest (smallest class as minority)","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","Clustering","k-NN neighborhood","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"Clusters the whole input space (all classes) with k-means, keeps clusters whose minority share exceeds an imbalance-ratio threshold, allocates samples by inverse minority density, and applies SMOTE within each selected cluster.","multiclass_handling":null,"builds_on":["SMOTE","k-means"],"baselines":["No oversampling","Random oversampling","SMOTE","Borderline-SMOTE1","Borderline-SMOTE2"],"n_datasets":"90 (12 UCI + undersampled variants, 19 KEEL, 10 simulated MADELON) + 5 2-D toy sets","classifiers":["Logistic regression","k-NN","Gradient boosting (GBM)"],"metrics":["G-mean","F1","AUPRC"],"limitations":"Choosing optimal k and other hyperparameters still relies on rules of thumb; future work: relate optimal hyperparameters to dataset properties and apply to other real-world problems.","code_url":"https://github.com/felix-last/kmeans_smote","read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1-1mPFa1PhFoS-xPWg37_YMgXfPEW4Yqj","label":"PDF"}],"uid":"P35","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Neighbour choice"],"smote_link":"Clusters the whole input space, keeps minority-dominated clusters, allocates samples by inverse minority density, and runs SMOTE inside each cluster.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"Binary datasets; multi-class UCI sets binarized one-vs-rest (smallest class as minority)","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Sample allocation","Seed selection"],"class_category":"Binary only","class_evidence_pdf":"All experiments two-class; a multiclass extension is said to be possible but not covered (Sec. 1, PDF p.4). 90 datasets (Abstract): 12 UCI sets plus randomly undersampled copies, 19 KEEL two-class sets and 10 simulated MADELON sets (Sec. 4.4, PDF p.14; Table 2, PDF p.15), plus 5 two-class 2-D toy sets (Figs. 10-14).","class_reduced":"Multiclass UCI sources (e.g. breast tissue, ecoli, glass, iris, libra, segment, vehicle, wine) turned into one-vs-rest problems with the smallest class as minority (Sec. 4.4, PDF p.14); KEEL sets are ready-made binary splits (Table 2).","class_multiclass_how":"","smote_explain":"k-means clusters the whole input space, and only clusters whose majority-to-minority ratio is below a threshold are kept, so seeds are minority points inside minority-dominated clusters (Sec. 3.1, PDF pp.7-8; Algorithm 1). Samples are shared across kept clusters in proportion to their sparsity, so sparse clusters get more (Sec. 3.1, PDF pp.8-9). Inside each cluster plain SMOTE runs on that cluster's points only, so partners come from the same cluster; placement is unchanged and there is no filtering. With one cluster and no threshold the method reduces to SMOTE (Sec. 3.2, PDF p.9).","pdf_check_note":"Add Neighbour choice (partner restricted to the same cluster). Evidence: 90 datasets (12 UCI plus undersampled variants, 19 KEEL, 10 MADELON). Neighbour choice debatable: only the candidate pool is restricted. Some minority counts in Table 2 look like merged classes rather than the smallest class.","pdf_checked":"28 Oct 2026"},{"file_id":"1gBhjMoQVtu1sk6-PqfO5RuHI7E11YCOk","acronym":"OBU","title":"Overlap-Based Undersampling for Improving Imbalanced Data Classification","authors":"Vuttipittayamongkol, Elyan, Petrovski, Jayne","year":2018,"venue":"IDEAL 2018 (LNCS 11341, Springer)","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"36 -Gaussian-mixture mode-specific normalization.","multiclass_handling":"Not a classifier; conditions on any discrete column with any number of categories via one-hot cond vector.","builds_on":["Conditional GAN","WGAN-GP","PacGAN","VAE"],"baselines":["CLBN","PrivBN","MedGAN","VeeGAN","TableGAN"],"n_datasets":"15 (7 simulated + 8 real: UCI, Kaggle credit, MNIST)","classifiers":["Decision Tree","Linear SVM","MLP"],"metrics":["Likelihood fitness (Lsyn, Ltest)","Accuracy","F1","R2"],"limitations":"Future work: derive a theoretical justification for why GANs can work on a distribution with both discrete and continuous data.","code_url":"https://github.com/DAI-Lab/CTGAN","read_status":"full","approach":"Deep generative","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"12J5xurnC4wZRavsb4XXYUj9ocXsOk4O0","label":"PDF"},{"folder":"Both","id":"1fbdBhn-6IR96LnKQxzPm5_LqxIEGo89Y","label":"Supplementary"}],"uid":"P38","paper_scope":"Binary+Multiclass","scope_differs":false,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"14E5TZ3e4lNZe8VWWCvWEF2vnfsbjGFlx","acronym":"G-SMOTE","title":"Geometric SMOTE: A geometrically enhanced drop-in replacement for SMOTE","authors":"Douzas, Bacao","year":2019,"venue":"Information Sciences","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"69 binary imbalanced datasets (UCI, KEEL, simulated MADELON) incl. undersampled variants","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["Geometric region","k-NN neighborhood","SMOTE interpolation"],"core_idea":"Around each minority center, picks a surface point (minority k-NN, nearest majority, or closer of both) setting the radius; samples uniformly in a hypersphere, then truncates and deforms it toward a hyper-spheroid.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["No oversampling","Random oversampling","SMOTE"],"n_datasets":"69 (13 UCI, 13 KEEL, 2 simulated MADELON + undersampled variants)","classifiers":["Logistic regression","k-NN","Decision tree","Gradient boosting"],"metrics":["AUC","F-score","G-mean"],"limitations":"Future work: test G-SMOTE as a drop-in replacement for SMOTE's generation step inside other SMOTE-based oversamplers.","code_url":"https://github.com/georgedouzas/scikit-learn-extensions/blob/master/sklearnext/over_sampling/geometric_smote.py","read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"14E5TZ3e4lNZe8VWWCvWEF2vnfsbjGFlx","label":"PDF"}],"uid":"P39","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Neighbour choice","Placement rule"],"smote_link":"Replaces the seed–neighbour segment with a hypersphere around the seed whose radius is set by the chosen neighbour, then truncates and deforms it toward that neighbour; strong truncation and deformation shrink it back toward the segment.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"69 binary imbalanced datasets (UCI, KEEL, simulated MADELON) incl. undersampled variants","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Placement rule"],"class_category":"Binary only","class_evidence_pdf":"All experiments two-class: 28 base datasets (13 UCI, 13 KEEL, 2 simulated MADELON) plus undersampled copies, 69 in total (Sec. 5.1, PDF p.18; Table 1, pp.18-19); binary AUC, F-score and G-mean (Sec. 5.2).","class_reduced":"Multiclass sources (e.g. iris, wine, glass, vehicle, segmentation, ecoli, libras, vowel, led, dermatology) appear as two-class sets in Table 1; how they were reduced is not stated.","class_multiclass_how":"","smote_explain":"Seeds and allocation are SMOTE-like (Sec. 4.1, PDF p.9). The surface point that sets the radius is chosen by a selection strategy: a random minority neighbour as in SMOTE, the nearest majority point, or whichever of the two is closer (Algorithm 1, PDF p.8; Sec. 4.3 step 4). The segment is replaced by a point drawn in a hypersphere around the seed with that radius, truncated and deformed into a hyper-spheroid along the seed-to-surface axis (Sec. 4.2; Sec. 4.3 steps 6-9, PDF pp.14-16). With full truncation and deformation and the minority strategy the region becomes SMOTE's segment (Sec. 5.4, PDF p.24).","pdf_check_note":"Add Neighbour choice: the majority or combined strategy can make a majority point the radius point. Evidence: 13 UCI + 13 KEEL + 2 MADELON, 69 with undersampled copies. The SMOTE special case gives SMOTE's support (the segment) but probably not its uniform lambda law.","pdf_checked":"28 Oct 2026"},{"file_id":"1lQRbdVR0IuupXcPeY7h0c9iaVlpM8ze2","acronym":"GAMO","title":"Generative Adversarial Minority Oversampling","authors":"Mullick, Datta, Das","year":2019,"venue":"ICCV","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Imbalanced 10-class MNIST, Fashion-MNIST, CIFAR10, SVHN; 5-class CelebA, LSUN; 50-class SUN397","data_type":["Image","Tabular"],"strategy":["Oversampling","Generative model"],"mechanism":["GAN","Deep learning (CNN)","Geometric region"],"core_idea":"Three-player game: a convex generator outputs minority samples as softmax-weighted convex combinations of class instances in feature space, trained to fool the classifier and a conditional discriminator, placing samples near class peripheries.","multiclass_handling":"Native: class-conditional generator with one instance-generation unit per minority class; class i sampled proportional to (Pc - Pi).","builds_on":["Conditional GAN","Least-squares GAN"],"baselines":["Baseline CN","SMOTE+CN","Oversample+CN","Augment+CN","cGAN/cDCGAN+CN","DOS","cG+CN","cG+D+CN","GAMO without D"],"n_datasets":"7 image datasets (MNIST, Fashion-MNIST, CIFAR10, SVHN, CelebA, LSUN, SUN397)","classifiers":["Classifier network (CNN feature extractor + dense layers)"],"metrics":["ACSA","G-mean","FID"],"limitations":"Future work: improve GAMO2pix image quality (e.g., BEGAN); reduce GAMO's tendency to overfit via improved GAN variants for few samples; learning new classes; GAN boundary distortion.","code_url":"https://github.com/SankhaSubhra/GAMO","read_status":"full","approach":"Deep generative","smote_based":true,"non_tabular":true,"folders":["Both"],"files":[{"folder":"Both","id":"1lQRbdVR0IuupXcPeY7h0c9iaVlpM8ze2","label":"PDF"},{"folder":"Both","id":"1uDhvVg56Sy7iRI5mhUAjJqHf0OuQ8lFg","label":"Supplementary"}],"uid":"P40","paper_scope":"Multiclass","scope_differs":true,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Neighbour choice","Placement rule","Inside a pipeline"],"smote_link":"Generalizes two-point interpolation to a convex combination of many minority instances: the GAN generator outputs the combination weights, so samples stay inside the class convex hull.","class_rule":"Multiclass rule","mc_strategy":"Per-class generator or region","class_rule_note":"Native: class-conditional generator with one instance-generation unit per minority class; class i sampled proportional to (Pc - Pi).","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Placement rule"],"class_category":"Binary + Multiclass","class_evidence_pdf":"Main paper: seven image datasets, all multiclass with selected classes kept: MNIST and Fashion-MNIST (10 classes, IR 100; Sec. 4.1, Table 1), CIFAR10 and SVHN (10 classes; Sec. 4.2, Table 2), CelebA and LSUN (5 classes, small and large; Sec. 4.3, Table 3), SUN397 (50 classes; Sec. 4.4, Table 4). Supplement (Sec. 4, Tables 7-8, p.8): GAMO also run on three two-class sets (Abalone19, IJCNN1, Magic) and two multiclass sets with all classes kept (Chess 18 classes, Cover Type 7).","class_reduced":"None in the main paper. Supplement uses Abalone19, the KEEL two-class version of Abalone (reduction not described); IJCNN1 and Magic are two-class by nature.","class_multiclass_how":"The c-1 minority classes are each filled up to the majority count (Sec. 3.1, p.1697); a shared class-conditional unit feeds one instance-generation unit per minority class, which outputs convex weights over that class's instances (Sec. 3.2, Eq. 1); labels of generated points are drawn in proportion to (Pc - Pi) (Alg. 1). One c-class classifier, no decomposition.","smote_explain":"GAMO creates each sample as a convex combination of all training points of a minority class (Eq. 1, Sec. 3.2, p.1697), not as a point on a seed-neighbour segment, so there is no single seed and no k-NN partner: a generator network learns the weights adversarially to place points near class peripheries that the classifier gets wrong. Generation runs inside end-to-end training that alternates generator, classifier and discriminator updates (Alg. 1, p.1698), usually in a learned feature space.","pdf_check_note":"Decided by P (28 Oct 2026): experiments reported in supplementary material count, so the two-class and multiclass tabular runs of the supplement (Tables 7-8) make GAMO Binary + Multiclass; on images alone it is Multiclass only. Core is debatable: the generator is a learned network and joins the family only through the convex-combination rule.","pdf_checked":"28 Oct 2026"},{"file_id":"1qFWXxXKmM8iLmnbzzAMT_dbvp6ag-yYw","acronym":"RBO","title":"Radial-Based oversampling for noisy imbalanced data classification","authors":"Koziarski, Krawczyk, Wozniak","year":2019,"venue":"Neurocomputing","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Sec 4.1: 34 two-class KEEL datasets (10 preliminary + 24 final analysis)","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["Radial basis/potential function","Evolutionary/optimization"],"core_idea":"Gaussian RBFs on majority (positive) and minority (negative) objects define a potential field; synthetic points start at random minority objects and hill-climb by random axis steps toward lower absolute potential (near decision border).","multiclass_handling":null,"builds_on":[],"baselines":["SMOTE","Borderline-SMOTE","SMOTE+TL","SMOTE+ENN","ADASYN","NCL","No resampling"],"n_datasets":"34 (KEEL): 10 preliminary + 24 final; with injected label and feature noise","classifiers":["CART","k-NN","SVM (RBF)","Naive Bayes"],"metrics":["Precision","Recall","G-mean","F-measure","AUC"],"limitations":"Weaker under feature noise with CART and k-NN; data-cleaning hybrids often better. Future: potential-based data cleaning, extension to multi-class problems, hybrid architectures with inbuilt mechanisms.","code_url":"https://github.com/michalkoziarski/RBO","read_status":"full","approach":"Oversampling","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1qFWXxXKmM8iLmnbzzAMT_dbvp6ag-yYw","label":"PDF"}],"uid":"P41","paper_scope":"Binary","scope_differs":true,"smote_rel":"Not counted","smote_via":[],"smote_link":"Moves points by hill climbing on an RBF potential field, not by interpolation."},{"file_id":"1XSRpT3VmHtzUREMRA7Ab5v4BgUK8Hpla","acronym":"SOUP","title":"Using information on class interrelations to improve classification of multiclass imbalanced data: A new resampling algorithm","authors":"Janicka, Lango, Stefanowski","year":2019,"venue":"Int. J. Appl. Math. Comput. Sci. (AMCS)","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"19 multi-class datasets: 15 real (UCI-based) + 4 synthetic, 1-5 minority classes","data_type":["Tabular"],"strategy":["Hybrid sampling","Undersampling","Oversampling"],"mechanism":["k-NN neighborhood","Borderline/safe-level weighting","Class-interrelation (multi-class)"],"core_idea":"Computes each example's safe level from its k-NN class composition weighted by class similarities; removes least-safe majority examples and duplicates safest minority examples until classes reach the mean of smallest-majority and largest-minority sizes.","multiclass_handling":"Native: majority classes undersampled largest-first venue":"Knowledge-Based Systems","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec 4.1: 20 multi-class KEEL datasets, with 0-25% injected label noise","data_type":["Tabular"],"strategy":["Oversampling","Data cleaning"],"mechanism":["Geometric region","Noise/overlap filtering","Adaptive sample weighting","Class-interrelation (multi-class)"],"core_idea":"Energy-limited spheres grow around each minority instance (cost rises per enclosed majority point); majority points inside are pushed to the sphere edge; synthetic minority sampled randomly inside spheres, more for smaller spheres.","multiclass_handling":"Iterative class-by-class in descending size; each class resampled against equal random subsets of larger classes, translations applied back.","builds_on":["CCR","MC-RBO"],"baselines":["SMOTE-all","STATIC-SMOTE","MDO","SMOM","SMOTE-IPF"],"n_datasets":"20 (KEEL), each at 6 label-noise levels (0-25%)","classifiers":["C5.0","MLP","k-NN","Naive Bayes"],"metrics":["AvAcc","CBA","mGM","CEN"],"limitations":"Future work: other cleaning-region shapes, robustness to other label-noise distributions and feature noise, parallelization for massive data/streams, application to real noisy (e.g., medical) data.","code_url":"https://github.com/michalkoziarski/MC-CCR","read_status":"full","approach":"Hybrid sampling","smote_based":false,"non_tabular":false,"folders":["Both","Multiclass"],"files":[{"folder":"Both","id":"1s5zMo4dtch11EBjKJXrjAAHIzGJV9TrL","label":"PDF"},{"folder":"Multiclass","id":"1un6dKVklmTv9AI6TB7PW8XYKR6hjuAlp","label":"PDF (copy)"}],"uid":"P46","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Not counted","smote_via":[],"smote_link":"Samples uniformly inside an energy sphere around each minority point, not along the direction to a neighbour."},{"file_id":"12CooZ3c_Z5KKRNe5LCdQSRvOd0I2WyVN","acronym":"MC-RBO","title":"Radial-Based Oversampling for Multiclass Imbalanced Data Classification","authors":"Krawczyk, Koziarski, Wozniak","year":2020,"venue":"IEEE TNNLS","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec IV-A: 20 multi-class imbalanced KEEL datasets","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["Radial basis/potential function","Evolutionary/optimization","Class-interrelation (multi-class)"],"core_idea":"Synthetic minority points start at random minority instances and are moved by random-direction hill climbing toward where mutual class potential (Gaussian RBF sums, majority minus minority) is near zero.","multiclass_handling":"Iterative class-by-class in descending size; each class oversampled against equal-size random subsets of all larger classes, including their synthetic samples.","builds_on":["RBO"],"baselines":["SMOTE-all","STATIC-SMOTE","MDO","SMOM","HTree","NB-SVM","AdaBoost.NC","SMOTEBagging","OVO + RUS/SMOTE/Borderline-SMOTE/ADASYN"],"n_datasets":"20 (KEEL)","classifiers":["C5.0","MLP","k-NN","Naive Bayes"],"metrics":["AvAcc","CBA","mGM","CEN"],"limitations":"Fewer synthetic samples hurt MLP and k-NN slightly; future work: robustness to label/feature noise, other similarity metrics for high-dimensional data, incremental/stream use.","code_url":"https://github.com/michalkoziarski/MultiClassRBO","read_status":"full","approach":"Oversampling","smote_based":false,"non_tabular":false,"folders":["Both","Multiclass"],"files":[{"folder":"Both","id":"12CooZ3c_Z5KKRNe5LCdQSRvOd0I2WyVN","label":"PDF"},{"folder":"Multiclass","id":"1w7q_Qkr4h5D3j7PPApBEbzgLkRkmCmfL","label":"PDF (copy)"}],"uid":"P47","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Not counted","smote_via":[],"smote_link":"Moves points by hill climbing on a multi-class RBF potential field, not by interpolation."},{"file_id":"1TyZkDJ6HCTtxK0QHigb1FOGCdYSL20AH","acronym":"NBU","title":"Neighbourhood-based undersampling approach for handling imbalanced and overlapped data","authors":"Vuttipittayamongkol, Elyan","year":2020,"venue":"Information S ,"core_idea":"Each iteration bins majority samples by classification hardness under the current ensemble and undersamples bins with weight 1/(mean hardness + alpha); alpha grows via tan, shifting focus to harder samples while keeping easy ones.","multiclass_handling":null,"builds_on":["Random undersampling","Self-paced learning","Gradient harmonizing (GHM)"],"baselines":["RandUnder","Neighbourhood Cleaning Rule","SMOTE","ADASYN","SMOTEENN","EasyEnsemble","BalanceCascade","RUSBoost","SMOTEBoost","SMOTEBagging"],"n_datasets":"6 (1 synthetic checkerboard + 5 real-world large-scale)","classifiers":["KNN","Decision Tree (C4.5)","SVM","MLP","Logistic Regression","AdaBoost","Random Forest","GBDT"],"metrics":["AUCPRC","F1","G-mean","MCC"],"limitations":null,"code_url":"https://github.com/ZhiningLiu1998/self-paced-ensemble","read_status":"full","approach":"Ensemble","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1vApVWeO1eS5XCrGkh7H4JjaFIwYV_bLw","label":"PDF"}],"uid":"P49","paper_scope":"Binary","scope_differs":true,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1WVOPeEJyvDqCZ6xgnz1kcnXOX7tvDpF0","acronym":"EMDO","title":"Evolutionary Mahalanobis Distance-Based Oversampling for Multi-Class Imbalanced Data Classification","authors":"Yao, Lin","year":2021,"venue":"Sensors (MDPI)","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"9 multi-class KEEL/UCI datasets + 2 multi-class sensor datasets (Shuttle, Mafalda)","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["Mahalanobis distance","Clustering","Evolutionary/optimization","Geometric region","Borderline/safe-level weighting","SMOTE interpolation"],"core_idea":"Each minority class is covered by several ellipsoids (Gustafson-Kessel clustering, sizes tuned by MOPSO for small volume, few misclassified points); synthetics allocated by inverse density, drawn inside; impure ellipsoids use Mahalanobis Borderline-SMOTE.","multiclass_handling":"Native: each minority class (size/Nmax below IR) gets its own ellipsoids; all other-class samples count as errors.","builds_on":["MDO","AMDO","Gustafson-Kessel clustering","MOPSO","Borderline-SMOTE"],"baselines":["C4.5 without sampling","Static-SMOTE","GCS (RESCALE)","AdaBoost.NC","OVO-SMOTE","MDO","MDO+","AMDO"],"n_datasets":"9 (KEEL, UCI) + 2 sensor datasets (Statlog Shuttle, Mafalda)","classifiers":["C4.5"],"metrics":["Pmin (smallest-class precision)","Pavg (mean per-class precision)","AUCm","MAUC"],"limitations":"Future work: apply EMDO to real-world IoT sensing data and integrate it with cost-sensitive methods.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"1WVOPeEJyvDqCZ6xgnz1kcnXOX7tvDpF0","label":"PDF"}],"uid":"P50","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Partial","smote_via":["Seed selection","Sample allocation","Neighbour choice","Placement rule"],"smote_link":"Draws most synthetic points inside Mahalanobis ellipsoids; only impure ellipsoids use a Mahalanobis version of Borderline-SMOTE interpolation.","class_rule":"Multiclass rule","mc_strategy":"Per-class generator or region","class_rule_note":"Native: each minority class (size/Nmax below IR) gets its own ellipsoids; all other-class samples count as errors.","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Placement rule"],"class_category":"Multiclass only","class_evidence_pdf":"9 KEEL/UCI sets with all classes kept (3 to 6 classes; Table 1, p.13) and 2 sensor sets (Shuttle 7, Mafalda 3; Table 6, p.16). Only two-class data is a toy illustration (Fig. 3). In 5 of the 11 sets only one class is oversampled.","class_reduced":"","class_multiclass_how":"Any class whose size ratio to the largest class is below the threshold is grown to N_max/IR (Eq. 1, p.4); each minority class gets its own ellipsoids fitted against all other classes (Eqs. 15-18).","smote_explain":"Each minority class is covered by Mahalanobis ellipsoids and its quota is split across them by inverse density times purity (Eqs. 32-34, p.11). In pure ellipsoids points are drawn along the ellipsoid axes without interpolation (Eqs. 37-40). In impure ellipsoids a modified Borderline-SMOTE interpolates: only borderline points are seeds, and the partner comes from their 5 Mahalanobis neighbours within the ellipsoid (Eqs. 41-42, p.12).","pdf_check_note":"Eq. 42 as printed points away from the partner (probable sign typo).","pdf_checked":"28 Oct 2026"},{"file_id":"158sVhWL_cG7GjnGlXyvV1JBebIYn7lu9","acronym":"HDE","title":"A hybrid data-level ensemble to enable learning from highly imbalanced dataset","authors":"Chen, Duan, Kang, Qiu","year":2021,"venue":"Information Sciences","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Targets binary tasks; 42 highly imbalanced binary datasets (28 KEEL, 14 LibSVM), IR 9.08 to 970.6","data_type":["Tabular"],"strategy":["Hybrid sampling","Ensemble"],"mechanism":["Bagging/random subspace","Adaptive sample weighting","SMOTE interpolation","k-NN neighborhood"],"core_idea":"Sequential bagging-style ensemble: each bootstrap keeps q% of majority via random sampling weighted by unsupervised ensemble margin, then interpolates minority toward nearest enemies chosen by Euclidean-plus-ensemble-disagreement distance with N(0,1) step.","multiclass_handling":null,"builds_on":["Bagging","SMOTE"],"baselines":["SMOTEBoost","EUSBoost","RUSBoost","SMOTEBagging","UnderBagging","EasyEnsemble","IIVotes","CBIS","SNGEIP","sNED"],"n_datasets":"42 (28 KEEL, 14 LibSVM)","classifiers":["C4.5"],"metrics":["AUC","G-mean"],"limitations":"Performance still depends on parameters k, lambda and q; defaults work reasonably, but per-task parameter search is suggested for further gains.","code_url":"https://github.com/smallcube/HD-Ensemble","read_status":"full","approach":"Ensemble","smote_based":true,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"158sVhWL_cG7GjnGlXyvV1JBebIYn7lu9","label":"PDF"}],"uid":"P51","paper_scope":"Binary","scope_differs":true,"smote_rel":"Core","smote_via":["Neighbour choice","Placement rule","Inside a pipeline"],"smote_link":"In each bagging member, interpolates minority points toward their nearest enemies (majority points) chosen by Euclidean plus ensemble-disagreement distance, with an N(0,1) step.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"Targets binary tasks; 42 highly imbalanced binary datasets (28 KEEL, 14 LibSVM), IR 9.08 to 970.6","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Neighbour choice","Placement rule","Inside a pipeline"],"class_category":"Binary only","class_evidence_pdf":"Targets binary tasks (Abstract; Sec. 2; Conclusion). 42 binary sets: 28 KEEL and 14 LibSVM (Sec. 4.1, Table 1, pp.9-10).","class_reduced":"KEEL x_vs_y and one-vs-rest splits of multiclass sources (Table 1); reduction not described.","class_multiclass_how":"","smote_explain":"The partner is one of the k = 5 nearest majority instances (nearest enemies), found with a mix of Euclidean distance and how often earlier ensemble members disagree on the two points (Sec. 3.3, Eqs. 3-4, pp.6-7). The step is x + r(x_i - x) with r drawn from N(0,1), so points cluster near the seed and can fall on either side of it (Eq. 5, p.8). Generation runs inside every member of a sequential bagging ensemble (Secs. 3.1-3.4).","pdf_check_note":"Seed selection and per-seed allocation are not stated.","pdf_checked":"28 Oct 2026"},{"file_id":"17eDnslcKmJbZ81yhKO23PuWldYNOij_N","acronym":"RSMOTE","title":"RSMOTE: A self-adaptive robust SMOTE for imbalanced problems with label noise","authors":"Chen, Xia, Chen, Wang et al.","year":2021,"venue":"Information Sciences","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"27 binary UCI + 8 multi-class UCI datasets, with 0-30% label noise","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Clustering","Borderline/safe-level weighting","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"Excludes minority samples whose k-NN are all majority; 2-means on relative density (heterogeneous/homogeneous k-NN distance ratio) splits borderline vs safe; per-sample quotas weighted by (k-m)/(k+1), m = majority neighbors; SMOTE within each group.","multiclass_handling":"Iterative class-by-class: each smaller class oversampled to largest class size; DOVO (one-vs-one) classifiers.","builds_on":["SMOTE"],"baselines":["SMOTE","Borderline-SMOTE1","Borderline-SMOTE2","AB-SMOTE","ADASYN","k-means SMOTE","No oversampling"],"n_datasets":"27 binary (UCI) + 8 multi-class (UCI) + 4 synthetic 2-D","classifiers":["AdaBoost","LR","DT","KNN","GBDT","DOVO (ANN, DT, kNN, LDA, LR, SVM)"],"metrics":["Precision","Recall","AUC","F1","G-mean","Macro-Recall","Macro-F1","Macro-G-mean"],"limitations":"Outlier resistance is limited; no noise removal from original data (original data sometimes best at 30% noise); future work on post-processing noise handling.","code_url":"https://github.com/syxiaa/RSMOTE","read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"17eDnslcKmJbZ81yhKO23PuWldYNOij_N","label":"PDF"}],"uid":"P52","paper_scope":"Binary+Multiclass","scope_differs":true,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation"],"smote_link":"Drops seeds whose neighbours are all majority, splits borderline from safe seeds by relative density, sets per-seed quotas, then runs SMOTE in each group.","class_rule":"Multiclass rule","mc_strategy":"To the largest class","class_rule_note":"Iterative class-by-class: each smaller class oversampled to largest class size; DOVO (one-vs-one) classifiers.","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection","Sample allocation"],"class_category":"Binary + Multiclass","class_evidence_pdf":"Two-class: 4 synthetic 2-D sets (Sec. 4.3.1, p.406) and 27 UCI sets used as binary (Table 2, p.409), each at 0-30% label noise. Multiclass: 8 UCI sets with all classes kept, 3 to 5 classes (Table 7, p.416; Sec. 4.3.3, pp.413-414), macro-averaged metrics (Eqs. 7-10, p.405). Same generator in both.","class_reduced":"Several of the 27 binary sets come from multiclass UCI sources (e.g. ecoli, iris, wine, segment, vehicle; Table 2, p.409); the reduction is not described but counts suggest one class vs the rest.","class_multiclass_how":"Every class smaller than the largest is oversampled with RSMOTE up to the largest class size (Sec. 4.3.3, p.413); classification uses diversified one-against-one classifiers (p.414).","smote_explain":"Minority points whose k neighbours are all majority are dropped as noise, and the remaining seeds are split into borderline and safe groups by 2-means on their relative density (Defs. 1-3, pp.401-402; Algorithm 1, p.403). Each group gets a share matching its size, and within a group each seed gets a weight (k-m)/(k+1), so safer seeds produce more points (Step 3, p.402). Points are made with SMOTE's own routine, uniform on the segment, once before training (Algorithm 1 line 22).","pdf_check_note":"Whether partners are limited to the seed's own group is not specified.","pdf_checked":"28 Oct 2026"},{"file_id":"13fFnaGVW1Ap9s1r8139AwjNjAmVOlUv1","acronym":"SMOTE Review","title":"SMOTE for Handling Imbalanced Data Problem: A Review","authors":"Pradipta, Wardoyo, Musdholifah, Sanjaya et al.","year":2021,"venue":"ICIC 2021 (IEEE)","paper_type":"Survey","class_setting":"Survey","class_setting_evidence":"Frames imbalance as minority vs majority; multi-class methods (FCM-SMOTE, MDO) only cited in passing","data_type":["Tabular"],"st
