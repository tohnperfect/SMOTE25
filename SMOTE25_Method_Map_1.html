<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMOTE25 Method Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one content column; summary tiles, a filter rail, then three views (table, approach x setting, year x setting) that share the four group columns. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eaeef2; --ink:#17212b; --muted:#56626e; --line:#d6dde4; --line-strong:#b9c3cd;
  --bin:#1d5c9f; --bin-bg:#e4edf7; --mul:#a9530a; --mul-bg:#faecdf; --both:#0d735c; --both-bg:#dff1eb;
  --ntab:#9c2f69; --ntab-bg:#f7e4ee; --sur:#4d5b69; --sur-bg:#e4e9ee; --focus:#1d5c9f; --shadow:0 10px 30px rgba(20,32,44,.18);
  --f-display:'Archivo Narrow','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#161d23; --sunk:#1c252d; --ink:#e3e9ee; --muted:#9ba7b2; --line:#29343e; --line-strong:#3b4855;
  --bin:#7fb2ea; --bin-bg:#16283b; --mul:#efa75e; --mul-bg:#33240f; --both:#52c8a7; --both-bg:#0f2f28;
  --ntab:#e690c0; --ntab-bg:#35172a; --sur:#b3c0cc; --sur-bg:#222c36; --focus:#7fb2ea; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#161d23; --sunk:#1c252d; --ink:#e3e9ee; --muted:#9ba7b2; --line:#29343e; --line-strong:#3b4855;
  --bin:#7fb2ea; --bin-bg:#16283b; --mul:#efa75e; --mul-bg:#33240f; --both:#52c8a7; --both-bg:#0f2f28;
  --ntab:#e690c0; --ntab-bg:#35172a; --sur:#b3c0cc; --sur-bg:#222c36; --focus:#7fb2ea; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:18px}
.wrap>*{min-width:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--bin)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
h1{font:700 2rem/1.05 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:.86rem}
.meta b{color:var(--ink);font-weight:500}

/* setting tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{--c:var(--ink);--cb:var(--sunk);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px 12px;cursor:pointer;display:grid;gap:2px;position:relative}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;border-radius:6px 0 0 6px;background:var(--c)}
.tile .lab{font:600 .95rem/1.2 var(--f-display);letter-spacing:.01em}
.tile .num{font:700 2rem/1 var(--f-display);color:var(--c)}
.tile .sub{font-size:.78rem;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--cb);border-color:var(--c)}
.tile[data-v="Binary"]{--c:var(--bin);--cb:var(--bin-bg)}
.tile[data-v="Multiclass"]{--c:var(--mul);--cb:var(--mul-bg)}
.tile[data-v="Binary+Multiclass"]{--c:var(--both);--cb:var(--both-bg)}
.tile[data-v="Survey"]{--c:var(--sur);--cb:var(--sur-bg)}
.tile[data-v="nontab"]{--c:var(--ntab);--cb:var(--ntab-bg)}
.legend-note{font-size:.78rem;color:var(--muted);margin-top:-8px}

/* SMOTE-family definition */
.defbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--both);border-radius:6px;padding:10px 14px}
.defbox summary{cursor:pointer;font:600 .95rem/1.4 var(--f-display);letter-spacing:.01em}
.defbox summary .n{font:400 .78rem var(--f-mono);color:var(--muted);margin-left:8px}
.defbox p{margin:8px 0 0;max-width:96ch;font-size:.86rem}
.defbox code{font-family:var(--f-mono);font-size:.82rem;background:var(--sunk);padding:0 4px;border-radius:3px}
.defbox dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;margin:10px 0 0;font-size:.84rem;max-width:96ch}
.defbox dt{font-weight:600}
.defbox dt .n{font:400 .74rem var(--f-mono);color:var(--muted);margin-left:4px}
.defbox dd{margin:0;color:var(--muted)}
.rel{display:inline-block;font:600 .72rem/1.5 var(--f-display);letter-spacing:.03em;padding:0 7px;border-radius:3px;white-space:nowrap;color:var(--sur);background:var(--sur-bg)}
.rel-Core,.rel-Partial{color:var(--both);background:var(--both-bg)}
.rel-Partial{background:transparent;box-shadow:inset 0 0 0 1px var(--both)}
.sfmark{display:block;margin-top:4px}
.via{display:inline-block;font-size:.72rem;color:var(--both);border:1px solid var(--both);border-radius:3px;padding:0 5px;margin:2px 3px 0 0;line-height:1.5}
.linktxt{margin:4px 0 0}
@media (max-width:760px){.defbox dl{grid-template-columns:minmax(0,1fr)}.defbox dd{margin-bottom:4px}}

/* filter rail */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:10px}
.rail-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--focus)}
.count{font-size:.86rem;color:var(--muted);white-space:nowrap}
.count b{color:var(--ink);font-family:var(--f-mono)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:6px 11px;cursor:pointer;font-size:.84rem;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.groups{display:flex;flex-wrap:wrap;gap:8px 22px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.glab{font:600 .72rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.f{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.f:hover{border-color:var(--line-strong)}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f .code{font-family:var(--f-mono);font-size:.7rem;opacity:.7}
.f .n{font-family:var(--f-mono);font-size:.7rem;opacity:.65}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 14px;cursor:pointer;font:600 .95rem/1 var(--f-display);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* badges */
.badge{display:inline-block;font:600 .72rem/1.5 var(--f-display);letter-spacing:.03em;padding:0 7px;border-radius:3px;white-space:nowrap}
.b-Binary{color:var(--bin);background:var(--bin-bg)}
.b-Multiclass{color:var(--mul);background:var(--mul-bg)}
.b-Binary\+Multiclass{color:var(--both);background:var(--both-bg)}
.b-Survey{color:var(--sur);background:var(--sur-bg)}
.dt{font-size:.8rem}
.dt .nt{color:var(--ntab);font-weight:600}
.tag{display:inline-block;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin:2px 3px 0 0;line-height:1.5}
.flag{display:inline-block;font:500 .68rem/1.5 var(--f-mono);color:var(--ntab);background:var(--ntab-bg);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}

/* table view */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table.cat{width:100%;border-collapse:collapse;min-width:900px}
table.cat th{position:sticky;top:0;background:var(--surface);text-align:left;font:600 .74rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:11px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
table.cat th button{border:0;background:none;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
table.cat th button[data-dir]::after{content:attr(data-dir);margin-left:4px}
table.cat td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row:hover td{background:var(--sunk)}
tr.row.open td{background:var(--sunk);border-bottom-color:transparent}
.c-year{width:58px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.c-method{width:200px}
.rowbtn{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:grid;gap:1px}
.rowbtn .ac{font:700 1rem/1.2 var(--f-display);color:var(--ink)}
.rowbtn .au{font-size:.76rem;color:var(--muted)}
.rowbtn .ac::after{content:"+";font-family:var(--f-mono);font-weight:400;color:var(--muted);margin-left:6px}
tr.open .rowbtn .ac::after{content:"\2212"}
.c-set{width:128px}.c-data{width:110px}.c-appr{width:120px;font-size:.84rem}
.idea{max-width:62ch}
.idea p{margin:0 0 3px}
tr.detail td{padding:0 10px 16px;background:var(--sunk);border-bottom:1px solid var(--line-strong)}

/* detail block (shared by table rows and the modal) */
.dgrid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:6px 16px;font-size:.86rem;max-width:1000px}
.dgrid dt{font:600 .74rem/1.6 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dgrid dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dtitle{font:600 1.02rem/1.35 var(--f-body);margin:12px 0 10px;max-width:80ch}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files a{font-size:.8rem;text-decoration:none;border:1px solid var(--line-strong);border-radius:4px;padding:1px 7px;background:var(--surface)}
.files a:hover{border-color:var(--bin)}
.warnline{color:var(--ntab);font-size:.8rem}

/* matrix + timeline */
.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table.mx{width:100%;border-collapse:collapse;min-width:780px;table-layout:fixed}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top;text-align:left}
table.mx td+td,table.mx th+th{border-left:1px solid var(--line)}
table.mx thead th{font:600 .9rem/1.2 var(--f-display);padding-top:12px;padding-bottom:12px}
table.mx thead th .n{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px}
table.mx thead th.h-Binary{color:var(--bin);box-shadow:inset 0 3px 0 var(--bin)}
table.mx thead th.h-Multiclass{color:var(--mul);box-shadow:inset 0 3px 0 var(--mul)}
table.mx thead th.h-Both{color:var(--both);box-shadow:inset 0 3px 0 var(--both)}
table.mx thead th.h-Survey{color:var(--sur);box-shadow:inset 0 3px 0 var(--sur)}
table.mx thead th:first-child{width:150px}
table.tl thead th:first-child{width:90px}
table.fl thead th.h-Core{color:var(--both);box-shadow:inset 0 3px 0 var(--both)}
table.fl thead th.h-Partial{color:var(--both);box-shadow:inset 0 3px 0 var(--both-bg),inset 0 -1px 0 var(--line)}
table.fl thead th.h-Study{color:var(--sur);box-shadow:inset 0 3px 0 var(--sur)}
table.fl thead th.h-Not{color:var(--muted);box-shadow:inset 0 3px 0 var(--line-strong)}
table.fl thead th.h-Other{color:var(--muted)}
table.fl tbody th .cum{display:block;font:400 .7rem/1.4 var(--f-mono);color:var(--both)}
table.mx tbody th{font:600 .9rem/1.25 var(--f-display)}
table.rm tbody th .d{display:block;font:400 .74rem/1.4 var(--f-body);color:var(--muted);margin-top:3px}
table.rm thead th:first-child{width:200px}
.stratbox{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:8px}
.stratbox h3{margin:0;font:600 .95rem/1.3 var(--f-display)}
.stratbox dl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 14px;margin:0}
.stratbox dt{font-weight:600;font-size:.86rem}
.stratbox dd{margin:0}
@media (max-width:760px){.stratbox dl{grid-template-columns:minmax(0,1fr)}}
table.mx tbody th .code{display:block;font:500 .72rem/1.4 var(--f-mono);color:var(--muted)}
table.mx tbody th .n{font:400 .74rem/1.4 var(--f-mono);color:var(--muted)}
table.tl tbody th{width:80px;font:500 .95rem/1.3 var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:.8rem;line-height:1.35;display:inline-flex;align-items:baseline;gap:5px}
.chip:hover{border-color:var(--ink)}
.chip .y,.chip .cd{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.chip.s-Binary{border-left:3px solid var(--bin)}
.chip.s-Multiclass{border-left:3px solid var(--mul)}
.chip.s-Binary\+Multiclass{border-left:3px solid var(--both)}
.chip.s-Survey{border-left:3px solid var(--sur)}
.empty{color:var(--line-strong);font-family:var(--f-mono)}
.codes{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);padding:2px 2px 0}
.codes b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.none{padding:28px;text-align:center;color:var(--muted)}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,16,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(48px,env(safe-area-inset-top,0px)) 16px 24px;z-index:20;overflow-y:auto}
.panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:min(860px,100%);padding:18px 20px 22px;display:grid;gap:4px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel-head h2{margin:0;font:700 1.5rem/1.1 var(--f-display)}
.panel-head .sub{color:var(--muted);font-size:.84rem;margin-top:4px}
.panel textarea{width:100%;min-height:320px;font:12px/1.45 var(--f-mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:5px;font-size:.86rem;z-index:30}
.err{background:var(--ntab-bg);color:var(--ntab);border:1px solid var(--ntab);border-radius:6px;padding:10px 12px;font-family:var(--f-mono);font-size:.8rem}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .wrap{padding-inline:16px}
  h1{font-size:1.6rem}
  table.cat{min-width:0}
  table.cat thead{display:none}
  table.cat,table.cat tbody,table.cat tr,table.cat td{display:block;width:auto}
  tr.row{display:grid!important;grid-template-columns:3.4rem minmax(0,1fr);column-gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  tr.row td{border:0;padding:2px 0;background:transparent!important}
  tr.row .c-year{grid-row:1 / span 5}
  tr.row .c-set,tr.row .c-data,tr.row .c-appr{display:inline-block}
  tr.detail td{padding:4px 12px 14px}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .dgrid dt{margin-top:6px}
}
@media (prefers-reduced-motion:no-preference){.tile,.f,.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>


<div class="wrap" id="app">
  <header class="top">
    <h1>SMOTE25 Method Map</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="tiles" id="tiles"></div>
  <div class="legend-note">Group = Drive folder. A paper in the Binary or Multiclass folder counts only there, even when a copy is also in Both; Both = Binary + Multiclass. Each record also shows the classes used in the paper's own experiments.</div>

  <details class="defbox" id="defbox"></details>

  <section class="rail" aria-label="Filters">
    <div class="rail-top">
      <label class="search" for="q"><span class="mono" aria-hidden="true">/</span><input id="q" type="search" placeholder="Search method, author, mechanism, baseline, dataset" autocomplete="off"></label>
      <span class="count" id="count"></span>
      <button class="btn ghost" data-act="reset" type="button">Reset</button>
      <button class="btn" data-act="latex" type="button">Copy LaTeX</button>
      <button class="btn" data-act="csv" type="button">Copy CSV</button>
    </div>
    <div class="groups" id="groups"></div>
  </section>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-act="view" data-v="table" id="tab-table" type="button">Table</button>
    <button class="tab" role="tab" data-act="view" data-v="matrix" id="tab-matrix" type="button">Approach × group</button>
    <button class="tab" role="tab" data-act="view" data-v="timeline" id="tab-timeline" type="button">Year × group</button>
    <button class="tab" role="tab" data-act="view" data-v="flags" id="tab-flags" type="button">Year × flag</button>
    <button class="tab" role="tab" data-act="view" data-v="rule" id="tab-rule" type="button">Rule × tested</button>
    <button class="tab" role="tab" data-act="view" data-v="cat" id="tab-cat" type="button">Class category</button>
  </div>

  <div id="view"></div>
</div>
<div id="overlay" class="ov" hidden></div>

ood","Geometric region"],"core_idea":"Condenses NN design set to boundary points: Method 1 adds nearest opposite-class boundary points when CNN misclassifies; Method 2 keeps opposite-class pairs whose midpoint-centered sphere holds no other sample, then applies CNN.","multiclass_handling":null,"builds_on":["CNN (Hart 1968)"],"baselines":["CNN","Selective NN rule (Ritter et al. 1975)"],"n_datasets":"1 synthetic 2-D two-class set (400 samples, uniform, irregular boundary)","classifiers":["1-NN"],"metrics":["Reduced design-set size","Decision boundary fidelity (visual)"],"limitations":null,"code_url":null,"read_status":"partial","approach":"Undersampling","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1X2CfrCtIwUs-lF5x7lzAs8LbIFvcgOOq","label":"PDF"}],"uid":"P02","paper_scope":"Binary","scope_differs":true,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1nQ49OEOPGSH-PjyDTl5YXwzhGO-sBaip","acronym":"AdaBoost","title":"A Decision-Theoretic Generalization of On-Line Learning and an Application to Boosting","authors":"Freund, Schapire","year":1997,"venue":"Journal of Computer and System Sciences (JCSS)","paper_type":"Foundational","class_setting":"Binary+Multiclass","class_setting_evidence":"Sec 4: binary AdaBoost; Sec 5: multi-class AdaBoost.M1 and AdaBoost.M2 (plus AdaBoost.R regression); theoretical, no experiments","data_type":["General"],"strategy":["Ensemble"],"mechanism":["Boosting","Adaptive sample weighting"],"core_idea":"Hedge multiplicative weight update applied to boosting: maintain a distribution over training examples, multiply weights of correctly classified examples by beta=err/(1-err), combine weak hypotheses by vote weighted log(1/beta). Not imbalance-specific.","multiclass_handling":"AdaBoost.M1 (weak learner error must be below 1/2) and AdaBoost.M2 (pseudo-loss over incorrect labels); ECOC binarization noted as alternative.","builds_on":["Weighted Majority (Littlestone-Warmuth)"],"baselines":[],"n_datasets":"0 (theoretical paper; no experiments)","classifiers":[],"metrics":[],"limitations":"AdaBoost.M1 needs weak hypotheses with error below 1/2, too strong for k>2 classes (motivates M2); SRM bounds may be loose, picking too few rounds; AdaBoost.R lacks trivial 1/2-loss hypothesis.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1nQ49OEOPGSH-PjyDTl5YXwzhGO-sBaip","label":"PDF"}],"uid":"P03","paper_scope":"Binary+Multiclass","scope_differs":false,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1OdoqDWkQSturmgk9F8bx5u_PgHLVdsjz","acronym":"OSS","title":"Addressing the Curse of Imbalanced Training Sets: One-Sided Selection","authors":"Kubat, Matwin","year":1997,"venue":"ICML","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"7 two-class domains; UCI glass, vowel, vehicle reduced to one class vs rest","data_type":["Tabular"],"strategy":["Undersampling","Data cleaning"],"mechanism":["k-NN neighborhood","Noise/overlap filtering"],"core_idea":"Keeps all minority examples; builds a 1-NN-consistent subset (Hart CNN variant: all positives plus one random negative, add misclassified) to drop redundant negatives, then deletes negatives in Tomek links as borderline/noisy.","multiclass_handling":null,"builds_on":["CNN (Hart)","Tomek links"],"baselines":["No sampling (full training set)","CNN-reduced set only"],"n_datasets":"7 (2 oil-spill, 2 sleep classification, 3 UCI)","classifiers":["1-NN","C4.5"],"metrics":["G-mean","Accuracy on positives (a+)","Accuracy on negatives (a-)","Accuracy"],"limitations":"Experiments addressed only 2-class problems (multi-class extension believed possible); gains small or negative on glass and vowels; apply only when a+ and a- are unbalanced.","code_url":null,"read_status":"full","approach":"Undersampling","smote_based":false,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1Odoq tting_evidence":"9 two-class datasets; Satimage and Forest Cover reduced to two classes","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood"],"core_idea":"For each minority example, chooses among its k=5 minority nearest neighbours and creates synthetic points at random positions on the connecting line segments; combined with random majority undersampling to sweep ROC curves.","multiclass_handling":null,"builds_on":[],"baselines":["Random undersampling","Random oversampling (replication)","Ripper loss ratio","Naive Bayes prior adjustment","C4.5 leaf threshold tuning","One-sided selection","SHRINK"],"n_datasets":"9 (UCI, ELENA, Oil, Mammography, E-state, Can)","classifiers":["C4.5","Ripper","Naive Bayes"],"metrics":["AUC","ROC convex hull","Accuracy on positives (Acc+)","Accuracy on negatives (Acc-)"],"limitations":"Future work: adaptive choice of k, other synthetic generation strategies, neighbour selection focused on misclassified examples; SMOTE-NC underperformed undersampling on Adult; all-nominal data not handled.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary","Both"],"files":[{"folder":"Both","id":"1xlt-DjX5xgyghFZOBng_MBCD9rpKnZ2h","label":"PDF"},{"folder":"Binary","id":"1QNibmYJDDccj-q4MtzzMWo-mh8ssyKWt","label":"PDF (copy)"}],"uid":"P06","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":[],"smote_link":"Defines the rule: each synthetic point is x + λ(x_nn − x) with λ ~ U(0,1), where x_nn is one of the k = 5 minority nearest neighbours of seed x.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"9 two-class datasets; Satimage and Forest Cover reduced to two classes","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":[],"class_category":"Binary only","class_evidence_pdf":"9 datasets, all used as two classes (Sec 5.1, pp.333-334; Table 2, p.334): Pima, Phoneme, Adult, E-state, Satimage, Forest Cover, Oil, Mammography, Can; Adult also run with SMOTE-NC (Sec 6.1, pp.348-349). The paper focuses on two-class problems; a multiclass use is stated but not run (pp.333-334).","class_reduced":"Satimage (6 classes): smallest class vs the other 5 merged (Sec 5.1 item 5, p.333). Forest Cover (7 classes): only Ponderosa Pine and Cottonwood/Willow kept, the other classes dropped (Sec 5.1 item 6, pp.333-334).","class_multiclass_how":"","smote_explain":"This paper defines the reference rule and changes none of the six decision points: every minority sample is a seed with N/100 points each (a random N% of seeds when N < 100), the partner is drawn from the k = 5 minority nearest neighbours, and lambda ~ U(0,1) on the segment (Sec 4.2, p.328; algorithm, p.329). Generation runs once before training, combined with random undersampling of the majority (Sec 4.3, p.331). SMOTE-NC changes only the distance used to find neighbours and sets nominal values by a vote of the neighbours (Sec 6.1, p.348).","pdf_check_note":"Forest Cover was cut to two of its seven classes, not merged. SMOTE-NC (run, binary) and SMOTE-N (proposed only) are extra variants; SMOTE-NC changes Neighbour choice.","pdf_checked":"28 Oct 2026"},{"file_id":"1BDWkAouBggfwiVzTId6e_yT6lNQPjXus","acronym":"SMOTEBoost","title":"SMOTEBoost: Improving Prediction of the Minority Class in Boosting","authors":"Chawla, Lazarevic, Hall, Bowyer","year":2003,"venue":"PKDD 2003 (LNAI 2838)","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Table 2: KDDCup-99 with 5 classes (minority U2R, R2L) plus three 2-class datasets (mammography, satimage, phoneme)","data_type":["Tabular"],"strategy":["Oversampling","Ensemble"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Boosting"],"core_idea":"AdaBoost.M2 variant that, in each boosting round, generates N% SMOTE synthetic examples for the minority class(es) from the current weighted distribution, trains the weak learner, then discards them; pseudo-loss computed on original data.","multiclass_handling":"Native AdaBoost.M2 over C classes; SMOTE applied per minority class with class-specific amounts (e.g., U2R and R2L in KDDCup-99).","builds_on":["SMOTE","AdaBoost.M2"],"baselines":["RIPPER","AdaBoost","SMOTE+RIPPER","SMOTE then AdaBoost","AdaCost"],"n_datasets":"4 (KDDCup-99, Mammography, Satimage, Phoneme)","classifiers":["RIPPER"],"metrics":["Precision","Recall","F-value"],"limitations":"Amount of SMOTE must be set manually (automatic determination is future work); effect of mislabeling noise not studied, as boosting performs poorly with noise.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":true,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1BDWkAouBggfwiVzTId6e_yT6lNQPjXus","label":"PDF"}],"uid":"P07","paper_scope":"Binary+Multiclass","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Inside a pipeline"],"smote_link":"Runs unchanged SMOTE inside every AdaBoost.M2 round, so each weak learner sees fresh synthetic minority points; they are discarded after the round.","class_rule":"Multiclass rule","mc_strategy":"Through the ensemble","class_rule_note":"Several classes are handled by AdaBoost.M2, not by SMOTE: the formal algorithm names one minority class (Fig. 1, p.111), and in the 5-class KDDCup-99 run each minority class (U2R, R2L) gets a hand-set SMOTE amount (Sec. 4, p.112). Only U2R results are tabulated (Table 3).","class_rule_source":"PDF checked 28 Oct 2026","smote_via_v1":["Inside a pipeline"],"class_category":"Binary + Multiclass","class_evidence_pdf":"4 datasets (Sec 4, Table 2, p.112): KDDCup-99 with all 5 classes kept (DoS, Probe, Normal, U2R, R2L); Mammography and Phoneme (two-class); Satimage (reduced to two). Results tabulated only for U2R (Table 3, p.113); R2L omitted for space. RIPPER base learner (p.111).","class_reduced":"Satimage: smallest class vs the rest merged (p.112). KDDCup-99 not reduced; only DoS and Normal subsampled for size (p.112).","class_multiclass_how":"AdaBoost.M2 core over labels {1..C} (Fig. 1, p.111); on KDDCup-99 SMOTE is applied separately to each minority class (U2R at 100/300/500%, R2L at 100%) (p.112); the other three classes are not oversampled.","smote_explain":"The generator is unchanged SMOTE (Sec 2, p.109), but it runs inside every AdaBoost.M2 round and the synthetic points are discarded after the round (Sec 3, p.110; Fig. 1, p.111). New points are created by sampling seeds from the round's boosting distribution, which the authors say focuses generation on misclassified or boundary minority cases (pp.110, 116). Allocation, partner, placement and the absence of filtering are as in SMOTE.","pdf_check_note":"Add Seed selection (seeds drawn from the boosting distribution D_t), flagged as debatable. How seeds are drawn from D_t is not formalised. The formal algorithm names one minority class; multiclass handling comes from AdaBoost.M2 with hand-set per-class amounts, and only U2R results are reported.","pdf_checked":"28 Oct 2026"},{"file_id":"1ZgiHn_vxEtv_TKLAT7rpe69s5wdEoxMt","acronym":"SMOTE-Tomek / SMOTE-ENN","title":"A Study of the Behavior of Several Methods for Balancing Machine Learning Training Data","authors":"Batista, Prati, Monard","year":2004,"venue":"SIGKDD Explorations","paper_type":"Empirical study","class_setting":"Binary","class_setting_evidence":"15 two-class sets from 13 UCI datasets; multi-class collapsed to smallest class vs rest","data_type":["Tabular"],"strategy":["Hybrid sampling","Oversampling","Undersampling","Data cleaning"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Noise/overlap filtering"],"core_idea":"SMOTE oversamples minority to balance, then cleans both classes: removes all Tomek-link pairs (SMOTE+Tomek) or any example misclassified by its 3 nearest neighbours via ENN (SMOTE+ENN); also proposes CNN followed by Tomek undersampling.","multiclass_handling":null,"builds_on":["SMOTE","Tomek links","ENN (Wilson)","CNN (Hart)","One-sided selection"],"baselines":["No sampling","Random oversampling","Random undersampling","SMOTE","Tomek links","CNN","One-sided selection","Neighborhood Cleaning Rule (NCL)"],"n_datasets":"15 (13 UCI; Letter and Splice each split into two)","classifiers":["C4.5 (pruned and unpruned)"],"metrics":["AUC","Number of rules","Conditions per rule"],"limitations":"Balanced 50/50 class distribution not always optimal (future work); Tomek links and NCL cannot set the resulting class distribution; ROC curves not yet analyzed.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Binary","Both"],"files":[{"folder":"Both","id":"1ZgiHn_vxEtv_TKLAT7rpe69s5wdEoxMt","label":"PDF"},{"folder":"Binary","id":"1ZE9_sBYlNd8f-v-0ncOXpDAHvL5lhvA3","label":"PDF (copy)"}],"uid":"P08","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Post-filtering"],"smote_link":"Applies standard SMOTE, then cleans the class overlap SMOTE creates by removing Tomek-link pairs or ENN-misclassified examples from both classes.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"15 two-class sets from 13 UCI datasets; multi-class collapsed to smallest class vs rest","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Post-filtering"],"class_category":"Binary only","class_evidence_pdf":"15 two-class datasets built from 13 UCI sources (Sec. 5, Table 3, pp.24-25); the paper considers only two-class problems (Sec. 4.1, p.22). C4.5, 10-fold CV, AUC (Tables 4-7).","class_reduced":"Smallest class vs the rest merged (Sec. 5, p.24), e.g. Vehicle van, New-thyroid hypo, E.Coli iMU, Satimage 4, Flag white, Glass, Nursery; Letter gives Letter-a (a vs rest) and Letter-vowel (all vowels vs rest); Splice gives two one-vs-rest sets (Table 3).","class_multiclass_how":"","smote_explain":"SMOTE first balances the training set (Sec. 5, p.25); then Tomek-link pairs are removed from both classes, or, in the ENN variant, every example misclassified by its 3 nearest neighbours is removed from both classes (Sec. 4.3, pp.23-24; Fig. 2). Seeds, neighbours and placement are as in SMOTE; the only addition is cleaning after generation.","pdf_check_note":"None to category or decision points. Evidence text: not every set is smallest class vs rest (Letter-vowel merges vowels; Splice gives two sets). Uses HVDM for k-NN (Sec. 4.2, p.22); whether SMOTE's own neighbour search uses HVDM is not stated. Cleaning removes original as well as synthetic examples.","pdf_checked":"28 Oct 2026"},{"file_id":"1cTusbQn1EiESN3UOguh2OlXl-fPgZ3or","acronym":"Borderline-SMOTE","title":"Borderline-SMOTE: A New Over-Sampling Method in Imbalanced Data Sets Learning","authors":"Han, Wang, Mao","year":2005,"venue":"ICIC 2005 (LNCS 3644)","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"4 two-class datasets: synthetic Circle, Pima, Haberman, Satimage (class 4 vs rest)","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting"],"core_idea":"Marks minority examples whose m nearest neighbours are mostly but not all majority as DANGER; applies SMOTE only to them (v1: toward minority neighbours; v2: also toward nearest majority neighbour with gap at most 0.5).","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["SMOTE","Random oversampling","No sampling (C4.5)"],"n_datasets":"4 (3 UCI + 1 synthetic)","classifiers":["C4.5"],"metrics":["TP rate","F-value"],"limitations":"Future work: other DANGER definitions, adaptive number of DANGER examples, combining with undersampling and learners; borderline-SMOTE2 causes class overlap that lowers F-value.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary","Both"],"files":[{"folder":"Binary","id":"1cTusbQn1EiESN3UOguh2OlXl-fPgZ3or","label":"PDF"},{"folder":"Both","id":"1mv_9t9bDf7fh5sMddMcltE3he7zawSyG","label":"PDF (copy)"}],"uid":"P09","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Neighbour choice","Placement rule"],"smote_link":"Interpolates only from DANGER seeds near the class border; v2 also interpolates toward the nearest majority neighbour with λ ≤ 0.5.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"4 two-class datasets: synthetic Circle, Pima, Haberman, Satimage (class 4 vs rest)","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection","Neighbour choice","Placement rule"],"class_category":"Binary only","class_evidence_pdf":"4 datasets used as two-class problems (Sec. 4, Table 2, p.883): Circle (simulated), Pima, Satimage (class 4 vs the rest), Haberman. The paper studies only two-class problems (Sec. 4, p.883). C4.5, 3 x 10-fold CV, TP rate and F-value (p.884).","class_reduced":"Satimage: class 4 vs all remaining classes merged (Sec. 4, p.883; Table 2).","class_multiclass_how":"","smote_explain":"For each minority point its m nearest neighbours in the whole training set are found (Sec. 3, Steps 1-2, p.882); points with only majority neighbours are treated as noise, and points with at least half majority neighbours form the DANGER set, which are the only seeds. In v1 each DANGER seed interpolates towards s of its k = 5 minority neighbours with lambda ~ U(0,1) as in SMOTE (Step 4, p.882). v2 also interpolates towards the seed's nearest majority neighbour with lambda in (0, 0.5), so those points stay near the seed (pp.882-883).","pdf_check_note":"None. Neighbour choice and Placement rule change only in v2; v1 changes only Seed selection. Distance metric not stated; m tuned so that DANGER holds about half of the minority class (p.884).","pdf_checked":"28 Oct 2026"},{"file_id":"1q9NlHTckoHw8AAG61d-68Y6t8hLFLtFJ","acronym":"Cluster-SMOTE","title":"Combating Imbalance in Network Intrusion Datasets","authors":"Cieslak, Chawla, Striegel","year":2006,"venue":null,"paper_type":"New method","class_setting":"Binary","class_setting_evidence":"2 intrusion datasets (Packets, Destinations) labeled intrusive vs non-intrusive as 2-class problem","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling"],"mechanism":["Clustering","SMOTE interpolation"],"core_idea":"Runs k-means (3 or 5 centroids) on minority examples only, applies SMOTE within each cluster, then merges synthetic and original minority examples; majority randomly undersampled at several levels to trace ROC curves.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["SMOTE","Random oversampling (replication)","Random undersampling","RIPPER loss ratio"],"n_datasets":"2 (Notre Dame network traffic: Packets, Destinations)","classifiers":["RIPPER"],"metrics":["ROC curve (TP rate vs FP rate)","ROC convex hull"],"limitations":"Simple k-means localization is limited (hyper-rectangles planned); Cluster-SMOTE unusable on Destinations (minority formed one cluster); needs evaluation on other datasets.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1q9NlHTckoHw8AAG61d-68Y6t8hLFLtFJ","label":"PDF"}],"uid":"P10","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Neighbour choice"],"smote_link":"Clusters the minority class with k-means and runs SMOTE inside each cluster, so seed and neighbour always come from the same cluster.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"2 intrusion datasets (Packets, Destinations) labeled intrusive vs non-intrusive as 2-class problem","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Neighbour choice"],"class_category":"Binary only","class_evidence_pdf":"Two datasets built by the authors from Notre Dame campus traffic (Sec. II, p.2): Packets (346,620 instances, 2,106 alerts) and Destinations (4,080 instances, 147 alerts) (Table I, p.2), both treated as intrusive vs not intrusive (Sec. II, p.2). Cluster-SMOTE was run only on Packets with 3 and 5 k-means clusters (Sec. V-A, Fig. 4, p.5); on Destinations the minority formed one cluster (Sec. V-B, pp.5-6).","class_reduced":"No benchmark multiclass dataset; SNORT attack-type labels are collapsed to intrusive vs not (Sec. II, p.2).","class_multiclass_how":"","smote_explain":"k-means is run on the minority examples only and SMOTE is applied separately inside each cluster, after which original and synthetic minority points are merged (Sec. III-C, p.4). The interpolation partner therefore always comes from the seed's own cluster; seeds, the SMOTE rate per cluster and uniform placement on the segment are as in SMOTE (Sec. III-B, p.3; Sec. V-A, p.5).","pdf_check_note":"Evidence for Cluster-SMOTE comes from one dataset (Packets); on Destinations clustering collapses to one cluster, i.e. plain SMOTE. Number of clusters set by the user; SMOTE k not stated.","pdf_checked":"28 Oct 2026"},{"file_id":"1zOM06qCMIDnpzxQk1T3n7xZhR03KEvOe","acronym":"COG-OS","title":"Local Decomposition for Rare Class Analysis","authors":"Wu, Xiong, Wu, Chen","year":2007,"venue":"KDD 2007","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"6 sampled binary + 2 KDD99 binary sets; multi-class page-blocks, k1b, la12 plus 5 balanced multi-class sets","data_type":["Tabular","Text"],"strategy":["Oversampling","Algorithm modification"],"mechanism":["Clustering"],"core_idea":"K-means splits each large class into relabeled subclasses of similar size and simpler (linearly separable) shape; COG-OS also replicates rare-class instances; a linear SVM is trained and subclass predictions mapped back to parent classes.","multiclass_handling":"Native: k-means splits each large class into subclasses; one multi-class linear classifier; predictions mapped to parent class.","builds_on":["Random oversampling"],"baselines":["Linear SVM","Random undersampling","Random oversampling","RIPPER","PNrule","Random partitioning (RP)","BMR","C4.5"],"n_datasets":"14 (8 UCI, 2 document, 4 LIBSVM) + KDD Cup 99 (2 binary versions)","classifiers":["Linear SVM (LIBSVM)","BMR (Bayesian logistic regression)","C4.5","RIPPER"],"metrics":["F-measure","Recall","Precision","Accuracy"],"limitations":"COG gives no consistent gains with non-linear classifiers (C4.5, RIPPER often worse); COG alone fails when rare class is adjacent to normal class, requiring over-sampling.","code_url":null,"read_status":"full","approach":"Algorithm-level","smote_based":false,"non_tabular":true,"folders":["Binary"],"files":[{"folder":"Binary","id":"1zOM06qCMIDnpzxQk1T3n7xZhR03KEvOe","label":"PDF"}],"uid":"P11","paper_scope":"Binary+Multiclass","scope_differs":true,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1TSf938BSpsQUc_1q0OW3LWiBEyaJ_Ph3","acronym":"ADASYN","title":"ADASYN: Adaptive Synthetic Sampling Approach for Imbalanced Learning","authors":"He, Bai, Garcia, Li","year":2008,"venue":"IJCNN 2008","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"5 two-class UCI datasets; multi-class ones collapsed (e.g., Vehicle van vs rest)","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Adaptive sample weighting"],"core_idea":"Weights each minority example by the majority fraction among its K nearest neighbours, normalizes weights to a density, allocates G=(ml-ms)*beta synthetic samples proportionally, generated by interpolation toward random minority neighbours.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["Decision tree (no sampling)","SMOTE"],"n_datasets":"5 (UCI) + 1 synthetic Gaussian","classifiers":["Decision tree"],"metrics":["Overall accuracy","Precision","Recall","F-measure","G-mean"],"limitations":"Compared only with single-model methods; future work: ensemble (boosted) ADASYN, multi-class extension, and incremental learning.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1TSf938BSpsQUc_1q0OW3LWiBEyaJ_Ph3","label":"PDF"}],"uid":"P12","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Sample allocation"],"smote_link":"Keeps SMOTE interpolation but gives more synthetic points to seeds with more majority neighbours (harder regions).","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"5 two-class UCI datasets; multi-class ones collapsed (e.g., Vehicle van vs rest)","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Sample allocation"],"class_category":"Binary only","class_evidence_pdf":"Algorithm defined for labels y in {1,-1} (Sec. II, p.1323). Artificial 2-class Gaussian set (Fig. 1, p.1324) and 5 UCI datasets used as two-class problems (Table I, Sec. III-A, pp.1324-1325): Vehicle, Pima, Vowel, Ionosphere, Abalone. A multiclass extension is described (Sec. III-D, p.1327) but never run.","class_reduced":"Vehicle (4 classes): van vs the rest (p.1324). Vowel (11 classes): first vowel vs the rest (p.1325). Abalone (29 classes): only class 18 vs class 9 kept (p.1325). Pima and Ionosphere are natively two-class.","class_multiclass_how":"","smote_explain":"ADASYN keeps the SMOTE generator: a partner is drawn from the seed's K nearest minority neighbours and the point is seed + lambda(partner - seed), with K = 5 in the experiments (Eq. 5, p.1324; Sec. III-C, p.1325). What changes is allocation: the total G = (ml - ms) beta is shared out as g_i proportional to the share of majority points among each seed's K neighbours (Eqs. 2-4, pp.1323-1324), instead of an equal number per seed.","pdf_check_note":"Category, Core and decision point confirmed. Evidence should list three reductions (Vehicle, Vowel, Abalone), not only Vehicle. Seeds with no majority neighbours get g_i = 0, effectively dropping them as seeds (could also count as Seed selection). Multiclass extension in Sec. III-D is not run.","pdf_checked":"28 Oct 2026"},{"file_id":"1L1LaFIxMQ8Gw6mmEAACJBF51yd5lxmc9","acronym":"LS","title":"Start Globally, Optimize Locally, Predict Globally: Improving Performance on Imbalanced Data","authors":"Cieslak, Chawla","year":2008,"venue":null,"paper_type":"New method","class_setting":"Binary","class_setting_evidence":"20 two-class datasets; multi-class sources converted to smallest class vs rest (Letter: vowels vs consonants)","data_type":["Tabular"],"strategy":["Hybrid sampling"],"mechanism":["SMOTE interpolation","Hellinger distance partitioning","Evolutionary/optimization"],"core_idea":"Splits training data into at most 4 segments with a height-2 tree using Hellinger-distance splits; a wrapper picks per-segment undersampling and SMOTE levels maximizing cross-validated AUROC; merged data trains one global C4.5.","multiclass_handling":null,"builds_on":["SMOTE","Random undersampling","Wrapper sampling-level search (Chawla et al.)"],"baselines":["C4.5","SVM","COG-OS + C4.5","COG-OS + SVM","Undersampling+SMOTE (global wrapper)"],"n_datasets":"20 (UCI, LIBSVM, real-world) + synthetic radial datasets","classifiers":["C4.5 (unpruned, Laplace)","SVM"],"metrics":["AUROC","Friedman average rank"],"limitations":"Partition tree limited to height 2 because deeper segments became too sparse; wrapper cost made LS with SVM prohibitive, so LS evaluated only with C4.5.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1L1LaFIxMQ8Gw6mmEAACJBF51yd5lxmc9","label":"PDF"}],"uid":"P13","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Sample allocation","Inside a pipeline"],"smote_link":"Uses SMOTE as the oversampler in a wrapper that tunes the SMOTE and undersampling levels separately for each Hellinger-tree segment.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"20 two-class datasets; multi-class sources converted to smallest class vs rest (Letter: vowels vs consonants)","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Inside a pipeline","Sample allocation"],"class_category":"Binary only","class_evidence_pdf":"20 datasets (Table 2, p7): real-world from Chawla et al. 2002, LIBSVM, the KDD'99 Intrusion subset and biological sets, plus UCI (Sec 5.3, pp7-8). All used as two-class problems with one minority percentage each (Table 2); Intrusion keeps u2r vs normal (Sec 5.3, p8). Motivating experiments use artificial two-class radial data (Sec 2, Fig 2-3, Table 1, pp2-4); Pima is the worked example (Fig 4, p6).","class_reduced":"Multiclass UCI sources reduced to smallest class vs the rest; Letter uses vowels vs consonants (Sec 5.3, p8). Which datasets were converted is not stated.","class_multiclass_how":"","smote_explain":"LS leaves the SMOTE generator unchanged but applies it per segment: a Hellinger-distance tree of height at most 2 splits the training data into up to 4 segments (Alg 1, Sec 3, pp4-5), and a 5-fold CV wrapper searches each segment for its own undersampling level (0-100%) and SMOTE level (0-500%) (Alg 2, Sec 4, p5). The number of synthetic points per seed therefore varies by segment, and generation runs inside a wrapper search rather than once before training. Seeds, partner and placement inside a segment are as in SMOTE.","pdf_check_note":"SMOTE runs per segment (Alg 2 line 3, p5), which implies partners come from the same segment (a Neighbour choice change) but the paper does not say so. LS is a general framework; only SMOTE plus undersampling is tested.","pdf_checked":"28 Oct 2026"},{"file_id":"1MOWXL4I6OT7pm5ZklAQfEpzap6dbsSaU","acronym":"EasyEnsemble/BalanceCascade","title":"Exploratory Undersampling for Class-Imbalance Learning","authors":"Liu, Wu, Zhou","year":2009,"venue":"IEEE Trans. Syst., Man, Cybern. B (TSMC-B)","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Intro: 'we examine only binary classification problems'; 16 UCI datasets with target class vs all others","data_type":["Tabular"],"strategy":["Undersampling","Ensemble"],"mechanism":["Bagging/random subspace","Boosting"],"core_idea":"EasyEnsemble draws T independent random majority subsets of minority size, trains an AdaBoost ensemble on each with all minority data, and pools all weak learners; BalanceCascade sequentially removes majority examples correctly classified by previous ensembles.","multiclass_handling":null,"builds_on":["Random undersampling","AdaBoost"],"baselines":["AdaBoost","Bagging","AsymBoost","SMOTEBoost","Undersampling+AdaBoost","Oversampling+AdaBoost","SMOTE+AdaBoost","Chan and Stolfo","Random Forests","Balanced Random Forests"],"n_datasets":"16 (UCI)","classifiers":["CART"],"metrics":["AUC","F-measure","G-mean","Training time"],"limitations":"BalanceCascade may overfit by discarding correctly classified majority examples; weak-learner weights not learned; as ensembles they lack comprehensibility; need methods to judge whether a task suffers from imbalance.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1MOWXL4I6OT7pm5ZklAQfEpzap6dbsSaU","label":"PDF"}],"uid":"P14","paper_scope":"Binary","scope_differs":true,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1BEXDhe4K5TYOH1ZkTMg2AwRXDfwN1C1l","acronym":"Safe-Level-SMOTE","title":"Safe-Level-SMOTE: Safe-Level-Synthetic Minority Over-Sampling TEchnique for Handling the Class Imbalanced Problem","authors":"Bunkhumpornpat, Sinapiromsaran, Lursinsap","year":2009,"venue":"PAKDD 2009 (LNAI 5476)","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"2 two-class UCI datasets: Satimage (class 4 vs rest) and Haberman","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting"],"core_idea":"Safe level = minority count among k nearest neighbours; each synthetic point lies on the line to a random minority neighbour, shifted toward the safer endpoint; nothing generated when both are noise.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["SMOTE","Borderline-SMOTE","No sampling"],"n_datasets":"2 (UCI)","classifiers":["C4.5","Naive Bayes","SVM"],"metrics":["Precision","Recall","F-value","AUC"],"limitations":"Future work: other safe-level definitions, handling nominal attributes, automatic choice of number of synthetic instances; SVMs showed no improvement with any oversampler.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary","Both"],"files":[{"folder":"Binary","id":"1BEXDhe4K5TYOH1ZkTMg2AwRXDfwN1C1l","label":"PDF"},{"folder":"Both","id":"1ndf16oaQbwLU0sGsYhEznHyksAKS0lHy","label":"PDF (copy)"}],"uid":"P15","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Placement rule"],"smote_link":"Moves λ toward the endpoint with the higher safe level (more minority neighbours) and skips pairs where both points are noise.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"2 two-class UCI datasets: Satimage (class 4 vs rest) and Haberman","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Placement rule"],"class_category":"Binary only","class_evidence_pdf":"Studies only the two-class case (Sec 1, p475). Two UCI datasets (Table 3, p480): Satimage (6,435; 626 positive) and Haberman (306; 81 positive). k=5, 10-fold CV, C4.5, Naive Bayes and SVM (Sec 4, p480).","class_reduced":"Satimage: class 4 vs all other classes merged (Sec 4, p480).","class_multiclass_how":"","smote_explain":"Each minority point has a safe level, the number of minority points among its k nearest neighbours (Eq 7, p478), and the ratio of the seed's and partner's safe levels bounds the gap (Fig 1, Sec 3, pp478-479): ratio 1 gives U(0,1) as in SMOTE, above 1 pulls the point towards the seed, below 1 towards the partner. When the partner's safe level is 0 the seed is copied, and when both are 0 nothing is generated, so noise pairs are skipped. The partner is still drawn uniformly from the 5 nearest minority neighbours and nothing is removed afterwards.","pdf_check_note":"Add Seed selection: generation is skipped when seed and sampled partner both have safe level 0 (Fig 1 lines 12-14, p479). Cases with partner safe level 0 produce copies of the seed, not interpolated points. Fig 1 searches neighbours in the positive set but Eq 7 counts positives among neighbours, which implies a whole-data neighbourhood; the skip depends on the random partner as well as the seed.","pdf_checked":"28 Oct 2026"},{"file_id":"1MoRHre9MtdPaheA2l0Iu_Y5G-2WFy-4H","acronym":"SBC (ClusterCentroids)","title":"Cluster-based under-sampling approaches for imbalanced data distributions","authors":"Yen, Lee","year":2009,"venue":"Expert Systems with Applications","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Majority (MA) vs minority (MI) formulation; binary synthetic datasets plus two binary real datasets (Census-Income, Overdue Detection)","data_type":["Tabular"],"strategy":["Undersampling"],"mechanism":["Clustering","k-NN neighborhood"],"core_idea":"Clusters all training data (k-means); from each cluster selects majority samples in proportion to its majority/minority ratio, randomly (SBC) or by NearMiss-style distance rules (SBCNM-1/2/3, SBCMD, SBCMF).","multiclass_handling":null,"builds_on":["NearMiss","Random undersampling"],"baselines":["No resampling (AT)","Random undersampling (RT)","NearMiss-2"],"n_datasets":"Synthetic datasets (DSiEjDk, 10,000 samples, 2-16 clusters, varying noise/IR) + 2 real-world (UCI Census-Income, bank Overdue Detection)","classifiers":["Backpropagation neural network"],"metrics":["Precision","Recall","F-measure","Execution time"],"limitations":"SBCNM-1, SBCNM-2, SBCNM-3 and SBCMF variants show unstable performance and take more time than SBC to select majority samples.","code_url":null,"read_status":"full","approach":"Undersampling","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1MoRHre9MtdPaheA2l0Iu_Y5G-2WFy-4H","label":"PDF"}],"uid":"P16","paper_scope":"Binary","scope_differs":true,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1bReNAIswhhGIh5BdrWZg5GlfndPLLBBf","acronym":"Global-CS (RESCALEnew)","title":"On Multi-Class Cost-Sensitive Learning","authors":"Zhou, Liu","year":2010,"venue":"Computational Intelligence; conf. version AAAI 2006","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"20 multi-class datasets (14 UCI + 6 synthetic), 10 imbalanced, 3-11 classes","data_type":["Tabular"],"strategy":["Cost-sensitive","Decomposition (OVO/OVA)"],"mechanism":["Cost matrix"],"core_idea":"Checks cost-matrix consistency (rank of pairwise-ratio coefficient matrix below c); if consistent, solves joint class weights and rescales all classes at once (weighting, resampling or threshold-moving); else rescales each OVO pair and votes.","multiclass_handling":"Native joint class weights if costs consistent (always for imbalance costs 1/n_i); otherwise OVO pairwise coupling with voting.","builds_on":["Traditional rescaling (C4.5CS)"],"baselines":["RESCALEold instance-weighting (C4.5CS)","RESCALEold over-sampling","RESCALEold under-sampling","RESCALEold threshold-moving NN","RESCALEold threshold-moving PETs","RESCALEold hard-ensemble","RESCALEold soft-ensemble","Cost-blind learners (C4.5, NN, PETs, ensembles)"],"n_datasets":"20 (14 UCI + 6 synthetic; 10 imbalanced)","classifiers":["C4.5 (J48)","BP neural network","PETs","Hard-ensemble","Soft-ensemble"],"metrics":["Misclassification cost","MAUC"],"limitations":"Cost-only rescaling fails on seriously imbalanced data; future work: multi-class cost-sensitive learning without decomposition, variable cost matrices, and visual evaluation tools like ROC/cost curves.","code_url":null,"read_status":"full","approach":"Cost-sensitive","smote_based":false,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"1bReNAIswhhGIh5BdrWZg5GlfndPLLBBf","label":"PDF"},{"folder":"Multiclass","id":"1IprP-P7NnFAlMF6q753wLu3LI0FWwRQA","label":"AAAI 2006 version"}],"uid":"P17","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"14A557-5oqo0oyDRVUFLgcoS2Vu53fxUQ","acronym":"RAMOBoost","title":"RAMOBoost: Ranked Minority Oversampling in Boosting","authors":"Chen, He, Garcia","year":2010,"venue":"IEEE Transactions on Neural Networks","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"19 UCI/ELENA datasets converted to two-class; authors consider only two-class problems","data_type":["Tabular"],"strategy":["Oversampling","Ensemble"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Adaptive sample weighting","Boosting"],"core_idea":"In each AdaBoost.M2 iteration, minority examples are ranked by a logistic function of majority count among k1 neighbors, sampled by this distribution, and SMOTE-interpolated with k2 minority neighbors to add synthetic data.","multiclass_handling":null,"builds_on":["SMOTE","SMOTEBoost","ADASYN","AdaBoost.M2"],"baselines":["SMOTEBoost","SMOTE","ADASYN","AdaCost","Borderline-SMOTE","SMOTE-Tomek"],"n_datasets":"19 (UCI, ELENA)","classifiers":["MLP"],"metrics":["Overall accuracy","Precision","Recall","F-measure","G-mean","AUC","ROC curves"],"limitations":"Only continuous features and two-class problems studied; future work: nominal features via SMOTE-N, multiclass extension, other distance measures, adaptive parameter setting.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"14A557-5oqo0oyDRVUFLgcoS2Vu53fxUQ","label":"PDF"}],"uid":"P18","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Inside a pipeline"],"smote_link":"Inside AdaBoost.M2, draws seeds from a ranking that favours border points, then SMOTE-interpolates them with minority neighbours.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"19 UCI/ELENA datasets converted to two-class; authors consider only two-class problems","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection","Inside a pipeline"],"class_category":"Binary only","class_evidence_pdf":"19 UCI/ELENA datasets, all run as two-class problems (Tables I-II, pp.1630-1631); only two-class problems considered (Sec. IV, p.1630); multiclass is future work (Sec. V, p.1641).","class_reduced":"One-vs-rest (e.g. Wine 1 vs 2+3, Vehicle van, Segment brickface, Letter Z vs A-Y), merged classes (Texture, Page_blocks) or two classes kept and the rest dropped (Abalone 18 vs 9, Yeast POX vs CYT) (Table II, p.1631).","class_multiclass_how":"","smote_explain":"The generator is SMOTE's segment interpolation towards one of the seed's k2 nearest minority neighbours (Eq. 1, p.1626; Algorithm 1 step 5). In each boosting round, seeds are drawn with replacement from a ranking that weights each minority point by a logistic function of the number of majority points among its k1 neighbours (steps 2-4, Eqs. 2-3), so border points receive more synthetic samples. Generation is repeated in every AdaBoost.M2 round on a minority subset resampled by the boosting weights (steps 1, 6-10).","pdf_check_note":"Seed selection and Sample allocation are two sides of one weighted draw.","pdf_checked":"28 Oct 2026"},{"file_id":"11twc68OZ57oOgWX3q9TapZClfIL8sxyW","acronym":"RUSBoost","title":"RUSBoost: A Hybrid Approach to Alleviating Class Imbalance","authors":"Seiffert, Khoshgoftaar, Van Hulse, Napolitano","year":2010,"venue":"IEEE Trans. Syst., Man, Cybern. A (TSMC-A)","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Sec IV-A: 15 datasets, multiclass sets converted to one-vs-rest binary; 'this paper considers only the binary classification problem'","data_type":["Tabular"],"strategy":["Undersampling","Ensemble"],"mechanism":["Boosting"],"core_idea":"AdaBoost.M2 in which, before training each weak learner, majority examples are randomly removed until the minority reaches a target share (35/50/65%); pseudoloss and weight updates computed on the full original data.","multiclass_handling":null,"builds_on":["SMOTEBoost","AdaBoost.M2","Random undersampling"],"baselines":["SMOTEBoost","RUS","SMOTE","AdaBoost","No resampling"],"n_datasets":"15 (UCI, NASA MDP, Mammography, 3 proprietary software project)","classifiers":["C4.5 (default)","C4.5 (no pruning, Laplace)","RIPPER","Naive Bayes"],"metrics":["AUC","AUPRC","K-S statistic","F-measure"],"limitations":"Future work: evaluate with additional learners and domains (bioinformatics), study effect of boosting iterations and sampling level, compare with more boosting methods, evaluate as cost-sensitive technique.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"11twc68OZ57oOgWX3q9TapZClfIL8sxyW","label":"PDF"}],"uid":"P19","paper_scope":"Binary","scope_differs":true,"smote_rel":"Not counted","smote_via":[],"smote_link":"Derived from SMOTEBoost, but replaces SMOTE with random undersampling."},{"file_id":"1VxKL_fHwFuDsw_JgJbczlW3BAA8X37kR","acronym":"SPIDER2","title":"Learning from Imbalanced Data in Presence of Noisy and Borderline Examples","authors":"Napierala, Stefanowski, Wilk","year":2010,"venue":"RSCTC 2010 (LNAI 6086, Springer)","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"Binary artificial 2-D sets and 9 real datasets; all non-minority classes merged into one majority class","data_type":["Tabular"],"strategy":["Hybrid sampling","Data cleaning"],"mechanism":["k-NN neighborhood","Noise/overlap filtering","Borderline/safe-level weighting"],"core_idea":"Uses k-NN (HVDM) to flag not-safe majority examples, which are removed or relabeled as minority; then not-safe minority examples are replicated by majority-minus-minority neighbor count plus one (weak or strong amplification).","multiclass_handling":null,"builds_on":["SPIDER","NCR","ENN"],"baselines":["No preprocessing","Random oversampling","Cluster oversampling","NCR","SPIDER (SP1)"],"n_datasets":"9 real (UCI + medical acl) + artificial 2-D sets (subclus, clover, paw; 800 examples, 1:7)","classifiers":["MODLEM","C4.5"],"metrics":["Sensitivity","Specificity","G-mean","Overall accuracy"],"limitations":"Tree/rule classifiers sensitive to non-linear boundaries; plan to study other classifiers (e.g., SVM); role of class shape, overlap and noise in real data needs further investigation.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":false,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1VxKL_fHwFuDsw_JgJbczlW3BAA8X37kR","label":"PDF"}],"uid":"P20","paper_scope":"Binary","scope_differs":false,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"10NyBqjLq7etYOKtdKCbiB0WpjTXZppW1","acronym":"DSRBF / SSRBF (Static-SMOTE)","title":"A dynamic over-sampling procedure based on sensitivity for multi-class problems","authors":"Fernández-Navarro, Hervás-Martínez, Gutiérrez","year":2011,"venue":"Pattern Recognition","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Table 3: 5 binary + 8 multi-class datasets (12 UCI + S. aureus growth problem)","data_type":["Tabular"],"strategy":["Oversampling","Algorithm modification"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Evolutionary/optimization"],"core_idea":"SSRBF: before training, repeatedly adds SMOTE samples (original size) to the currently smallest class, once per class. DSRBF: SMOTE the minority class, then periodically SMOTE-oversample the minimum-sensitivity class during memetic RBF-network evolution.","multiclass_handling":"Native multi-class softmax RBFNN; iteratively oversamples the smallest or minimum-sensitivity class, no OVO/OVA.","builds_on":["SMOTE","MRBF (memetic RBFNN)"],"baselines":["MRBF","SSRBF","OS (over-sampling NN)","SmoteOS","TMNN (threshold-moving NN)","Soft-ensemble (SE)","Hard-ensemble (HE)"],"n_datasets":"13 (12 UCI + 1 real-world S. aureus growth)","classifiers":["RBFNN (memetic algorithm)","MLP (RProp, baselines)"],"metrics":["Accuracy (C)","Minimum sensitivity (MS)"],"limitations":"Sensitivity gains come with accuracy loss on some imbalanced datasets; the expert has to decide whether to apply the methodology.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Both","Multiclass"],"files":[{"folder":"Multiclass","id":"10NyBqjLq7etYOKtdKCbiB0WpjTXZppW1","label":"PDF"},{"folder":"Both","id":"17PDayCmBGe4hJ-msxlJP-d4sXDgyxmrz","label":"PDF (copy)"}],"uid":"P21","paper_scope":"Binary+Multiclass","scope_differs":true,"smote_rel":"Core","smote_via":["Sample allocation","Inside a pipeline"],"smote_link":"Applies SMOTE repeatedly to the smallest or least-sensitive class, before (static) or during (dynamic) memetic RBF-network training.","class_rule":"Multiclass rule","mc_strategy":"Class by class","class_rule_note":"Native multi-class softmax RBFNN; iteratively oversamples the smallest or minimum-sensitivity class, no OVO/OVA.","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Inside a pipeline","Sample allocation"],"class_category":"Binary + Multiclass","class_evidence_pdf":"13 datasets (Sec. 4.1, p.1827; Table 3, p.1828): 5 two-class (Hepatitis, BreastC, Haberman, CYTvsPOX, ME2vsOther) and 8 with all classes kept (Newthyroid 3, Balance 3, Saureus4 4, Anneal 5, Glass 6, Zoo 7, E. coli 8, Yeast 10). SSRBF and DSRBF run on all 13 (Table 4) with one softmax RBF network, no decomposition.","class_reduced":"CYTvsPOX and ME2vsOther are derived from Yeast (Sec. 4.1, p.1827).","class_multiclass_how":"One class is oversampled at a time: SSRBF enlarges the currently smallest class J times before training; DSRBF pauses the memetic training at set generations and oversamples the class with the lowest sensitivity, each time by its original size (Secs. 3.3-3.4, pp.1825-1827).","smote_explain":"The generator is unchanged SMOTE: every original pattern of the chosen class is a seed joined to one of its k = 5 nearest same-class neighbours (Sec. 1, p.1821; Sec. 3.4, p.1826). What changes is which class is oversampled and how many times, set by class size (SSRBF) or by the lowest per-class sensitivity of the current best network (DSRBF). In DSRBF generation runs inside the training loop; SSRBF runs before training.","pdf_check_note":"Inside a pipeline applies only to DSRBF.","pdf_checked":"28 Oct 2026"},{"file_id":"1WPtufLQO108SGQWNL51X3uZGg7W-dzw1","acronym":"INOS","title":"Integrated Oversampling for Imbalanced Time Series Classification","authors":"Cao, Li, Woon, Ng","year":2013,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"48 imbalanced two-class apportions (one class vs rest) from 7 UCR time series datasets","data_type":["Time series"],"strategy":["Oversampling","Data cleaning"],"mechanism":["Probabilistic/density model","SMOTE interpolation","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"In null-space-removed signal space, ESPO draws about 70% of synthetic minority series from a multivariate Gaussian preserving minority covariance with regularized unreliable eigen-spectrum; ADASYN interpolation generates the rest; Tomek-like noise-link pairs are removed.","multiclass_handling":null,"builds_on":["SPO","ADASYN"],"baselines":["Random oversampling (repeating)","SMOTE","Borderline-SMOTE","ADASYN","DataBoost","SPO","EasyEnsemble","BalanceCascade","1NN-DTW","1NN"],"n_datasets":"7 (UCR time series) split into 48 binary apportions","classifiers":["SVM (RBF)"],"metrics":["F-value","G-mean","Precision","Recall","True negative rate"],"limitations":"Some datasets (e.g., TwoPats) are better classified by 1NN-DTW; future meta-learning to choose methods per dataset; oversampling becomes inefficient when the negative class is extremely large.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":true,"folders":["Both"],"files":[{"folder":"Both","id":"1WPtufLQO108SGQWNL51X3uZGg7W-dzw1","label":"PDF"}],"uid":"P22","paper_scope":"Binary","scope_differs":true,"smote_rel":"Partial","smote_via":["Sample allocation","Post-filtering"],"smote_link":"About 30% of synthetic series come from ADASYN interpolation; the other 70% are drawn from a covariance-preserving Gaussian (ESPO).","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"Written for a positive vs a negative class (Sec. 3, p.3). 48 two-class tasks built from 7 UCR sets, one class vs the rest (Sec. 4.2, pp.7-8); no multiclass extension mentioned.","class_rule_source":"PDF checked 28 Oct 2026","smote_via_v1":["Placement rule"],"class_category":"Binary only","class_evidence_pdf":"Restricted to two-class time series (p.2; Sec. 3, p.3). 48 two-class apportions from 7 UCR datasets (Adiac, FaceAll, 50words, SLeaf, Wafer, Yoga, TwoPats), each a separate binary task (Sec. 4.2, pp.7-8, Table 1).","class_reduced":"Adiac (37 classes), FaceAll (14), 50words (50), SLeaf (15): one class positive, the rest merged as negative, one apportion per chosen class (Sec. 4.2, p.8).","class_multiclass_how":"","smote_explain":"INOS splits the synthetic quota between two generators: 70% from ESPO, a regularised Gaussian of the minority covariance that does not interpolate (Sec. 3.2.2, Eq. 13; r = 0.7, Sec. 4.3), and 30% from ADASYN in a signal space with the null space removed (Sec. 3.3, Eqs. 14-15). The ADASYN part allocates points per seed by the share of negatives among its neighbours and interpolates uniformly towards one of the 5 nearest positives, as in SMOTE. Afterwards, Tomek-like noise links between synthetic positives and nearest negatives are removed (Sec. 3.4, pp.5-6).","pdf_check_note":"Drop Placement rule (the interpolating part keeps uniform placement; ESPO is a separate generator); add Sample allocation and Post-filtering. ADASYN weighting could also count as Seed selection.","pdf_checked":"28 Oct 2026"},{"file_id":"1zYDaE9DXkV9_GMfZRt9aJa_48pf7Usjc","acronym":"OVO/OVA + SMOTE study","title":"Analysing the classification of imbalanced data-sets with multiple classes: Binarization techniques and ad-hoc approaches","authors":"Fernández, López, Galar, del Jesus, et al.","year":2013,"venue":"Knowledge-Based Systems","paper_type":"Empirical study","class_setting":"Multiclass","class_setting_evidence":"24 multi-class KEEL datasets (3-11 classes, IR 1.48-4558.6)","data_type":["Tabular"],"strategy":["Decomposition (OVO/OVA)","Oversampling","Undersampling","Hybrid sampling","Data cleaning","Cost-sensitive","Ensemble"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Noise/overlap filtering","Cost matrix","Boosting"],"core_idea":"Compares OVO and OVA binarization combined with binary resampling (ROS, SMOTE, SMOTE-ENN, Safe-Level-SMOTE, RUS, NCL, TL, OSS) or IR-based instance weighting against ad hoc Global-CS, Static-SMOTE and AdaBoost.NC; OVO+SMOTE and OVO+CS perform best.","multiclass_handling":"OVO (voting) and OVA decomposition with binary resampling or cost-sensitive learning per subproblem; native ad hoc methods as references.","builds_on":[],"baselines":["Global-CS","Static-SMOTE","AdaBoost.NC","Std-OVO / Std-OVA","Base classifier (no preprocessing)","OVO/OVA + ROS","OVO/OVA + SMOTE-ENN","OVO/OVA + Safe-Level-SMOTE","OVO/OVA + instance-weighting CS","OVO/OVA + RUS/NCL/TL/OSS"],"n_datasets":"24 (KEEL)","classifiers":["C4.5","SVM (SMO)","kNN (HVDM)"],"metrics":["Average accuracy (AvgAcc)","Mean F-measure (web page)"],"limitations":"Future work: non-competent classifiers in OVO, scalability to many classes and examples, new OVO aggregations, and intrinsic data characteristics (small disjuncts, overlap, dataset shift).","code_url":null,"read_status":"full","approach":"Survey / study","smote_based":false,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"1zYDaE9DXkV9_GMfZRt9aJa_48pf7Usjc","label":"PDF"}],"uid":"P23","paper_scope":"Multiclass","scope_differs":false,"smote_rel":"Study","smote_via":[],"smote_link":"Proposes no generator; evaluates SMOTE, SMOTE-ENN and Safe-Level-SMOTE combined with OVO/OVA decomposition."},{"file_id":"1AoUTjcCFpdz9liFQu2I65F9Tx3OrdJHv","acronym":"MWMOTE","title":"MWMOTE - Majority Weighted Minority Oversampling Technique for Imbalanced Data Set Learning","authors":"Barua, Islam, Yao, Murase","year":2014,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"4 artificial two-class domains + 20 UCI datasets, multi-class ones transformed to two-class","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Clustering","Borderline/safe-level weighting","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"Filters noisy minority, finds borderline majority (k2-NN) and their k3 minority neighbors as informative set; weights them by closeness/density to borderline majority; interpolates weighted-sampled seeds with random same-cluster minority members (average-linkage clustering).","multiclass_handling":null,"builds_on":["SMOTE","Borderline-SMOTE","ADASYN","RAMO"],"baselines":["SMOTE","ADASYN","RAMO","COGOS","Local sampling (LS)"],"n_datasets":"20 (UCI) + 4 artificial","classifiers":["MLP (backpropagation NN)","AdaBoost.M2 ensemble of NNs","k-NN","C4.5"],"metrics":["Accuracy","Precision","Recall","F-measure","G-mean","AUC","ROC curves"],"limitations":"Only two-class, continuous-feature data used; future work: multiclass, nominal features, better clustering, combining with undersampling, parameter optimization. Recall lower than competitors.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary","Both"],"files":[{"folder":"Both","id":"1AoUTjcCFpdz9liFQu2I65F9Tx3OrdJHv","label":"PDF"},{"folder":"Binary","id":"1OXYKQjqnGD50QjTpJtnDSlBbhHphZ_DG","label":"PDF (copy)"}],"uid":"P24","paper_scope":"Binary","scope_differs":false,"smote_rel":"Core","smote_via":["Seed selection","Sample allocation","Neighbour choice"],"smote_link":"Weights informative border seeds by closeness to the majority class and by density, and interpolates only with members of the same minority cluster.","class_rule":"Binary rule","mc_strategy":"","class_rule_note":"4 artificial two-class domains + 20 UCI datasets, multi-class ones transformed to two-class","class_rule_source":"Method Map record (multiclass_handling, class_setting_evidence; read 6 Oct 2026)","smote_via_v1":["Seed selection","Neighbour choice"],"class_category":"Binary only","class_evidence_pdf":"4 artificial two-class domains (Sec. 5.3, pp.11-12) and 20 UCI datasets used as two-class problems (Sec. 5.4, p.13, Table 5); networks with 2 output neurons (Sec. 5.2). Multiclass use named as future work (Sec. 6, p.19).","class_reduced":"Multiclass sources converted to two-class problems with the chosen minority and majority classes listed in Table 5 (Sec. 5.4, p.13); the table could not be extracted from the text.","class_multiclass_how":"","smote_explain":"Seeds are limited to an informative minority set near the borderline majority points, after dropping minority points whose neighbours are all majority (Alg. 1 steps 1-6; Sec. 4.1, p.5). Each seed gets a weight from its closeness to the majority class and its density, and seeds are drawn in proportion to it, so counts per seed vary (Alg. 1 steps 7-9, 12a; Sec. 4.2, pp.6-7). The partner is a random member of the seed's minority cluster from average-linkage clustering, not one of its 5 nearest neighbours (Alg. 1 steps 10, 12b; Secs. 4.3-4.4). Placement is uniform on the segment and nothing is removed afterwards.","pdf_check_note":"Add Sample allocation (weighted seed draws give unequal counts per seed). Exact class mapping in Table 5 not checked.","pdf_checked":"28 Oct 2026"},{"file_id":"1xyZUzavvdWF2OsrM31uxugOEHpn0liE3","acronym":"RACOG/wRACOG","title":"RACOG and wRACOG: Two Probabilistic Oversampling Techniques","authors":"Das, Krishnan, Cook","year":2015,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"10 binary datasets: prompting plus 9 UCI, multi-class ones converted to one-class-vs-rest","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["Probabilistic/density model"],"core_idea":"Approximates minority joint distribution of discretized attributes with Chow-Liu dependence tree; Gibbs chains seeded at each minority instance generate samples; RACOG keeps them by burn-in/lag, wRACOG keeps those misclassified by a wrapper classifier.","multiclass_handling":null,"builds_on":["Chow-Liu dependence tree","Gibbs sampling"],"baselines":["No resampling","SMOTE","SMOTEBoost","RUSBoost"],"n_datasets":"10 (9 UCI + 1 smart-home prompting)","classifiers":["C4.5","SVM (RBF)","k-NN (k=5)","Logistic Regression"],"metrics":["Sensitivity","G-mean","AUC-ROC"],"limitations":"Open question on comparison with random over/undersampling; future work needs more high-dimensional, high-cardinality datasets and handling of continuous-valued variables.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1xyZUzavvdWF2OsrM31uxugOEHpn0liE3","label":"PDF"}],"uid":"P25","paper_scope":"Binary","scope_differs":true,"smote_rel":"","smote_via":[],"smote_link":""},{"file_id":"1Ulmbg5NkJAK7hBcLjmm3waZW5FOc6lzj","acronym":"RBBoost","title":"Random Balance: Ensembles of variable priors classifiers for imbalanced data","authors":"Diez-Pastor, Rodriguez, Garcia-Osorio, Kuncheva","year":2015,"venue":"Knowledge-Based Systems","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"86 two-class imbalanced datasets: 20 HDDT collection + 66 KEEL","data_type":["Tabular"],"strategy":["Ensemble","Hybrid sampling"],"mechanism":["SMOTE interpolation","Boosting","Bagging/random subspace"],"core_idea":"Each ensemble member gets a same-size training set with randomly drawn class proportions (possibly inverted): the shrunk class is randomly undersampled, the other enlarged by SMOTE; RB-Boost applies this inside each AdaBoost.M2 round.","multiclass_handling":null,"builds_on":["SMOTE","Random undersampling","AdaBoost.M2","Bagging"],"baselines":["SMOTEBoost","RUSBoost","AdaBoost.M1","MultiBoost","SMOTEBagging","Bagging","Ensemble + SMOTE","Ensemble + RUS","Partitioning","Reliability-based Balancing"],"n_datasets":"86 (20 HDDT + 66 KEEL)","classifiers":["J48 (C4.4, unpruned, Laplace)","1-NN","SVM (Gaussian kernel)"],"metrics":["AUC","F-Measure","G-mean","Accuracy"],"limitations":"Future work: study behavior under overlap, noise, small disjuncts and borderline examples; combine other preprocessing techniques via random proportions; extend to multi-class problems; test other combination rules.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":true,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1Ulmbg5NkJAK7hBcLjmm3waZW5FOc6lzj","label":
