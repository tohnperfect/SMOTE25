<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMOTE25 Method Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one content column; summary tiles, a filter rail, then three views (table, approach x setting, year x setting) that share the four group columns. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eaeef2; --ink:#17212b; --muted:#56626e; --line:#d6dde4; --line-strong:#b9c3cd;
  --bin:#1d5c9f; --bin-bg:#e4edf7; --mul:#a9530a; --mul-bg:#faecdf; --both:#0d735c; --both-bg:#dff1eb;
  --ntab:#9c2f69; --ntab-bg:#f7e4ee; --sur:#4d5b69; --sur-bg:#e4e9ee; --focus:#1d5c9f; --shadow:0 10px 30px rgba(20,32,44,.18);
  --f-display:'Archivo Narrow','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#161d23; --sunk:#1c252d; --ink:#e3e9ee; --muted:#9ba7b2; --line:#29343e; --line-strong:#3b4855;
  --bin:#7fb2ea; --bin-bg:#16283b; --mul:#efa75e; --mul-bg:#33240f; --both:#52c8a7; --both-bg:#0f2f28;
  --ntab:#e690c0; --ntab-bg:#35172a; --sur:#b3c0cc; --sur-bg:#222c36; --focus:#7fb2ea; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#161d23; --sunk:#1c252d; --ink:#e3e9ee; --muted:#9ba7b2; --line:#29343e; --line-strong:#3b4855;
  --bin:#7fb2ea; --bin-bg:#16283b; --mul:#efa75e; --mul-bg:#33240f; --both:#52c8a7; --both-bg:#0f2f28;
  --ntab:#e690c0; --ntab-bg:#35172a; --sur:#b3c0cc; --sur-bg:#222c36; --focus:#7fb2ea; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:18px}
.wrap>*{min-width:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--bin)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
h1{font:700 2rem/1.05 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:.86rem}
.meta b{color:var(--ink);font-weight:500}

/* setting tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{--c:var(--ink);--cb:var(--sunk);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px 12px;cursor:pointer;display:grid;gap:2px;position:relative}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;border-radius:6px 0 0 6px;background:var(--c)}
.tile .lab{font:600 .95rem/1.2 var(--f-display);letter-spacing:.01em}
.tile .num{font:700 2rem/1 var(--f-display);color:var(--c)}
.tile .sub{font-size:.78rem;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--cb);border-color:var(--c)}
.tile[data-v="Binary"]{--c:var(--bin);--cb:var(--bin-bg)}
.tile[data-v="Multiclass"]{--c:var(--mul);--cb:var(--mul-bg)}
.tile[data-v="Binary+Multiclass"]{--c:var(--both);--cb:var(--both-bg)}
.tile[data-v="Survey"]{--c:var(--sur);--cb:var(--sur-bg)}
.tile[data-v="nontab"]{--c:var(--ntab);--cb:var(--ntab-bg)}
.legend-note{font-size:.78rem;color:var(--muted);margin-top:-8px}

/* filter rail */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:10px}
.rail-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--focus)}
.count{font-size:.86rem;color:var(--muted);white-space:nowrap}
.count b{color:var(--ink);font-family:var(--f-mono)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:6px 11px;cursor:pointer;font-size:.84rem;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.groups{display:flex;flex-wrap:wrap;gap:8px 22px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.glab{font:600 .72rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.f{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.f:hover{border-color:var(--line-strong)}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f .code{font-family:var(--f-mono);font-size:.7rem;opacity:.7}
.f .n{font-family:var(--f-mono);font-size:.7rem;opacity:.65}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 14px;cursor:pointer;font:600 .95rem/1 var(--f-display);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* badges */
.badge{display:inline-block;font:600 .72rem/1.5 var(--f-display);letter-spacing:.03em;padding:0 7px;border-radius:3px;white-space:nowrap}
.b-Binary{color:var(--bin);background:var(--bin-bg)}
.b-Multiclass{color:var(--mul);background:var(--mul-bg)}
.b-Binary\+Multiclass{color:var(--both);background:var(--both-bg)}
.b-Survey{color:var(--sur);background:var(--sur-bg)}
.dt{font-size:.8rem}
.dt .nt{color:var(--ntab);font-weight:600}
.tag{display:inline-block;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin:2px 3px 0 0;line-height:1.5}
.flag{display:inline-block;font:500 .68rem/1.5 var(--f-mono);color:var(--ntab);background:var(--ntab-bg);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}

/* table view */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table.cat{width:100%;border-collapse:collapse;min-width:900px}
table.cat th{position:sticky;top:0;background:var(--surface);text-align:left;font:600 .74rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:11px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
table.cat th button{border:0;background:none;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
table.cat th button[data-dir]::after{content:attr(data-dir);margin-left:4px}
table.cat td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row:hover td{background:var(--sunk)}
tr.row.open td{background:var(--sunk);border-bottom-color:transparent}
.c-year{width:58px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.c-method{width:200px}
.rowbtn{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:grid;gap:1px}
.rowbtn .ac{font:700 1rem/1.2 var(--f-display);color:var(--ink)}
.rowbtn .au{font-size:.76rem;color:var(--muted)}
.rowbtn .ac::after{content:"+";font-family:var(--f-mono);font-weight:400;color:var(--muted);margin-left:6px}
tr.open .rowbtn .ac::after{content:"\2212"}
.c-set{width:128px}.c-data{width:110px}.c-appr{width:120px;font-size:.84rem}
.idea{max-width:62ch}
.idea p{margin:0 0 3px}
tr.detail td{padding:0 10px 16px;background:var(--sunk);border-bottom:1px solid var(--line-strong)}

/* detail block (shared by table rows and the modal) */
.dgrid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:6px 16px;font-size:.86rem;max-width:1000px}
.dgrid dt{font:600 .74rem/1.6 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dgrid dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dtitle{font:600 1.02rem/1.35 var(--f-body);margin:12px 0 10px;max-width:80ch}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files a{font-size:.8rem;text-decoration:none;border:1px solid var(--line-strong);border-radius:4px;padding:1px 7px;background:var(--surface)}
.files a:hover{border-color:var(--bin)}
.warnline{color:var(--ntab);font-size:.8rem}

/* matrix + timeline */
.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table.mx{width:100%;border-collapse:collapse;min-width:780px;table-layout:fixed}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top;text-align:left}
table.mx td+td,table.mx th+th{border-left:1px solid var(--line)}
table.mx thead th{font:600 .9rem/1.2 var(--f-display);padding-top:12px;padding-bottom:12px}
table.mx thead th .n{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px}
table.mx thead th.h-Binary{color:var(--bin);box-shadow:inset 0 3px 0 var(--bin)}
table.mx thead th.h-Multiclass{color:var(--mul);box-shadow:inset 0 3px 0 var(--mul)}
table.mx thead th.h-Both{color:var(--both);box-shadow:inset 0 3px 0 var(--both)}
table.mx thead th.h-Survey{color:var(--sur);box-shadow:inset 0 3px 0 var(--sur)}
table.mx thead th:first-child{width:150px}
table.tl thead th:first-child{width:90px}
table.mx tbody th{font:600 .9rem/1.25 var(--f-display)}
table.mx tbody th .code{display:block;font:500 .72rem/1.4 var(--f-mono);color:var(--muted)}
table.mx tbody th .n{font:400 .74rem/1.4 var(--f-mono);color:var(--muted)}
table.tl tbody th{width:80px;font:500 .95rem/1.3 var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:.8rem;line-height:1.35;display:inline-flex;align-items:baseline;gap:5px}
.chip:hover{border-color:var(--ink)}
.chip .y,.chip .cd{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.chip.s-Binary{border-left:3px solid var(--bin)}
.chip.s-Multiclass{border-left:3px solid var(--mul)}
.chip.s-Binary\+Multiclass{border-left:3px solid var(--both)}
.chip.s-Survey{border-left:3px solid var(--sur)}
.empty{color:var(--line-strong);font-family:var(--f-mono)}
.codes{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);padding:2px 2px 0}
.codes b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.none{padding:28px;text-align:center;color:var(--muted)}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,16,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(48px,env(safe-area-inset-top,0px)) 16px 24px;z-index:20;overflow-y:auto}
.panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:min(860px,100%);padding:18px 20px 22px;display:grid;gap:4px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel-head h2{margin:0;font:700 1.5rem/1.1 var(--f-display)}
.panel-head .sub{color:var(--muted);font-size:.84rem;margin-top:4px}
.panel textarea{width:100%;min-height:320px;font:12px/1.45 var(--f-mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:5px;font-size:.86rem;z-index:30}
.err{background:var(--ntab-bg);color:var(--ntab);border:1px solid var(--ntab);border-radius:6px;padding:10px 12px;font-family:var(--f-mono);font-size:.8rem}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .wrap{padding-inline:16px}
  h1{font-size:1.6rem}
  table.cat{min-width:0}
  table.cat thead{display:none}
  table.cat,table.cat tbody,table.cat tr,table.cat td{display:block;width:auto}
  tr.row{display:grid!important;grid-template-columns:3.4rem minmax(0,1fr);column-gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  tr.row td{border:0;padding:2px 0;background:transparent!important}
  tr.row .c-year{grid-row:1 / span 5}
  tr.row .c-set,tr.row .c-data,tr.row .c-appr{display:inline-block}
  tr.detail td{padding:4px 12px 14px}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .dgrid dt{margin-top:6px}
}
@media (prefers-reduced-motion:no-preference){.tile,.f,.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>


<div class="wrap" id="app">
  <header class="top">
    <h1>SMOTE25 Method Map</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="tiles" id="tiles"></div>
  <div class="legend-note">Group = Drive folder. A paper in the Binary or Multiclass folder counts only there, even when a copy is also in Both; Both = Binary + Multiclass. Each record also shows the classes used in the paper's own experiments.</div>

  <section class="rail" aria-label="Filters">
    <div class="rail-top">
      <label class="search" for="q"><span class="mono" aria-hidden="true">/</span><input id="q" type="search" placeholder="Search method, author, mechanism, baseline, dataset" autocomplete="off"></label>
      <span class="count" id="count"></span>
      <button class="btn ghost" data-act="reset" type="button">Reset</button>
      <button class="btn" data-act="latex" type="button">Copy LaTeX</button>
      <button class="btn" data-act="csv" type="button">Copy CSV</button>
    </div>
    <div class="groups" id="groups"></div>
  </section>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-act="view" data-v="table" id="tab-table" type="button">Table</button>
    <button class="tab" role="tab" data-act="view" data-v="matrix" id="tab-matrix" type="button">Approach × group</button>
    <button class="tab" role="tab" data-act="view" data-v="timeline" id="tab-timeline" type="button">Year × group</button>
  </div>

  <div id="view"></div>
</div>
<div id="overlay" class="ov" hidden></div>
<div id="toast" class="toast" hidden></div>

ples are ranked by a logistic function of majority count among k1 neighbors, sampled by this distribution, and SMOTE-interpolated with k2 minority neighbors to add synthetic data.","multiclass_handling":null,"builds_on":["SMOTE","SMOTEBoost","ADASYN","AdaBoost.M2"],"baselines":["SMOTEBoost","SMOTE","ADASYN","AdaCost","Borderline-SMOTE","SMOTE-Tomek"],"n_datasets":"19 (UCI, ELENA)","classifiers":["MLP"],"metrics":["Overall accuracy","Precision","Recall","F-measure","G-mean","AUC","ROC curves"],"limitations":"Only continuous features and two-class problems studied; future work: nominal features via SMOTE-N, multiclass extension, other distance measures, adaptive parameter setting.","code_url":null,"read_status":"full","approach":"Ensemble","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"14A557-5oqo0oyDRVUFLgcoS2Vu53fxUQ","label":"PDF"}],"uid":"P18","paper_scope":"Binary","scope_differs":false},{"file_id":"11twc68OZ57oOgWX3q9TapZClfIL8sxyW","acronym":"RUSBoost","title":"RUSBoost: A Hybrid Approach to Alleviating Class Imbalance","authors":"Seiffert, Khoshgoftaar, Van Hulse, Napolitano","year":2010,"venue":"IEEE Trans. Syst., Man, Cybern. A (TSMC-A)","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Sec IV-A: 15 datasets, multiclass sets converted to one-vs-rest binary; 'this paper considers only the binary classification problem'","data_type":["Tabular"],"strategy":["Undersampling","Ensemble"],"mechanism":["Boosting"],"core_idea":"AdaBoost.M2 in which, before training each weak learner, majority examples are randomly removed until the minority reaches a target share (35/50/65%); pseudoloss and weight updates computed on the full original data.","multiclass_handling":null,"builds_on":["SMOTEBoost","AdaBoost.M2","Random undersampling"],"baselines":["SMOTEBoost","RUS","SMOTE","AdaBoost","No resampling"],"n_datasets":"15 (UCI, NASA MDP, Mammography, 3 proprietary software project)","classif  data-sets with multiple classes: Binarization techniques and ad-hoc approaches","authors":"Fernández, López, Galar, del Jesus, et al.","year":2013,"venue":"Knowledge-Based Systems","paper_type":"Empirical study","class_setting":"Multiclass","class_setting_evidence":"24 multi-class KEEL datasets (3-11 classes, IR 1.48-4558.6)","data_type":["Tabular"],"strategy":["Decomposition (OVO/OVA)","Oversampling","Undersampling","Hybrid sampling","Data cleaning","Cost-sensitive","Ensemble"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Noise/overlap filtering","Cost matrix","Boosting"],"core_idea":"Compares OVO and OVA binarization combined with binary resampling (ROS, SMOTE, SMOTE-ENN, Safe-Level-SMOTE, RUS, NCL, TL, OSS) or IR-based instance weighting against ad hoc Global-CS, Static-SMOTE and AdaBoost.NC; OVO+SMOTE and OVO+CS perform best.","multiclass_handling":"OVO (voting) and OVA decomposition with binary resampling or cost-sensitive learning per subproblem; native ad hoc methods as references.","builds_on":[],"baselines":["Global-CS","Static-SMOTE","AdaBoost.NC","Std-OVO / Std-OVA","Base classifier (no preprocessing)","OVO/OVA + ROS","OVO/OVA + SMOTE-ENN","OVO/OVA + Safe-Level-SMOTE","OVO/OVA + instance-weighting CS","OVO/OVA + RUS/NCL/TL/OSS"],"n_datasets":"24 (KEEL)","classifiers":["C4.5","SVM (SMO)","kNN (HVDM)"],"metrics":["Average accuracy (AvgAcc)","Mean F-measure (web page)"],"limitations":"Future work: non-competent classifiers in OVO, scalability to many classes and examples, new OVO aggregations, and intrinsic data characteristics (small disjuncts, overlap, dataset shift).","code_url":null,"read_status":"full","approach":"Survey / study","smote_based":true,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"1zYDaE9DXkV9_GMfZRt9aJa_48pf7Usjc","label":"PDF"}],"uid":"P23","paper_scope":"Multiclass","scope_differs":false},{"file_id":"1AoUTjcCFpdz9liFQu2I65F9Tx3OrdJHv","acronym":"MWMOTE","title":"MWMOTE - Majority Weighted Minority Oversampling Technique for Imbalanced Data Set Learning","authors":"Barua, Islam, Yao, Murase","year":2014,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"4 artificial two-class domains + 20 UCI datasets, multi-class ones transformed to two-class","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Clustering","Borderline/safe-level weighting","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"Filters noisy minority, finds borderline majority (k2-NN) and their k3 minority neighbors as informative set; weights them by closeness/density to borderline majority; interpolates weighted-sampled seeds with random same-cluster minority members (average-linkage clustering).","multiclass_handling":null,"builds_on":["SMOTE","Borderline-SMOTE","ADASYN","RAMO"],"baselines":["SMOTE","ADASYN","RAMO","COGOS","Local sampling (LS)"],"n_datasets":"20 (UCI) + 4 artificial","classifiers":["MLP (backpropagation NN)","AdaBoost.M2 ensemble of NNs","k-NN","C4.5"],"metrics":["Accuracy","Precision","Recall","F-measure","G-mean","AUC","ROC curves"],"limitations":"Only two-class, continuous-feature data used; future work: multiclass, nominal features, better clustering, combining with undersampling, parameter optimization. Recall lower than competitors.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary","Both"],"files":[{"folder":"Both","id":"1AoUTjcCFpdz9liFQu2I65F9Tx3OrdJHv","label":"PDF"},{"folder":"Binary","id":"1OXYKQjqnGD50QjTpJtnDSlBbhHphZ_DG","label":"PDF (copy)"}],"uid":"P24","paper_scope":"Binary","scope_differs":false},{"file_id":"1xyZUzavvdWF2OsrM31uxugOEHpn0liE3","acronym":"RACOG/wRACOG","title":"RACOG and wRACOG: Two Probabilistic Oversampling Techniques","authors":"Das, Krishnan, Cook","year":2015,"venue":"IEEE TKDE","paper_type":"New method","clas "C4.5","RIPPER","kNN (k=5)"],"metrics":["MAUC","G-mean","Minority precision","Minority recall","Minority F-measure"],"limitations":"Slow for high-dimensional data; only numeric attributes handled; future work: nominal/mixed attributes, other distances (e.g., Hellinger), and comparison with OAA/OAO two-class oversamplers.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":false,"non_tabular":false,"folders":["Both","Multiclass"],"files":[{"folder":"Multiclass","id":"1bWUoc6-OoSvVbY_LDzHA2LP-g9g2IVaV","label":"PDF"},{"folder":"Both","id":"1Mg6uMRcl3DBW6pl_gUHttNwhRnBHIshn","label":"PDF (copy)"}],"uid":"P32","paper_scope":"Multiclass","scope_differs":false},{"file_id":"12KDC3jaa429TWX4hq-t7gXh6LIHJE3h6","acronym":"SMOM","title":"Synthetic minority oversampling technique for multiclass imbalance problems","authors":"Zhu, Lin, Liu","year":2017,"venue":"Pattern Recognition","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"27 multiclass imbalanced datasets (UCI and ordinal regression benchmarks)","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Clustering","Borderline/safe-level weighting","Class-interrelation (multi-class)"],"core_idea":"SMOTE-style interpolation where each of a trapped instance's k neighbor directions gets a selection weight penalizing over-generalization into other (especially minority) classes; NBDOS clustering finds outstanding instances, which use uniform direction selection.","multiclass_handling":"Native: each minority class oversampled to largest class size; direction weights consider all other classes jointly.","builds_on":["SMOTE"],"baselines":["No oversampling","ROS","SMOTE","ADASYN","Safe-Level-SMOTE","MWMOTE","MDO"],"n_datasets":"27 (UCI + ordinal regression benchmarks)","classifiers":["C4.5","AdaBoost.M1 (C4.5)","MLP","Naive Bayes"],"metrics":["MG (G-mean)","MAUC","Recall (smallest minority class)","Precision (smallest minori essing Class Imbalance without Cost Tuning","authors":"Datta, Nag, Das","year":2020,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"54 artificial two-class + 15 two-class and 10 multi-class KEEL; multi-class hyperspectral and ImageNet subsets","data_type":["Tabular","Image"],"strategy":["Ensemble","Algorithm modification"],"mechanism":["Boosting","Evolutionary/optimization","Adaptive sample weighting"],"core_idea":"Two-stage lexicographic LP sets AdaBoost component weights: first minimizes each class's average hinge loss separately, then minimizes the maximum class-wise loss increase; the dual variant also adapts per-instance weights each round.","multiclass_handling":"Native: margin redefined with class label vectors; one hinge-loss LP per class, then joint min-max deviation LP.","builds_on":["AdaBoost","LPBoost","LPUBoost"],"baselines":["AdaBoost / AdaBoost.M2","AdaMEC-Calib","AdaBoost.NC + random oversampling","LPAdaBoost","Dual-LPAdaBoost","LPUBoost","Dual-LPUBoost"],"n_datasets":"54 artificial + 25 KEEL (15 two-class, 10 multi-class) + 5 hyperspectral images + 3 ImageNet subsets","classifiers":["C4.5","kNN"],"metrics":["G-mean","AUC","Avg-AUC (MAUC)"],"limitations":"Future work: extend the framework to single-class (one-class) classification.","code_url":"https://github.com/Shounak-D/LexiBoost","read_status":"full","approach":"Ensemble","smote_based":false,"non_tabular":true,"folders":["Both"],"files":[{"folder":"Both","id":"1OShlehmxdBW8ZJopG0_swGdxmwUs1f_P","label":"PDF"},{"folder":"Both","id":"1OtT48iUkd5Fr_0zq1qHojlRvCKDURId8","label":"Supplementary"}],"uid":"P44","paper_scope":"Binary+Multiclass","scope_differs":false},{"file_id":"1vjD3vWHkPV0xnwoFP8v36gWWud03PkfD","acronym":"MBS","title":"Model-Based Synthetic Sampling for Imbalanced Data","authors":"Liu, Hsieh","year":2020,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"13 two-class UCI/Kaggle datasets; method formulated for minority vs majority (multi-class extension only suggested)","data_type":["Tabular"],"strategy":["Oversampling","Ensemble"],"mechanism":["Feature-relationship regression","Boosting"],"core_idea":"Trains one regression model per minority feature (predicting it from the other features), builds temporary samples by independently resampling each feature's observed minority values, then iteratively replaces features with model predictions.","multiclass_handling":null,"builds_on":["AdaBoost.M2"],"baselines":["Random oversampling","Random undersampling","SMOTE","Borderline-SMOTE1/2","Safe-Level-SMOTE","ADASYN","CBO","SBC","RUSBoost","UnderBagging"],"n_datasets":"13 (UCI, Kaggle)","classifiers":["Logistic regression"],"metrics":["AUC"],"limitations":"Handles numeric features only; non-linear feature models (CART, SVR) underperform with few minority samples; future work: other regression models, oversampling-rate effects, domain-specific feature models.","code_url":"https://github.com/b10071007/Model-Based-Synthetic-Sampling","read_status":"full","approach":"Oversampling","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1vjD3vWHkPV0xnwoFP8v36gWWud03PkfD","label":"PDF"}],"uid":"P45","paper_scope":"Binary","scope_differs":true},{"file_id":"1s5zMo4dtch11EBjKJXrjAAHIzGJV9TrL","acronym":"MC-CCR","title":"Combined Cleaning and Resampling algorithm for multi-class imbalanced data with label noise","authors":"Koziarski, Wozniak, Krawczyk","year":2020,"venue":"Knowledge-Based Systems","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec 4.1: 20 multi-class KEEL datasets, with 0-25% injected label noise","data_type":["Tabular"],"strategy":["Oversampling","Data cleaning"],"mechanism":["Geometric region","Noise/overlap filtering","Adaptive sample weighting","Class-interrelation (multi-class)"],"core_idea":"Energy-limited spheres grow around each minority instance (cost rises s, with 0-30% label noise","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Clustering","Borderline/safe-level weighting","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"Excludes minority samples whose k-NN are all majority; 2-means on relative density (heterogeneous/homogeneous k-NN distance ratio) splits borderline vs safe; per-sample quotas weighted by (k-m)/(k+1), m = majority neighbors; SMOTE within each group.","multiclass_handling":"Iterative class-by-class: each smaller class oversampled to largest class size; DOVO (one-vs-one) classifiers.","builds_on":["SMOTE"],"baselines":["SMOTE","Borderline-SMOTE1","Borderline-SMOTE2","AB-SMOTE","ADASYN","k-means SMOTE","No oversampling"],"n_datasets":"27 binary (UCI) + 8 multi-class (UCI) + 4 synthetic 2-D","classifiers":["AdaBoost","LR","DT","KNN","GBDT","DOVO (ANN, DT, kNN, LDA, LR, SVM)"],"metrics":["Precision","Recall","AUC","F1","G-mean","Macro-Recall","Macro-F1","Macro-G-mean"],"limitations":"Outlier resistance is limited; no noise removal from original data (original data sometimes best at 30% noise); future work on post-processing noise handling.","code_url":"https://github.com/syxiaa/RSMOTE","read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"17eDnslcKmJbZ81yhKO23PuWldYNOij_N","label":"PDF"}],"uid":"P52","paper_scope":"Binary+Multiclass","scope_differs":true},{"file_id":"13fFnaGVW1Ap9s1r8139AwjNjAmVOlUv1","acronym":"SMOTE Review","title":"SMOTE for Handling Imbalanced Data Problem: A Review","authors":"Pradipta, Wardoyo, Musdholifah, Sanjaya et al.","year":2021,"venue":"ICIC 2021 (IEEE)","paper_type":"Survey","class_setting":"Survey","class_setting_evidence":"Frames imbalance as minority vs majority; multi-class methods (FCM-SMOTE, MDO) only cited in passing","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling","Data cleaning"]," ":"Transformer VAE trained with triplet-center loss separates classes in latent space; a class-center-conditioned latent diffusion model with classifier-free guidance samples minority latents, decoded back to tabular data.","multiclass_handling":null,"builds_on":["Tabsyn"],"baselines":["SMOTE","Borderline-SMOTE","SMOTE-TomekLinks","MLOS","GAMO","SOS","No resampling"],"n_datasets":"18 real-world (UCI, imbalanced-learn) + 5 synthetic","classifiers":["Gaussian NB","KNN","Decision Tree","SVM","Random Forest"],"metrics":["F1","MCC","Accuracy"],"limitations":"Future work: strengthen theory on latent geometry and similarity metrics; extend to multi-class imbalance and long-tailed distributions; adapt to time series and image data.","code_url":"https://github.com/MLneuers/GOIO","read_status":"full","approach":"Deep generative","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1LPHYXmZjSX0GQEZsamv27HsJPpkT52vA","label":"PDF"}],"uid":"P69","paper_scope":"Binary","scope_differs":true},{"file_id":"17x6NWBqjstuf9-XZIL1Gg1LojLU9qVHK","acronym":"MC-NCLWO","title":"MC-NCLWO: Newton's Cooling Law-Based Oversampling Algorithm for Multi-Class Imbalanced Datasets With Feature Noise","authors":"Tao, Liang, Wu, Qian, et al.","year":2025,"venue":"IEEE Access","paper_type":"New method","class_setting":"Multiclass","class_setting_evidence":"Sec V-A: 23 imbalanced multi-class KEEL datasets; noise-robustness test with 5-30% Gaussian feature noise","data_type":["Tabular"],"strategy":["Oversampling","Data cleaning"],"mechanism":["Adaptive sample weighting","Geometric region","Noise/overlap filtering"],"core_idea":"Weights minority samples by difficulty (inverse local density and distance to nearest majority); hypersphere around each expands with heat decaying per Newton's Cooling Law, majority samples inside are pushed out, synthetic points drawn inside hypersphere.","multiclass_handling":"Iterative class-by-class in descending class size; for each class, all larger classes act as the majority set.","builds_on":["NCLWO"],"baselines":["SMOTE","Borderline-SMOTE","ADASYN","MWMOTE","A-SUWO","G-SMOTE","SMOTE-IPF","MC-CCR","MC-RBO","MC-MBRC"],"n_datasets":"23 (KEEL)","classifiers":["k-NN","CART","Naive Bayes","SVM"],"metrics":["F-beta (macro)","Average accuracy","Class balanced accuracy (CBA)","Confusion entropy (CEN)"],"limitations":"Higher computational complexity than traditional oversampling due to iterative noise cleaning and adaptive generation; not optimized for high-dimensional or unstructured data (images, time series); future deep learning integration.","code_url":"https://github.com/taoliangliang/MC-NCLWO","read_status":"full","approach":"Hybrid sampling","smote_based":false,"non_tabular":false,"folders":["Multiclass"],"files":[{"folder":"Multiclass","id":"17x6NWBqjstuf9-XZIL1Gg1LojLU9qVHK","label":"PDF"}],"uid":"P70","paper_scope":"Multiclass","scope_differs":false},{"file_id":"1MgRNYVAXU8VYZF13piF_4UVCPCT6Q_8n","acronym":"MLOS","title":"Synthetic oversampling with Mahalanobis distance and local information for highly imbalanced class-overlapped data","authors":"Yan, Zheng, Han, Yu et al.","year":2025,"venue":"Expert Systems with Applications","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"16 two-class highly imbalanced (IR>10), overlapped datasets from KEEL, UCI, PROMISE","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling","Data cleaning"],"mechanism":["Mahalanobis distance","Radial basis/potential function","k-NN neighborhood","Geometric region","Noise/overlap filtering"],"core_idea":"Whitens data by majority covariance; each minority seed gets radius from 5-NN auxiliary sample with nearest majority RBF density; samples in that hypersphere, rescales onto seed's contour; cleans overlapping majority and dense synthetic samples.","multiclass_handling":null,"builds_on":["SWIMMD","SWIMRBF"],"baselines":["SMOTE","Borderline-SMOTE","ADASYN","MWMOTE","MAHAKIL","CCR","SWIMMD","SWIMRBF","LDAS","GDO"],"n_datasets":"16 (KEEL, UCI, PROMISE)","classifiers":["SVM"],"metrics":["AUC","G-mean","Recall"],"limitations":"Scaling factor alpha only tested at a few values in [0,1]; setting for real applications left to researchers. Future work: extend to multi-class scenarios.","code_url":"https://github.com/ytyancp/MLOS","read_status":"full","approach":"Hybrid sampling","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1MgRNYVAXU8VYZF13piF_4UVCPCT6Q_8n","label":"PDF"}],"uid":"P71","paper_scope":"Binary","scope_differs":true},{"file_id":"1kJZCKYe3QR2tSvb54AfOhHd5XNzkdJ6g","acronym":"CISO","title":"Certified Interpolation Oversampling: Per-Instance Safety Guarantees for Imbalanced Learning","authors":"Yadav, Vijay","year":2026,"venue":"arXiv:2501.15790 (preprint)","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"37 binary KEEL + 8 UCI datasets; multi-class sets binarized smallest-class-vs-rest","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Adaptive sample weighting","Probabilistic/density model"],"core_idea":"Anchors drawn by safety score (majority clearance x (1 - regional majority density)) with signed temperature; two minority neighbors weighted by clearance and q-Gaussian locality; truncated q-Gaussian placement on segment; per-instance certified clearance.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["Class weighting","Random oversampling","SMOTE","Borderline-SMOTE","ADASYN","SMOTE-ENN","SMOTE-Tomek","KMeans-SMOTE","Safe-Level-SMOTE","G-SMOTE"],"n_datasets":"45 (37 KEEL + 8 UCI) + 5 KEEL used only for tuning","classifiers":["LR","SVC (RBF)","RF","HistGradientBoosting"],"metrics":["PR-AUC","ROC-AUC","G-mean","MMD2 (fidelity)","Certified fraction"],"limitations":"Not significantly better than SMOTE, class weighting or random oversampling on PR-AUC; about 39x SMOTE cost; binary only, multiclass extension and adaptive temperature left for future work.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1kJZCKYe3QR2tSvb54AfOhHd5XNzkdJ6g","label":"PDF"}],"uid":"P72","paper_scope":"Binary","scope_differs":false},{"file_id":"1V9E9guns3UmIBq2vj0dzdZ90SMgM9WXv","acronym":"DGOT","title":"Diffusion GAN-Based Oversampling for Imbalanced Tabular Data","authors":"Ren, Ding, Cheung","year":2026,"venue":"IEEE TKDE","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"Sec IV-A: 22 datasets = 15 binary + 7 multi-class (UCI, imbalanced-learn)","data_type":["Tabular"],"strategy":["Oversampling","Generative model"],"mechanism":["GAN","Diffusion"],"core_idea":"GAN whose generator is a conditional denoising-diffusion chain with few large steps (predicts x0, samples posterior); time-dependent discriminator with SNR-weighted noise-sensitive auxiliary classifier; trained generator synthesizes minority-class tabular samples.","multiclass_handling":"Native class-conditional generation; each minority class oversampled until d times majority size; macro-averaged metrics.","builds_on":["Denoising diffusion GAN","ACGAN"],"baselines":["SMOTE","Borderline-SMOTE","SMOTE-TomekLinks","CTGAN","TVAE","SOS","No resampling"],"n_datasets":"22 (UCI, imbalanced-learn): 15 binary + 7 multi-class","classifiers":["XGBoost","KNN","Decision Tree","Logistic Regression","Random Forest"],"metrics":["Accuracy","F1","MCC"],"limitations":"Future work: extend the approach to other data types and further reduce computational resource overhead.","code_url":"https://github.com/MLneuers/DGOT","read_status":"full","approach":"Deep generative","smote_based":false,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1V9E9guns3UmIBq2vj0dzdZ90SMgM9WXv","label":"PDF"}],"uid":"P73","paper_scope":"Binary+Multiclass","scope_differs":false},{"file_id":"1PK1o_aazCwaEO0yx3bTeXHQHRfaai90K","acronym":"Loyalty-SMOTE","title":"Loyalty-SMOTE: Data synthesis algorithm for effective imbalanced data classification","authors":"Hu, Li, Li, Zhang et al.","year":2026,"venue":"Neural Networks","paper_type":"New method","class_setting":"Binary+Multiclass","class_setting_evidence":"30 binary UCI/KEEL datasets (group 1) + 5 multiclass UCI datasets (group 4)","data_type":["Tabular"],"strategy":["Oversampling","Hybrid sampling","Data cleaning"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Noise/overlap filtering","Class-interrelation (multi-class)"],"core_idea":"Loyalty (inverse-distance-weighted same- minus different-class k-NN influence) flags noise (Loyalty<0); boundary minority samples (0<=Loyalty<=m) are SMOTE-oversampled; then Loyalty recheck removes minority noise and LOF removes majority noise.","multiclass_handling":"Attraction relabels unloyal samples to most-attracting class; experiments treat largest class as majority, smallest as minority.","builds_on":["SMOTE","LOF"],"baselines":["SMOTE","SMOTE-ENN","SMOTE-TomekLinks","Borderline-SMOTE","Safe-Level-SMOTE"],"n_datasets":"59 in 5 groups: 30 (UCI/KEEL) + 5 multiclass (UCI) + 24 (Kaggle)","classifiers":["SVM"],"metrics":["F1","AUC","Recall","G-mean","Runtime"],"limitations":"Longer runtime and higher time complexity than traditional imbalanced data methods; future work will focus on reducing time complexity.","code_url":null,"read_status":"full","approach":"Hybrid sampling","smote_based":true,"non_tabular":false,"folders":["Both"],"files":[{"folder":"Both","id":"1PK1o_aazCwaEO0yx3bTeXHQHRfaai90K","label":"PDF"}],"uid":"P74","paper_scope":"Binary+Multiclass","scope_differs":false},{"file_id":"1ic15ixamezP9A2bop_KHS6t0UcU3MpgY","acronym":"QC-SMOTE","title":"QC-SMOTE: Quality-Controlled SMOTE for Imbalanced Classification","authors":"Upman, Gowda","year":2026,"venue":"Preprint","paper_type":"New method","class_setting":"Binary","class_setting_evidence":"30 binary benchmark datasets (VS-SMOTE set); one-vs-rest multi-class extension stated but not evaluated","data_type":["Tabular"],"strategy":["Oversampling"],"mechanism":["SMOTE interpolation","k-NN neighborhood","Borderline/safe-level weighting","Adaptive sample weighting","Noise/overlap filtering"],"core_idea":"Seeds drawn by trust score (safe-level, local minority density, majority isolation); best-of-K interpolated candidates scored by candidate and midpoint purity plus majority clearance; regime-adaptive range; low-quality candidates replaced by duplicating trusted minority.","multiclass_handling":null,"builds_on":["SMOTE"],"baselines":["SMOTE","Borderline-SMOTE1","SMOTE-WE","K-SMOTE","RSMOTE","SMOTEWB","SMOTE-CD","VS-SMOTE"],"n_datasets":"30 (VS-SMOTE binary benchmark: ecoli, glass, yeast, vehicle, page-blocks, etc.; IR 1.82-32.73)","classifiers":["CatBoost"],"metrics":["AUC-ROC","Macro F1"],"limitations":"Slower than SMOTE (about 39x); future work: mixed/categorical features, integration with deep representation learning, learnable trustworthiness for dynamic or streaming data.","code_url":null,"read_status":"full","approach":"Oversampling","smote_based":true,"non_tabular":false,"folders":["Binary"],"files":[{"folder":"Binary","id":"1ic15ixamezP9A2bop_KHS6t0UcU3MpgY","label":"PDF"}],"uid":"P75","paper_scope":"Binary","scope_differs":false}]</script>
<script>
(function(){
'use strict';
function boot(){
  var root=document.getElementById('app');
  function showErr(e){var d=document.createElement('div');d.className='err';d.textContent='Page error: '+(e&&e.message?e.message:e);root.insertBefore(d,root.firstChild);}
  try{
  var P=JSON.parse(document.getElementById('data').textContent);
  var BY={};P.forEach(function(p){BY[p.uid]=p;});
  var SETTINGS=['Binary','Multiclass','Binary+Multiclass','Survey'];
  var SET_LABEL={'Binary':'Binary','Multiclass':'Multiclass','Binary+Multiclass':'Binary + Multiclass','Survey':'Survey'};
  var APPR=[['Oversampling','OS'],['Undersampling','US'],['Hybrid sampling','HY'],['Ensemble','EN'],['Deep generative','DG'],['Cost-sensitive','CS'],['Algorithm-level','AL'],['Survey / study','SV']];
  var CODE={};APPR.forEach(function(a){CODE[a[0]]=a[1];});
  var DATA=['Tabular','Image','Time series','Text'];
  var DT_SHORT={'Image':'IMG','Time series':'TS','Text':'TXT'};
  var TYPES=['New method','Empirical study','Survey','Foundational'];
  
  var S={view:'table',q:'',set:{},nontab:false,appr:{},data:{},type:{},smote:false,mismatch:false,sortKey:'year',sortDir:1,open:{}};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function keys(o){return Object.keys(o).filter(function(k){return o[k];});}
  function mismatch(p){return !!p.scope_differs;}
  function yy(y){return '\u2019'+String(y).slice(2);}
  function ntTags(p){return p.data_type.filter(function(d){return DT_SHORT[d];}).map(function(d){return '<span class="flag">'+DT_SHORT[d]+'</span>';}).join('');}
  function hay(p){return [p.acronym,p.title,p.authors,p.venue,p.year,p.core_idea,p.multiclass_handling,p.n_datasets,p.limitations,p.approach,p.class_setting,p.paper_scope,(p.mechanism||[]).join(' '),(p.builds_on||[]).join(' '),(p.baselines||[]).join(' '),(p.classifiers||[]).join(' '),(p.metrics||[]).join(' '),(p.strategy||[]).join(' '),p.data_type.join(' ')].join(' ').toLowerCase();}
  P.forEach(function(p){p._h=hay(p);p._mm=mismatch(p);});

  function pass(p,skip){
    skip=skip||{};
    var s=keys(S.set); if(!skip.set&&s.length&&s.indexOf(p.class_setting)<0) return false;
    if(S.nontab&&!p.non_tabular) return false;
    var a=keys(S.appr); if(!skip.appr&&a.length&&a.indexOf(p.approach)<0) return false;
    var d=keys(S.data); if(d.length&&!p.data_type.some(function(x){return d.indexOf(x)>=0;})) return false;
    var t=keys(S.type); if(t.length&&t.indexOf(p.paper_type)<0) return false;
    if(S.smote&&!p.smote_based) return false;
    if(S.mismatch&&!p._mm) return false;
    if(S.q){var terms=S.q.toLowerCase().split(/\s+/).filter(Boolean);for(var i=0;i<terms.length;i++){if(p._h.indexOf(terms[i])<0) return false;}}
    return true;
  }
  function rows(){
    var r=P.filter(function(p){return pass(p);});
    var k=S.sortKey,dir=S.sortDir;
    r.sort(function(a,b){
      var x,y;
      if(k==='year'){x=a.year;y=b.year;if(x!==y) return (x-y)*dir;return a.acronym.localeCompare(b.acronym);}
      x=String(a[k]).toLowerCase();y=String(b[k]).toLowerCase();
      return (x<y?-1:x>y?1:a.year-b.year)*dir;
    });
    return r;
  }

  /* static parts */
  var yrs=P.map(function(p){return p.year;});
  document.getElementById('meta').innerHTML='<b>'+P.length+'</b> papers · <b>'+Math.min.apply(null,yrs)+'–'+Math.max.apply(null,yrs)+'</b> · Drive SMOTE25 (Survey, Binary, Multiclass, Both) · read 6 Oct 2026';
  function cnt(f){return P.filter(f).length;}
  var nt={};P.forEach(function(p){p.data_type.forEach(function(d){if(DT_SHORT[d]) nt[d]=(nt[d]||0)+1;});});
  function apprMix(set){var m={};P.forEach(function(p){if(p.class_setting===set) m[p.approach]=(m[p.approach]||0)+1;});return APPR.filter(function(a){return m[a[0]];}).sort(function(x,y){return m[y[0]]-m[x[0]];}).slice(0,3).map(function(a){return m[a[0]]+' '+a[0].toLowerCase();}).join(' · ');}
  var th='';
  SETTINGS.forEach(function(s){th+='<button class="tile" type="button" data-act="set" data-v="'+esc(s)+'" aria-pressed="false"><span class="lab">'+SET_LABEL[s]+'</span><span class="num mono">'+cnt(function(p){return p.class_setting===s;})+'</span><span class="sub">'+esc(apprMix(s))+'</span></button>';});
  th+='<button class="tile" type="button" data-act="nontab" data-v="nontab" aria-pressed="false"><span class="lab">Non-tabular data</span><span class="num mono">'+cnt(function(p){return p.non_tabular;})+'</span><span class="sub">'+Object.keys(nt).map(function(d){return nt[d]+' '+d.toLowerCase();}).join(' · ')+'</span></button>';
  document.getElementById('tiles').innerHTML=th;

  function fbtn(act,v,label,extra){return '<button class="f" type="button" data-act="'+act+'" data-v="'+esc(v)+'" aria-pressed="false">'+(extra||'')+esc(label)+'</button>';}
  var g='<div class="group"><span class="glab">Approach</span>';
  APPR.forEach(function(a){g+=fbtn('appr',a[0],a[0],'<span class="code">'+a[1]+'</span>').replace('</button>',' <span class="n">'+cnt(function(p){return p.approach===a[0];})+'</span></button>');});
  g+='</div><div class="group"><span class="glab">Data</span>';
  DATA.forEach(function(d){g+=fbtn('data',d,d).replace('</button>',' <span class="n">'+cnt(function(p){return p.data_type.indexOf(d)>=0;})+'</span></button>');});
  g+='</div><div class="group"><span class="glab">Paper</span>';
  TYPES.forEach(function(t){g+=fbtn('type',t,t).replace('</button>',' <span class="n">'+cnt(function(p){return p.paper_type===t;})+'</span></button>');});
  g+='</div><div class="group"><span class="glab">Flags</span>'+fbtn('smote','1','SMOTE-family').replace('</button>',' <span class="n">'+cnt(function(p){return p.smote_based;})+'</span></button>')+fbtn('mismatch','1','Experiments ≠ group').replace('</button>',' <span class="n">'+cnt(function(p){return p._mm;})+'</span></button>')+'</div>';
  document.getElementById('groups').innerHTML=g;

  function list(a){return a&&a.length?a.map(esc).join(', '):'<span class="empty">–</span>';}
  function val(v){return v==null||v===''?'<span class="empty">–</span>':esc(v);}
  function detail(p){
    var files=p.files.map(function(f){return '<a href="https://drive.google.com/file/d/'+esc(f.id)+'/view" target="_blank" rel="noopener">'+esc(f.folder)+' · '+esc(f.label)+'</a>';}).join('');
    var code=p.code_url?'<a href="'+esc(p.code_url)+'" target="_blank" rel="noopener">'+esc(p.code_url)+'</a>':'<span class="empty">–</span>';
    return '<div class="dtitle">'+esc(p.title)+'</div><dl class="dgrid">'+
      '<dt>Authors</dt><dd>'+esc(p.authors)+'</dd>'+
      '<dt>Venue · year</dt><dd>'+val(p.venue)+' · <span class="mono">'+p.year+'</span></dd>'+
      '<dt>Paper type</dt><dd>'+esc(p.paper_type)+(p.smote_based?' · SMOTE-family':'')+'</dd>'+
      '<dt>Group</dt><dd><span class="badge b-'+esc(p.class_setting)+'">'+SET_LABEL[p.class_setting]+'</span> Drive folder: '+esc(p.folders.join(', '))+'</dd>'+
      '<dt>Experiments in paper</dt><dd>'+(p.paper_scope?'<span class="badge b-'+esc(p.paper_scope)+'">'+SET_LABEL[p.paper_scope]+'</span> ':'')+esc(p.class_setting_evidence)+(p.scope_differs?' <span class="flag">\u2260 group</span>':'')+'</dd>'+
      '<dt>Multi-class handling</dt><dd>'+val(p.multiclass_handling)+'</dd>'+
      '<dt>Data</dt><dd>'+esc(p.data_type.join(', '))+'</dd>'+
      '<dt>Approach</dt><dd>'+esc(p.approach)+' · strategy: '+list(p.strategy)+'</dd>'+
      '<dt>Key idea</dt><dd>'+esc(p.core_idea)+'</dd>'+
      '<dt>Mechanism</dt><dd>'+p.mechanism.map(function(m){return '<span class="tag">'+esc(m)+'</span>';}).join('')+'</dd>'+
      '<dt>Builds on</dt><dd>'+list(p.builds_on)+'</dd>'+
      '<dt>Compared with</dt><dd>'+list(p.baselines)+'</dd>'+
      '<dt>Datasets</dt><dd>'+val(p.n_datasets)+'</dd>'+
      '<dt>Classifiers</dt><dd>'+list(p.classifiers)+'</dd>'+
      '<dt>Metrics</dt><dd>'+list(p.metrics)+'</dd>'+
      '<dt>Stated limitation</dt><dd>'+val(p.limitations)+'</dd>'+
      '<dt>Code</dt><dd>'+code+'</dd>'+
      '<dt>Drive</dt><dd><div class="files">'+files+'</div>'+''+'</dd>'+
      '</dl>';
  }

  function renderTable(r){
    if(!r.length) return '<div class="none">No papers match these filters.</div>';
    function sh(k,label){return '<button type="button" data-act="sort" data-v="'+k+'"'+(S.sortKey===k?' data-dir="'+(S.sortDir>0?'\u2191':'\u2193')+'"':'')+'>'+label+'</button>';}
    var h='<div class="tablebox"><table class="cat"><thead><tr><th>'+sh('year','Year')+'</th><th>'+sh('acronym','Method')+'</th><th>'+sh('class_setting','Group')+'</th><th>Data</th><th>'+sh('approach','Approach')+'</th><th>Key idea · mechanism</th></tr></thead><tbody>';
    r.forEach(function(p){
      var o=!!S.open[p.uid];
      var dt=p.data_type.map(function(d){return DT_SHORT[d]?'<span class="nt">'+esc(d)+'</span>':esc(d);}).join(', ');
      h+='<tr class="row'+(o?' open':'')+'"><td class="c-year">'+p.year+'</td>'+
        '<td class="c-method"><button class="rowbtn" type="button" data-act="toggle" data-v="'+p.uid+'" aria-expanded="'+o+'"><span class="ac">'+esc(p.acronym)+'</span><span class="au">'+esc(p.authors)+'</span></button></td>'+
        '<td class="c-set"><span class="badge b-'+esc(p.class_setting)+'">'+SET_LABEL[p.class_setting]+'</span></td>'+
        '<td class="c-data dt">'+dt+'</td>'+
        '<td class="c-appr">'+esc(p.approach)+'</td>'+
        '<td class="idea"><p>'+esc(p.core_idea)+'</p>'+p.mechanism.map(function(m){return '<span class="tag">'+esc(m)+'</span>';}).join('')+'</td></tr>';
      if(o) h+='<tr class="detail"><td colspan="6">'+detail(p)+'</td></tr>';
    });
    return h+'</tbody></table></div>';
  }
  function chip(p,mode){
    var tail=mode==='matrix'?'<span class="y">'+yy(p.year)+'</span>':'<span class="cd">'+CODE[p.approach]+'</span>';
    return '<button class="chip s-'+esc(p.class_setting)+'" type="button" data-act="detail" data-v="'+p.uid+'" title="'+esc(p.acronym+' ('+p.year+') · '+p.approach+' · '+p.class_setting)+'">'+esc(p.acronym)+tail+ntTags(p)+'</button>';
  }
  function headCols(r){
    return SETTINGS.map(function(s){var n=r.filter(function(p){return p.class_setting===s;}).length;return '<th class="h-'+(s==='Binary+Multiclass'?'Both':s)+'">'+SET_LABEL[s]+'<span class="n">'+n+'</span></th>';}).join('');
  }
  function renderMatrix(r){
    if(!r.length) return '<div class="none">No papers match these filters.</div>';
    var h='<div class="gridbox"><table class="mx"><thead><tr><th>Approach</th>'+headCols(r)+'</tr></thead><tbody>';
    APPR.forEach(function(a){
      var ra=r.filter(function(p){return p.approach===a[0];});
      if(!ra.length) return;
      h+='<tr><th>'+esc(a[0])+'<span class="code">'+a[1]+' · '+ra.length+'</span></th>';
      SETTINGS.forEach(function(s){
        var c=ra.filter(function(p){return p.class_setting===s;}).sort(function(x,y){return x.year-y.year;});
        h+='<td>'+(c.length?'<div class="chips">'+c.map(function(p){return chip(p,'matrix');}).join('')+'</div>':'<span class="empty">–</span>')+'</td>';
      });
      h+='</tr>';
    });
    return h+'</tbody></table></div>';
  }
  function renderTimeline(r){
    if(!r.length) return '<div class="none">No papers match these filters.</div>';
    var years=[];r.forEach(function(p){if(years.indexOf(p.year)<0) years.push(p.year);});years.sort(function(a,b){return a-b;});
    var h='<div class="codes">'+APPR.map(function(a){return '<span><b>'+a[1]+'</b> '+esc(a[0])+'</span>';}).join('')+'<span><span class="flag">IMG</span><span class="flag">TS</span><span class="flag">TXT</span> non-tabular</span></div>';
    h+='<div class="gridbox"><table class="mx tl"><thead><tr><th>Year</th>'+headCols(r)+'</tr></thead><tbody>';
    years.forEach(function(y){
      var ry=r.filter(function(p){return p.year===y;});
      h+='<tr><th>'+y+'<span class="n"> · '+ry.length+'</span></th>';
      SETTINGS.forEach(function(s){
        var c=ry.filter(function(p){return p.class_setting===s;});
        h+='<td>'+(c.length?'<div class="chips">'+c.map(function(p){return chip(p,'timeline');}).join('')+'</div>':'')+'</td>';
      });
      h+='</tr>';
    });
    return h+'</tbody></table></div>';
  }

  function syncPressed(){
    var btns=root.querySelectorAll('[data-act]');
    for(var i=0;i<btns.length;i++){
      var b=btns[i],a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),on=null;
      if(a==='set') on=!!S.set[v]; else if(a==='nontab') on=S.nontab; else if(a==='appr') on=!!S.appr[v];
      else if(a==='data') on=!!S.data[v]; else if(a==='type') on=!!S.type[v]; else if(a==='smote') on=S.smote; else if(a==='mismatch') on=S.mismatch;
      else if(a==='view'){b.setAttribute('aria-selected',String(S.view===v));continue;}
      if(on!==null) b.setAttribute('aria-pressed',String(on));
    }
  }
  function render(){
    try{
      var r=rows();
      document.getElementById('count').innerHTML='Showing <b>'+r.length+'</b> of '+P.length;
      var v=document.getElementById('view');
      v.innerHTML=S.view==='matrix'?renderMatrix(r):S.view==='timeline'?renderTimeline(r):renderTable(r);
      syncPressed();
    }catch(e){showErr(e);}
  }

  /* exports */
  var TEX={'\\':'\\textbackslash{}','&':'\\&','%':'\\%','$':'\\$','#':'\\#','_':'\\_','{':'\\{','}':'\\}','~':'\\textasciitilde{}','^':'\\textasciicircum{}','<':'$<$','>':'$>$','\u2264':'$\\leq$','\u2265':'$\\geq$','\u00d7':'$\\times$','\u2192':'$\\rightarrow$','\u2212':'$-$','\u2013':'--','\u00b1':'$\\pm$'};
  function tex(s){return String(s==null?'':s).replace(/[\\&%$#_{}~^<>\u2264\u2265\u00d7\u2192\u2212\u2013\u00b1]/g,function(c){return TEX[c];});}
  function latex(r){
    var L=['% SMOTE25 Method Map export, '+r.length+' papers (filters as shown on the page)','% requires \\usepackage{booktabs,longtable,array}','\\begingroup\\setlength{\\tabcolsep}{3pt}\\small',
      '\\begin{longtable}{@{}>{\\raggedright\\arraybackslash}p{0.15\\linewidth}c>{\\raggedright\\arraybackslash}p{0.12\\linewidth}>{\\raggedright\\arraybackslash}p{0.09\\linewidth}>{\\raggedright\\arraybackslash}p{0.12\\linewidth}>{\\raggedright\\arraybackslash}p{0.39\\linewidth}@{}}',
      '\\caption{Imbalance-handling methods by group (Drive folder), data type and approach.}\\label{tab:method-map}\\\\',
      '\\toprule','Method & Year & Group & Data & Approach & Key idea \\\\','\\midrule','\\endfirsthead',
      '\\toprule','Method & Year & Group & Data & Approach & Key idea \\\\','\\midrule','\\endhead','\\bottomrule','\\endfoot'];
    r.forEach(function(p){L.push(tex(p.acronym).replace(/\//g,'/\\allowbreak{}')+' & '+p.year+' & '+tex(SET_LABEL[p.class_setting])+' & '+tex(p.data_type.join(', '))+' & '+tex(p.approach)+' & '+tex(p.core_idea)+' \\\\');});
    L.push('\\end{longtable}');L.push('\\endgroup');
    return L.join('\n');
  }
  function csvCell(v){v=Array.isArray(v)?v.join('; '):(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  function csv(r){
    var cols=['uid','acronym','year','title','authors','venue','paper_type','class_setting','paper_scope','class_setting_evidence','data_type','approach','strategy','mechanism','smote_based','core_idea','multiclass_handling','builds_on','baselines','n_datasets','classifiers','metrics','limitations','code_url','folders','drive'];
    var out=[cols.map(function(c){return c==='class_setting'?'group':c==='paper_scope'?'experiments_in_paper':c;}).join(',')];
    r.forEach(function(p){out.push(cols.map(function(c){return csvCell(c==='drive'?p.files.map(function(f){return 'https://drive.google.com/file/d/'+f.id+'/view';}):p[c]);}).join(','));});
    return out.join('\n');
  }
  var toastT;
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2200);}
  function openPanel(html){var o=document.getElementById('overlay');o.innerHTML='<div class="panel" role="dialog" aria-modal="true">'+html+'</div>';o.hidden=false;var c=o.querySelector('[data-act="close"]');if(c) c.focus();}
  function closePanel(){var o=document.getElementById('overlay');o.hidden=true;o.innerHTML='';}
  function copyText(txt,label){
    function fallback(){openPanel('<div class="panel-head"><div><h2>'+esc(label)+'</h2><div class="sub">Clipboard is blocked here. The text is selected; press Ctrl+C or Cmd+C.</div></div><button class="btn" type="button" data-act="close">Close</button></div><textarea id="copybox" readonly>'+esc(txt)+'</textarea>');var ta=document.getElementById('copybox');ta.focus();ta.select();}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(label+' copied');},fallback);}else fallback();
    }catch(e){fallback();}
  }

  document.addEventListener('click',function(ev){
    try{
      var o=document.getElementById('overlay');
      if(ev.target===o){closePanel();return;}
      var b=ev.target.closest('[data-act]'); if(!b) return;
      var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
      if(a==='set'){S.set[v]=!S.set[v];}
      else if(a==='nontab'){S.nontab=!S.nontab;}
      else if(a==='appr'){S.appr[v]=!S.appr[v];}
      else if(a==='data'){S.data[v]=!S.data[v];}
      else if(a==='type'){S.type[v]=!S.type[v];}
      else if(a==='smote'){S.smote=!S.smote;}
      else if(a==='mismatch'){S.mismatch=!S.mismatch;}
      else if(a==='view'){S.view=v;try{history.replaceState(null,'','#'+v);}catch(e){}}
      else if(a==='sort'){if(S.sortKey===v) S.sortDir=-S.sortDir; else {S.sortKey=v;S.sortDir=1;}}
      else if(a==='toggle'){S.open[v]=!S.open[v];}
      else if(a==='detail'){var p=BY[v];openPanel('<div class="panel-head"><div><h2>'+esc(p.acronym)+'</h2><div class="sub"><span class="mono">'+p.year+'</span> · '+esc(p.approach)+'</div></div><button class="btn" type="button" data-act="close">Close</button></div>'+detail(p));return;}
      else if(a==='close'){closePanel();return;}
      else if(a==='reset'){S.q='';S.set={};S.nontab=false;S.appr={};S.data={};S.type={};S.smote=false;S.mismatch=false;S.open={};document.getElementById('q').value='';}
      else if(a==='latex'){copyText(latex(rows()),'LaTeX table ('+rows().length+' rows)');return;}
      else if(a==='csv'){copyText(csv(rows()),'CSV ('+rows().length+' rows)');return;}
      else return;
      render();
    }catch(e){showErr(e);}
  });
  document.addEventListener('input',function(ev){if(ev.target&&ev.target.id==='q'){S.q=ev.target.value.trim();render();}});
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'&&!document.getElementById('overlay').hidden){closePanel();}
    else if(ev.key==='/'&&document.activeElement&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){ev.preventDefault();document.getElementById('q').focus();}
  });
  var hv=(location.hash||'').replace('#','');
  if(hv==='matrix'||hv==='timeline'||hv==='table') S.view=hv;
  render();
  }catch(e){showErr(e);}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>

</body>
</html>
